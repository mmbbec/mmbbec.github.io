<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Classroom Portal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    .code-input {
      letter-spacing: 4px;
      font-weight: bold;
      font-family: monospace;
      font-size: 1.5rem;
      text-transform: uppercase;
    }
  </style>
</head>
<body class="bg-light p-3 p-md-4">

  <!-- CODE LOOKUP BOX -->
  <div id="lookupContainer" class="container mt-4" style="max-width: 480px;">
    <div class="card shadow-sm border-0 text-center p-4">
      <h3 class="text-primary mb-2">Student Classroom Portal</h3>
      <p class="text-muted small mb-4">Enter the 6-character Class Code provided by your professor to view Notes, Resources, and Attendance.</p>

      <form onsubmit="handleLookup(event)">
        <div class="mb-3">
          <input type="text" id="codeField" class="form-control text-center code-input" placeholder="CODE" maxlength="6" required>
        </div>
        <button type="submit" id="btnLookup" class="btn btn-primary w-100 py-2">Open Classroom</button>
      </form>
      <div id="lookupAlert" class="alert alert-danger mt-3 d-none small py-2"></div>
    </div>
  </div>

  <!-- CLASSROOM VIEW (Visible after Code Verified) -->
  <div id="classroomView" class="container d-none mt-3" style="max-width: 900px;">
    <!-- Classroom Banner -->
    <div class="card shadow-sm border-0 mb-4 bg-primary text-white">
      <div class="card-body p-4 d-flex flex-wrap justify-content-between align-items-center">
        <div>
          <span class="badge bg-light text-primary mb-2" id="lblClassCode"></span>
          <h3 class="mb-1" id="lblSubject"></h3>
          <p class="mb-0 opacity-75" id="lblMeta"></p>
        </div>
        <button class="btn btn-outline-light btn-sm mt-3 mt-md-0" onclick="exitClass()">Change Code</button>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <ul class="nav nav-pills mb-3" id="classTabs">
      <li class="nav-item">
        <button class="nav-link active" onclick="switchTab('posts')">
          <i class="bi bi-folder2-open"></i> Notes & Resources
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link" onclick="switchTab('attendance')">
          <i class="bi bi-calendar-check"></i> Attendance Record
        </button>
      </li>
    </ul>

    <!-- Tab 1: Notes & Resources -->
    <div id="tabContentPosts">
      <div id="postsList"></div>
    </div>

    <!-- Tab 2: Attendance Records -->
    <div id="tabContentAttendance" class="d-none">
      <div class="card border-0 shadow-sm">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Date</th>
                <th>Topic / Hour</th>
                <th>Status</th>
                <th>Absentees</th>
              </tr>
            </thead>
            <tbody id="attendanceTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ==================== CONFIGURATION ====================
    // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE:
    const SCRIPT_API_URL = "https://script.google.com/macros/s/AKfycbxYOUR_DEPLOYMENT_ID_HERE/exec";

    async function callBackend(action, data = {}) {
      try {
        const response = await fetch(SCRIPT_API_URL, {
          method: "POST",
          body: JSON.stringify({ action: action, data: data })
        });
        const result = await response.json();
        if (!result.success) throw new Error(result.error);
        return result.data;
      } catch (err) {
        throw err;
      }
    }

    async function handleLookup(e) {
      if (e) e.preventDefault();
      const code = document.getElementById('codeField').value.trim().toUpperCase();
      const btn = document.getElementById('btnLookup');
      const alertBox = document.getElementById('lookupAlert');

      btn.disabled = true;
      btn.innerText = 'Connecting...';
      alertBox.classList.add('d-none');

      try {
        const data = await callBackend('getStudentClassData', { classCode: code });
        btn.disabled = false;
        btn.innerText = 'Open Classroom';
        renderClassroom(data);
      } catch (err) {
        btn.disabled = false;
        btn.innerText = 'Open Classroom';
        alertBox.textContent = err.message || 'Classroom not found.';
        alertBox.classList.remove('d-none');
      }
    }

    function renderClassroom(data) {
      const info = data.classInfo;
      document.getElementById('lblClassCode').textContent = 'CLASS CODE: ' + info.code;
      document.getElementById('lblSubject').textContent = info.subject;
      document.getElementById('lblMeta').textContent = `Faculty: ${info.faculty} | ${info.branch} - Sem ${info.semester} (Div ${info.division})`;

      // Render Notes and Resources
      const postsDiv = document.getElementById('postsList');
      if (data.posts.length === 0) {
        postsDiv.innerHTML = '<div class="alert alert-secondary text-center py-4">No notes or announcements posted yet.</div>';
      } else {
        postsDiv.innerHTML = data.posts.map(p => `
          <div class="card border-0 shadow-sm mb-3">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-start">
                <div>
                  <span class="badge bg-secondary mb-1">${p.category}</span>
                  <h5 class="mb-1">${p.title}</h5>
                </div>
                <small class="text-muted">${p.date}</small>
              </div>
              <p class="text-secondary mt-2 mb-2">${p.description || ''}</p>
              ${p.link ? `<a href="${p.link}" target="_blank" rel="noopener noreferrer" class="btn btn-outline-primary btn-sm"><i class="bi bi-box-arrow-up-right"></i> Open Resource / Drive Link</a>` : ''}
            </div>
          </div>
        `).join('');
      }

      // Render Attendance Table
      const attTbody = document.getElementById('attendanceTableBody');
      if (data.attendance.length === 0) {
        attTbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-3">No attendance recorded yet.</td></tr>';
      } else {
        attTbody.innerHTML = data.attendance.map(a => `
          <tr>
            <td><strong>${a.date}</strong></td>
            <td>${a.topic}</td>
            <td>
              <span class="badge bg-success">${a.present} / ${a.total} Present</span>
              ${a.absent > 0 ? `<span class="badge bg-danger ms-1">${a.absent} Absent</span>` : ''}
            </td>
            <td>
              <div class="small ${a.absentRolls !== 'None' ? 'text-danger font-monospace fw-bold' : 'text-muted'}">
                ${a.absentRolls}
              </div>
              ${a.remarks ? `<div class="small text-muted mt-1"><em>${a.remarks}</em></div>` : ''}
            </td>
          </tr>
        `).join('');
      }

      document.getElementById('lookupContainer').classList.add('d-none');
      document.getElementById('classroomView').classList.remove('d-none');
    }

    function switchTab(tab) {
      const postsTab = document.getElementById('tabContentPosts');
      const attTab = document.getElementById('tabContentAttendance');
      const tabs = document.querySelectorAll('#classTabs .nav-link');

      if (tab === 'posts') {
        tabs[0].classList.add('active');
        tabs[1].classList.remove('active');
        postsTab.classList.remove('d-none');
        attTab.classList.add('d-none');
      } else {
        tabs[1].classList.add('active');
        tabs[0].classList.remove('active');
        attTab.classList.remove('d-none');
        postsTab.classList.add('d-none');
      }
    }

    function exitClass() {
      document.getElementById('classroomView').classList.add('d-none');
      document.getElementById('lookupContainer').classList.remove('d-none');
      document.getElementById('codeField').value = '';
    }

    // Auto-read code if passed in URL query: ?code=ABC123
    window.onload = function() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      if (code) {
        document.getElementById('codeField').value = code;
        handleLookup();
      }
    };
  </script>
</body>
</html>
