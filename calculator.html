<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scientific Calculator | Free Tools</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#eef2f7;
}

.container{
    max-width:500px;
    margin:20px auto;
    padding:12px;
}

.calculator{
    background:#20252b;
    padding:15px;
    border-radius:18px;
    box-shadow:0 8px 25px rgba(0,0,0,.25);
}

.title{
    color:white;
    text-align:center;
    font-size:21px;
    font-weight:bold;
    margin-bottom:10px;
}

.display-box{
    background:#d9e7d2;
    border:4px solid #111;
    border-radius:8px;
    padding:8px;
    margin-bottom:10px;
}

.expression{
    width:100%;
    height:25px;
    border:0;
    background:transparent;
    text-align:right;
    font-size:14px;
    outline:none;
}

.display{
    width:100%;
    height:42px;
    border:0;
    background:transparent;
    text-align:right;
    font-size:27px;
    outline:none;
    font-weight:bold;
}

.status{
    display:flex;
    justify-content:space-between;
    color:#fff;
    font-size:12px;
    margin:5px 2px 9px;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:6px;
}

button{
    min-height:47px;
    border:0;
    border-radius:7px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

button:active{
    transform:scale(.95);
}

.function{background:#cbd5e1}
.number{background:#f1f5f9}
.operator{background:#f59e0b;color:white}
.equal{background:#16a34a;color:white}
.clear{background:#dc2626;color:white}
.special{background:#475569;color:white}
.shift{background:#facc15;color:#111}
.alpha{background:#38bdf8;color:#111}
.mode{background:#2563eb;color:white}
.memory{background:#64748b;color:white}

.info{
    background:white;
    margin-top:15px;
    padding:14px;
    border-radius:10px;
    line-height:1.5;
    font-size:14px;
}

@media(max-width:400px){
    button{
        min-height:43px;
        font-size:13px;
    }
}
</style>
</head>

<body>

<div class="container">

<div class="calculator">

<div class="title">Scientific Calculator</div>

<div class="display-box">
    <input id="expression" class="expression" readonly>
    <input id="display" class="display" value="0" readonly>
</div>

<div class="status">
    <span id="modeStatus">DEG</span>
    <span id="shiftStatus"></span>
    <span id="alphaStatus"></span>
</div>

<div class="buttons">

<!-- SHIFT / ALPHA -->
<button class="shift" onclick="toggleShift()">SHIFT</button>
<button class="alpha" onclick="toggleAlpha()">ALPHA</button>
<button class="mode" onclick="toggleAngle()">DEG</button>
<button class="clear" onclick="clearAll()">AC</button>
<button class="special" onclick="backspace()">DEL</button>

<!-- TRIG -->
<button class="function" onclick="trig('sin')">sin</button>
<button class="function" onclick="trig('cos')">cos</button>
<button class="function" onclick="trig('tan')">tan</button>
<button class="function" onclick="trig('hyp')">hyp</button>
<button class="function" onclick="insert('(')">(</button>

<!-- SHIFT TRIG -->
<button class="function" onclick="inverseTrig('sin')">sin⁻¹</button>
<button class="function" onclick="inverseTrig('cos')">cos⁻¹</button>
<button class="function" onclick="inverseTrig('tan')">tan⁻¹</button>
<button class="function" onclick="insert(')')">)</button>
<button class="function" onclick="insert(',')">,</button>

<!-- LOG -->
<button class="function" onclick="insert('log(')">log</button>
<button class="function" onclick="insert('ln(')">ln</button>
<button class="function" onclick="insert('sqrt(')">√</button>
<button class="function" onclick="insert('cbrt(')">∛</button>
<button class="function" onclick="insert('^')">xʸ</button>

<!-- POWER -->
<button class="function" onclick="insert('^2')">x²</button>
<button class="function" onclick="insert('^3')">x³</button>
<button class="function" onclick="insert('10^')">10ˣ</button>
<button class="function" onclick="insert('exp(')">eˣ</button>
<button class="function" onclick="insert('1/')">1/x</button>

<!-- SPECIAL -->
<button class="function" onclick="insert('pi')">π</button>
<button class="function" onclick="insert('e')">e</button>
<button class="function" onclick="insert('!')">x!</button>
<button class="function" onclick="insert('%')">%</button>
<button class="function" onclick="insert('Ans')">Ans</button>

<!-- COMBINATIONS -->
<button class="function" onclick="insert('nCr(')">nCr</button>
<button class="function" onclick="insert('nPr(')">nPr</button>
<button class="function" onclick="insert('ENG')">ENG</button>
<button class="function" onclick="insert('EXP')">EXP</button>
<button class="function" onclick="toggleSign()">±</button>

<!-- NUMBERS -->
<button class="number" onclick="insert('7')">7</button>
<button class="number" onclick="insert('8')">8</button>
<button class="number" onclick="insert('9')">9</button>
<button class="operator" onclick="insert('/')">÷</button>
<button class="memory" onclick="memoryRecall()">MR</button>

<button class="number" onclick="insert('4')">4</button>
<button class="number" onclick="insert('5')">5</button>
<button class="number" onclick="insert('6')">6</button>
<button class="operator" onclick="insert('*')">×</button>
<button class="memory" onclick="memoryAdd()">M+</button>

<button class="number" onclick="insert('1')">1</button>
<button class="number" onclick="insert('2')">2</button>
<button class="number" onclick="insert('3')">3</button>
<button class="operator" onclick="insert('-')">−</button>
<button class="memory" onclick="memorySubtract()">M−</button>

<button class="number" onclick="insert('0')">0</button>
<button class="number" onclick="insert('00')">00</button>
<button class="number" onclick="insert('.')">.</button>
<button class="operator" onclick="insert('+')">+</button>
<button class="equal" onclick="calculate()">=</button>

<!-- MEMORY -->
<button class="memory" onclick="memoryClear()">MC</button>
<button class="memory" onclick="memoryRecall()">MR</button>
<button class="memory" onclick="memoryAdd()">M+</button>
<button class="memory" onclick="memorySubtract()">M−</button>
<button class="special" onclick="clearAll()">C</button>

</div>
</div>

<div class="info">
<strong>Scientific Calculator</strong><br><br>

Supports scientific calculations, DEG/RAD,
SHIFT, ALPHA, trigonometric functions, logarithms,
powers, roots, factorial, nCr, nPr, memory and Ans.

<br><br>

<strong>Calculation is performed locally in your browser.</strong>
</div>

</div>

<script>

let expression="";
let answer=0;
let memory=0;

let angleMode="DEG";
let shift=false;
let alpha=false;

const expressionBox=document.getElementById("expression");
const displayBox=document.getElementById("display");

function updateDisplay(){
    expressionBox.value=expression;
}

function insert(value){

    if(value==="ENG"){
        engineering();
        return;
    }

    if(value==="EXP"){
        expression+="e";
        updateDisplay();
        return;
    }

    expression+=value;
    updateDisplay();
}

function clearAll(){

    expression="";
    displayBox.value="0";
    expressionBox.value="";
    shift=false;
    alpha=false;
    updateStatus();
}

function backspace(){

    expression=expression.slice(0,-1);
    updateDisplay();
}

function toggleShift(){

    shift=!shift;

    if(shift){
        alpha=false;
    }

    updateStatus();
}

function toggleAlpha(){

    alpha=!alpha;

    if(alpha){
        shift=false;
    }

    updateStatus();
}

function updateStatus(){

    document.getElementById("modeStatus").textContent=angleMode;

    document.getElementById("shiftStatus").textContent=
        shift ? "SHIFT" : "";

    document.getElementById("alphaStatus").textContent=
        alpha ? "ALPHA" : "";
}

function toggleAngle(){

    angleMode=angleMode==="DEG"?"RAD":"DEG";

    document.querySelector(".mode").textContent=angleMode;

    updateStatus();
}

function toRad(x){

    return angleMode==="DEG"
        ? x*Math.PI/180
        : x;
}

function fromRad(x){

    return angleMode==="DEG"
        ? x*180/Math.PI
        : x;
}

function trig(type){

    if(type==="hyp"){
        expression+="hyp";
        updateDisplay();
        return;
    }

    expression+=type+"(";
    updateDisplay();
}

function inverseTrig(type){

    expression+="a"+type+"(";
    updateDisplay();

    shift=false;
    updateStatus();
}

function factorial(n){

    if(n<0 || !Number.isInteger(n))
        throw new Error();

    if(n>170)
        throw new Error();

    let r=1;

    for(let i=2;i<=n;i++)
        r*=i;

    return r;
}

function nCr(n,r){

    if(!Number.isInteger(n)||!Number.isInteger(r))
        throw new Error();

    if(r<0||r>n)
        return 0;

    return factorial(n)/
        (factorial(r)*factorial(n-r));
}

function nPr(n,r){

    if(!Number.isInteger(n)||!Number.isInteger(r))
        throw new Error();

    if(r<0||r>n)
        return 0;

    return factorial(n)/
        factorial(n-r);
}

function replaceFactorials(str){

    while(str.includes("!")){

        let match=str.match(/(\d+(?:\.\d+)?)!/);

        if(!match)
            throw new Error();

        str=str.replace(
            match[0],
            "factorial("+match[1]+")"
        );
    }

    return str;
}

function prepareExpression(str){

    str=str.replace(/×/g,"*");
    str=str.replace(/÷/g,"/");
    str=str.replace(/−/g,"-");

    str=str.replace(/π/g,"pi");

    str=str.replace(/\^/g,"**");

    str=replaceFactorials(str);

    str=str.replace(/\bAns\b/g,
        "("+answer+")");

    return str;
}

function evaluateExpression(str){

    str=prepareExpression(str);

    const sin=x=>Math.sin(toRad(x));
    const cos=x=>Math.cos(toRad(x));
    const tan=x=>Math.tan(toRad(x));

    const asin=x=>fromRad(Math.asin(x));
    const acos=x=>fromRad(Math.acos(x));
    const atan=x=>fromRad(Math.atan(x));

    const log=x=>Math.log10(x);
    const ln=x=>Math.log(x);

    const sqrt=x=>Math.sqrt(x);
    const cbrt=x=>Math.cbrt(x);
    const exp=x=>Math.exp(x);

    const pi=Math.PI;
    const e=Math.E;

    const allowed=
    /^[0-9+\-*/%().,\sA-Za-z_]+$/;

    if(!allowed.test(str))
        throw new Error();

    const fn=new Function(
        "sin","cos","tan",
        "asin","acos","atan",
        "log","ln",
        "sqrt","cbrt","exp",
        "factorial","nCr","nPr",
        "pi","e",
        `"use strict";return (${str});`
    );

    return fn(
        sin,cos,tan,
        asin,acos,atan,
        log,ln,
        sqrt,cbrt,exp,
        factorial,nCr,nPr,
        pi,e
    );
}

function calculate(){

    if(!expression)
        return;

    try{

        let result=evaluateExpression(expression);

        if(!Number.isFinite(result))
            throw new Error();

        answer=result;

        displayBox.value=formatNumber(result);

        expressionBox.value=
            expression+" =";

        expression=String(result);

    }catch(error){

        displayBox.value="Error";

        setTimeout(clearAll,1200);
    }
}

function formatNumber(value){

    if(Math.abs(value)<1e-12)
        value=0;

    if(
        Math.abs(value)>=1e10 ||
        (Math.abs(value)>0 &&
         Math.abs(value)<1e-9)
    ){
        return value.toExponential(8);
    }

    return Number(
        value.toPrecision(12)
    ).toString();
}

function engineering(){

    if(!expression)
        return;

    try{

        let value=evaluateExpression(expression);

        if(value===0){
            displayBox.value="0";
            return;
        }

        let exponent=
            Math.floor(Math.log10(Math.abs(value))/3)*3;

        let mantissa=
            value/Math.pow(10,exponent);

        displayBox.value=
            mantissa.toPrecision(10)
            +" × 10^"+exponent;

        answer=value;

    }catch(e){

        displayBox.value="Error";
    }
}

function toggleSign(){

    if(!expression)
        expression="-";

    else
        expression="-("+expression+")";

    updateDisplay();
}

function memoryClear(){
    memory=0;
}

function memoryRecall(){

    expression+=String(memory);
    updateDisplay();
}

function memoryAdd(){

    try{
        memory+=evaluateExpression(
            expression||"0"
        );
    }catch(e){}
}

function memorySubtract(){

    try{
        memory-=evaluateExpression(
            expression||"0"
        );
    }catch(e){}
}

document.addEventListener("keydown",function(e){

    if(/[0-9+\-*/().%,]/.test(e.key)){
        insert(e.key);
    }

    else if(e.key==="Enter"){
        calculate();
    }

    else if(e.key==="Backspace"){
        backspace();
    }

    else if(e.key==="Escape"){
        clearAll();
    }

});

updateStatus();

</script>

</body>
</html>
