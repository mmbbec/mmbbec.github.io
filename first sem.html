        </select>
      </label>
      <label class="viz-ctrl"><span>point x</span><input type="range" min="-1.5" max="1.5" step="0.05" value="0.6" data-px><b>0.60</b></label>
      <label class="viz-ctrl"><span>point y</span><input type="range" min="-1.5" max="1.5" step="0.05" value="0.4" data-py><b>0.40</b></label>
      <label class="viz-ctrl"><span>rotate</span><input type="range" min="0" max="360" step="1" value="35" data-rot><b>35°</b></label>
    </div>
    <div class="viz-stats">
      <div class="viz-stat"><span>f(x₀,y₀)</span><b data-out="z0">—</b></div>
      <div class="viz-stat"><span>∂f/∂x</span><b data-out="fx">—</b></div>
      <div class="viz-stat"><span>∂f/∂y</span><b data-out="fy">—</b></div>
      <div class="viz-stat"><span>tangent plane</span><b data-out="tp" style="font-size:10.5px">—</b></div>
    </div>
    <div class="viz-note"><b>Real-world:</b> surfaces z = f(x, y) model terrain elevation, temperature distribution on a plate, and the profit landscape in optimization.</div>
  `;
  const canvas = container.querySelector('canvas');
  const S = { fn:'saddle', px:0.6, py:0.4, rot:35 };

  const F = {
    saddle: { f:(x,y) => x*x - y*y,   fx:(x) => 2*x, fy:(y) => -2*y, range:1.5 },
    parab:  { f:(x,y) => x*x + y*y,   fx:(x) => 2*x, fy:(y) => 2*y,  range:1.5 },
    ripple: { f:(x,y) => Math.sin(x)*Math.cos(y), fx:(x,y) => Math.cos(x)*Math.cos(y), fy:(x,y) => -Math.sin(x)*Math.sin(y), range:2.2 }
  };

  function project(x, y, z, cx, cy, scale, rot){
    const cr = Math.cos(rot), sr = Math.sin(rot);
    const X = x*cr - y*sr;
    const Y = x*sr + y*cr;
    const px = cx + X*scale;
    const py = cy + Y*scale*0.45 - z*scale*0.7;
    return [px, py];
  }

  function draw(){
    const { ctx, w, h } = fitCanvas(canvas, 360);
    const p = vizPalette();
    ctx.fillStyle = p.bg; ctx.fillRect(0, 0, w, h);
    const spec = F[S.fn];
    const cx = w/2, cy = h/2 + 30;
    const scale = Math.min(w/4.4, h/2.6) / spec.range;
    const rot = S.rot * Math.PI/180;

    // Sample grid
    const N = 22;
    const cells = [];
    let zmin = Infinity, zmax = -Infinity;
    for (let i = 0; i <= N; i++){
      cells[i] = [];
      for (let j = 0; j <= N; j++){
        const x = -spec.range + 2*spec.range*i/N;
        const y = -spec.range + 2*spec.range*j/N;
        const z = spec.f(x, y);
        cells[i][j] = { x, y, z };
        if (z < zmin) zmin = z;
        if (z > zmax) zmax = z;
      }
    }

    const colorFor = z => {
      const t = (z - zmin) / (zmax - zmin || 1);
      // blue → violet → ember
      const r = Math.round(60 + 180*t);
      const g = Math.round(110 + 40*(1 - Math.abs(t - 0.5)*2));
      const b = Math.round(220 - 130*t);
      return `rgb(${r},${g},${b})`;
    };

    // Draw quads sorted by depth
    const quads = [];
    for (let i = 0; i < N; i++){
      for (let j = 0; j < N; j++){
        const c = cells[i][j];
        const depth = (c.x + c.y);
        quads.push({ i, j, depth });
      }
    }
    quads.sort((a, b) => a.depth - b.depth);

    for (const q of quads){
      const c00 = cells[q.i][q.j];
      const c10 = cells[q.i+1][q.j];
      const c11 = cells[q.i+1][q.j+1];
      const c01 = cells[q.i][q.j+1];
      const pts = [c00, c10, c11, c01].map(c => project(c.x, c.y, c.z, cx, cy, scale, rot));
      const zAvg = (c00.z + c10.z + c11.z + c01.z)/4;
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let k = 1; k < 4; k++) ctx.lineTo(pts[k][0], pts[k][1]);
      ctx.closePath();
      ctx.fillStyle = colorFor(zAvg);
      ctx.globalAlpha = 0.85;
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = p.bg;
      ctx.lineWidth = 0.4;
      ctx.stroke();
    }

    // Tangent plane at (px, py)
    const x0 = S.px, y0 = S.py;
    const z0 = spec.f(x0, y0);
    const fx = spec.fx(x0, y0), fy = spec.fy(x0, y0);
    const plane = [];
    const dp = 0.5;
    const corners = [
      [x0-dp, y0-dp], [x0+dp, y0-dp], [x0+dp, y0+dp], [x0-dp, y0+dp]
    ];
    for (const [x, y] of corners){
      const z = z0 + fx*(x - x0) + fy*(y - y0);
      plane.push(project(x, y, z, cx, cy, scale, rot));
    }
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(plane[0][0], plane[0][1]);
    for (let k = 1; k < 4; k++) ctx.lineTo(plane[k][0], plane[k][1]);
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,200,80,0.35)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,180,40,0.95)';
    ctx.lineWidth = 1.6;
    ctx.stroke();
    ctx.restore();

    // Point
    const pp = project(x0, y0, z0, cx, cy, scale, rot);
    ctx.save();
    ctx.fillStyle = p.brand;
    ctx.beginPath(); ctx.arc(pp[0], pp[1], 5, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
    labelText(ctx, `P (${R(x0)}, ${R(y0)}, ${R(z0)})`, pp[0] + 10, pp[1] - 12, p.brand, 10);

    // Axes
    const axes = [
      { x: spec.range, y: 0, z: 0, label:'x', color:'#f87171' },
      { x: 0, y: spec.range, z: 0, label:'y', color:'#34d399' },
      { x: 0, y: 0, z: zmax,    label:'z', color:'#60a5fa' }
    ];
    const origin = project(0, 0, 0, cx, cy, scale, rot);
    for (const a of axes){
      const e = project(a.x, a.y, a.z, cx, cy, scale, rot);
      arrow(ctx, origin[0], origin[1], e[0], e[1], a.color, 8);
      labelText(ctx, a.label, e[0] + 6, e[1] - 6, a.color, 11);
    }

    container.querySelector('[data-out="z0"]').textContent = R(z0);
    container.querySelector('[data-out="fx"]').textContent = R(fx);
    container.querySelector('[data-out="fy"]').textContent = R(fy);
    container.querySelector('[data-out="tp"]').textContent =
      `z = ${R(z0)} + ${R(fx)}(x−${R(x0)}) + ${R(fy)}(y−${R(y0)})`;
  }

  container.querySelector('[data-fn]').addEventListener('change', e => { S.fn = e.target.value; draw(); });
  ['px','py','rot'].forEach(k => {
    container.querySelector(`[data-${k}]`).addEventListener('input', e => {
      S[k] = parseFloat(e.target.value);
      e.target.parentElement.querySelector('b').textContent = k === 'rot' ? S[k] + '°' : S[k].toFixed(2);
      draw();
    });
  });
  let raf = 0;
  const resize = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); };
  window.addEventListener('resize', resize);
  vizCleanups.push(() => { window.removeEventListener('resize', resize); cancelAnimationFrame(raf); });
  draw();
}

/* ============================== VIZ: CONTOUR MAP ============================== */
function setupContourViz(container){
  const spec = VIZ_SPECS.unit2.find(s => s.id === 'contour');
  container.innerHTML = `
    <div class="solver-head"><div>
      <h4>${spec.title}</h4>
      <p>${spec.desc}</p>
    </div></div>
    <div class="viz-wrap"><canvas class="viz-canvas" style="height:360px"></canvas></div>
    <div class="viz-ctrls">
      <label class="viz-ctrl"><span>function</span>
        <select class="input" data-fn style="flex:1;padding:5px 8px;font-size:11.5px">
          <option value="saddle">f = x² − y² (saddle at origin)</option>
          <option value="bowl">f = x² + y² (minimum at origin)</option>
          <option value="peak">f = 4 − x² − y² (maximum at origin)</option>
          <option value="cubic">f = x³ − 3xy²</option>
        </select>
      </label>
    </div>
    <div class="viz-stats">
      <div class="viz-stat"><span>point (x, y)</span><b data-out="xy">—</b></div>
      <div class="viz-stat"><span>f(x, y)</span><b data-out="f">—</b></div>
      <div class="viz-stat"><span>∇f (gradient)</span><b data-out="grad">—</b></div>
      <div class="viz-stat"><span>classification</span><b data-out="cls" style="font-size:10.5px">—</b></div>
    </div>
    <div class="viz-note"><b>Real-world:</b> topographic maps encode elevation as contour lines. In optimization, contour plots reveal the structure of a cost function — where the valleys, peaks and saddle points lie.</div>
  `;
  const canvas = container.querySelector('canvas');
  const S = { fn:'saddle', px:0, py:0 };

  const F = {
    saddle:{ f:(x,y) => x*x - y*y,  fx:(x) => 2*x, fy:(y) => -2*y, fxx:()=>2, fxy:()=>0, fyy:()=>-2 },
    bowl:  { f:(x,y) => x*x + y*y,  fx:(x) => 2*x, fy:(y) => 2*y,  fxx:()=>2, fxy:()=>0, fyy:()=>2 },
    peak:  { f:(x,y) => 4 - x*x - y*y, fx:(x) => -2*x, fy:(y) => -2*y, fxx:()=>-2, fxy:()=>0, fyy:()=>-2 },
    cubic: { f:(x,y) => x*x*x - 3*x*y*y,
             fx:(x,y) => 3*x*x - 3*y*y,
             fy:(x,y) => -6*x*y,
             fxx:(x)=>6*x, fxy:(x,y)=>-6*y, fyy:(x)=>-6*x }
  };

  function draw(){
    const { ctx, w, h } = fitCanvas(canvas, 360);
    const p = vizPalette();
    ctx.fillStyle = p.bg; ctx.fillRect(0, 0, w, h);
    const spec = F[S.fn];
    const cx = w/2, cy = h/2;
    const scale = Math.min(w, h) / 4.6;
    const range = 2.2;

    // Heatmap
    const N = 90;
    const step = 2*range / N;
    let zmin = Infinity, zmax = -Infinity;
    const grid = [];
    for (let i = 0; i <= N; i++){
      grid[i] = [];
      for (let j = 0; j <= N; j++){
        const x = -range + i*step;
        const y = -range + j*step;
        const z = spec.f(x, y);
        grid[i][j] = z;
        if (z < zmin) zmin = z;
        if (z > zmax) zmax = z;
      }
    }
    const img = ctx.createImageData(N+1, N+1);
    for (let i = 0; i <= N; i++){
      for (let j = 0; j <= N; j++){
        const z = grid[i][j];
        const t = (z - zmin) / (zmax - zmin || 1);
        const idx = 4 * (j*(N+1) + i);
        img.data[idx]   = Math.round(40 + 200*(1 - t));
        img.data[idx+1] = Math.round(80 + 120*Math.abs(t - 0.5)*2);
        img.data[idx+2] = Math.round(60 + 180*t);
        img.data[idx+3] = 220;
      }
    }
    const off = ctx.createImageData ? null : null;
    // draw scaled
    const small = document.createElement('canvas');
    small.width = N+1; small.height = N+1;
    small.getContext('2d').putImageData(img, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(small, cx - range*scale, cy - range*scale, 2*range*scale, 2*range*scale);

    // Contours via simple level-set tracing
    const levels = 12;
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1;
    for (let L = 1; L < levels; L++){
      const lev = zmin + (zmax - zmin) * L/levels;
      ctx.beginPath();
      for (let i = 0; i < N; i++){
        for (let j = 0; j < N; j++){
          const z00 = grid[i][j], z10 = grid[i+1][j], z11 = grid[i+1][j+1], z01 = grid[i][j+1];
          const pts = [];
          const edge = (za, zb, xa, ya, xb, yb) => {
            if ((za - lev)*(zb - lev) < 0){
              const t = (lev - za)/(zb - za);
              pts.push([xa + t*(xb - xa), ya + t*(yb - ya)]);
            }
          };
          const xa = -range + i*step, xb = xa + step;
          const ya = -range + j*step, yb = ya + step;
          edge(z00, z10, xa, ya, xb, ya);
          edge(z10, z11, xb, ya, xb, yb);
          edge(z11, z01, xb, yb, xa, yb);
          edge(z01, z00, xa, yb, xa, ya);
          if (pts.length === 2){
            const [x1, y1] = pts[0], [x2, y2] = pts[1];
            ctx.moveTo(cx + x1*scale, cy - y1*scale);
            ctx.lineTo(cx + x2*scale, cy - y2*scale);
          }
        }
      }
      ctx.stroke();
    }
    ctx.restore();

    // Axes ticks
    ctx.save();
    ctx.strokeStyle = p.axis; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(cx - range*scale, cy); ctx.lineTo(cx + range*scale, cy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, cy - range*scale); ctx.lineTo(cx, cy + range*scale); ctx.stroke();
    labelText(ctx, 'x', cx + range*scale + 8, cy, p.text, 11);
    labelText(ctx, 'y', cx, cy - range*scale - 10, p.text, 11, 'center');
    ctx.restore();

    // Critical point marker
    const crit = { saddle:[0,0,'saddle'], bowl:[0,0,'min'], peak:[0,0,'max'], cubic:[0,0,'saddle'] }[S.fn];
    const cpx = cx + crit[0]*scale, cpy = cy - crit[1]*scale;
    ctx.save();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cpx, cpy, 7, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cpx, cpy, 3, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    labelText(ctx, `critical point (${crit[2]})`, cpx + 12, cpy - 12, '#fff', 10);

    // Current point
    const px = S.px, py = S.py;
    const fv = spec.f(px, py);
    const gx = spec.fx(px, py), gy = spec.fy(px, py);
    const qx = cx + px*scale, qy = cy - py*scale;
    ctx.save();
    ctx.fillStyle = p.brand;
    ctx.beginPath(); ctx.arc(qx, qy, 6, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();

    // Gradient arrow
    const gmag = Math.hypot(gx, gy);
    if (gmag > 0.01){
      const gs = Math.min(1.2, 40/gmag);
      arrow(ctx, qx, qy, qx + gx*gs*scale*0.15, qy - gy*gs*scale*0.15, p.ok, 7);
    }
    labelText(ctx, `P (${R(px)}, ${R(py)})`, qx + 10, qy + 14, '#fff', 10);

    // Classify
    let cls = '—';
    const fxx = spec.fxx(px), fxy = spec.fxy(px, py), fyy = spec.fyy(px);
    const D = fxx*fyy - fxy*fxy;
    if (Math.abs(gx) < 0.15 && Math.abs(gy) < 0.15){
      if (D > 0 && fxx < 0) cls = 'Local maximum';
      else if (D > 0 && fxx > 0) cls = 'Local minimum';
      else if (D < 0) cls = 'Saddle point';
      else cls = 'Inconclusive';
    } else cls = 'Not a critical point';

    container.querySelector('[data-out="xy"]').textContent = `(${R(px)}, ${R(py)})`;
    container.querySelector('[data-out="f"]').textContent = R(fv);
    container.querySelector('[data-out="grad"]').textContent = `(${R(gx)}, ${R(gy)})`;
    container.querySelector('[data-out="cls"]').textContent = cls;

    // Save transform for click
    canvas._xform = { cx, cy, scale, range };
  }

  canvas.addEventListener('click', e => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const t = canvas._xform;
    if (!t) return;
    const x = (mx - t.cx)/t.scale;
    const y = -(my - t.cy)/t.scale;
    if (Math.abs(x) <= t.range && Math.abs(y) <= t.range){
      S.px = Math.round(x*20)/20;
      S.py = Math.round(y*20)/20;
      draw();
    }
  });

  container.querySelector('[data-fn]').addEventListener('change', e => { S.fn = e.target.value; draw(); });
  let raf = 0;
  const resize = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); };
  window.addEventListener('resize', resize);
  vizCleanups.push(() => { window.removeEventListener('resize', resize); cancelAnimationFrame(raf); });
  draw();
}

/* ============================== VIZ: SPRING ANIMATION ============================== */
function setupSpringViz(container){
  const spec = VIZ_SPECS.unit3.find(s => s.id === 'spring');
  container.innerHTML = `
    <div class="solver-head"><div>
      <h4>${spec.title}</h4>
      <p>${spec.desc}</p>
    </div></div>
    <div class="viz-wrap"><canvas class="viz-canvas" style="height:340px"></canvas></div>
    <div class="viz-ctrls">
      <label class="viz-ctrl"><span>m</span><input type="range" min="0.5" max="3" step="0.1" value="1" data-m><b>1.0 kg</b></label>
      <label class="viz-ctrl"><span>c</span><input type="range" min="0" max="4" step="0.1" value="0.5" data-c><b>0.5</b></label>
      <label class="viz-ctrl"><span>k</span><input type="range" min="1" max="10" step="0.1" value="4" data-k><b>4.0</b></label>
      <label class="viz-ctrl"><span>controls</span>
        <button class="btn btn-sm" data-toggle-play style="flex:1">${I.pause} Pause</button>
        <button class="btn btn-sm" data-reset>${I.rotate} Reset</button>
      </label>
    </div>
    <div class="viz-stats">
      <div class="viz-stat"><span>ωₙ</span><b data-out="wn">—</b></div>
      <div class="viz-stat"><span>ζ</span><b data-out="z">—</b></div>
      <div class="viz-stat"><span>regime</span><b data-out="regime" style="font-size:10.5px">—</b></div>
      <div class="viz-stat"><span>t</span><b data-out="t">—</b></div>
    </div>
    <div class="viz-note"><b>Real-world:</b> vehicle suspension, earthquake-resistant buildings, and MEMS accelerometers are all modelled by mx″ + cx′ + kx = 0. The regime determines whether the system oscillates, returns smoothly, or creeps back.</div>
  `;
  const canvas = container.querySelector('canvas');
  const S = { m:1, c:0.5, k:4, x0:1, v0:0, t:0, playing:true };

  function stateAt(t){
    // Solve via numerical RK4 once for trajectory, cached
    return S._traj ? interpTraj(S._traj, t) : { x: S.x0, v: S.v0 };
  }

  function buildTraj(){
    const m = S.m, c = S.c, k = S.k;
    const dt = 0.008, T = 12;
    const N = Math.floor(T/dt);
    const xs = new Float32Array(N+1), vs = new Float32Array(N+1);
    xs[0] = S.x0; vs[0] = S.v0;
    const acc = (x, v) => (-c*v - k*x) / m;
    for (let i = 0; i < N; i++){
      const x = xs[i], v = vs[i];
      const k1x = v,               k1v = acc(x, v);
      const k2x = v + dt/2*k1v,    k2v = acc(x + dt/2*k1x, v + dt/2*k1v);
      const k3x = v + dt/2*k2v,    k3v = acc(x + dt/2*k2x, v + dt/2*k2v);
      const k4x = v + dt*k3v,      k4v = acc(x + dt*k3x,   v + dt*k3v);
      xs[i+1] = x + dt/6*(k1x + 2*k2x + 2*k3x + k4x);
      vs[i+1] = v + dt/6*(k1v + 2*k2v + 2*k3v + k4v);
    }
    S._traj = { xs, vs, dt, T };
  }
  function interpTraj(tr, t){
    const idx = Math.max(0, Math.min(tr.xs.length - 1, t / tr.dt));
    const i0 = Math.floor(idx), i1 = Math.min(tr.xs.length - 1, i0 + 1), a = idx - i0;
    return { x: tr.xs[i0]*(1-a) + tr.xs[i1]*a, v: tr.vs[i0]*(1-a) + tr.vs[i1]*a };
  }

  buildTraj();

  function draw(){
    const { ctx, w, h } = fitCanvas(canvas, 340);
    const p = vizPalette();
    ctx.fillStyle = p.bg; ctx.fillRect(0, 0, w, h);

    const wn = Math.sqrt(S.k/S.m);
    const z = S.c / (2*Math.sqrt(S.m*S.k));
    const regime = z < 0.999 ? 'Underdamped' : z < 1.001 ? 'Critically damped' : 'Overdamped';

    // Top half: mass on spring
    const ceilingY = 30;
    const massTop = h*0.55;
    const massH = 42, massW = 62;
    const cx = w * 0.32;
    const massY = massTop - massH/2 + 2.5 * 26 * Math.max(-1.4, Math.min(1.4, stateAt(S.t).x));

    // Ceiling
    ctx.save();
    ctx.strokeStyle = p.axis; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx - 100, ceilingY); ctx.lineTo(cx + 100, ceilingY); ctx.stroke();
    for (let i = -100; i < 100; i += 12){
      ctx.beginPath(); ctx.moveTo(cx + i, ceilingY); ctx.lineTo(cx + i - 8, ceilingY - 9); ctx.stroke();
    }
    ctx.restore();

    // Spring
    const coils = 10, springTop = ceilingY + 6, springBottom = massY - massH/2;
    const springH = springBottom - springTop;
    ctx.save();
    ctx.strokeStyle = p.brand; ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(cx, springTop);
    for (let i = 0; i <= coils*10; i++){
      const t = i/(coils*10);
      const yy = springTop + t*springH;
      const xx = cx + Math.sin(t*coils*Math.PI*2) * 18 * Math.sin(t*Math.PI);
      ctx.lineTo(xx, yy);
    }
    ctx.lineTo(cx, springBottom);
    ctx.stroke();
    ctx.restore();

    // Mass
    ctx.save();
    const grd = ctx.createLinearGradient(cx - massW/2, massY - massH/2, cx + massW/2, massY + massH/2);
    grd.addColorStop(0, p.brand);
    grd.addColorStop(1, cssVar('--brand-2') || p.brand);
    ctx.fillStyle = grd;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(cx - massW/2, massY - massH/2, massW, massH, 8);
    else ctx.rect(cx - massW/2, massY - massH/2, massW, massH);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = `800 14px 'Inter', sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('m', cx, massY);
    ctx.restore();

    // Vertical guide
    ctx.save();
    ctx.strokeStyle = p.grid; ctx.lineWidth = 1;
    ctx.setLineDash([3,4]);
    ctx.beginPath(); ctx.moveTo(cx, h - 20); ctx.lineTo(cx, 10); ctx.stroke();
    ctx.restore();

    // Right half: x(t) chart
    const chartX0 = w * 0.55, chartY0 = 30, chartW = w*0.42, chartH = h - 70;
    ctx.save();
    ctx.fillStyle = p.bg;
    ctx.fillRect(chartX0 - 4, chartY0, chartW + 8, chartH);
    ctx.strokeStyle = p.grid; ctx.lineWidth = 1;
    // axes
    ctx.beginPath(); ctx.moveTo(chartX0, chartY0 + chartH/2); ctx.lineTo(chartX0 + chartW, chartY0 + chartH/2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(chartX0, chartY0); ctx.lineTo(chartX0, chartY0 + chartH); ctx.stroke();
    labelText(ctx, 'x(t)', chartX0 - 4, chartY0 - 6, p.text, 10, 'right');
    labelText(ctx, 't', chartX0 + chartW + 8, chartY0 + chartH/2, p.text, 10);

    // Waveform
    ctx.beginPath();
    const T = S._traj.T, N = S._traj.xs.length;
    const amp = 1.2;
    for (let i = 0; i < N; i++){
      const x = S._traj.xs[i];
      const px = chartX0 + (i/N)*chartW;
      const py = chartY0 + chartH/2 - (x/amp)*(chartH/2 - 8);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.strokeStyle = p.brand; ctx.lineWidth = 2; ctx.stroke();

    // Envelope for underdamped
    if (z < 1){
      ctx.save();
      ctx.strokeStyle = p.warn; ctx.lineWidth = 1; ctx.setLineDash([4,4]); ctx.globalAlpha = 0.6;
      for (const s of [1, -1]){
        ctx.beginPath();
        for (let i = 0; i <= 100; i++){
          const t = (i/100)*T;
          const env = s * Math.exp(-z*wn*t) * 1.05;
          const px = chartX0 + (i/100)*chartW;
          const py = chartY0 + chartH/2 - (env/amp)*(chartH/2 - 8);
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke();
      }
      ctx.restore();
    }

    // Current time marker
    const curX = chartX0 + (S.t/T)*chartW;
    ctx.save();
    ctx.strokeStyle = p.ok; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(curX, chartY0); ctx.lineTo(curX, chartY0 + chartH); ctx.stroke();
    ctx.restore();

    // Current marker
    const cur = stateAt(S.t);
    const cyMarker = chartY0 + chartH/2 - (cur.x/amp)*(chartH/2 - 8);
    ctx.save();
    ctx.fillStyle = p.ok; ctx.beginPath(); ctx.arc(curX, cyMarker, 5, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    labelText(ctx, `x = ${R(cur.x)}`, curX + 8, cyMarker - 10, p.ok, 11);
    ctx.restore();

    // Stats
    container.querySelector('[data-out="wn"]').textContent = R(wn) + ' rad/s';
    container.querySelector('[data-out="z"]').textContent = R(z);
    container.querySelector('[data-out="regime"]').textContent = regime;
    container.querySelector('[data-out="t"]').textContent = S.t.toFixed(2) + ' s';
  }

  let last = performance.now();
  let raf = 0;
  function loop(now){
    const dt = (now - last)/1000; last = now;
    if (S.playing){
      S.t += dt;
      if (S.t > S._traj.T) S.t = 0;
    }
    draw();
    raf = requestAnimationFrame(loop);
  }
  raf = requestAnimationFrame(loop);

  container.querySelectorAll('input[type=range]').forEach(inp => {
    inp.addEventListener('input', () => {
      const k = inp.dataset.m ? 'm' : inp.dataset.c ? 'c' : 'k';
      S[k] = parseFloat(inp.value);
      const unit = k === 'm' ? ' kg' : '';
      inp.parentElement.querySelector('b').textContent = S[k].toFixed(1) + unit;
      S.t = 0;
      buildTraj();
    });
  });
  container.querySelector('[data-toggle-play]').addEventListener('click', e => {
    S.playing = !S.playing;
    e.target.innerHTML = S.playing ? I.pause + ' Pause' : I.play + ' Play';
  });
  container.querySelector('[data-reset]').addEventListener('click', () => { S.t = 0; });

  vizCleanups.push(() => cancelAnimationFrame(raf));
}

/* ============================== VIZ: SLOPE FIELD ============================== */
function setupSlopeViz(container){
  const spec = VIZ_SPECS.unit3.find(s => s.id === 'slope');
  container.innerHTML = `
    <div class="solver-head"><div>
      <h4>${spec.title}</h4>
      <p>${spec.desc}</p>
    </div></div>
    <div class="viz-wrap"><canvas class="viz-canvas" style="height:360px;cursor:crosshair"></canvas></div>
    <div class="viz-ctrls">
      <label class="viz-ctrl"><span>dy/dx =</span>
        <select class="input" data-fn style="flex:1;padding:5px 8px;font-size:11.5px">
          <option value="logistic">y(1 − y) — logistic growth</option>
          <option value="linear">x − y — decay toward x = y</option>
          <option value="osc">−x/y — circular flow</option>
          <option value="predator">y − x² — predator–prey</option>
        </select>
      </label>
      <label class="viz-ctrl"><span>curves</span><button class="btn btn-sm" data-clear style="flex:1">${I.rotate} Clear solution curves</button></label>
    </div>
    <div class="viz-stats">
      <div class="viz-stat"><span>field</span><b data-out="field" style="font-size:10.5px">—</b></div>
      <div class="viz-stat"><span>curves drawn</span><b data-out="curves">0</b></div>
    </div>
    <div class="viz-note"><b>Real-world:</b> slope fields visualize any first-order ODE. The logistic field models population growth with carrying capacity; predator–prey fields model interacting species; the circular field models simple harmonic motion.</div>
  `;
  const canvas = container.querySelector('canvas');
  const S = { fn:'logistic', curves:[] };
  const F = {
    logistic:{ f:(x,y) => y*(1 - y),            label:'dy/dx = y(1 − y)' },
    linear:  { f:(x,y) => x - y,                label:'dy/dx = x − y' },
    osc:     { f:(x,y) => -x/(y + 0.001),       label:'dy/dx = −x/y' },
    predator:{ f:(x,y) => y - x*x/2,            label:'dy/dx = y − x²/2' }
  };

  function draw(){
    const { ctx, w, h } = fitCanvas(canvas, 360);
    const p = vizPalette();
    ctx.fillStyle = p.bg; ctx.fillRect(0, 0, w, h);
    const cx = w/2, cy = h/2;
    const scale = Math.min(w, h) / 6;
    const range = 3;

    // grid
    ctx.save();
    ctx.strokeStyle = p.grid; ctx.lineWidth = 1;
    for (let i = -range; i <= range; i++){
      ctx.beginPath(); ctx.moveTo(cx + i*scale, 0); ctx.lineTo(cx + i*scale, h); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, cy + i*scale); ctx.lineTo(w, cy + i*scale); ctx.stroke();
    }
    ctx.strokeStyle = p.axis; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(w, cy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, h); ctx.stroke();
    ctx.restore();

    // Slope field
    const f = F[S.fn].f;
    const step = 0.4;
    ctx.save();
    ctx.strokeStyle = p.muted; ctx.lineWidth = 1.2;
    for (let x = -range; x <= range; x += step){
      for (let y = -range; y <= range; y += step){
        const sl = f(x, y);
        const ang = Math.atan(sl);
        const len = 0.22;
        const dx = Math.cos(ang) * len, dy = Math.sin(ang) * len;
        const px = cx + x*scale, py = cy - y*scale;
        ctx.globalAlpha = 0.7;
        ctx.beginPath();
        ctx.moveTo(px - dx*scale, py + dy*scale);
        ctx.lineTo(px + dx*scale, py - dy*scale);
        ctx.stroke();
      }
    }
    ctx.restore();

    // Solution curves
    for (const curve of S.curves){
      ctx.save();
      ctx.strokeStyle = p.brand; ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i < curve.pts.length; i++){
        const [x, y] = curve.pts[i];
        const px = cx + x*scale, py = cy - y*scale;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
      const start = curve.pts[0];
      ctx.fillStyle = p.brand;
      ctx.beginPath(); ctx.arc(cx + start[0]*scale, cy - start[1]*scale, 4.5, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
      ctx.restore();
    }

    // Equation label
    labelText(ctx, F[S.fn].label, 12, 20, p.text, 12);
    container.querySelector('[data-out="field"]').textContent = F[S.fn].label;
    container.querySelector('[data-out="curves"]').textContent = String(S.curves.length);
    canvas._xform = { cx, cy, scale, range };
  }

  function integrate(x0, y0){
    const pts = [[x0, y0]];
    const f = F[S.fn].f;
    const dt = 0.03;
    const range = 3.2;
    // forward
    let x = x0, y = y0;
    for (let i = 0; i < 400; i++){
      const k1 = f(x, y);
      const k2 = f(x + dt/2, y + dt/2*k1);
      const k3 = f(x + dt/2, y + dt/2*k2);
      const k4 = f(x + dt, y + dt*k3);
      x += dt; y += dt/6*(k1 + 2*k2 + 2*k3 + k4);
      if (!isFinite(y) || Math.abs(y) > 10 || Math.abs(x) > range) break;
      pts.push([x, y]);
    }
    // backward
    x = x0; y = y0;
    const back = [];
    for (let i = 0; i < 400; i++){
      const k1 = f(x, y);
      const k2 = f(x - dt/2, y - dt/2*k1);
      const k3 = f(x - dt/2, y - dt/2*k2);
      const k4 = f(x - dt, y - dt*k3);
      x -= dt; y -= dt/6*(k1 + 2*k2 + 2*k3 + k4);
      if (!isFinite(y) || Math.abs(y) > 10 || Math.abs(x) > range) break;
      back.unshift([x, y]);
    }
    return back.concat(pts);
  }

  canvas.addEventListener('click', e => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const t = canvas._xform;
    if (!t) return;
    const x = (mx - t.cx)/t.scale;
    const y = -(my - t.cy)/t.scale;
    if (Math.abs(x) <= t.range && Math.abs(y) <= t.range){
      S.curves.push({ pts: integrate(x, y) });
      draw();
    }
  });

  container.querySelector('[data-fn]').addEventListener('change', e => {
    S.fn = e.target.value; S.curves = []; draw();
  });
  container.querySelector('[data-clear]').addEventListener('click', () => { S.curves = []; draw(); });
  let raf = 0;
  const resize = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); };
  window.addEventListener('resize', resize);
  vizCleanups.push(() => { window.removeEventListener('resize', resize); cancelAnimationFrame(raf); });
  draw();
}

/* ============================== VIZ: LINEAR TRANSFORM ============================== */
function setupTransformViz(container){
  const spec = VIZ_SPECS.unit4.find(s => s.id === 'transform');
  container.innerHTML = `
    <div class="solver-head"><div>
      <h4>${spec.title}</h4>
      <p>${spec.desc}</p>
    </div></div>
    <div class="viz-wrap"><canvas class="viz-canvas" style="height:360px"></canvas></div>
    <div class="viz-ctrls">
      <label class="viz-ctrl"><span>a₁₁</span><input type="range" min="-2" max="2" step="0.05" value="1.2" data-a><b>1.20</b></label>
      <label class="viz-ctrl"><span>a₁₂</span><input type="range" min="-2" max="2" step="0.05" value="0.6" data-b><b>0.60</b></label>
      <label class="viz-ctrl"><span>a₂₁</span><input type="range" min="-2" max="2" step="0.05" value="0.4" data-c><b>0.40</b></label>
      <label class="viz-ctrl"><span>a₂₂</span><input type="range" min="-2" max="2" step="0.05" value="1.4" data-d><b>1.40</b></label>
    </div>
    <div class="viz-stats">
      <div class="viz-stat"><span>det A</span><b data-out="det">—</b></div>
      <div class="viz-stat"><span>λ₁</span><b data-out="l1">—</b></div>
      <div class="viz-stat"><span>λ₂</span><b data-out="l2">—</b></div>
      <div class="viz-stat"><span>behaviour</span><b data-out="beh" style="font-size:10.5px">—</b></div>
    </div>
    <div class="viz-note"><b>Real-world:</b> every 2D graphic operation — rotation, scaling, shear — is a matrix. Eigenvectors are the directions that only stretch, not rotate; this underpins vibration modes, principal component analysis, and Google's PageRank.</div>
  `;
  const canvas = container.querySelector('canvas');
  const S = { a:1.2, b:0.6, c:0.4, d:1.4, t:0 };

  function draw(){
    const { ctx, w, h } = fitCanvas(canvas, 360);
    const p = vizPalette();
    ctx.fillStyle = p.bg; ctx.fillRect(0, 0, w, h);
    const cx = w/2, cy = h/2;
    const scale = Math.min(w, h)/6;

    drawGrid(ctx, w, h, cx, cy, scale, Math.ceil(w/(2*scale)), Math.ceil(h/(2*scale)));

    // Unit square (original)
    const sq = [[0,0],[1,0],[1,1],[0,1]];
    ctx.save();
    ctx.strokeStyle = p.muted; ctx.lineWidth = 1.5; ctx.setLineDash([4,3]);
    ctx.beginPath();
    sq.forEach(([x,y],i) => {
      const px = cx + x*scale, py = cy - y*scale;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    });
    ctx.closePath(); ctx.stroke();
    ctx.fillStyle = 'rgba(120,140,180,0.15)';
    ctx.fill();
    ctx.restore();

    // Transformed square
    const { a, b, c, d } = S;
    const t = S.t;
    const lerp = (u, v) => u + (v - u)*t;
    const A = [lerp(1, a), lerp(0, b), lerp(0, c), lerp(1, d)];
    ctx.save();
    ctx.fillStyle = 'rgba(52,82,212,0.22)';
    ctx.strokeStyle = p.brand; ctx.lineWidth = 2.4;
    ctx.beginPath();
    for (let i = 0; i < 4; i++){
      const [x, y] = sq[i];
      const nx = A[0]*x + A[1]*y;
      const ny = A[2]*x + A[3]*y;
      const px = cx + nx*scale, py = cy - ny*scale;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();

    // Basis vectors
    const e1x = cx + A[0]*scale, e1y = cy - A[2]*scale;
    const e2x = cx + A[1]*scale, e2y = cy - A[3]*scale;
    arrow(ctx, cx, cy, e1x, e1y, '#f87171', 8);
    arrow(ctx, cx, cy, e2x, e2y, '#34d399', 8);
    labelText(ctx, 'Ae₁', e1x + 8, e1y - 6, '#f87171', 10);
    labelText(ctx, 'Ae₂', e2x + 8, e2y - 6, '#34d399', 10);
    ctx.restore();

    // Eigenvectors
    const tr = a + d, det = a*d - b*c;
    const disc = tr*tr - 4*det;
    let l1 = 0, l2 = 0, beh = '—';
    if (disc >= 0){
      l1 = (tr + Math.sqrt(disc))/2;
      l2 = (tr - Math.sqrt(disc))/2;
      beh = (l1 > 1 && l2 > 1) ? 'Expanding' : (l1 < -1 || l2 < -1) ? 'Mixed / reflection' : 'Contracting';
    } else {
      const re = tr/2, im = Math.sqrt(-disc)/2;
      beh = 'Complex → rotation';
      l1 = re; l2 = re;
    }
    const drawEig = (lam, color) => {
      if (Math.abs(disc) < 1e-9 && Math.abs(lam - tr/2) < 1e-9 && Math.abs(l2 - l1) < 1e-9) return;
      let vx = b, vy = lam - a;
      if (Math.abs(b) < 1e-9 && Math.abs(c) < 1e-9){ vx = 1; vy = 0; }
      else if (Math.abs(b) < 1e-9){ vx = 0; vy = 1; }
      const len = Math.hypot(vx, vy) || 1;
      vx /= len; vy /= len;
      const mag = 1.4;
      const x1 = cx - vx*mag*scale, y1 = cy + vy*mag*scale;
      const x2 = cx + vx*mag*scale, y2 = cy - vy*mag*scale;
      ctx.save();
      ctx.strokeStyle = color; ctx.lineWidth = 2.2; ctx.setLineDash([6,4]);
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      ctx.restore();
      // arrowhead
      arrow(ctx, cx, cy, x2, y2, color, 7);
    };
    if (disc >= 0){
      drawEig(l1, '#fbbf24');
      if (Math.abs(l1 - l2) > 1e-6) drawEig(l2, '#a78bfa');
    }

    // determinant display in corner
    ctx.save();
    ctx.fillStyle = p.text;
    ctx.font = `700 12px 'JetBrains Mono', monospace`;
    ctx.fillText(`det A = ${R(det)}`, 12, h - 22);
    ctx.restore();

    // Stats
    container.querySelector('[data-out="det"]').textContent = R(det);
    if (disc >= 0){
      container.querySelector('[data-out="l1"]').textContent = R(l1);
      container.querySelector('[data-out="l2"]').textContent = R(l2);
    } else {
      const im = Math.sqrt(-disc)/2;
      container.querySelector('[data-out="l1"]').textContent = `${R(tr/2)} + ${R(im)}i`;
      container.querySelector('[data-out="l2"]').textContent = `${R(tr/2)} − ${R(im)}i`;
    }
    container.querySelector('[data-out="beh"]').textContent = beh;
  }

  // Animate on parameter change
  let animId = 0;
  function animate(){
    cancelAnimationFrame(animId);
    S.t = 0;
    const start = performance.now();
    const dur = 420;
    function step(now){
      const k = Math.min(1, (now - start)/dur);
      S.t = k;
      draw();
      if (k < 1) animId = requestAnimationFrame(step);
    }
    animId = requestAnimationFrame(step);
  }

  const map = { a:'a', b:'b', c:'c', d:'d' };
  container.querySelectorAll('input[type=range]').forEach(inp => {
    inp.addEventListener('input', () => {
      const key = Object.keys(map).find(k => inp.dataset[k] !== undefined);
      S[key] = parseFloat(inp.value);
      inp.parentElement.querySelector('b').textContent = S[key].toFixed(2);
      animate();
    });
  });

  let raf = 0;
  const resize = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); };
  window.addEventListener('resize', resize);
  vizCleanups.push(() => {
    window.removeEventListener('resize', resize);
    cancelAnimationFrame(raf); cancelAnimationFrame(animId);
  });
  draw();
}

/* ============================== VIZ: TRAFFIC NETWORK ============================== */
function setupTrafficViz(container){
  const spec = VIZ_SPECS.unit4.find(s => s.id === 'traffic');
  container.innerHTML = `
    <div class="solver-head"><div>
      <h4>${spec.title}</h4>
      <p>${spec.desc}</p>
    </div></div>
    <div class="viz-wrap"><canvas class="viz-canvas" style="height:340px;cursor:pointer"></canvas></div>
    <div class="viz-ctrls">
      <label class="viz-ctrl"><span>a₁₂</span><input type="range" min="0" max="800" step="10" value="400" data-e12><b>400</b></label>
      <label class="viz-ctrl"><span>a₂₃</span><input type="range" min="0" max="800" step="10" value="500" data-e23><b>500</b></label>
      <label class="viz-ctrl"><span>a₃₄</span><input type="range" min="0" max="800" step="10" value="350" data-e34><b>350</b></label>
      <label class="viz-ctrl"><span>a₄₁</span><input type="range" min="0" max="800" step="10" value="450" data-e41><b>450</b></label>
      <label class="viz-ctrl"><span>inflow</span><input type="range" min="0" max="800" step="10" value="500" data-s1><b>500</b></label>
      <label class="viz-ctrl"><span>outflow</span><input type="range" min="0" max="800" step="10" value="500" data-s2><b>500</b></label>
    </div>
    <div class="viz-stats">
      <div class="viz-stat"><span>system</span><b data-out="sys" style="font-size:10.5px">—</b></div>
      <div class="viz-stat"><span>junction 1</span><b data-out="j1" style="font-size:10px">—</b></div>
      <div class="viz-stat"><span>junction 2</span><b data-out="j2" style="font-size:10px">—</b></div>
      <div class="viz-stat"><span>junction 3</span><b data-out="j3" style="font-size:10px">—</b></div>
    </div>
    <div class="viz-note"><b>Real-world:</b> civil engineers use this exact framework to design signal timing. A consistent linear system means the specified boundary flows can be realised; an inconsistent one means the road network cannot carry the demand.</div>
  `;
  const canvas = container.querySelector('canvas');
  const S = { e12:400, e23:500, e34:350, e41:450, s1:500, s2:500 };

  function draw(){
    const { ctx, w, h } = fitCanvas(canvas, 340);
    const p = vizPalette();
    ctx.fillStyle = p.bg; ctx.fillRect(0, 0, w, h);

    // Four junctions in a rough square
    const cx = w/2, cy = h/2;
    const R = Math.min(w, h) * 0.3;
    const J = [
      [cx - R, cy - R],
      [cx + R, cy - R],
      [cx + R, cy + R],
      [cx - R, cy + R]
    ];

    // Edges with flow values
    const edges = [
      { i:0, j:1, val:S.e12, label:'x₁', color:'#f87171' },
      { i:1, j:2, val:S.e23, label:'x₂', color:'#34d399' },
      { i:2, j:3, val:S.e34, label:'x₃', color:'#60a5fa' },
      { i:3, j:0, val:S.e41, label:'x₄', color:'#fbbf24' }
    ];

    // Draw edges
    edges.forEach(e => {
      const [x1, y1] = J[e.i], [x2, y2] = J[e.j];
      const mx = (x1 + x2)/2, my = (y1 + y2)/2;
      // curve offset outward
      const dx = x2 - x1, dy = y2 - y1;
      const nx = -dy, ny = dx;
      const len = Math.hypot(dx, dy);
      const off = 28;
      const cxA = mx + nx/len*off, cyA = my + ny/len*off;
      // quadratic
      ctx.save();
      ctx.strokeStyle = e.color; ctx.lineWidth = 2.5 + e.val/300;
      ctx.beginPath(); ctx.moveTo(x1, y1);
      ctx.quadraticCurveTo(cxA, cyA, x2, y2); ctx.stroke();

      // arrowhead at midpoint pointing along curve direction
      const tx = 2*(1-0.5)*(cxA - x1) + 2*0.5*(x2 - cxA);
      const ty = 2*(1-0.5)*(cyA - y1) + 2*0.5*(y2 - cyA);
      const ang = Math.atan2(ty, tx);
      const aLen = 9;
      // point on curve at t=0.5
      const px = 0.25*x1 + 0.5*cxA + 0.25*x2;
      const py = 0.25*y1 + 0.5*cyA + 0.25*y2;
      ctx.fillStyle = e.color;
      ctx.beginPath();
      ctx.moveTo(px + Math.cos(ang)*aLen*0.6, py + Math.sin(ang)*aLen*0.6);
      ctx.lineTo(px - Math.cos(ang - 0.5)*aLen, py - Math.sin(ang - 0.5)*aLen);
      ctx.lineTo(px - Math.cos(ang + 0.5)*aLen, py - Math.sin(ang + 0.5)*aLen);
      ctx.closePath(); ctx.fill();

      // label
      ctx.fillStyle = e.color;
      ctx.font = `700 11px 'JetBrains Mono', monospace`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(`${e.label} = ${e.val}`, px + nx/len*40, py + ny/len*40);
      ctx.restore();
    });

    // Draw junctions
    const junctionLabels = ['J₁','J₂','J₃','J₄'];
    J.forEach(([x, y], i) => {
      // outer ring
      ctx.save();
      const grd = ctx.createRadialGradient(x, y, 4, x, y, 26);
      grd.addColorStop(0, p.brand);
      grd.addColorStop(1, 'rgba(52,82,212,0.15)');
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(x, y, 26, 0, Math.PI*2); ctx.fill();

      ctx.fillStyle = p.brand;
      ctx.beginPath(); ctx.arc(x, y, 18, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = p.bg; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = `800 12px 'Inter', sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(junctionLabels[i], x, y);
      ctx.restore();
    });

    // Inflow / outflow arrows on edges
    arrow(ctx, cx - R - 60, cy - R, cx - R - 22, cy - R, '#f87171', 9);
    labelText(ctx, `in ${S.s1}`, cx - R - 62, cy - R - 14, '#f87171', 10, 'center');
    arrow(ctx, cx + R + 22, cy + R, cx + R + 60, cy + R, '#34d399', 9);
    labelText(ctx, `out ${S.s2}`, cx + R + 62, cy + R + 14, '#34d399', 10, 'center');

    // Conservation: at each junction, inflow = outflow
    // Using directed loop: J1 gets a41 + s1, sends a12
    // For simplicity treat loop as: x1 flows J1→J2, x2 J2→J3, x3 J3→J4, x4 J4→J1
    // s1 enters at J1, s2 exits at J3
    const bal1 = S.e41 + S.s1 - S.e12;
    const bal2 = S.e12 - S.e23;
    const bal3 = S.e23 - S.e34 - S.s2;
    const bal4 = S.e34 - S.e41;
    const consistent = Math.abs(bal1) < 1 && Math.abs(bal2) < 1 && Math.abs(bal3) < 1 && Math.abs(bal4) < 1;

    // Show balance equations as text in corner
    ctx.save();
    ctx.font = `600 10.5px 'JetBrains Mono', monospace`;
    ctx.fillStyle = p.text;
    const lines = [
      `J₁: x₄ + ${S.s1} − x₁ = ${bal1}`,
      `J₂: x₁ − x₂          = ${bal2}`,
      `J₃: x₂ − x₃ − ${S.s2} = ${bal3}`,
      `J₄: x₃ − x₄          = ${bal4}`
    ];
    lines.forEach((line, i) => ctx.fillText(line, 12, h - 60 + i*13));
    ctx.fillStyle = consistent ? p.ok : p.warn;
    ctx.font = `800 11.5px 'Inter', sans-serif`;
    ctx.fillText(consistent ? '✓ Consistent — flow feasible' : '✗ Inconsistent — impossible flow', 12, h - 8);
    ctx.restore();

    container.querySelector('[data-out="sys"]').textContent = consistent ? 'Consistent' : 'Inconsistent';
    container.querySelector('[data-out="j1"]').textContent = `${bal1 >= 0 ? '+' : ''}${R(bal1)}`;
    container.querySelector('[data-out="j2"]').textContent = `${bal2 >= 0 ? '+' : ''}${R(bal2)}`;
    container.querySelector('[data-out="j3"]').textContent = `${bal3 >= 0 ? '+' : ''}${R(bal3)}`;
  }

  container.querySelectorAll('input[type=range]').forEach(inp => {
    inp.addEventListener('input', () => {
      const keys = ['e12','e23','e34','e41','s1','s2'];
      const key = keys.find(k => inp.dataset[k] !== undefined);
      S[key] = parseFloat(inp.value);
      inp.parentElement.querySelector('b').textContent = String(S[key]);
      draw();
    });
  });

  let raf = 0;
  const resize = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); };
  window.addEventListener('resize', resize);
  vizCleanups.push(() => { window.removeEventListener('resize', resize); cancelAnimationFrame(raf); });
  draw();
}

function progressPct(){
  const visitedUnits = [...state.visited].filter(v => v.startsWith('unit')).length;
  const solved = Object.values(state.practice).filter(Boolean).length;
  const mcqDone = state.mcq.submitted ? MCQS.length : Object.keys(state.mcq.answers).length;
  const pct = (visitedUnits/4)*45 + (solved/PRACTICE.length)*35 + (mcqDone/MCQS.length)*20;
  return Math.max(0, Math.min(100, Math.round(pct)));
}

  $('#ringArc').setAttribute('stroke-dasharray', C.toFixed(1));

  $('#ringTxt').textContent = p + '%';

/* ============================== SOLVER RENDERING ============================== */
function fieldValue(sid, mode, f){
  const s = state.sv[sid] || {};
  const key = mode + '.' + f.k;
  return s[key] !== undefined ? s[key] : f.v;
}

function solverCard(sid){
  const S = SOLVERS[sid];
  if (S.static) {
    return `<div class="card pad-lg">
      <div class="solver-head"><div>
        <h4>${esc(S.title)}</h4>
        <p>${esc(S.desc)}</p>
      </div></div>
      <div class="steps" style="white-space:pre-wrap">${esc(S.body)}</div>
    </div>`;
  }
  if (S.custom) return customSolver(S);

  const modes = Object.keys(S.modes);
  const cur = (state.sv[sid] && state.sv[sid].__mode) || modes[0];
  const def = S.modes[cur];
  const vals = {};
  def.fields.forEach(f => { vals[f.k] = parseFloat(fieldValue(sid, cur, f)) || 0; });
  const out = def.run(vals);
  const multi = modes.length > 1;

  return `
  <div class="card pad-lg">
    <div class="solver-head">
      <div><h4>${esc(S.title)}</h4><p>${esc(S.desc)}</p></div>
    </div>
    ${multi ? `<div class="seg" style="margin-top:14px">
      ${modes.map(m => `<button class="${m===cur?'active':''}" data-svmode="${sid}" data-mode="${m}">${esc(S.modes[m].label)}</button>`).join('')}
    </div>` : ''}
    <div class="fields" style="grid-template-columns:repeat(${Math.min(def.fields.length,2)},minmax(0,1fr))">
      ${def.fields.map(f => `
        <label class="field">
          <span>${esc(f.l)}</span>
          <input class="input" type="number" step="any" value="${esc(fieldValue(sid, cur, f))}"
            data-sv="${sid}" data-svmode-key="${cur}" data-key="${f.k}">
        </label>`).join('')}
    </div>
    <div id="sv-out-${sid}">${solverOutput(out)}</div>
  </div>`;
}

function solverOutput(o){
  return `<div class="steps">
<span class="ln"><b>FORMULA</b>      ${esc(o.f)}</span>
<span class="ln"><b>SUBSTITUTE</b>   ${esc(o.s)}</span>
<span class="ln"><b>CALCULATE</b>    ${esc(o.c)}</span>
<span class="ln ans">ANSWER       ${esc(o.a)}</span>
</div>`;
}

function refreshSolver(sid){
  const S = SOLVERS[sid];
  if (!S || S.custom || S.static) return;
  const modes = Object.keys(S.modes);
  const cur = (state.sv[sid] && state.sv[sid].__mode) || modes[0];
  const def = S.modes[cur];
  const vals = {};
  def.fields.forEach(f => { vals[f.k] = parseFloat(fieldValue(sid, cur, f)) || 0; });
  const el = $('#sv-out-' + sid);
  if (el) el.innerHTML = solverOutput(def.run(vals));
}

function customSolver(S){
  if (S.custom === 'taylor') return taylorSolver();
  if (S.custom === 'partial') return partialSolver();
  if (S.custom === 'rank') return rankSolver();
  if (S.custom === 'gauss') return gaussSolver();
  if (S.custom === 'seidel') return seidelSolver();
  if (S.custom === 'eigen') return eigenSolver();
  if (S.custom === 'power') return powerSolver();
  return '';
}

function getSV(id, key, def){
  const s = state.sv[id];
  return (s && s[key] !== undefined) ? s[key] : def;
}
function putSV(id, key, val){
  if (!state.sv[id]) state.sv[id] = {};
  state.sv[id][key] = val;
}

function taylorSolver(){
  const fn = getSV('taylor','fn','exp');
  const a  = parseFloat(getSV('taylor','a',0)) || 0;
  const x  = parseFloat(getSV('taylor','x',0.5));
  const n  = Math.max(1, Math.min(10, parseInt(getSV('taylor','n',5)) || 5));
  const fact = k => { let r = 1; for (let i = 2; i <= k; i++) r *= i; return r; };
  const exactFn = { exp: Math.exp, sin: Math.sin, cos: Math.cos, log1p: v => Math.log(1+v) }[fn];
  const exact = exactFn(x);
  const deriv = (k, at) => {
    if (fn === 'exp') return Math.exp(at);
    if (fn === 'sin') return Math.sin(at + k*Math.PI/2);
    if (fn === 'cos') return Math.cos(at + k*Math.PI/2);
    if (fn === 'log1p') {
      if (k === 0) return Math.log(1 + at);
      const f = fact(k-1);
      return Math.pow(-1, k-1) * f / Math.pow(1+at, k);
    }
    return 0;
  };
  let sum = 0, rows = '';
  for (let k = 0; k < n; k++) {
    const d = deriv(k, a);
    const term = d * Math.pow(x - a, k) / fact(k);
    sum += term;
    rows += `<span class="ln">k=${String(k).padEnd(2)} f⁽ᵏ⁾(a) = ${R(d).padEnd(12)} term = ${R(term)}</span>`;
  }
  return `
  <div class="card pad-lg">
    <div class="solver-head"><div><h4>Taylor / Maclaurin Expansion</h4><p>Expand a standard function about a point and compare with the exact value.</p></div></div>
    <div class="fields" style="grid-template-columns:repeat(4,minmax(0,1fr))">
      <label class="field"><span>Function</span>
        <select class="input" data-custom="taylor" data-key="fn">
          <option value="exp"   ${fn==='exp'?'selected':''}>eˣ</option>
          <option value="sin"   ${fn==='sin'?'selected':''}>sin x</option>
          <option value="cos"   ${fn==='cos'?'selected':''}>cos x</option>
          <option value="log1p" ${fn==='log1p'?'selected':''}>ln(1 + x)</option>
        </select>
      </label>
      <label class="field"><span>Centre a</span><input class="input" type="number" step="any" data-custom="taylor" data-key="a" value="${a}"></label>
      <label class="field"><span>Evaluate at x</span><input class="input" type="number" step="any" data-custom="taylor" data-key="x" value="${x}"></label>
      <label class="field"><span>Terms n</span><input class="input" type="number" min="1" max="10" data-custom="taylor" data-key="n" value="${n}"></label>
    </div>
    <div class="steps">
<span class="ln"><b>FORMULA</b>      f(x) = Σ f⁽ᵏ⁾(a)(x − a)ᵏ / k!</span>
<span class="ln"><b>SUBSTITUTE</b>   a = ${R(a)} ,  x = ${R(x)} ,  n = ${n}</span>
${rows}
<span class="ln ans">ANSWER       approx = ${R(sum)}   ·   exact = ${R(exact)}   ·   error = ${R(Math.abs(exact - sum))}</span>
    </div>
  </div>`;
}

function partialSolver(){
  const expr = getSV('partial','expr','x*x*y + Math.sin(x*y)');
  const x0 = parseFloat(getSV('partial','x0',1));
  const y0 = parseFloat(getSV('partial','y0',0.5));
  const h = 1e-5;
  let f;
  try { f = new Function('x','y','return (' + expr + ')'); f(1,1); } catch(e){ f = null; }
  if (!f) {
    return `<div class="card pad-lg">
      <div class="solver-head"><div><h4>Partial Derivatives (Numerical)</h4><p>Enter a valid JavaScript expression in x and y.</p></div></div>
      <div class="fields" style="margin-top:14px"><label class="field"><span>f(x, y)</span><input class="input mono" data-custom="partial" data-key="expr" value="${esc(expr)}"></label></div>
      <div class="steps"><span class="ln ans">ERROR  Could not parse the expression.</span></div>
    </div>`;
  }
  const F = f;
  const fx  = (F(x0+h,y0) - F(x0-h,y0)) / (2*h);
  const fy  = (F(x0,y0+h) - F(x0,y0-h)) / (2*h);
  const fxx = (F(x0+h,y0) - 2*F(x0,y0) + F(x0-h,y0)) / (h*h);
  const fyy = (F(x0,y0+h) - 2*F(x0,y0) + F(x0,y0-h)) / (h*h);
  const fxy = (F(x0+h,y0+h) - F(x0+h,y0-h) - F(x0-h,y0+h) + F(x0-h,y0-h)) / (4*h*h);
  return `
  <div class="card pad-lg">
    <div class="solver-head"><div><h4>Partial Derivatives (Numerical)</h4><p>Central-difference evaluation of fx, fy, fxx, fyy and fxy at a point.</p></div></div>
    <div class="fields" style="margin-top:14px">
      <label class="field"><span>f(x, y) — JavaScript expression</span>
        <input class="input mono" data-custom="partial" data-key="expr" value="${esc(expr)}"></label>
    </div>
    <div class="fields" style="grid-template-columns:repeat(2,minmax(0,1fr))">
      <label class="field"><span>x₀</span><input class="input" type="number" step="any" data-custom="partial" data-key="x0" value="${x0}"></label>
      <label class="field"><span>y₀</span><input class="input" type="number" step="any" data-custom="partial" data-key="y0" value="${y0}"></label>
    </div>
    <div class="steps">
<span class="ln"><b>FORMULA</b>      fx ≈ [f(x+h,y) − f(x−h,y)] / 2h ,  h = ${h}</span>
<span class="ln"><b>SUBSTITUTE</b>   point (${R(x0)}, ${R(y0)}) ,  f(${R(x0)}, ${R(y0)}) = ${R(F(x0,y0))}</span>
<span class="ln"><b>CALCULATE</b>    fx  = ${R(fx)}     fy  = ${R(fy)}
                fxx = ${R(fxx)}    fyy = ${R(fyy)}
                fxy = ${R(fxy)}</span>
<span class="ln ans">ANSWER       fx = ${R(fx)} ,  fy = ${R(fy)}</span>
    </div>
  </div>`;
}

function matrixInputs(name, rows, cols){
  const M = state.matrices[name];
  let html = `<div style="display:grid;grid-template-columns:repeat(${cols},minmax(0,1fr));gap:7px;margin-top:14px;max-width:${cols*74}px">`;
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++)
      html += `<input class="input mono" style="padding:7px 6px;text-align:center;font-size:12px"
        type="number" step="any" value="${M[r][c]}"
        data-matrix="${name}" data-r="${r}" data-c="${c}">`;
  html += '</div>';
  return html;
}

function echelon(rows, cols){
  const M = rows.map(r => r.slice());
  let rank = 0, steps = [];
  for (let col = 0; col < cols && rank < rows.length; col++) {
    let pivot = rank;
    for (let r = rank + 1; r < rows.length; r++)
      if (Math.abs(M[r][col]) > Math.abs(M[pivot][col])) pivot = r;
    if (Math.abs(M[pivot][col]) < 1e-10) continue;
    if (pivot !== rank) { [M[rank], M[pivot]] = [M[pivot], M[rank]]; steps.push(`Swap R${rank+1} ↔ R${pivot+1}`); }
    for (let r = rank + 1; r < rows.length; r++) {
      const factor = M[r][col] / M[rank][col];
      if (Math.abs(factor) > 1e-12) {
        steps.push(`R${r+1} ← R${r+1} − (${R(factor)}) R${rank+1}`);
        for (let c = col; c < cols; c++) M[r][c] -= factor * M[rank][c];
      }
    }
    rank++;
  }
  return { M, rank, steps };
}

function rankSolver(){
  const M = state.matrices.rank;
  const { M: E, rank, steps } = echelon(M, 3);
  return `
  <div class="card pad-lg">
    <div class="solver-head"><div><h4>Matrix Rank via Row Echelon Form</h4><p>Enter a 3×3 matrix; elementary row operations produce the echelon form and rank.</p></div></div>
    ${matrixInputs('rank',3,3)}
    <div class="steps">
<span class="ln"><b>FORMULA</b>      rank = number of non-zero rows in row-echelon form</span>
${steps.length ? steps.map(s => `<span class="ln">${esc(s)}</span>`).join('') : '<span class="ln">Matrix is already in echelon form.</span>'}
<span class="ln"><b>ECHELON</b>${E.map(r => `\n  [ ${r.map(v => R(v)).join('  ')} ]`).join('')}</span>
<span class="ln ans">ANSWER       rank = ${rank}</span>
    </div>
  </div>`;
}

function gaussSolver(){
  const M = state.matrices.gauss;
  const N = M.map(r => r.slice());
  const steps = [];
  for (let i = 0; i < 3; i++) {
    let pivot = i;
    for (let r = i+1; r < 3; r++) if (Math.abs(N[r][i]) > Math.abs(N[pivot][i])) pivot = r;
    if (Math.abs(N[pivot][i]) < 1e-10) { steps.push(`Pivot in column ${i+1} is zero — check consistency.`); continue; }
    if (pivot !== i) { [N[i], N[pivot]] = [N[pivot], N[i]]; steps.push(`Swap R${i+1} ↔ R${pivot+1}`); }
    for (let r = i+1; r < 3; r++) {
      const f = N[r][i] / N[i][i];
      if (Math.abs(f) > 1e-12) {
        steps.push(`R${r+1} ← R${r+1} − (${R(f)}) R${i+1}`);
        for (let c = i; c < 4; c++) N[r][c] -= f * N[i][c];
      }
    }
  }
  const sol = [0,0,0];
  let consistent = true;
  for (let i = 2; i >= 0; i--) {
    let s = N[i][3];
    for (let c = i+1; c < 3; c++) s -= N[i][c] * sol[c];
    if (Math.abs(N[i][i]) < 1e-10) {
      if (Math.abs(s) > 1e-8) { consistent = false; break; }
      sol[i] = 0;
    } else sol[i] = s / N[i][i];
  }
  return `
  <div class="card pad-lg">
    <div class="solver-head"><div><h4>Gauss Elimination — 3×4 Augmented System</h4><p>Forward elimination followed by back substitution to solve [A | b].</p></div></div>
    ${matrixInputs('gauss',3,4)}
    <div class="steps">
<span class="ln"><b>FORMULA</b>      [A | b] → upper triangular U ,  then back substitute</span>
${steps.slice(0,12).map(s => `<span class="ln">${esc(s)}</span>`).join('')}
<span class="ln"><b>UPPER U</b>${N.map(r => `\n  [ ${r.map(v => R(v)).join('  ')} ]`).join('')}</span>
<span class="ln ans">ANSWER       ${consistent ? `x = ${R(sol[0])} ,  y = ${R(sol[1])} ,  z = ${R(sol[2])}` : 'No unique solution — the system is inconsistent or under-determined.'}</span>
    </div>
  </div>`;
}

function seidelSolver(){
  const M = state.matrices.seidel;
  const tol = 1e-4;
  let x = [0,0,0];
  const rows = [];
  for (let it = 0; it < 20; it++) {
    const prev = x.slice();
    for (let i = 0; i < 3; i++) {
      let s = M[i][3];
      for (let j = 0; j < 3; j++) if (j !== i) s -= M[i][j] * x[j];
      const diag = M[i][i];
      x[i] = Math.abs(diag) < 1e-12 ? 0 : s / diag;
    }
    const err = Math.max(...x.map((v,i) => Math.abs(v - prev[i])));
    rows.push({ it: it+1, x: x.slice(), err });
    if (err < tol) break;
  }
  const last = rows[rows.length-1];
  return `
  <div class="card pad-lg">
    <div class="solver-head"><div><h4>Gauss–Seidel Iteration</h4><p>Iterative solution of a diagonally dominant 3×4 system, with convergence monitor.</p></div></div>
    ${matrixInputs('seidel',3,4)}
    <div class="steps">
<span class="ln"><b>FORMULA</b>      xᵢ⁽ᵏ⁺¹⁾ = (bᵢ − Σⱼ≠ᵢ aᵢⱼxⱼ) / aᵢᵢ     (tolerance 1e−4)</span>
<span class="ln"><b>ITERATIONS</b>${rows.slice(-8).map(r => `\n  k=${String(r.it).padStart(2)}  x = [ ${r.x.map(v=>R(v)).join(' , ')} ]   err = ${R(r.err)}`).join('')}</span>
<span class="ln ans">ANSWER       x = [ ${last.x.map(v=>R(v)).join(' , ')} ]   after ${last.it} iterations (error ${R(last.err)})</span>
    </div>
  </div>`;
}

function eigenSolver(){
  const M = state.matrices.eigen;
  const [a,b,c,d] = M;
  const tr = a + d, det = a*d - b*c;
  const D = tr*tr - 4*det;
  let lam = '', vec = '';
  if (D >= 0) {
    const l1 = (tr + Math.sqrt(D))/2, l2 = (tr - Math.sqrt(D))/2;
    lam = `λ₁ = ${R(l1)} ,   λ₂ = ${R(l2)}`;
    vec = `v₁ ∝ [ ${R(-b)} , ${R(a - l1)} ]      v₂ ∝ [ ${R(-b)} , ${R(a - l2)} ]`;
  } else {
    const re = tr/2, im = Math.sqrt(-D)/2;
    lam = `λ = ${R(re)} ± ${R(im)}i`;
    vec = `Complex eigenvalues — eigenvectors involve the same rotation pair.`;
  }
  return `
  <div class="card pad-lg">
    <div class="solver-head"><div><h4>Eigenvalues & Eigenvectors (2×2)</h4><p>Characteristic equation det(A − λI) = 0 for a 2×2 matrix.</p></div></div>
    ${matrixInputs('eigen',2,2)}
    <div class="steps">
<span class="ln"><b>FORMULA</b>      det(A − λI) = 0  ⇒  λ² − (tr)λ + det = 0</span>
<span class="ln"><b>SUBSTITUTE</b>   tr = ${R(a)} + ${R(d)} = ${R(tr)} ,   det = (${R(a)})( ${R(d)}) − (${R(b)})( ${R(c)}) = ${R(det)}</span>
<span class="ln"><b>CALCULATE</b>    discriminant = tr² − 4det = ${R(D)}</span>
<span class="ln"><b>ROOTS</b>        ${lam}</span>
<span class="ln ans">ANSWER       ${lam}
             ${vec}</span>
    </div>
  </div>`;
}

function powerSolver(){
  const M = state.matrices.power;
  const [a,b,c,d] = M;
  let x = [1, 1];
  const rows = [];
  for (let k = 1; k <= 8; k++) {
    const y = [a*x[0] + b*x[1], c*x[0] + d*x[1]];
    const nrm = Math.hypot(y[0], y[1]) || 1;
    const nx = [y[0]/nrm, y[1]/nrm];
    const lam = (nx[0]*y[0] + nx[1]*y[1]) / (nx[0]*nx[0] + nx[1]*nx[1]);
    rows.push({ k, y, x: nx, lam });
    x = nx;
  }
  const last = rows[rows.length-1];
  return `
  <div class="card pad-lg">
    <div class="solver-head"><div><h4>Power Method & Rayleigh Quotient</h4><p>Iterative estimation of the dominant eigenvalue of a 2×2 matrix.</p></div></div>
    ${matrixInputs('power',2,2)}
    <div class="steps">
<span class="ln"><b>FORMULA</b>      y = Ax ,  x ← y/‖y‖ ,  λ ≈ (xᵀAx)/(xᵀx)</span>
<span class="ln"><b>ITERATIONS</b>${rows.map(r => `\n  k=${r.k}  y = [ ${r.y.map(v=>R(v)).join(' , ')} ]   x = [ ${r.x.map(v=>R(v)).join(' , ')} ]   λ ≈ ${R(r.lam)}`).join('')}</span>
<span class="ln ans">ANSWER       λ ≈ ${R(last.lam)}  with eigenvector ≈ [ ${last.x.map(v=>R(v)).join(' , ')} ]</span>
    </div>
  </div>`;
}

/* ============================== RENDER ============================== */
function renderView(){
  cleanupViz();
  const v = state.view;
  const el = $('#content');
  if (v === 'dashboard') el.innerHTML = viewDashboard();
  else if (v.startsWith('unit')) el.innerHTML = viewUnit(v);
  else if (v === 'formulas') el.innerHTML = viewFormulas();
  else if (v === 'practice') el.innerHTML = viewPractice();
  else if (v === 'mcq') el.innerHTML = viewMcq();
  else if (v === 'progress') el.innerHTML = viewProgress();
  else if (v === 'about') el.innerHTML = viewAbout();
  el.scrollTop = 0;
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
  // Mount visualizations after layout
  if (v.startsWith('unit') && state.tab[v] === 'visualize'){
    requestAnimationFrame(() => mountVizForUnit(v));
  }
}

function renderAll(){
  renderNav();
  renderView();
  setRing();
  const label = {dashboard:'Dashboard', formulas:'Formula Sheet', practice:'Practice', mcq:'MCQ Test', progress:'Progress', about:'About'}[state.view]
    || (UNITS.find(u => u.id === state.view)?.title || 'Dashboard');
  $('#crumb').textContent = label;
}

function navigate(v){
  state.view = v;
  state.visited.add(v);
  state.search = '';
  save();
  renderAll();
  closeSidebar();
}

function openSidebar(){ $('#sidebar').classList.add('open'); $('#scrim').classList.add('show'); }
function closeSidebar(){ $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('show'); }

$('#menuBtn').innerHTML = I.menu;
$('#scrim').addEventListener('click', closeSidebar);

$('#themeBtn').addEventListener('click', () => {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', state.theme);
  $('#themeBtn').innerHTML = state.theme === 'dark' ? I.sun : I.moon;
  save();
  // Redraw any active visualizations with the new theme
  if (state.view.startsWith('unit') && state.tab[state.view] === 'visualize'){
    const specs = VIZ_SPECS[state.view] || [];
    specs.forEach(s => {
      const host = document.getElementById('viz-' + s.id);
      if (host){ delete host.dataset.mounted; host.innerHTML = ''; }
    });
    requestAnimationFrame(() => mountVizForUnit(state.view));
  }
});

$('#nav').addEventListener('click', e => {
  const b = e.target.closest('[data-nav]');
  if (b) navigate(b.dataset.nav);
});

const content = $('#content');

content.addEventListener('click', e => {
  const t = e.target;
  const nav = t.closest('[data-nav]');
  if (nav) { navigate(nav.dataset.nav); return; }

  const tab = t.closest('[data-tab]');
  if (tab) {
    state.tab[tab.dataset.unit] = tab.dataset.tab;
    state.search = '';
    cleanupViz();
    renderView();
    return;
  }

  const seg = t.closest('[data-svmode]');
  if (seg) {
    const sid = seg.dataset.svmode;
    if (!state.sv[sid]) state.sv[sid] = {};
    state.sv[sid].__mode = seg.dataset.mode;
    const card = seg.closest('.card');
    const html = solverCard(sid);
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    card.replaceWith(tmp.firstElementChild);
    return;
  }

  const cp = t.closest('[data-copy]');
  if (cp) {
    const text = cp.dataset.copy;
    const done = () => {
      cp.classList.add('done');
      cp.innerHTML = I.check;
      toast('Formula copied to clipboard');
      setTimeout(() => { cp.classList.remove('done'); cp.innerHTML = I.copy; }, 1300);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(done);
    } else done();
    return;
  }

  const chk = t.closest('[data-check]');
  if (chk) {
    const id = parseInt(chk.dataset.check);
    const p = PRACTICE.find(x => x.id === id);
    const cur = state.practice[id];
    const raw = cur && typeof cur === 'object' ? cur.input : '';
    const val = parseFloat(raw);
    const ok = !isNaN(val) && Math.abs(val - p.a) <= p.tol;
    state.practice[id] = { input: raw, ok };
    save();
    renderView();
    setRing();
    if (ok) toast('Correct answer');
    return;
  }

  const mopt = t.closest('[data-mcq-opt]');
  if (mopt) { state.mcq.answers[state.mcq.index] = parseInt(mopt.dataset.mcqOpt); save(); renderView(); return; }
  const mnav = t.closest('[data-mcq-nav]');
  if (mnav) { const i = parseInt(mnav.dataset.mcqNav); if (i >= 0 && i < MCQS.length){ state.mcq.index = i; save(); renderView(); } return; }
  if (t.closest('[data-mcq-submit]')) { state.mcq.submitted = true; save(); renderView(); setRing(); return; }
  if (t.closest('[data-mcq-retry]')) { state.mcq = { answers:{}, submitted:false, index:0 }; save(); renderView(); return; }
  if (t.closest('[data-reset]')) {
    state.practice = {};
    state.mcq = { answers:{}, submitted:false, index:0 };
    state.visited = new Set(['dashboard']);
    save(); renderAll(); toast('Progress reset');
    return;
  }
});

content.addEventListener('input', e => {
  const t = e.target;

  if (t.matches('[data-search]')) {
    state.search = t.value;
    const pos = t.selectionStart;
    renderView();
    const next = $('[data-search]');
    if (next) { next.focus(); next.setSelectionRange(pos, pos); }
    return;
  }
  if (t.matches('[data-sv]')) {
    const sid = t.dataset.sv, mode = t.dataset.svmodeKey, key = t.dataset.key;
    if (!state.sv[sid]) state.sv[sid] = {};
    state.sv[sid][mode + '.' + key] = t.value;
    refreshSolver(sid);
    return;
  }
  if (t.matches('[data-custom]')) {
    putSV(t.dataset.custom, t.dataset.key, t.value);
    const card = t.closest('.card');
    const html = customSolver(SOLVERS[t.dataset.custom]);
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    const which = t.dataset.key;
    card.replaceWith(tmp.firstElementChild);
    const again = $(`[data-custom="${t.dataset.custom}"][data-key="${which}"]`);
    if (again) { again.focus(); const v = again.value; again.setSelectionRange(v.length, v.length); }
    return;
  }
  if (t.matches('[data-practice]')) {
    const id = parseInt(t.dataset.practice);
    const cur = state.practice[id];
    state.practice[id] = { input: t.value, ok: cur && typeof cur === 'object' ? cur.ok : false };
    save();
    return;
  }
  if (t.matches('[data-matrix]')) {
    const name = t.dataset.matrix, r = parseInt(t.dataset.r), c = parseInt(t.dataset.c);
    state.matrices[name][r][c] = parseFloat(t.value) || 0;
    const card = t.closest('.card');
    const sid = { rank:'rank', gauss:'gauss', seidel:'seidel', eigen:'eigen', power:'power' }[name];
    const html = customSolver(SOLVERS[sid]);
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    card.replaceWith(tmp.firstElementChild);
    const again = $(`[data-matrix="${name}"][data-r="${r}"][data-c="${c}"]`);
    if (again) { again.focus(); const v = again.value; again.setSelectionRange(v.length, v.length); }
    return;
  }
});

/* ============================== BOOT ============================== */
document.documentElement.setAttribute('data-theme', state.theme);
$('#themeBtn').innerHTML = state.theme === 'dark' ? I.sun : I.moon;
renderAll();
</script>
</body>
</html>
