    const pad = 40;
    const X0 = pad, X1 = w-pad, Y0 = h-pad, Y1 = pad;
    const xmax = Math.max(S.n, Math.ceil(S.lam*2.5), 20);
    // Axes
    ctx.save();
    ctx.strokeStyle = p.axis; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(X0, Y0); ctx.lineTo(X1, Y0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(X0, Y0); ctx.lineTo(X0, Y1); ctx.stroke();
    ctx.restore();
    // x ticks
    ctx.save();
    ctx.fillStyle = p.muted; ctx.font = `600 10px 'JetBrains Mono', monospace`;
    for (let k = 0; k <= xmax; k += Math.max(1, Math.round(xmax/10))){
      const px = X0 + (k/xmax)*(X1-X0);
      ctx.fillText(String(k), px-5, Y0+14);
    }
    ctx.restore();

    // Binomial
    if (S.show === 'all' || S.show === 'bin'){
      ctx.save();
      ctx.fillStyle = 'rgba(16,185,129,.7)';
      ctx.strokeStyle = 'rgb(5,150,105)';
      ctx.lineWidth = 1.4;
      for (let k = 0; k <= S.n; k++){
        const v = binomPmf(S.n, S.p, k);
        const px = X0 + (k/xmax)*(X1-X0);
        const bw = (X1-X0)/xmax * 0.55;
        const by = Y0 - v*(Y0-Y1)/0.4;
        ctx.fillRect(px - bw/2, by, bw, Y0-by);
      }
      ctx.restore();
      labelText(ctx, 'Binomial', X0+6, Y1+12, 'rgb(5,150,105)', 11);
    }

    // Poisson
    if (S.show === 'all' || S.show === 'poi'){
      ctx.save();
      ctx.strokeStyle = 'rgb(139,92,246)'; ctx.lineWidth = 2;
      ctx.beginPath();
      let first = true;
      for (let k = 0; k <= xmax; k++){
        const v = poisPmf(S.lam, k);
        const px = X0 + (k/xmax)*(X1-X0);
        const py = Y0 - v*(Y0-Y1)/0.4;
        if (first){ ctx.moveTo(px, py); first = false; } else ctx.lineTo(px, py);
      }
      ctx.stroke();
      // dots
      ctx.fillStyle = 'rgb(139,92,246)';
      for (let k = 0; k <= xmax; k++){
        const v = poisPmf(S.lam, k);
        const px = X0 + (k/xmax)*(X1-X0);
        const py = Y0 - v*(Y0-Y1)/0.4;
        ctx.beginPath(); ctx.arc(px, py, 3, 0, Math.PI*2); ctx.fill();
      }
      ctx.restore();
      labelText(ctx, 'Poisson', X0+6, Y1+28, 'rgb(139,92,246)', 11);
    }

    // Normal overlay
    if (S.show === 'all' || S.show === 'norm'){
      const mu = S.n*S.p;
      const sd = Math.sqrt(S.n*S.p*(1-S.p));
      ctx.save();
      ctx.strokeStyle = 'rgb(59,130,246)'; ctx.lineWidth = 2.2; ctx.setLineDash([6,4]);
      ctx.beginPath();
      let first = true;
      for (let i = 0; i <= 200; i++){
        const xv = -0.5 + (xmax+0.5)*i/200;
        const v = normPdf(xv, mu, Math.max(0.3, sd));
        const px = X0 + (xv/xmax)*(X1-X0);
        const py = Y0 - v*(Y0-Y1)/0.4;
        if (first){ ctx.moveTo(px, py); first = false; } else ctx.lineTo(px, py);
      }
      ctx.stroke();
      ctx.restore();
      labelText(ctx, `Normal(μ=${R(mu)}, σ=${R(sd)})`, X0+6, Y1+44, 'rgb(59,130,246)', 11);
    }

    // legend
    ctx.save();
    ctx.fillStyle = p.text; ctx.font = `700 11px 'Inter', sans-serif`;
    ctx.fillText('Probability mass / density', X0, Y1-6);
    ctx.restore();

    container.querySelector('[data-out="bmu"]').textContent = R(S.n*S.p);
    container.querySelector('[data-out="pmu"]').textContent = R(S.lam);
    const nMu = S.n*S.p, nSd = Math.sqrt(S.n*S.p*(1-S.p));
    container.querySelector('[data-out="nmu"]').textContent = `μ=${R(nMu)}, σ=${R(nSd)}`;
  }

  container.querySelectorAll('input[type=range], select[data-k]').forEach(inp => {
    inp.addEventListener('input', () => {
      const key = inp.dataset.k;
      if (key === 'show'){ S.show = inp.value; }
      else {
        S[key] = parseFloat(inp.value);
        inp.parentElement.querySelector('b').textContent = key === 'n' ? String(Math.round(S.n)) : S[key].toFixed(2);
      }
      draw();
    });
  });
  let raf = 0;
  const resize = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); };
  window.addEventListener('resize', resize);
  vizCleanups.push(() => { window.removeEventListener('resize', resize); cancelAnimationFrame(raf); });
  draw();
}

/* CLT simulation */
function setupCltViz(container){
  const spec = VIZ_SPECS.unit2.find(s => s.id === 'clt');
  container.innerHTML = `
    <div class="solver-head"><div>
      <h4>${spec.title}</h4><p>${spec.desc}</p>
    </div></div>
    <div class="viz-wrap"><canvas class="viz-canvas" style="height:320px"></canvas></div>
    <div class="viz-ctrls">
      <label class="viz-ctrl"><span>sample size n</span><input type="range" min="1" max="40" step="1" value="5" data-k="n"><b>5</b></label>
      <label class="viz-ctrl"><span>population</span>
        <select data-k="pop" style="flex:1;padding:5px 8px;font-size:11.5px;border-radius:8px;border:1px solid var(--border-2);background:var(--surface-2)">
          <option value="unif">Uniform(0,1)</option>
          <option value="exp">Exponential(1)</option>
          <option value="bimodal">Bimodal</option>
        </select>
      </label>
      <label class="viz-ctrl"><span>samples</span><input type="range" min="200" max="3000" step="100" value="1000" data-k="M"><b>1000</b></label>
    </div>
    <div class="viz-stats">
      <div class="viz-stat"><span>pop μ</span><b data-out="pm">—</b></div>
      <div class="viz-stat"><span>pop σ</span><b data-out="ps">—</b></div>
      <div class="viz-stat"><span>theoretical SE</span><b data-out="se">—</b></div>
      <div class="viz-stat"><span>sample mean SD</span><b data-out="smsd">—</b></div>
    </div>
    <div class="viz-note"><b>Real-world:</b> CLT is why we can use normal-based confidence intervals and tests for sample means even when the population is skewed.</div>
  `;
  const canvas = container.querySelector('canvas');
  const S = { n:5, pop:'unif', M:1000 };

  function sample(){
    if (S.pop === 'unif') return Math.random();
    if (S.pop === 'exp') return -Math.log(1 - Math.random());
    // bimodal
    return Math.random() < 0.5 ? 0.3 + Math.random()*0.2 : 0.7 + Math.random()*0.2;
  }
  function popMu(){
    if (S.pop === 'unif') return 0.5;
    if (S.pop === 'exp') return 1;
    return 0.5;
  }
  function popVar(){
    if (S.pop === 'unif') return 1/12;
    if (S.pop === 'exp') return 1;
    // bimodal approx
    const p = 0.5, m1 = 0.4, m2 = 0.8;
    const mu = 0.6;
    const s1 = 0.0577, s2 = 0.0577;
    return p*(s1*s1 + (m1-mu)**2) + (1-p)*(s2*s2 + (m2-mu)**2);
  }

  function draw(){
    const { ctx, w, h } = fitCanvas(canvas, 320);
    const p = vizPalette();
    ctx.fillStyle = p.bg; ctx.fillRect(0, 0, w, h);

    // sample means
    const means = [];
    for (let i = 0; i < S.M; i++){
      let s = 0;
      for (let j = 0; j < S.n; j++) s += sample();
      means.push(s / S.n);
    }
    // histogram
    const mu = popMu();
    const v = popVar();
    const se = Math.sqrt(v / S.n);
    const lo = mu - 4*se, hi = mu + 4*se;
    const B = 40;
    const bins = new Array(B).fill(0);
    means.forEach(m => {
      const idx = clamp(Math.floor((m - lo) / (hi - lo) * B), 0, B-1);
      bins[idx]++;
    });
    const maxB = Math.max(...bins);
    const pad = 30;
    const X0 = pad, X1 = w - pad, Y0 = h - pad, Y1 = pad;
    // axes
    ctx.strokeStyle = p.axis; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(X0, Y0); ctx.lineTo(X1, Y0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(X0, Y0); ctx.lineTo(X0, Y1); ctx.stroke();
    // bars
    ctx.save();
    ctx.fillStyle = p.brand;
    for (let i = 0; i < B; i++){
      const bx = X0 + (i/B)*(X1-X0);
      const bh = bins[i]/maxB * (Y0-Y1);
      ctx.fillRect(bx, Y0 - bh, (X1-X0)/B - 1, bh);
    }
    ctx.restore();

    // overlay theoretical normal
    ctx.save();
    ctx.strokeStyle = p.ok; ctx.lineWidth = 2.4;
    ctx.beginPath();
    let first = true;
    for (let i = 0; i <= 200; i++){
      const xv = lo + (hi-lo)*i/200;
      const pdf = normPdf(xv, mu, se);
      const px = X0 + (i/200)*(X1-X0);
      const py = Y0 - (pdf/normPdf(mu, mu, se)) * (Y0-Y1) * 0.85;
      if (first){ ctx.moveTo(px, py); first = false; } else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.restore();

    // mean line
    ctx.save();
    ctx.strokeStyle = p.warn; ctx.lineWidth = 1.5; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo((X0+X1)/2, Y0); ctx.lineTo((X0+X1)/2, Y1); ctx.stroke();
    ctx.restore();

    labelText(ctx, `n = ${S.n}`, X0+6, Y1+12, p.text, 11);
    labelText(ctx, `M = ${S.M} samples`, X0+6, Y1+28, p.muted, 10);

    // stats
    const sampleSD = Math.sqrt(means.reduce((a,m)=>a+(m-meanArr(means))**2, 0)/means.length);
    container.querySelector('[data-out="pm"]').textContent = R(mu);
    container.querySelector('[data-out="ps"]').textContent = R(Math.sqrt(v));
    container.querySelector('[data-out="se"]').textContent = R(se);
    container.querySelector('[data-out="smsd"]').textContent = R(sampleSD);
  }

  container.querySelectorAll('input[type=range], select').forEach(inp => {
    inp.addEventListener('input', () => {
      const key = inp.dataset.k;
      if (key === 'pop') S.pop = inp.value;
      else { S[key] = parseInt(inp.value); inp.parentElement.querySelector('b').textContent = String(S[key]); }
      draw();
    });
  });
  let raf = 0;
  const resize = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); };
  window.addEventListener('resize', resize);
  vizCleanups.push(() => { window.removeEventListener('resize', resize); cancelAnimationFrame(raf); });
  draw();
}

/* Markov chain state diagram */
function setupMarkovViz(container){
  const spec = VIZ_SPECS.unit3.find(s => s.id === 'markov');
  container.innerHTML = `
    <div class="solver-head"><div>
      <h4>${spec.title}</h4><p>${spec.desc}</p>
    </div></div>
    <div class="viz-wrap"><canvas class="viz-canvas" style="height:340px"></canvas></div>
    <div class="viz-ctrls">
      <label class="viz-ctrl"><span>P₀₁</span><input type="range" min="0" max="1" step="0.05" value="0.3" data-k="p01"><b>0.30</b></label>
      <label class="viz-ctrl"><span>P₁₀</span><input type="range" min="0" max="1" step="0.05" value="0.4" data-k="p10"><b>0.40</b></label>
    </div>
    <div class="viz-stats">
      <div class="viz-stat"><span>π₀</span><b data-out="pi0">—</b></div>
      <div class="viz-stat"><span>π₁</span><b data-out="pi1">—</b></div>
      <div class="viz-stat"><span>step</span><b data-out="step">0</b></div>
    </div>
    <div class="viz-note"><b>Real-world:</b> two-state chains model on/off processes — packet loss, weather (sunny/rainy), or user engagement (active/inactive).</div>
  `;
  const canvas = container.querySelector('canvas');
  const S = { p01:0.3, p10:0.4, dist:[1,0], t:0, playing:true };

  function stationary(){
    const s = S.p01 + S.p10;
    if (s < 1e-9) return [0.5, 0.5];
    return [S.p10/s, S.p01/s];
  }

  function draw(){
    const { ctx, w, h } = fitCanvas(canvas, 340);
    const p = vizPalette();
    ctx.fillStyle = p.bg; ctx.fillRect(0, 0, w, h);

    const cx = w/2, cy = h/2 + 20;
    const R = Math.min(w, h) * 0.25;
    const S0 = [cx - R, cy];
    const S1 = [cx + R, cy];

    // edges
    const drawEdge = (from, to, prob, color, curveDir) => {
      const dx = to[0] - from[0], dy = to[1] - from[1];
      const mx = (from[0] + to[0])/2, my = (from[1] + to[1])/2;
      const nx = -dy, ny = dx;
      const len = Math.hypot(dx, dy) || 1;
      const off = 30 * curveDir;
      const ctrlX = mx + nx/len * off, ctrlY = my + ny/len * off;
      ctx.save();
      ctx.strokeStyle = color; ctx.lineWidth = 2 + prob*3;
      ctx.beginPath();
      ctx.moveTo(from[0], from[1]);
      ctx.quadraticCurveTo(ctrlX, ctrlY, to[0], to[1]);
      ctx.stroke();
      // arrowhead
      const tx = (to[0] - ctrlX), ty = (to[1] - ctrlY);
      const ang = Math.atan2(ty, tx);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(to[0], to[1]);
      ctx.lineTo(to[0] - Math.cos(ang-0.4)*12, to[1] - Math.sin(ang-0.4)*12);
      ctx.lineTo(to[0] - Math.cos(ang+0.4)*12, to[1] - Math.sin(ang+0.4)*12);
      ctx.closePath(); ctx.fill();
      // label
      const lx = mx + nx/len * (off*1.4), ly = my + ny/len * (off*1.4);
      ctx.fillStyle = color; ctx.font = `700 12px 'JetBrains Mono', monospace`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(prob.toFixed(2), lx, ly);
      ctx.restore();
    };

    // Self loops (drawn with angle)
    const drawSelf = (at, prob, angle, color) => {
      ctx.save();
      ctx.strokeStyle = color; ctx.lineWidth = 2 + prob*3;
      const R0 = 26;
      const ax = at[0] + Math.cos(angle) * R0;
      const ay = at[1] + Math.sin(angle) * R0;
      const ax2 = at[0] + Math.cos(angle+0.6) * R0;
      const ay2 = at[1] + Math.sin(angle+0.6) * R0;
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.quadraticCurveTo(at[0] + Math.cos(angle+0.3)*60, at[1] + Math.sin(angle+0.3)*60, ax2, ay2);
      ctx.stroke();
      // arrow
      const tx = ax2 - (at[0] + Math.cos(angle+0.3)*60), ty = ay2 - (at[1] + Math.sin(angle+0.3)*60);
      const ang = Math.atan2(ty, tx);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(ax2, ay2);
      ctx.lineTo(ax2 - Math.cos(ang-0.4)*10, ay2 - Math.sin(ang-0.4)*10);
      ctx.lineTo(ax2 - Math.cos(ang+0.4)*10, ay2 - Math.sin(ang+0.4)*10);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = color; ctx.font = `700 12px 'JetBrains Mono', monospace`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(prob.toFixed(2), at[0] + Math.cos(angle+0.3)*80, at[1] + Math.sin(angle+0.3)*80);
      ctx.restore();
    };

    // Edges from 0 → 1 and 1 → 0, plus self loops
    drawEdge(S0, S1, S.p01, 'rgb(52,82,212)', 1);
    drawEdge(S1, S0, S.p10, 'rgb(16,185,129)', 1);
    drawSelf(S0, 1 - S.p01, -Math.PI/2 - 0.3, 'rgb(52,82,212)');
    drawSelf(S1, 1 - S.p10, -Math.PI/2 + 0.3, 'rgb(16,185,129)');

    // Nodes
    const drawNode = (at, label, prob) => {
      ctx.save();
      const grad = ctx.createRadialGradient(at[0], at[1], 4, at[0], at[1], 36);
      grad.addColorStop(0, p.brand);
      grad.addColorStop(1, 'rgba(52,82,212,.18)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(at[0], at[1], 36, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = p.brand;
      ctx.beginPath(); ctx.arc(at[0], at[1], 26, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = p.bg; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = `800 14px 'Inter', sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(label, at[0], at[1]);
      ctx.restore();
      // probability label above
      ctx.save();
      ctx.fillStyle = p.text; ctx.font = `700 12px 'JetBrains Mono', monospace`;
      ctx.textAlign = 'center';
      ctx.fillText(prob.toFixed(3), at[0], at[1] + 52);
      ctx.restore();
    };

    drawNode(S0, 'S₀', S.dist[0]);
    drawNode(S1, 'S₁', S.dist[1]);

    // Title
    labelText(ctx, 'Transition probabilities shown on arrows', 12, 20, p.text, 11);

    const [pi0, pi1] = stationary();
    container.querySelector('[data-out="pi0"]').textContent = R(pi0);
    container.querySelector('[data-out="pi1"]').textContent = R(pi1);
    container.querySelector('[data-out="step"]').textContent = String(S.t);
  }

  let last = performance.now();
  let raf = 0;
  function loop(now){
    const dt = (now - last)/1000; last = now;
    if (S.playing){
      S.t += 1;
      // one transition
      const p0 = S.dist[0], p1 = S.dist[1];
      const n0 = p0*(1 - S.p01) + p1*S.p10;
      const n1 = p0*S.p01 + p1*(1 - S.p10);
      S.dist = [n0, n1];
      if (Math.abs(S.dist[0] - n0) < 1e-9 && S.t > 0) {}
    }
    draw();
    raf = requestAnimationFrame(loop);
  }

  // Instead of fast transition, animate at 1 step per 800ms
  let lastStep = performance.now();
  function stepLoop(now){
    if (S.playing && now - lastStep > 800){
      lastStep = now;
      S.t++;
      const p0 = S.dist[0], p1 = S.dist[1];
      const n0 = p0*(1 - S.p01) + p1*S.p10;
      const n1 = p0*S.p01 + p1*(1 - S.p10);
      S.dist = [n0, n1];
    }
    draw();
    raf = requestAnimationFrame(stepLoop);
  }
  raf = requestAnimationFrame(stepLoop);

  container.querySelectorAll('input[type=range]').forEach(inp => {
    inp.addEventListener('input', () => {
      S[inp.dataset.k] = parseFloat(inp.value);
      inp.parentElement.querySelector('b').textContent = S[inp.dataset.k].toFixed(2);
      // Reset distribution
      S.dist = [1,0]; S.t = 0;
    });
  });

  vizCleanups.push(() => cancelAnimationFrame(raf));
}

/* Joint distribution heatmap */
function setupJointHeatViz(container){
  const spec = VIZ_SPECS.unit3.find(s => s.id === 'jointHeat');
  container.innerHTML = `
    <div class="solver-head"><div>
      <h4>${spec.title}</h4><p>${spec.desc}</p>
    </div></div>
    <div class="viz-wrap"><canvas class="viz-canvas" style="height:340px"></canvas></div>
    <div class="viz-ctrls">
      <label class="viz-ctrl"><span>correlation</span><input type="range" min="-0.9" max="0.9" step="0.05" value="0.3" data-k="corr"><b>0.30</b></label>
      <label class="viz-ctrl"><span>blur</span><input type="range" min="0.5" max="3" step="0.1" value="1.4" data-k="blur"><b>1.40</b></label>
    </div>
    <div class="viz-stats">
      <div class="viz-stat"><span>Cov</span><b data-out="cov">—</b></div>
      <div class="viz-stat"><span>ρ</span><b data-out="rho">—</b></div>
    </div>
    <div class="viz-note"><b>Real-world:</b> joint distributions underpin multivariate analysis, portfolio covariance, and probabilistic graphical models.</div>
  `;
  const canvas = container.querySelector('canvas');
  const S = { corr:0.3, blur:1.4 };

  function jointPdf(x, y){
    const r = S.corr;
    const z = (x*x - 2*r*x*y + y*y) / (2*(1-r*r));
    return Math.exp(-z) / (2*Math.PI * Math.sqrt(1-r*r));
  }

  function draw(){
    const { ctx, w, h } = fitCanvas(canvas, 340);
    const p = vizPalette();
    ctx.fillStyle = p.bg; ctx.fillRect(0, 0, w, h);
    const pad = 40;
    const cw = w - pad*2, ch = h - pad*2;
    const N = 80;
    // Sample grid
    let zmax = 0;
    const grid = Array.from({length:N}, () => new Array(N).fill(0));
    for (let i = 0; i < N; i++){
      for (let j = 0; j < N; j++){
        const x = -3 + 6*i/(N-1);
        const y = -3 + 6*j/(N-1);
        const v = jointPdf(x, y);
        grid[i][j] = v;
        if (v > zmax) zmax = v;
      }
    }
    // Draw as small squares
    const cellW = cw/N, cellH = ch/N;
    for (let i = 0; i < N; i++){
      for (let j = 0; j < N; j++){
        const v = grid[i][j] / zmax;
        const px = pad + i*cellW;
        const py = pad + (N-1-j)*cellH;
        // colourmap
        const r = Math.round(20 + 220*v);
        const g = Math.round(30 + 180*v*(1-Math.abs(S.corr)));
        const b = Math.round(60 + 180*(1-v));
        ctx.fillStyle = `rgb(${r},${g},${b})`;
        ctx.fillRect(px, py, cellW+0.5, cellH+0.5);
      }
    }
    // Axes
    ctx.strokeStyle = p.axis; ctx.lineWidth = 1.5;
    ctx.strokeRect(pad, pad, cw, ch);
    // ticks
    ctx.save();
    ctx.fillStyle = p.text; ctx.font = `600 10px 'JetBrains Mono', monospace`;
    for (let k = -3; k <= 3; k++){
      const px = pad + (k+3)/6 * cw;
      ctx.fillText(String(k), px-4, pad + ch + 14);
      const py = pad + ch - (k+3)/6 * ch;
      ctx.fillText(String(k), pad-20, py+3);
    }
    ctx.restore();

    // Marginals (bars on sides)
    // Top: marginal X
    const margX = new Array(N).fill(0);
    for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) margX[i] += grid[i][j];
    const mXmax = Math.max(...margX);
    ctx.save();
    ctx.fillStyle = 'rgba(52,82,212,.6)';
    for (let i = 0; i < N; i++){
      const px = pad + i*cellW;
      const bh = margX[i]/mXmax * 20;
      ctx.fillRect(px, pad - bh, cellW+0.5, bh);
    }
    ctx.restore();
    // Right: marginal Y
    const margY = new Array(N).fill(0);
    for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) margY[j] += grid[i][j];
    const mYmax = Math.max(...margY);
    ctx.save();
    ctx.fillStyle = 'rgba(16,185,129,.6)';
    for (let j = 0; j < N; j++){
      const py = pad + (N-1-j)*cellH;
      const bw = margY[j]/mYmax * 20;
      ctx.fillRect(pad + cw, py, bw, cellH+0.5);
    }
    ctx.restore();

    labelText(ctx, 'x', pad + cw + 8, pad + ch/2, p.text, 11);
    labelText(ctx, 'y', pad + cw/2, pad - 32, p.text, 11, 'center');
    labelText(ctx, 'marg X', pad + cw/2, pad - 12, p.muted, 9, 'center');
    labelText(ctx, 'marg Y', pad + cw + 26, pad + ch/2, p.muted, 9);

    // Stats
    container.querySelector('[data-out="cov"]').textContent = R(S.corr);
    container.querySelector('[data-out="rho"]').textContent = R(S.corr);
  }

  container.querySelectorAll('input[type=range]').forEach(inp => {
    inp.addEventListener('input', () => {
      S[inp.dataset.k] = parseFloat(inp.value);
      inp.parentElement.querySelector('b').textContent = S[inp.dataset.k].toFixed(2);
      draw();
    });
  });
  let raf = 0;
  const resize = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); };
  window.addEventListener('resize', resize);
  vizCleanups.push(() => { window.removeEventListener('resize', resize); cancelAnimationFrame(raf); });
  draw();
}

/* Sampling distribution */
function setupSampDistViz(container){
  const spec = VIZ_SPECS.unit4.find(s => s.id === 'sampDist');
  container.innerHTML = `
    <div class="solver-head"><div>
      <h4>${spec.title}</h4><p>${spec.desc}</p>
    </div></div>
    <div class="viz-wrap"><canvas class="viz-canvas" style="height:320px"></canvas></div>
    <div class="viz-ctrls">
      <label class="viz-ctrl"><span>n</span><input type="range" min="1" max="50" step="1" value="10" data-k="n"><b>10</b></label>
      <label class="viz-ctrl"><span>σ</span><input type="range" min="1" max="20" step="0.5" value="10" data-k="sigma"><b>10.0</b></label>
    </div>
    <div class="viz-stats">
      <div class="viz-stat"><span>SE = σ/√n</span><b data-out="se">—</b></div>
      <div class="viz-stat"><span>sample SD</span><b data-out="ssd">—</b></div>
    </div>
    <div class="viz-note"><b>Real-world:</b> SE shrinks with √n, so quadrupling the sample size only halves the standard error. This drives the cost-benefit analysis of larger studies.</div>
  `;
  const canvas = container.querySelector('canvas');
  const S = { n:10, sigma:10 };

  function draw(){
    const { ctx, w, h } = fitCanvas(canvas, 320);
    const p = vizPalette();
    ctx.fillStyle = p.bg; ctx.fillRect(0, 0, w, h);
    const mu = 100;
    const se = S.sigma / Math.sqrt(S.n);
    // 5000 samples
    const means = [];
    for (let i = 0; i < 5000; i++){
      let s = 0;
      for (let j = 0; j < S.n; j++){
        const u1 = Math.random() || 1e-9, u2 = Math.random();
        const z = Math.sqrt(-2*Math.log(u1))*Math.cos(2*Math.PI*u2);
        s += mu + S.sigma * z;
      }
      means.push(s / S.n);
    }
    const lo = mu - 4*se, hi = mu + 4*se;
    const B = 40;
    const bins = new Array(B).fill(0);
    means.forEach(m => {
      const idx = clamp(Math.floor((m - lo)/(hi-lo)*B), 0, B-1);
      bins[idx]++;
    });
    const maxB = Math.max(...bins);
    const pad = 30;
    const X0 = pad, X1 = w - pad, Y0 = h - pad, Y1 = pad;
    ctx.strokeStyle = p.axis; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(X0, Y0); ctx.lineTo(X1, Y0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(X0, Y0); ctx.lineTo(X0, Y1); ctx.stroke();
    ctx.save();
    ctx.fillStyle = p.brand;
    for (let i = 0; i < B; i++){
      const bx = X0 + (i/B)*(X1-X0);
      const bh = bins[i]/maxB * (Y0-Y1);
      ctx.fillRect(bx, Y0 - bh, (X1-X0)/B - 1, bh);
    }
    ctx.restore();
    // theoretical normal
    ctx.save();
    ctx.strokeStyle = p.ok; ctx.lineWidth = 2.4;
    ctx.beginPath();
    let first = true;
    for (let i = 0; i <= 200; i++){
      const xv = lo + (hi-lo)*i/200;
      const pdf = normPdf(xv, mu, se);
      const px = X0 + (i/200)*(X1-X0);
      const py = Y0 - (pdf/normPdf(mu, mu, se)) * (Y0-Y1) * 0.85;
      if (first){ ctx.moveTo(px, py); first = false; } else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.restore();
    labelText(ctx, `sampling distribution of X̄  (μ=${mu}, σ=${S.sigma}, n=${S.n})`, X0+6, Y1+12, p.text, 11);
    const sampleSD = Math.sqrt(means.reduce((a,m)=>a+(m-mu)**2, 0)/means.length);
    container.querySelector('[data-out="se"]').textContent = R(se);
    container.querySelector('[data-out="ssd"]').textContent = R(sampleSD);
  }

  container.querySelectorAll('input[type=range]').forEach(inp => {
    inp.addEventListener('input', () => {
      S[inp.dataset.k] = parseFloat(inp.value);
      inp.parentElement.querySelector('b').textContent = S[inp.dataset.k].toFixed(inp.dataset.k === 'n' ? 0 : 1);
      draw();
    });
  });
  let raf = 0;
  const resize = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); };
  window.addEventListener('resize', resize);
  vizCleanups.push(() => { window.removeEventListener('resize', resize); cancelAnimationFrame(raf); });
  draw();
}

/* Hypothesis rejection regions */
function setupHypoViz(container){
  const spec = VIZ_SPECS.unit4.find(s => s.id === 'hypo');
  container.innerHTML = `
    <div class="solver-head"><div>
      <h4>${spec.title}</h4><p>${spec.desc}</p>
    </div></div>
    <div class="viz-wrap"><canvas class="viz-canvas" style="height:320px"></canvas></div>
    <div class="viz-ctrls">
      <label class="viz-ctrl"><span>Z value</span><input type="range" min="-4" max="4" step="0.05" value="2.1" data-k="z"><b>2.10</b></label>
      <label class="viz-ctrl"><span>α</span>
        <select data-k="alpha" style="flex:1;padding:5px 8px;font-size:11.5px;border-radius:8px;border:1px solid var(--border-2);background:var(--surface-2)">
          <option value="0.10">0.10 (±1.645)</option>
          <option value="0.05" selected>0.05 (±1.96)</option>
          <option value="0.01">0.01 (±2.576)</option>
        </select>
      </label>
    </div>
    <div class="viz-stats">
      <div class="viz-stat"><span>critical</span><b data-out="crit">—</b></div>
      <div class="viz-stat"><span>p (two-tailed)</span><b data-out="p">—</b></div>
      <div class="viz-stat"><span>decision</span><b data-out="dec" style="font-size:10.5px">—</b></div>
    </div>
    <div class="viz-note"><b>Real-world:</b> every clinical trial, A/B test, or quality-control check ends with this decision. Shaded tails are the rejection regions — where the null hypothesis is abandoned.</div>
  `;
  const canvas = container.querySelector('canvas');
  const S = { z:2.1, alpha:0.05 };

  function crit(){
    if (S.alpha === 0.10) return 1.645;
    if (S.alpha === 0.01) return 2.576;
    return 1.96;
  }

  function draw(){
    const { ctx, w, h } = fitCanvas(canvas, 320);
    const p = vizPalette();
    ctx.fillStyle = p.bg; ctx.fillRect(0, 0, w, h);
    const pad = 30;
    const X0 = pad, X1 = w-pad, Y0 = h-40, Y1 = 30;
    const lo = -4, hi = 4;
    const toX = z => X0 + (z - lo)/(hi - lo)*(X1-X0);
    const pdf = z => normPdf(z, 0, 1);
    const maxPdf = normPdf(0,0,1);

    // Curve
    ctx.save();
    ctx.strokeStyle = p.brand; ctx.lineWidth = 2.4;
    ctx.beginPath();
    for (let i = 0; i <= 400; i++){
      const z = lo + (hi-lo)*i/400;
      const px = toX(z);
      const py = Y0 - pdf(z)/maxPdf * (Y0-Y1);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.restore();

    // Fill rejection regions
    const c = crit();
    const shade = (from, to, color) => {
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(toX(from), Y0);
      for (let i = 0; i <= 200; i++){
        const z = from + (to-from)*i/200;
        const px = toX(z);
        const py = Y0 - pdf(z)/maxPdf * (Y0-Y1);
        ctx.lineTo(px, py);
      }
      ctx.lineTo(toX(to), Y0);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
      ctx.restore();
    };
    shade(lo, -c, 'rgba(239,68,68,.35)');
    shade(c, hi, 'rgba(239,68,68,.35)');

    // Axis
    ctx.strokeStyle = p.axis; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(X0, Y0); ctx.lineTo(X1, Y0); ctx.stroke();
    // ticks
    ctx.save();
    ctx.fillStyle = p.muted; ctx.font = `600 10px 'JetBrains Mono', monospace`;
    ctx.textAlign = 'center';
    for (let z = -4; z <= 4; z++){
      const px = toX(z);
      ctx.beginPath(); ctx.moveTo(px, Y0); ctx.lineTo(px, Y0+4); ctx.strokeStyle = p.axis; ctx.stroke();
      if (z !== 0) ctx.fillText(String(z), px, Y0+16);
    }
    ctx.restore();

    // Critical lines
    [-c, c].forEach(x => {
      ctx.save();
      ctx.strokeStyle = 'rgb(220,38,38)'; ctx.lineWidth = 1.6; ctx.setLineDash([5,4]);
      ctx.beginPath(); ctx.moveTo(toX(x), Y0); ctx.lineTo(toX(x), Y1+10); ctx.stroke();
      ctx.restore();
      labelText(ctx, x.toFixed(2), toX(x), Y1, 'rgb(220,38,38)', 10, 'center');
    });

    // Test stat marker
    const zx = toX(S.z);
    const zy = Y0 - pdf(S.z)/maxPdf * (Y0-Y1);
    ctx.save();
    ctx.fillStyle = 'rgb(52,82,212)';
    ctx.beginPath(); ctx.arc(zx, zy, 7, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
    labelText(ctx, `Z = ${S.z.toFixed(2)}`, zx, zy-14, 'rgb(52,82,212)', 11, 'center');

    // Two-tailed p-value
    const ptwo = 2 * (1 - normCdf(Math.abs(S.z)));
    const reject = Math.abs(S.z) > c;
    container.querySelector('[data-out="crit"]').textContent = '±' + c;
    container.querySelector('[data-out="p"]').textContent = R(ptwo);
    container.querySelector('[data-out="dec"]').textContent = reject ? 'Reject H₀' : 'Fail to reject H₀';

    labelText(ctx, 'Standard normal under H₀', X0+6, Y1+4, p.text, 11);
  }

  container.querySelectorAll('input[type=range], select').forEach(inp => {
    inp.addEventListener('input', () => {
      if (inp.dataset.k === 'z'){
        S.z = parseFloat(inp.value);
        inp.parentElement.querySelector('b').textContent = S.z.toFixed(2);
      } else if (inp.dataset.k === 'alpha'){
        S.alpha = parseFloat(inp.value);
      }
      draw();
    });
  });
  let raf = 0;
  const resize = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); };
  window.addEventListener('resize', resize);
  vizCleanups.push(() => { window.removeEventListener('resize', resize); cancelAnimationFrame(raf); });
  draw();
}

function mountVizForUnit(unitId){
  const specs = VIZ_SPECS[unitId] || [];
  specs.forEach(s => {
    const el = document.getElementById('viz-' + s.id);
    if (el && !el.dataset.mounted){
      el.dataset.mounted = '1';
      try { VIZ_SETUP[s.id](el); } catch(e){ console.error('viz mount', s.id, e); }
    }
  });
}

/* ============================== RENDER ============================== */
function renderView(){
  cleanupViz();
  const v = state.view;
  const el = $('#content');
  if (v === 'dashboard') el.innerHTML = viewDashboard();
  else if (v.startsWith('unit')) el.innerHTML = viewUnit(v);
  else if (v === 'formulas') el.innerHTML = viewFormulas();
  else if (v === 'practice') el.innerHTML = viewPractice();
  else if (v === 'mcq') el.innerHTML = viewMcq();
  else if (v === 'definitions') el.innerHTML = viewDefinitions();
  else if (v === 'progress') el.innerHTML = viewProgress();
  else if (v === 'about') el.innerHTML = viewAbout();
  el.scrollTop = 0;
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
  if (v.startsWith('unit') && state.tab[v] === 'visualize'){
    requestAnimationFrame(() => mountVizForUnit(v));
  }
}

function renderAll(){
  renderNav();
  renderView();
  setRing();
  const label = {dashboard:'Dashboard', formulas:'Formula Sheet', practice:'Practice', mcq:'MCQ Test', definitions:'Definitions', progress:'Progress', about:'About'}[state.view]
    || (UNITS.find(u => u.id === state.view)?.title || 'Dashboard');
  $('#crumb').textContent = label;
}

function navigate(v){
  state.view = v;
  state.visited.add(v);
  state.search = '';
  save();
  renderAll();
  closeSidebar();
}

    const done = () => {
      cp.classList.add('done'); cp.innerHTML = I.check;
      toast('Formula copied');
      setTimeout(() => { cp.classList.remove('done'); cp.innerHTML = I.copy; }, 1300);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(done);
    else done();
    return;
  }
  const chk = t.closest('[data-check]');
  if (chk){
    const id = parseInt(chk.dataset.check);
    const p = PRACTICE.find(x => x.id === id);
    const cur = state.practice[id];
    const raw = cur && typeof cur === 'object' ? cur.input : '';
    const val = parseFloat(raw);
    const ok = !isNaN(val) && Math.abs(val - p.a) <= p.tol;
    state.practice[id] = { input: raw, ok };
    save(); renderView(); setRing();
    if (ok) toast('Correct answer');
    return;
  }
  const mopt = t.closest('[data-mcq-opt]');
  if (mopt){ state.mcq.answers[state.mcq.index] = parseInt(mopt.dataset.mcqOpt); save(); renderView(); return; }
  const mnav = t.closest('[data-mcq-nav]');
  if (mnav){ const i = parseInt(mnav.dataset.mcqNav); if (i >= 0 && i < MCQS.length){ state.mcq.index = i; save(); renderView(); } return; }
  if (t.closest('[data-mcq-submit]')){ state.mcq.submitted = true; save(); renderView(); setRing(); return; }
  if (t.closest('[data-mcq-retry]')){ state.mcq = { answers:{}, submitted:false, index:0 }; save(); renderView(); return; }
  if (t.closest('[data-reset]')){
    state.practice = {};
    state.mcq = { answers:{}, submitted:false, index:0 };
    state.visited = new Set(['dashboard']);
    save(); renderAll();
    toast('Progress reset');
    return;
  }
});

content.addEventListener('input', e => {
  const t = e.target;

  if (t.matches('[data-search]')){
    state.search = t.value;
    const pos = t.selectionStart;
    renderView();
    const next = $('[data-search]');
    if (next){ next.focus(); next.setSelectionRange(pos, pos); }
    return;
  }
  if (t.matches('[data-practice]')){
    const id = parseInt(t.dataset.practice);
    const cur = state.practice[id];
    state.practice[id] = { input: t.value, ok: cur && typeof cur === 'object' ? cur.ok : false };
    save();
    return;
  }
  if (t.matches('[data-custom]')){
    putSV(t.dataset.custom, t.dataset.key, t.value);
    const card = t.closest('.card');
    const html = solverCard(t.dataset.custom);
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    const which = t.dataset.key;
    card.replaceWith(tmp.firstElementChild);
    const again = $(`[data-custom="${t.dataset.custom}"][data-key="${which}"]`);
    if (again){ again.focus(); const v = again.value; again.setSelectionRange(v.length, v.length); }
    return;
  }
  if (t.matches('[data-matrix]')){
    const name = t.dataset.matrix, r = parseInt(t.dataset.r), c = parseInt(t.dataset.c);
    state.matrices[name][r][c] = parseFloat(t.value) || 0;
    const card = t.closest('.card');
    const sid = { jointP:'joint', stochP:'stoch', markovP:'markov' }[name] || 'joint';
    const html = solverCard(sid);
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    card.replaceWith(tmp.firstElementChild);
    const again = $(`[data-matrix="${name}"][data-r="${r}"][data-c="${c}"]`);
    if (again){ again.focus(); const v = again.value; again.setSelectionRange(v.length, v.length); }
    return;
  }
  if (t.matches('[data-matrix-vec]')){
    const name = t.dataset.matrixVec;
    if (name === 'jointX' || name === 'jointY'){
      state.matrices[name] = parseList(t.value).slice(0, state.matrices.jointSize);
      // pad
      while (state.matrices[name].length < state.matrices.jointSize) state.matrices[name].push(state.matrices[name].length);
    } else if (name === 'markovP0'){
      state.matrices.markovP0 = t.value;
    }
    const card = t.closest('.card');
    const sid = name === 'markovP0' ? 'markov' : 'joint';
    const html = solverCard(sid);
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    card.replaceWith(tmp.firstElementChild);
    const again = $(`[data-matrix-vec="${name}"]`);
    if (again){ again.focus(); const v = again.value; again.setSelectionRange(v.length, v.length); }
    return;
  }
  if (t.matches('[data-matrix-size]')){
    const name = t.dataset.matrixSize;
    const n = parseInt(t.value);
    if (name === 'stoch'){
      state.matrices.stochSize = n;
      state.matrices.stochP = Array.from({length:n}, (_, i) => Array.from({length:n}, (_, j) => i === j ? 0.7 : 0.3/(n-1)));
    } else if (name === 'markov'){
      state.matrices.markovSize = n;
      state.matrices.markovP = Array.from({length:n}, (_, i) => Array.from({length:n}, (_, j) => i === j ? 0.7 : 0.3/(n-1)));
      state.matrices.markovP0 = Array.from({length:n}, (_, i) => i === 0 ? 1 : 0).join(',');
    }
    const card = t.closest('.card');
    const html = solverCard(name);
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    card.replaceWith(tmp.firstElementChild);
    return;
  }
});

/* ============================== BOOT ============================== */
document.documentElement.setAttribute('data-theme', state.theme);
$('#themeBtn').innerHTML = state.theme === 'dark' ? I.sun : I.moon;
renderAll();
</script>
