  return Math.min(100, 10 + Math.round((solvedForUnit / practiceForUnit.length) * 90));
}

const SOLVERS = {

const UNIT_SOLVERS = {
  unit1:['linear','quad','expo','pearson','spearman'],
  unit2:['basicProb','rv','binomial','poisson','normal'],
  unit3:['joint','vec','stoch','markov','stationary','absorbing'],
  unit4:['sampling','ztest','ttest','chi']
};
const SOLVER_META = {
  linear:{title:'Linear Least Squares y = a + bx', desc:'Fit a straight line by minimizing squared residuals.'},
  quad:{title:'Quadratic Fit y = a + bx + cx²', desc:'Solve the 3×3 system of normal equations.'},
  expo:{title:'Exponential Fit y = a·bˣ', desc:'Linearize via ln y = ln a + x·ln b.'},
  pearson:{title:'Pearson Correlation r', desc:'Strength and direction of linear association.'},
  spearman:{title:'Spearman Rank Correlation', desc:'Rank-based correlation.'},
  basicProb:{title:'Basic Probability', desc:'Union, complement, conditional.'},
  rv:{title:'Discrete Random Variable', desc:'Expectation and variance from PMF.'},
  binomial:{title:'Binomial Distribution', desc:'PMF, CDF and moments.'},

};

function solverCard(sid){
  const M = SOLVER_META[sid];
  const body = customSolver(SOLVERS[sid].custom);
  return `<div class="card pad-lg"><div class="solver-head"><div><h4>${esc(M.title)}</h4><p>${esc(M.desc)}</p></div></div>${body}</div>`;
}
function getSV(id, key, def){ const s = state.sv[id]; return (s && s[key] !== undefined) ? s[key] : def; }
function putSV(id, key, val){ if (!state.sv[id]) state.sv[id] = {}; state.sv[id][key] = val; }

function customSolver(kind){
  switch(kind){
    case 'linear': return svLinear();
    case 'quad': return svQuad();
    case 'expo': return svExpo();
    case 'pearson': return svPearson();
    case 'spearman': return svSpearman();
    case 'basicProb': return svBasicProb();
    case 'rv': return svRV();
    case 'binomial': return svBinomial();
    case 'poisson': return svPoisson();
    case 'normal': return svNormal();
    case 'joint': return svJoint();
    case 'vec': return svVec();
    case 'stoch': return svStoch();
    case 'markov': return svMarkov();
    case 'stationary': return svStationary();
    case 'absorbing': return svAbsorbing();
    case 'sampling': return svSampling();
    case 'ztest': return svZtest();
    case 'ttest': return svTtest();
    case 'chi': return svChi();
  }
  return '';
}

function svLinear(){
  const xs = getSV('linear','x','1,2,3,4'), ys = getSV('linear','y','2,3,5,6');
  let out = `<div class="steps"><span class="ln ans">Enter x and y lists.</span></div>`;
  const X = parseList(xs), Y = parseList(ys);
  if (X.length === Y.length && X.length >= 2 && X.every(isFinite) && Y.every(isFinite)){
    const n = X.length, sx = sumArr(X), sy = sumArr(Y), sx2 = sumArr(X.map(v => v*v)), sxy = sumArr(X.map((v,i) => v*Y[i]));
    const mx = sx/n, my = sy/n, denom = n*sx2 - sx*sx;
    const b = denom === 0 ? NaN : (n*sxy - sx*sy)/denom; const a = my - b*mx;
    const sse = sumArr(Y.map((y,i) => (y - (a + b*X[i]))**2));
    out = `<div class="steps"><span class="ln"><b>FORMULA</b>      b = (nΣxy − Σx·Σy)/(nΣx² − (Σx)²) , a = ȳ − b·x̄</span><span class="ln"><b>SUMS</b>         Σx=${R(sx)} , Σy=${R(sy)} , Σx²=${R(sx2)} , Σxy=${R(sxy)} , n=${n}</span><span class="ln"><b>MEANS</b>        x̄=${R(mx)} , ȳ=${R(my)}</span><span class="ln"><b>CALC</b>         b = ${R(b)} , a = ${R(a)}</span><span class="ln ans">ANSWER       y = ${R(a)} + ${R(b)}·x , SSE = ${R(sse)}</span></div>`;
  }
  return `<div class="fields" style="grid-template-columns:repeat(2,minmax(0,1fr))"><label class="field"><span>x</span><textarea class="input" rows="2" data-custom="linear" data-key="x">${esc(xs)}</textarea></label><label class="field"><span>y</span><textarea class="input" rows="2" data-custom="linear" data-key="y">${esc(ys)}</textarea></label></div>${out}`;
}

function svQuad(){
  const xs = getSV('quad','x','0,1,2,3,4'), ys = getSV('quad','y','1,2,5,10,17');
  const X = parseList(xs), Y = parseList(ys);
  let out = `<div class="steps"><span class="ln ans">Need at least 3 points.</span></div>`;
  if (X.length === Y.length && X.length >= 3 && X.every(isFinite) && Y.every(isFinite)){
    const n = X.length, sx = sumArr(X), sx2 = sumArr(X.map(v=>v*v)), sx3 = sumArr(X.map(v=>v**3)), sx4 = sumArr(X.map(v=>v**4));
    const sy = sumArr(Y), sxy = sumArr(X.map((v,i)=>v*Y[i])), sx2y = sumArr(X.map((v,i)=>v*v*Y[i]));
    const sol = gauss([[n,sx,sx2],[sx,sx2,sx3],[sx2,sx3,sx4]], [sy, sxy, sx2y]);
    if (sol) out = `<div class="steps"><span class="ln"><b>3×3 normal equations solved.</b></span><span class="ln ans">ANSWER       y = ${R(sol[0])} + ${R(sol[1])}·x + ${R(sol[2])}·x²</span></div>`;
    else out = `<div class="steps"><span class="ln ans">Singular — x values must be distinct.</span></div>`;
  }
  return `<div class="fields" style="grid-template-columns:repeat(2,minmax(0,1fr))"><label class="field"><span>x</span><textarea class="input" rows="2" data-custom="quad" data-key="x">${esc(xs)}</textarea></label><label class="field"><span>y</span><textarea class="input" rows="2" data-custom="quad" data-key="y">${esc(ys)}</textarea></label></div>${out}`;
}

function svExpo(){
  const xs = getSV('expo','x','0,1,2,3'), ys = getSV('expo','y','2,4,8,16');
  const X = parseList(xs), Y = parseList(ys);
  let out = `<div class="steps"><span class="ln ans">Enter x and positive y.</span></div>`;
  if (X.length === Y.length && X.length >= 2 && X.every(isFinite) && Y.every(v => isFinite(v) && v > 0)){
    const L = Y.map(v => Math.log(v)); const n = X.length;
    const sx = sumArr(X), sL = sumArr(L), sx2 = sumArr(X.map(v=>v*v)), sxL = sumArr(X.map((v,i)=>v*L[i]));
    const denom = n*sx2 - sx*sx;
    const lnb = (n*sxL - sx*sL)/denom; const lna = (sL - lnb*sx)/n;
    out = `<div class="steps"><span class="ln"><b>ln y = ln a + x·ln b</b></span><span class="ln ans">ANSWER       y = ${R(Math.exp(lna))} · ${R(Math.exp(lnb))}ˣ</span></div>`;
  }

function svPearson(){
  const xs = getSV('pearson','x','1,2,3,4,5'), ys = getSV('pearson','y','2,4,5,4,5');
  const X = parseList(xs), Y = parseList(ys);
  let out = `<div class="steps"><span class="ln ans">Enter x and y lists.</span></div>`;
  if (X.length === Y.length && X.length >= 2 && X.every(isFinite) && Y.every(isFinite)){
    const n = X.length, mx = meanArr(X), my = meanArr(Y);
    const cov = sumArr(X.map((v,i)=>(v-mx)*(Y[i]-my)))/n;
    const sx = Math.sqrt(sumArr(X.map(v => (v-mx)**2))/n);
    const sy = Math.sqrt(sumArr(Y.map(v => (v-my)**2))/n);
    const r = (sx === 0 || sy === 0) ? NaN : cov/(sx*sy);
    out = `<div class="steps"><span class="ln"><b>r = Cov(X,Y)/(σx σy)</b></span><span class="ln ans">ANSWER       r = ${R(r)}</span></div>`;
  }
  return `<div class="fields" style="grid-template-columns:repeat(2,minmax(0,1fr))"><label class="field"><span>x</span><textarea class="input" rows="2" data-custom="pearson" data-key="x">${esc(xs)}</textarea></label><label class="field"><span>y</span><textarea class="input" rows="2" data-custom="pearson" data-key="y">${esc(ys)}</textarea></label></div>${out}`;
}

function svSpearman(){
  const xs = getSV('spearman','x','10,20,30,40,50'), ys = getSV('spearman','y','15,25,35,30,45');
  const X = parseList(xs), Y = parseList(ys);
  let out = `<div class="steps"><span class="ln ans">Enter two lists.</span></div>`;
  if (X.length === Y.length && X.length >= 2 && X.every(isFinite) && Y.every(isFinite)){
    const rx = rankOf(X), ry = rankOf(Y);
    const d = rx.map((v,i) => v - ry[i]); const d2 = d.map(v => v*v);
    const sumD2 = sumArr(d2); const n = X.length;
    const rho = 1 - 6*sumD2/(n*(n*n - 1));
    out = `<div class="steps"><span class="ln"><b>ρ = 1 − 6Σd²/(n(n²−1))</b></span><span class="ln ans">ANSWER       ρ = ${R(rho)}</span></div>`;
  }
  return `<div class="fields" style="grid-template-columns:repeat(2,minmax(0,1fr))"><label class="field"><span>x</span><textarea class="input" rows="2" data-custom="spearman" data-key="x">${esc(xs)}</textarea></label><label class="field"><span>y</span><textarea class="input" rows="2" data-custom="spearman" data-key="y">${esc(ys)}</textarea></label></div>${out}`;
}

function svBasicProb(){

function svRV(){
  const xs = getSV('rv','x','0,1,2'), ps = getSV('rv','p','0.2,0.5,0.3');
  const X = parseList(xs), P = parseList(ps);

      const varr = ex2 - ex*ex;

function svBinomial(){

  <div class="steps"><span class="ln"><b>P(X=k) = C(n,k)·pᵏ·qⁿ⁻ᵏ</b></span><span class="ln">μ = np = ${R(n*p)} , σ² = npq = ${R(n*p*(1-p))}</span><span class="ln ans">ANSWER       P(X=${x}) = ${R(pmf)} , P(X≤${x}) = ${R(cdf)}</span></div>`;

function svNormal(){
  const mu = num(getSV('normal','mu',0), 0);
  const sigma = Math.max(1e-9, num(getSV('normal','sigma',1), 1));
  const a = num(getSV('normal','a',-1), -1);
  const b = num(getSV('normal','b',1), 1);
  const mode = getSV('normal','mode','between');
  const z1 = (a - mu) / sigma, z2 = (b - mu) / sigma;
  const Phi1 = normCdf(z1), Phi2 = normCdf(z2);
  let answer = 0, note = '';
  if (mode === 'left'){ answer = Phi1; note = `P(X ≤ ${R(a)})`; }
  else if (mode === 'right'){ answer = 1 - Phi1; note = `P(X ≥ ${R(a)})`; }
  else { answer = Math.abs(Phi2 - Phi1); note = `P(${R(a)} ≤ X ≤ ${R(b)})`; }
  return `<div class="fields" style="grid-template-columns:repeat(2,minmax(0,1fr))"><label class="field"><span>μ</span><input class="input" type="number" step="any" data-custom="normal" data-key="mu" value="${mu}"></label><label class="field"><span>σ</span><input class="input" type="number" step="any" data-custom="normal" data-key="sigma" value="${sigma}"></label><label class="field"><span>a</span><input class="input" type="number" step="any" data-custom="normal" data-key="a" value="${a}"></label><label class="field"><span>b</span><input class="input" type="number" step="any" data-custom="normal" data-key="b" value="${b}"></label></div>
  <div class="fields" style="grid-template-columns:1fr"><label class="field"><span>Type</span><select class="input" data-custom="normal" data-key="mode"><option value="left" ${mode==='left'?'selected':''}>P(X ≤ a)</option><option value="between" ${mode==='between'?'selected':''}>P(a ≤ X ≤ b)</option><option value="right" ${mode==='right'?'selected':''}>P(X ≥ a)</option></select></label></div>
  <div class="steps"><span class="ln"><b>Z = (X − μ)/σ</b></span><span class="ln">z₁ = ${R(z1)} , Φ(z₁) = ${R(Phi1)}</span><span class="ln">z₂ = ${R(z2)} , Φ(z₂) = ${R(Phi2)}</span><span class="ln ans">ANSWER       ${note} = ${R(answer)}</span></div>`;
}

function svJoint(){
  const S = state.matrices; const n = S.jointSize;
  const xs = S.jointX, ys = S.jointY, P = S.jointP;
  const total = P.flat().reduce((a,b) => a+b, 0);
  const valid = P.flat().every(v => v>=0 && v<=1) && Math.abs(total - 1) < 1e-6;
  let out = '';
  if (valid){
    const margX = P.map(row => row.reduce((a,b)=>a+b,0));
    const margY = Array.from({length:n}, (_, j) => P.reduce((s,row)=>s+row[j], 0));
    const ex = sumArr(xs.map((v,i) => v*margX[i]));
    const ey = sumArr(ys.map((v,j) => v*margY[j]));
    const ex2 = sumArr(xs.map((v,i) => v*v*margX[i]));
    const ey2 = sumArr(ys.map((v,j) => v*v*margY[j]));
    const exy = sumArr(xs.map((v,i) => ys.reduce((s,w,j) => s + v*w*P[i][j], 0)));
    const cov = exy - ex*ey;
    const vx = ex2 - ex*ex, vy = ey2 - ey*ey;
    const corr = (vx <= 0 || vy <= 0) ? NaN : cov/Math.sqrt(vx*vy);
    out = `<div class="steps"><span class="ln"><b>MARG X</b>   [${margX.map(R).join(', ')}]</span><span class="ln"><b>MARG Y</b>   [${margY.map(R).join(', ')}]</span><span class="ln"><b>MEANS</b>    E(X)=${R(ex)} , E(Y)=${R(ey)}</span><span class="ln"><b>COVAR</b>    ${R(cov)}</span><span class="ln ans">ANSWER       Cov = ${R(cov)} , ρ = ${R(corr)}</span></div>`;
  } else {
    out = `<div class="steps"><span class="ln ans">Total = ${R(total)} — must equal 1.</span></div>`;
  }
  let table = `<div class="matrix-grid" style="grid-template-columns:repeat(${n+1},minmax(0,1fr))">`;
  table += `<div style="padding:7px 6px;font-size:10.5px;font-weight:700;color:var(--muted);text-align:center">X \\ Y</div>`;
  for (let j = 0; j < n; j++) table += `<div style="padding:7px 6px;font-size:10.5px;font-weight:700;color:var(--muted);text-align:center">${ys[j]}</div>`;
  for (let i = 0; i < n; i++){
    table += `<div style="padding:7px 6px;font-size:10.5px;font-weight:700;color:var(--muted);text-align:center">${xs[i]}</div>`;
    for (let j = 0; j < n; j++) table += `<input class="input" type="number" step="any" min="0" max="1" data-matrix="jointP" data-r="${i}" data-c="${j}" value="${P[i][j]}">`;
  }
  table += `</div>`;
  return `<div class="fields" style="grid-template-columns:repeat(2,minmax(0,1fr))"><label class="field"><span>X values</span><input class="input" data-matrix-vec="jointX" value="${xs.join(',')}"></label><label class="field"><span>Y values</span><input class="input" data-matrix-vec="jointY" value="${ys.join(',')}"></label></div>${table}${out}`;
}

function svMarkov(){

    const Pn = matPow(P, 3);
    out = `<div class="steps">${steps.slice(0,5).map((v,i) => `<span class="ln"><b>P${i}</b> = [${v.map(R).join(', ')}]</span>`).join('')}<span class="ln ans">ANSWER       P₃ = [${vecMul(P0, Pn).map(R).join(', ')}]</span></div>`;
  } else {

  for (let i=0;i<n;i++) for (let j=0;j<n;j++) table += `<input class="input" type="number" step="any" data-matrix="markovP" data-r="${i}" data-c="${j}" value="${P[i][j]}">`;
  table += `</div>`;
  return `<div class="fields" style="grid-template-columns:repeat(2,minmax(0,1fr))"><label class="field"><span>Size</span><select class="input" data-matrix-size="markov"><option value="2" ${n===2?'selected':''}>2 states</option><option value="3" ${n===3?'selected':''}>3 states</option></select></label><label class="field"><span>P₀</span><input class="input" data-matrix-vec="markovP0" value="${esc(S.markovP0)}"></label></div>${table}${out}`;
}

function svStationary(){
  const S = state.matrices; const n = S.stochSize, P = S.stochP;
  let sol = null;
  if (n === 2){ const [p00,p01] = P[0], [p10,p11] = P[1]; const s1 = p01 + p10; if (s1 > 1e-9) sol = [p10/s1, p01/s1]; }
  else if (n === 3){ const A = [[P[0][0]-1, P[1][0], P[2][0]], [P[0][1], P[1][1]-1, P[2][1]], [1, 1, 1]]; sol = gauss(A, [0, 0, 1]); }
  let out = sol ? `<div class="steps"><span class="ln ans">ANSWER       π = [${sol.map(R).join(', ')}]</span></div>` : `<div class="steps"><span class="ln ans">No unique stationary distribution.</span></div>`;
  let table = `<div class="matrix-grid" style="grid-template-columns:repeat(${n},minmax(0,1fr))">`;
  for (let i=0;i<n;i++) for (let j=0;j<n;j++) table += `<input class="input" type="number" step="any" data-matrix="stochP" data-r="${i}" data-c="${j}" value="${P[i][j]}">`;
  table += `</div>`;
  return `<div class="fields" style="grid-template-columns:1fr"><label class="field"><span>Size</span><select class="input" data-matrix-size="stoch"><option value="2" ${n===2?'selected':''}>2 × 2</option><option value="3" ${n===3?'selected':''}>3 × 3</option></select></label></div>${table}${out}`;
}

function svAbsorbing(){
  const P = state.matrices.stochP; const n = state.matrices.stochSize;
  const absorbing = [], transient = [];
  for (let i=0;i<n;i++){ const isAbs = Math.abs(P[i][i]-1) < 1e-9 && P[i].every((v,j)=>j===i || Math.abs(v)<1e-9); (isAbs ? absorbing : transient).push(i); }
  let table = `<div class="matrix-grid" style="grid-template-columns:repeat(${n},minmax(0,1fr))">`;
  for (let i=0;i<n;i++) for (let j=0;j<n;j++) table += `<input class="input" type="number" step="any" data-matrix="stochP" data-r="${i}" data-c="${j}" value="${P[i][j]}">`;
  table += `</div>`;
  return `${table}<div class="steps"><span class="ln"><b>ABSORBING</b>    ${absorbing.length ? absorbing.map(i=>'S'+i).join(', ') : 'None'}</span><span class="ln"><b>TRANSIENT</b>    ${transient.length ? transient.map(i=>'S'+i).join(', ') : 'None'}</span></div>`;
}

function svZtest(){
  try {
    const mode = getSV('ztest','mode','oneMean');
    const alpha = num(getSV('ztest','alpha',0.05), 0.05);
    const zcrit = alpha === 0.01 ? 2.576 : alpha === 0.1 ? 1.645 : 1.96;
    let z = 0, detail = '';
    if (mode === 'oneMean'){ const xbar = num(getSV('ztest','xbar',52), 52); const mu = num(getSV('ztest','mu',50), 50); const sigma = Math.max(1e-9, num(getSV('ztest','sigma',4), 4)); const n = Math.max(1, parseInt(getSV('ztest','n',16)) || 1); z = (xbar - mu) / (sigma/Math.sqrt(n)); detail = `Z = ${R(z)}`; }
    else if (mode === 'twoMean'){ const x1 = num(getSV('ztest','x1',55), 55); const x2 = num(getSV('ztest','x2',50), 50); const s1 = Math.max(1e-9, num(getSV('ztest','s1',5), 5)); const n1 = Math.max(1, parseInt(getSV('ztest','n1',30)) || 1); const n2 = Math.max(1, parseInt(getSV('ztest','n2',35)) || 1); z = (x1 - x2) / (s1*Math.sqrt(1/n1 + 1/n2)); detail = `Z = ${R(z)}`; }
    else { const p1 = num(getSV('ztest','p1',0.6), 0.6); const p2 = num(getSV('ztest','p2',0.5), 0.5); if (p1 < 0 || p1 > 1 || p2 < 0 || p2 > 1) throw new Error("Proportions must be between 0 and 1."); const n1 = Math.max(1, parseInt(getSV('ztest','n1',100)) || 1); const n2 = Math.max(1, parseInt(getSV('ztest','n2',100)) || 1); const pbar = (p1*n1 + p2*n2) / (n1 + n2); const se = Math.sqrt(pbar*(1-pbar)*(1/n1 + 1/n2)); if (se < 1e-12) throw new Error("Zero standard error."); z = (p1 - p2) / se; detail = `Z = ${R(z)}`; }
    const reject = Math.abs(z) > zcrit;
    let fields = '';
    if (mode === 'oneMean'){ fields = `<div class="fields" style="grid-template-columns:repeat(2,minmax(0,1fr))"><label class="field"><span>x̄</span><input class="input" type="number" step="any" data-custom="ztest" data-key="xbar" value="${getSV('ztest','xbar',52)}"></label><label class="field"><span>μ₀</span><input class="input" type="number" step="any" data-custom="ztest" data-key="mu" value="${getSV('ztest','mu',50)}"></label><label class="field"><span>σ</span><input class="input" type="number" step="any" data-custom="ztest" data-key="sigma" value="${getSV('ztest','sigma',4)}"></label><label class="field"><span>n</span><input class="input" type="number" min="1" step="1" data-custom="ztest" data-key="n" value="${getSV('ztest','n',16)}"></label></div>`; }
    else if (mode === 'twoMean'){ fields = `<div class="fields" style="grid-template-columns:repeat(2,minmax(0,1fr))"><label class="field"><span>x̄₁</span><input class="input" type="number" step="any" data-custom="ztest" data-key="x1" value="${getSV('ztest','x1',55)}"></label><label class="field"><span>x̄₂</span><input class="input" type="number" step="any" data-custom="ztest" data-key="x2" value="${getSV('ztest','x2',50)}"></label><label class="field"><span>σ</span><input class="input" type="number" step="any" data-custom="ztest" data-key="s1" value="${getSV('ztest','s1',5)}"></label><label class="field"><span>n₁</span><input class="input" type="number" min="1" step="1" data-custom="ztest" data-key="n1" value="${getSV('ztest','n1',30)}"></label><label class="field"><span>n₂</span><input class="input" type="number" min="1" step="1" data-custom="ztest" data-key="n2" value="${getSV('ztest','n2',35)}"></label></div>`; }

    return `<div class="fields" style="grid-template-columns:1fr"><label class="field"><span>Test type</span><select class="input" data-custom="ztest" data-key="mode"><option value="oneMean" ${mode==='oneMean'?'selected':''}>One-sample mean</option><option value="twoMean" ${mode==='twoMean'?'selected':''}>Two-sample mean</option><option value="twoProp" ${mode==='twoProp'?'selected':''}>Two proportions</option></select></label></div>${fields}
    <div class="fields" style="grid-template-columns:1fr"><label class="field"><span>α</span><select class="input" data-custom="ztest" data-key="alpha"><option value="0.10" ${alpha===0.1?'selected':''}>0.10</option><option value="0.05" ${alpha===0.05?'selected':''}>0.05</option><option value="0.01" ${alpha===0.01?'selected':''}>0.01</option></select></label></div>

  } catch (e) {
    return `<div class="steps"><span class="ln ans">⚠ ${esc(e.message || 'Error')}</span></div>`;
  }
}

function svTtest(){
  try {
    const mode = getSV('ttest','mode','one');
    const alpha = num(getSV('ttest','alpha',0.05), 0.05);
    let t = 0, df = 1, detail = '', fields = '';
    if (mode === 'one'){ const xbar = num(getSV('ttest','xbar',5), 5); const mu = num(getSV('ttest','mu',4), 4); const s = Math.max(1e-9, num(getSV('ttest','s',1), 1)); const n = Math.max(2, parseInt(getSV('ttest','n',10)) || 2); t = (xbar - mu) / (s/Math.sqrt(n)); df = n - 1; detail = `t = ${R(t)} , df = ${df}`; fields = `<div class="fields" style="grid-template-columns:repeat(2,minmax(0,1fr))"><label class="field"><span>x̄</span><input class="input" type="number" step="any" data-custom="ttest" data-key="xbar" value="${xbar}"></label><label class="field"><span>μ₀</span><input class="input" type="number" step="any" data-custom="ttest" data-key="mu" value="${mu}"></label><label class="field"><span>s</span><input class="input" type="number" step="any" data-custom="ttest" data-key="s" value="${s}"></label><label class="field"><span>n</span><input class="input" type="number" min="2" step="1" data-custom="ttest" data-key="n" value="${n}"></label></div>`; }
    else { const x1 = num(getSV('ttest','x1',55), 55); const x2 = num(getSV('ttest','x2',50), 50); const s1 = Math.max(1e-9, num(getSV('ttest','s1',5), 5)); const s2 = Math.max(1e-9, num(getSV('ttest','s2',4), 4)); const n1 = Math.max(2, parseInt(getSV('ttest','n1',12)) || 2); const n2 = Math.max(2, parseInt(getSV('ttest','n2',10)) || 2); const sp = Math.sqrt(((n1-1)*s1*s1 + (n2-1)*s2*s2) / (n1+n2-2)); t = (x1 - x2) / (sp * Math.sqrt(1/n1 + 1/n2)); df = n1 + n2 - 2; detail = `t = ${R(t)} , df = ${df}`; fields = `<div class="fields" style="grid-template-columns:repeat(2,minmax(0,1fr))"><label class="field"><span>x̄₁</span><input class="input" type="number" step="any" data-custom="ttest" data-key="x1" value="${x1}"></label><label class="field"><span>x̄₂</span><input class="input" type="number" step="any" data-custom="ttest" data-key="x2" value="${x2}"></label><label class="field"><span>s₁</span><input class="input" type="number" step="any" data-custom="ttest" data-key="s1" value="${s1}"></label><label class="field"><span>s₂</span><input class="input" type="number" step="any" data-custom="ttest" data-key="s2" value="${s2}"></label><label class="field"><span>n₁</span><input class="input" type="number" min="2" step="1" data-custom="ttest" data-key="n1" value="${n1}"></label><label class="field"><span>n₂</span><input class="input" type="number" min="2" step="1" data-custom="ttest" data-key="n2" value="${n2}"></label></div>`; }
    const tcrit = tCritical(df, alpha);
    const reject = Math.abs(t) > tcrit;
    return `<div class="fields" style="grid-template-columns:1fr"><label class="field"><span>Test type</span><select class="input" data-custom="ttest" data-key="mode"><option value="one" ${mode==='one'?'selected':''}>One-sample</option><option value="two" ${mode==='two'?'selected':''}>Two-sample</option></select></label></div>${fields}
    <div class="steps"><span class="ln"><b>CALC</b>   ${detail}</span><span class="ln"><b>CRIT</b>   t_{α/2, df=${df}} ≈ ±${R(tcrit)}</span><span class="ln ans">DECISION     |t| = ${R(Math.abs(t))} → ${reject ? 'Reject H₀' : 'Fail to reject H₀'}</span></div>`;
  } catch (e) {
    return `<div class="steps"><span class="ln ans">⚠ ${esc(e.message || 'Error')}</span></div>`;
  }
}

function svChi(){
  const obs = parseList(getSV('chi','o','10,20,30'));
  const exp = parseList(getSV('chi','e','15,15,30'));
  let out = '';
  if (obs.length === exp.length && obs.length > 0 && exp.every(v => v > 0)){
    const comps = obs.map((o,i) => ({o, e: exp[i], term: (o-exp[i])**2/exp[i]}));
    const chi2 = sumArr(comps.map(c => c.term)); const df = obs.length - 1;
    const crit = df <= 10 ? ({1:3.841,2:5.991,3:7.815,4:9.488,5:11.07,6:12.592,7:14.067,8:15.507,9:16.919,10:18.307}[df] || df + 1.96*Math.sqrt(2*df)) : df + 1.96*Math.sqrt(2*df);
    const reject = chi2 > crit;
    out = `<div class="steps"><span class="ln"><b>χ² = Σ(O−E)²/E</b></span><span class="ln"><b>CHI²</b>    ${R(chi2)} , df = ${df}</span><span class="ln ans">DECISION     χ² = ${R(chi2)} → ${reject ? 'Reject H₀' : 'Fail to reject H₀'}</span></div>`;
  } else {
    out = `<div class="steps"><span class="ln ans">Observed and Expected must have equal length; E > 0.</span></div>`;
  }
  return `<div class="fields" style="grid-template-columns:repeat(2,minmax(0,1fr))"><label class="field"><span>Observed</span><textarea class="input" rows="2" data-custom="chi" data-key="o">${esc(getSV('chi','o','10,20,30'))}</textarea></label><label class="field"><span>Expected</span><textarea class="input" rows="2" data-custom="chi" data-key="e">${esc(getSV('chi','e','15,15,30'))}</textarea></label></div>${out}`;
}

let vizCleanups = [];
function cleanupViz(){ vizCleanups.forEach(fn => { try{ fn(); }catch(e){} }); vizCleanups = []; }

function fitCanvas(canvas, h){
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const w = rect.width || 600;
  canvas.width  = Math.round(w * dpr);
  canvas.height = Math.round((h || rect.height || 320) * dpr);
  canvas.style.height = (h || 320) + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w, h: h || 320 };
}

function cssVar(name){
  const el = document.getElementById('stats-app') || document.documentElement;
  return getComputedStyle(el).getPropertyValue(name).trim();
}
function vizPalette(){
  return {
    bg: cssVar('--code-bg'), grid: cssVar('--border'),
    axis: cssVar('--border-2'), text: cssVar('--code-tx'),
    brand: cssVar('--brand'), brandSoft: cssVar('--brand-soft'),
    ok: cssVar('--ok'), warn: cssVar('--warn'), muted: cssVar('--muted')
  };
}
function labelText(ctx, text, x, y, color, size, align){
  ctx.save(); ctx.fillStyle = color; ctx.font = `600 ${size||11}px 'JetBrains Mono', monospace`;
  ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y); ctx.restore();
}

function setupScatterViz(container){
  const spec = VIZ_SPECS.unit1.find(s => s.id === 'scatter');
  let data = [[1,2],[2,4],[3,4.6],[4,6.1],[5,7.4],[6,8.5]];
  container.innerHTML = `<div class="solver-head"><div><h4>${spec.title}</h4><p>${spec.desc}</p></div></div><div class="viz-wrap"><canvas class="viz-canvas" style="height:340px"></canvas></div><div class="viz-stats"><div class="viz-stat"><span>a</span><b data-out="a">—</b></div><div class="viz-stat"><span>b</span><b data-out="b">—</b></div><div class="viz-stat"><span>r</span><b data-out="r">—</b></div><div class="viz-stat"><span>SSE</span><b data-out="sse">—</b></div></div><div class="viz-note"><b>Click</b> canvas to add points; <b>right-click</b> to remove nearest.</div>`;
  const canvas = container.querySelector('canvas');
  function fitLine(){ const n = data.length; if (n < 2) return {a:0,b:0}; const sx = sumArr(data.map(p => p[0])); const sy = sumArr(data.map(p => p[1])); const sx2 = sumArr(data.map(p => p[0]*p[0])); const sxy = sumArr(data.map(p => p[0]*p[1])); const den = n*sx2 - sx*sx; const b = den === 0 ? 0 : (n*sxy - sx*sy)/den; const a = (sy - b*sx)/n; return {a, b}; }
  function pearsonR(){ if (data.length < 2) return 0; const mx = meanArr(data.map(p=>p[0])), my = meanArr(data.map(p=>p[1])); const cov = sumArr(data.map(p => (p[0]-mx)*(p[1]-my)))/data.length; const sx = Math.sqrt(sumArr(data.map(p => (p[0]-mx)**2))/data.length); const sy = Math.sqrt(sumArr(data.map(p => (p[1]-my)**2))/data.length); return (sx*sy) === 0 ? 0 : cov/(sx*sy); }
  function draw(){
    const { ctx, w, h } = fitCanvas(canvas, 340); const p = vizPalette();
    ctx.fillStyle = p.bg; ctx.fillRect(0, 0, w, h);
    const pad = 30; const xmin = 0, xmax = 7, ymin = 0, ymax = 10;
    const X = v => pad + (v - xmin)/(xmax - xmin)*(w - pad*2);
    const Y = v => h - pad - (v - ymin)/(ymax - ymin)*(h - pad*2);
    ctx.strokeStyle = p.grid; ctx.lineWidth = 1;
    for (let x = 1; x < xmax; x++){ ctx.beginPath(); ctx.moveTo(X(x), pad); ctx.lineTo(X(x), h-pad); ctx.stroke(); }
    for (let y = 1; y < ymax; y += 2){ ctx.beginPath(); ctx.moveTo(pad, Y(y)); ctx.lineTo(w-pad, Y(y)); ctx.stroke(); }
    ctx.strokeStyle = p.axis; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(pad, h-pad); ctx.lineTo(w-pad, h-pad); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(pad, pad); ctx.lineTo(pad, h-pad); ctx.stroke();
    const { a, b } = fitLine();
    ctx.save(); ctx.strokeStyle = p.brand; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(X(xmin), Y(a + b*xmin)); ctx.lineTo(X(xmax), Y(a + b*xmax)); ctx.stroke(); ctx.restore();
    data.forEach(([x,y]) => {
      const px = X(x), py = Y(y); ctx.save();
      const grad = ctx.createRadialGradient(px, py, 1, px, py, 9);
      grad.addColorStop(0, p.brand); grad.addColorStop(1, 'rgba(52,82,212,.2)');
      ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(px, py, 9, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = p.brand; ctx.beginPath(); ctx.arc(px, py, 4.5, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke(); ctx.restore();
    });
    ctx.save(); ctx.strokeStyle = p.warn; ctx.setLineDash([3,3]); ctx.lineWidth = 1.2;
    data.forEach(([x,y]) => { const pred = a + b*x; ctx.beginPath(); ctx.moveTo(X(x), Y(y)); ctx.lineTo(X(x), Y(pred)); ctx.stroke(); }); ctx.restore();
    const r = pearsonR(); const sse = sumArr(data.map(([x,y]) => (y - (a + b*x))**2));
    container.querySelector('[data-out="a"]').textContent = R(a);
    container.querySelector('[data-out="b"]').textContent = R(b);
    container.querySelector('[data-out="r"]').textContent = R(r);
    container.querySelector('[data-out="sse"]').textContent = R(sse);
    labelText(ctx, 'x', w-pad+14, h-pad, p.text, 11);
    labelText(ctx, 'y', pad-10, pad-12, p.text, 11, 'right');
    ctx.save(); ctx.fillStyle = p.brand; ctx.font = `700 12px 'JetBrains Mono', monospace`;
    ctx.fillText(`y = ${R(a)} + ${R(b)}x`, pad+10, pad+14);
    ctx.fillStyle = p.ok; ctx.fillText(`r = ${R(r)}`, pad+10, pad+30); ctx.restore();
  }
  canvas.addEventListener('contextmenu', e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const w = rect.width, h = rect.height, pad = 30;
    const xmin = 0, xmax = 7, ymin = 0, ymax = 10;
    let best = -1, bd = 40;
    data.forEach(([x,y], i) => { const px = pad + (x-xmin)/(xmax-xmin)*(w-pad*2); const py = h - pad - (y-ymin)/(ymax-ymin)*(h-pad*2); const d = Math.hypot(px-mx, py-my); if (d < bd){ bd = d; best = i; } });
    if (best >= 0){ data.splice(best, 1); draw(); }
  });
  canvas.addEventListener('click', e => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const w = rect.width, h = rect.height, pad = 30;
    const xmin = 0, xmax = 7, ymin = 0, ymax = 10;
    if (mx < pad || mx > w-pad || my < pad || my > h-pad) return;
    const vx = xmin + (mx - pad)/(w - pad*2)*(xmax-xmin);
    const vy = ymax - (my - pad)/(h - pad*2)*(ymax-ymin);
    data.push([vx, vy]); draw();
  });
  let raf = 0;
  const resize = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); };
  window.addEventListener('resize', resize);
  vizCleanups.push(() => { window.removeEventListener('resize', resize); cancelAnimationFrame(raf); });
  draw();
}

function setupCorrDemoViz(container){
  const spec = VIZ_SPECS.unit1.find(s => s.id === 'corrDemo');
  container.innerHTML = `<div class="solver-head"><div><h4>${spec.title}</h4><p>${spec.desc}</p></div></div><div class="viz-wrap"><canvas class="viz-canvas" style="height:300px"></canvas></div><div class="viz-ctrls"><label class="viz-ctrl"><span>target r</span><input type="range" min="-1" max="1" step="0.05" value="0.7" data-k="r"><b>0.70</b></label></div><div class="viz-stats"><div class="viz-stat"><span>actual r</span><b data-out="r">—</b></div><div class="viz-stat"><span>interpretation</span><b data-out="interp" style="font-size:10.5px">—</b></div></div>`;
  const canvas = container.querySelector('canvas');
  const S = { r:0.7, pts:[] };
  function gen(){ S.pts = []; for (let i = 0; i < 80; i++){ const u1 = Math.random() || 1e-9, u2 = Math.random(); const z1 = Math.sqrt(-2*Math.log(u1))*Math.cos(2*Math.PI*u2); const z2 = Math.sqrt(-2*Math.log(u1))*Math.sin(2*Math.PI*u2); S.pts.push([z1, S.r * z1 + Math.sqrt(Math.max(0, 1 - S.r*S.r)) * z2]); } }
  function draw(){
    const { ctx, w, h } = fitCanvas(canvas, 300); const p = vizPalette();
    ctx.fillStyle = p.bg; ctx.fillRect(0, 0, w, h);
    const pad = 30; const cx = w/2, cy = h/2; const scale = Math.min(w, h) / 6;
    ctx.strokeStyle = p.grid; ctx.lineWidth = 1;
    for (let i = -3; i <= 3; i++){ ctx.beginPath(); ctx.moveTo(cx + i*scale, pad); ctx.lineTo(cx + i*scale, h-pad); ctx.stroke(); ctx.beginPath(); ctx.moveTo(pad, cy + i*scale); ctx.lineTo(w-pad, cy + i*scale); ctx.stroke(); }
    ctx.strokeStyle = p.axis; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(pad, cy); ctx.lineTo(w-pad, cy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, pad); ctx.lineTo(cx, h-pad); ctx.stroke();
    let sx = 0, sy = 0, sxx = 0, syy = 0, sxy = 0; const n = S.pts.length;
    S.pts.forEach(([x, y]) => { sx += x; sy += y; sxx += x*x; syy += y*y; sxy += x*y; const px = cx + x*scale, py = cy - y*scale; ctx.save(); ctx.fillStyle = p.brandSoft; ctx.beginPath(); ctx.arc(px, py, 6, 0, Math.PI*2); ctx.fill(); ctx.fillStyle = p.brand; ctx.beginPath(); ctx.arc(px, py, 3, 0, Math.PI*2); ctx.fill(); ctx.restore(); });
    const mx = sx/n, my = sy/n; const cov = sxy/n - mx*my; const sdx = Math.sqrt(Math.max(0, sxx/n - mx*mx)); const sdy = Math.sqrt(Math.max(0, syy/n - my*my)); const r = sdx*sdy === 0 ? 0 : cov/(sdx*sdy);
    container.querySelector('[data-out="r"]').textContent = R(r);
    const interp = !isFinite(r) ? '—' : Math.abs(r) >= 0.8 ? (r > 0 ? 'Strong positive' : 'Strong negative') : Math.abs(r) >= 0.5 ? (r > 0 ? 'Moderate positive' : 'Moderate negative') : Math.abs(r) >= 0.2 ? 'Weak linear' : 'No linear';
    container.querySelector('[data-out="interp"]').textContent = interp;
  }
  container.querySelectorAll('input[type=range]').forEach(inp => { inp.addEventListener('input', () => { S.r = parseFloat(inp.value); inp.parentElement.querySelector('b').textContent = S.r.toFixed(2); gen(); draw(); }); });
  let raf = 0;
  const resize = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); };
  window.addEventListener('resize', resize);
  vizCleanups.push(() => { window.removeEventListener('resize', resize); cancelAnimationFrame(raf); });
  gen(); draw();
}

function setupDistViz(container){

    if (S.show === 'all' || S.show === 'norm'){ const mu = S.n*S.p; const sd = Math.sqrt(S.n*S.p*(1-S.p)); ctx.save(); ctx.strokeStyle = 'rgb(59,130,246)'; ctx.lineWidth = 2.2; ctx.setLineDash([6,4]); ctx.beginPath(); let first = true; for (let i = 0; i <= 200; i++){ const xv = -0.5 + (xmax+0.5)*i/200; const v = normPdf(xv, mu, Math.max(0.3, sd)); const px = X0 + (xv/xmax)*(X1-X0); const py = Y0 - v*(Y0-Y1)/0.4; if (first){ ctx.moveTo(px, py); first = false; } else ctx.lineTo(px, py); } ctx.stroke(); ctx.restore(); }
  }

function setupCltViz(container){
  const spec = VIZ_SPECS.unit2.find(s => s.id === 'clt');
  container.innerHTML = `<div class="solver-head"><div><h4>${spec.title}</h4><p>${spec.desc}</p></div></div><div class="viz-wrap"><canvas class="viz-canvas" style="height:320px"></canvas></div><div class="viz-ctrls"><label class="viz-ctrl"><span>n</span><input type="range" min="1" max="40" step="1" value="5" data-k="n"><b>5</b></label><label class="viz-ctrl"><span>population</span><select data-k="pop" style="flex:1;padding:5px 8px;font-size:11.5px;border-radius:8px;border:1px solid var(--border-2);background:var(--surface-2)"><option value="unif">Uniform</option><option value="exp">Exponential</option><option value="bimodal">Bimodal</option></select></label><label class="viz-ctrl"><span>samples</span><input type="range" min="200" max="3000" step="100" value="1000" data-k="M"><b>1000</b></label></div>`;
  const canvas = container.querySelector('canvas');
  const S = { n:5, pop:'unif', M:1000 };
  function sample(){ if (S.pop === 'unif') return Math.random(); if (S.pop === 'exp') return -Math.log(1 - Math.random()); return Math.random() < 0.5 ? 0.3 + Math.random()*0.2 : 0.7 + Math.random()*0.2; }
  function popMu(){ if (S.pop === 'unif') return 0.5; if (S.pop === 'exp') return 1; return 0.6; }
  function popVar(){ if (S.pop === 'unif') return 1/12; if (S.pop === 'exp') return 1; return 0.0433; }
  function draw(){
    const { ctx, w, h } = fitCanvas(canvas, 320); const p = vizPalette();
    ctx.fillStyle = p.bg; ctx.fillRect(0, 0, w, h);
    const means = []; for (let i = 0; i < S.M; i++){ let s = 0; for (let j = 0; j < S.n; j++) s += sample(); means.push(s / S.n); }
    const mu = popMu(); const v = popVar(); const se = Math.sqrt(v / S.n);
    const lo = mu - 4*se, hi = mu + 4*se; const B = 40;
    const bins = new Array(B).fill(0);
    means.forEach(m => { const idx = clamp(Math.floor((m - lo) / (hi - lo) * B), 0, B-1); bins[idx]++; });
    const maxB = Math.max(...bins);
    const pad = 30; const X0 = pad, X1 = w - pad, Y0 = h - pad, Y1 = pad;
    ctx.strokeStyle = p.axis; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(X0, Y0); ctx.lineTo(X1, Y0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(X0, Y0); ctx.lineTo(X0, Y1); ctx.stroke();
    ctx.save(); ctx.fillStyle = p.brand;
    for (let i = 0; i < B; i++){ const bx = X0 + (i/B)*(X1-X0); const bh = bins[i]/maxB * (Y0-Y1); ctx.fillRect(bx, Y0 - bh, (X1-X0)/B - 1, bh); } ctx.restore();
    ctx.save(); ctx.strokeStyle = p.ok; ctx.lineWidth = 2.4;
    ctx.beginPath(); let first = true;
    for (let i = 0; i <= 200; i++){ const xv = lo + (hi-lo)*i/200; const pdf = normPdf(xv, mu, se); const px = X0 + (i/200)*(X1-X0); const py = Y0 - (pdf/normPdf(mu, mu, se)) * (Y0-Y1) * 0.85; if (first){ ctx.moveTo(px, py); first = false; } else ctx.lineTo(px, py); } ctx.stroke(); ctx.restore();
    labelText(ctx, `n = ${S.n}`, X0+6, Y1+12, p.text, 11);
  }
  container.querySelectorAll('input[type=range], select').forEach(inp => { inp.addEventListener('input', () => { const key = inp.dataset.k; if (key === 'pop') S.pop = inp.value; else { S[key] = parseInt(inp.value); inp.parentElement.querySelector('b').textContent = String(S[key]); } draw(); }); });
  let raf = 0;
  const resize = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); };
  window.addEventListener('resize', resize);
  vizCleanups.push(() => { window.removeEventListener('resize', resize); cancelAnimationFrame(raf); });
  draw();
}

function setupMarkovViz(container){
  const spec = VIZ_SPECS.unit3.find(s => s.id === 'markov');
  container.innerHTML = `<div class="solver-head"><div><h4>${spec.title}</h4><p>${spec.desc}</p></div></div><div class="viz-wrap"><canvas class="viz-canvas" style="height:340px"></canvas></div><div class="viz-ctrls"><label class="viz-ctrl"><span>P₀₁</span><input type="range" min="0" max="1" step="0.05" value="0.3" data-k="p01"><b>0.30</b></label><label class="viz-ctrl"><span>P₁₀</span><input type="range" min="0" max="1" step="0.05" value="0.4" data-k="p10"><b>0.40</b></label></div><div class="viz-stats"><div class="viz-stat"><span>π₀</span><b data-out="pi0">—</b></div><div class="viz-stat"><span>π₁</span><b data-out="pi1">—</b></div><div class="viz-stat"><span>step</span><b data-out="step">0</b></div></div>`;
  const canvas = container.querySelector('canvas');
  const S = { p01:0.3, p10:0.4, dist:[1,0], t:0 };
  function stationary(){ const s = S.p01 + S.p10; if (s < 1e-9) return [0.5, 0.5]; return [S.p10/s, S.p01/s]; }
  function draw(){
    const { ctx, w, h } = fitCanvas(canvas, 340); const p = vizPalette();
    ctx.fillStyle = p.bg; ctx.fillRect(0, 0, w, h);
    const cx = w/2, cy = h/2 + 20; const R = Math.min(w, h) * 0.25;
    const S0 = [cx - R, cy], S1 = [cx + R, cy];
    const drawEdge = (from, to, prob, color) => {
      const dx = to[0] - from[0], dy = to[1] - from[1];
      const mx = (from[0] + to[0])/2, my = (from[1] + to[1])/2;
      const nx = -dy, ny = dx; const len = Math.hypot(dx, dy) || 1; const off = 30;
      const ctrlX = mx + nx/len * off, ctrlY = my + ny/len * off;
      ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 2 + prob*3;
      ctx.beginPath(); ctx.moveTo(from[0], from[1]); ctx.quadraticCurveTo(ctrlX, ctrlY, to[0], to[1]); ctx.stroke();
      const tx = (to[0] - ctrlX), ty = (to[1] - ctrlY); const ang = Math.atan2(ty, tx);
      ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(to[0], to[1]); ctx.lineTo(to[0] - Math.cos(ang-0.4)*12, to[1] - Math.sin(ang-0.4)*12); ctx.lineTo(to[0] - Math.cos(ang+0.4)*12, to[1] - Math.sin(ang+0.4)*12); ctx.closePath(); ctx.fill();
      const lx = mx + nx/len * (off*1.4), ly = my + ny/len * (off*1.4);
      ctx.fillStyle = color; ctx.font = `700 12px 'JetBrains Mono', monospace`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(prob.toFixed(2), lx, ly); ctx.restore();
    };
    drawEdge(S0, S1, S.p01, 'rgb(52,82,212)');
    drawEdge(S1, S0, S.p10, 'rgb(16,185,129)');
    const drawNode = (at, label, prob) => {
      ctx.save(); const grad = ctx.createRadialGradient(at[0], at[1], 4, at[0], at[1], 36);
      grad.addColorStop(0, p.brand); grad.addColorStop(1, 'rgba(52,82,212,.18)');
      ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(at[0], at[1], 36, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = p.brand; ctx.beginPath(); ctx.arc(at[0], at[1], 26, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = p.bg; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = `800 14px 'Inter', sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(label, at[0], at[1]); ctx.restore();
      ctx.save(); ctx.fillStyle = p.text; ctx.font = `700 12px 'JetBrains Mono', monospace`; ctx.textAlign = 'center'; ctx.fillText(prob.toFixed(3), at[0], at[1] + 52); ctx.restore();
    };
    drawNode(S0, 'S₀', S.dist[0]);
    drawNode(S1, 'S₁', S.dist[1]);
    const [pi0, pi1] = stationary();
    container.querySelector('[data-out="pi0"]').textContent = R(pi0);
    container.querySelector('[data-out="pi1"]').textContent = R(pi1);
    container.querySelector('[data-out="step"]').textContent = String(S.t);
  }
  let raf = 0; let lastStep = performance.now();
  function loop(now){
    if (now - lastStep > 800){
      lastStep = now;
      S.t++;
      const p0 = S.dist[0], p1 = S.dist[1];
      const n0 = p0*(1 - S.p01) + p1*S.p10;
      const n1 = p0*S.p01 + p1*(1 - S.p10);
      S.dist = [n0, n1];
    }
    draw(); raf = requestAnimationFrame(loop);
  }
  raf = requestAnimationFrame(loop);
  container.querySelectorAll('input[type=range]').forEach(inp => { inp.addEventListener('input', () => { S[inp.dataset.k] = parseFloat(inp.value); inp.parentElement.querySelector('b').textContent = S[inp.dataset.k].toFixed(2); S.dist = [1,0]; S.t = 0; }); });
  vizCleanups.push(() => cancelAnimationFrame(raf));
}

function setupJointHeatViz(container){
  const spec = VIZ_SPECS.unit3.find(s => s.id === 'jointHeat');
  container.innerHTML = `<div class="solver-head"><div><h4>${spec.title}</h4><p>${spec.desc}</p></div></div><div class="viz-wrap"><canvas class="viz-canvas" style="height:340px"></canvas></div><div class="viz-ctrls"><label class="viz-ctrl"><span>corr</span><input type="range" min="-0.9" max="0.9" step="0.05" value="0.3" data-k="corr"><b>0.30</b></label></div>`;
  const canvas = container.querySelector('canvas');
  const S = { corr:0.3 };
  function jointPdf(x, y){ const r = S.corr; const z = (x*x - 2*r*x*y + y*y) / (2*(1-r*r)); return Math.exp(-z) / (2*Math.PI * Math.sqrt(1-r*r)); }
  function draw(){
    const { ctx, w, h } = fitCanvas(canvas, 340); const p = vizPalette();
    ctx.fillStyle = p.bg; ctx.fillRect(0, 0, w, h);
    const pad = 40; const cw = w - pad*2, ch = h - pad*2; const N = 80;
    let zmax = 0; const grid = Array.from({length:N}, () => new Array(N).fill(0));
    for (let i = 0; i < N; i++) for (let j = 0; j < N; j++){ const x = -3 + 6*i/(N-1); const y = -3 + 6*j/(N-1); const v = jointPdf(x, y); grid[i][j] = v; if (v > zmax) zmax = v; }
    const cellW = cw/N, cellH = ch/N;
    for (let i = 0; i < N; i++) for (let j = 0; j < N; j++){
      const v = grid[i][j] / zmax; const px = pad + i*cellW; const py = pad + (N-1-j)*cellH;
      const r = Math.round(20 + 220*v); const g = Math.round(30 + 180*v*(1-Math.abs(S.corr))); const b = Math.round(60 + 180*(1-v));
      ctx.fillStyle = `rgb(${r},${g},${b})`; ctx.fillRect(px, py, cellW+0.5, cellH+0.5);
    }
    ctx.strokeStyle = p.axis; ctx.lineWidth = 1.5; ctx.strokeRect(pad, pad, cw, ch);
  }
  container.querySelectorAll('input[type=range]').forEach(inp => { inp.addEventListener('input', () => { S[inp.dataset.k] = parseFloat(inp.value); inp.parentElement.querySelector('b').textContent = S[inp.dataset.k].toFixed(2); draw(); }); });
  let raf = 0;
  const resize = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); };
  window.addEventListener('resize', resize);
  vizCleanups.push(() => { window.removeEventListener('resize', resize); cancelAnimationFrame(raf); });
  draw();
}

function setupSampDistViz(container){

function setupHypoViz(container){
  const spec = VIZ_SPECS.unit4.find(s => s.id === 'hypo');
  container.innerHTML = `<div class="solver-head"><div><h4>${spec.title}</h4><p>${spec.desc}</p></div></div><div class="viz-wrap"><canvas class="viz-canvas" style="height:320px"></canvas></div><div class="viz-ctrls"><label class="viz-ctrl"><span>Z value</span><input type="range" min="-4" max="4" step="0.05" value="2.1" data-k="z"><b>2.10</b></label><label class="viz-ctrl"><span>α</span><select data-k="alpha" style="flex:1;padding:5px 8px;font-size:11.5px;border-radius:8px;border:1px solid var(--border-2);background:var(--surface-2)"><option value="0.10">0.10</option><option value="0.05" selected>0.05</option><option value="0.01">0.01</option></select></label></div><div class="viz-stats"><div class="viz-stat"><span>critical</span><b data-out="crit">—</b></div><div class="viz-stat"><span>p (2-tail)</span><b data-out="p">—</b></div><div class="viz-stat"><span>decision</span><b data-out="dec" style="font-size:10.5px">—</b></div></div>`;
  const canvas = container.querySelector('canvas');
  const S = { z:2.1, alpha:0.05 };
  function crit(){ if (S.alpha === 0.10) return 1.645; if (S.alpha === 0.01) return 2.576; return 1.96; }
  function draw(){
    const { ctx, w, h } = fitCanvas(canvas, 320); const p = vizPalette();
    ctx.fillStyle = p.bg; ctx.fillRect(0, 0, w, h);
    const pad = 30; const X0 = pad, X1 = w-pad, Y0 = h-40, Y1 = 30;
    const lo = -4, hi = 4;
    const toX = z => X0 + (z - lo)/(hi - lo)*(X1-X0);
    const pdf = z => normPdf(z, 0, 1); const maxPdf = normPdf(0,0,1);
    ctx.save(); ctx.strokeStyle = p.brand; ctx.lineWidth = 2.4; ctx.beginPath();
    for (let i = 0; i <= 400; i++){ const z = lo + (hi-lo)*i/400; const px = toX(z); const py = Y0 - pdf(z)/maxPdf * (Y0-Y1); if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py); } ctx.stroke(); ctx.restore();
    const c = crit();
    const shade = (from, to, color) => { ctx.save(); ctx.beginPath(); ctx.moveTo(toX(from), Y0); for (let i = 0; i <= 200; i++){ const z = from + (to-from)*i/200; const px = toX(z); const py = Y0 - pdf(z)/maxPdf * (Y0-Y1); ctx.lineTo(px, py); } ctx.lineTo(toX(to), Y0); ctx.closePath(); ctx.fillStyle = color; ctx.fill(); ctx.restore(); };
    shade(lo, -c, 'rgba(239,68,68,.35)'); shade(c, hi, 'rgba(239,68,68,.35)');
    ctx.strokeStyle = p.axis; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(X0, Y0); ctx.lineTo(X1, Y0); ctx.stroke();
    [-c, c].forEach(x => { ctx.save(); ctx.strokeStyle = 'rgb(220,38,38)'; ctx.lineWidth = 1.6; ctx.setLineDash([5,4]); ctx.beginPath(); ctx.moveTo(toX(x), Y0); ctx.lineTo(toX(x), Y1+10); ctx.stroke(); ctx.restore(); labelText(ctx, x.toFixed(2), toX(x), Y1, 'rgb(220,38,38)', 10, 'center'); });
    const zx = toX(S.z); const zy = Y0 - pdf(S.z)/maxPdf * (Y0-Y1);
    ctx.save(); ctx.fillStyle = 'rgb(52,82,212)'; ctx.beginPath(); ctx.arc(zx, zy, 7, 0, Math.PI*2); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
    labelText(ctx, `Z = ${S.z.toFixed(2)}`, zx, zy-14, 'rgb(52,82,212)', 11, 'center');
    const ptwo = 2 * (1 - normCdf(Math.abs(S.z))); const reject = Math.abs(S.z) > c;
    container.querySelector('[data-out="crit"]').textContent = '±' + c;
    container.querySelector('[data-out="p"]').textContent = R(ptwo);
    container.querySelector('[data-out="dec"]').textContent = reject ? 'Reject H₀' : 'Fail to reject H₀';
  }
  container.querySelectorAll('input[type=range], select').forEach(inp => { inp.addEventListener('input', () => { if (inp.dataset.k === 'z'){ S.z = parseFloat(inp.value); inp.parentElement.querySelector('b').textContent = S.z.toFixed(2); } else if (inp.dataset.k === 'alpha'){ S.alpha = parseFloat(inp.value); } draw(); }); });
  let raf = 0;
  const resize = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); };
  window.addEventListener('resize', resize);
  vizCleanups.push(() => { window.removeEventListener('resize', resize); cancelAnimationFrame(raf); });
  draw();
}

function mountVizForUnit(unitId){

    const el = document.getElementById('viz-' + s.id);
    if (el && !el.dataset.mounted){ el.dataset.mounted = '1'; try { VIZ_SETUP[s.id](el); } catch(e){ console.error('viz mount', s.id, e); } }

function renderView(){
  cleanupViz();
  const v = state.view; const el = $('#content');
  if (v === 'dashboard') el.innerHTML = viewDashboard();
  else if (v.startsWith('unit')) el.innerHTML = viewUnit(v);
  else if (v === 'formulas') el.innerHTML = viewFormulas();
  else if (v === 'practice') el.innerHTML = viewPractice();
  else if (v === 'mcq') el.innerHTML = viewMcq();
  else if (v === 'definitions') el.innerHTML = viewDefinitions();
  else if (v === 'progress') el.innerHTML = viewProgress();
  else if (v === 'about') el.innerHTML = viewAbout();
  el.scrollTop = 0;
  window.scrollTo({ top: 0, behavior: 'instant' });
  if (v.startsWith('unit') && state.tab[v] === 'visualize'){ requestAnimationFrame(() => mountVizForUnit(v)); }
}

function renderAll(){
  renderNav();
  renderView();
  setRing();
  const label = {dashboard:'Dashboard', formulas:'Formula Sheet', practice:'Practice', mcq:'MCQ Test', definitions:'Definitions', progress:'Progress', about:'About'}[state.view]
    || (UNITS.find(u => u.id === state.view)?.title || 'Dashboard');
  $('#crumb').textContent = label;
}

function navigate(v){
  state.view = v;
  state.visited.add(v);
  state.search = '';
  save();
  renderAll();
  closeSidebar();
}

/* ============ EVENTS ============ */
function openSidebar(){ $('#sidebar').classList.add('open'); $('#scrim').classList.add('show'); }
function closeSidebar(){ $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('show'); }

$('#menuBtn').innerHTML = I.menu;
$('#scrim').addEventListener('click', closeSidebar);
$('#themeBtn').addEventListener('click', () => {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', state.theme);
  $('#themeBtn').innerHTML = state.theme === 'dark' ? I.sun : I.moon;
  save();
  if (state.view.startsWith('unit') && state.tab[state.view] === 'visualize'){
    const specs = VIZ_SPECS[state.view] || [];
    specs.forEach(s => { const host = document.getElementById('viz-' + s.id); if (host){ delete host.dataset.mounted; host.innerHTML = ''; } });
    requestAnimationFrame(() => mountVizForUnit(state.view));
  }
});
$('#nav').addEventListener('click', e => {
  const b = e.target.closest('[data-nav]');
  if (b) navigate(b.dataset.nav);
});

const content = $('#content');

content.addEventListener('click', e => {
  const t = e.target;
  const nav = t.closest('[data-nav]');
  if (nav) { navigate(nav.dataset.nav); return; }
  const tab = t.closest('[data-tab]');
  if (tab) { state.tab[tab.dataset.unit] = tab.dataset.tab; state.search = ''; cleanupViz(); renderView(); return; }
  const cp = t.closest('[data-copy]');
  if (cp){
    const text = cp.dataset.copy;
    const done = () => { cp.classList.add('done'); cp.innerHTML = I.check; toast('Formula copied'); setTimeout(() => { cp.classList.remove('done'); cp.innerHTML = I.copy; }, 1300); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(done); else done();
    return;
  }
  const chk = t.closest('[data-check]');
  if (chk){
    const id = parseInt(chk.dataset.check); const p = PRACTICE.find(x => x.id === id);
    const cur = state.practice[id]; const raw = cur && typeof cur === 'object' ? cur.input : '';
    const val = parseFloat(raw);
    const ok = !isNaN(val) && Math.abs(val - p.a) <= p.tol;
    state.practice[id] = { input: raw, ok };
    save(); renderView(); setRing();
    if (ok) toast('Correct answer');
    return;
  }
  const mopt = t.closest('[data-mcq-opt]');
  if (mopt){ state.mcq.answers[state.mcq.index] = parseInt(mopt.dataset.mcqOpt); save(); renderView(); return; }
  const mnav = t.closest('[data-mcq-nav]');
  if (mnav){ const i = parseInt(mnav.dataset.mcqNav); if (i >= 0 && i < MCQS.length){ state.mcq.index = i; save(); renderView(); } return; }
  if (t.closest('[data-mcq-submit]')){ state.mcq.submitted = true; save(); renderView(); setRing(); return; }
  if (t.closest('[data-mcq-retry]')){ state.mcq = { answers:{}, submitted:false, index:0 }; save(); renderView(); return; }
  if (t.closest('[data-reset]')){ state.practice = {}; state.mcq = { answers:{}, submitted:false, index:0 }; state.visited = new Set(['dashboard']); save(); renderAll(); toast('Progress reset'); return; }
});

content.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('[data-search]')){
    state.search = t.value;
    const pos = t.selectionStart;
    renderView();
    const next = $('[data-search]');
    if (next){ next.focus(); next.setSelectionRange(pos, pos); }
    return;
  }
  if (t.matches('[data-practice]')){
    const id = parseInt(t.dataset.practice);
    const cur = state.practice[id];
    state.practice[id] = { input: t.value, ok: cur && typeof cur === 'object' ? cur.ok : false };
    save();
    return;
  }
  if (t.matches('[data-custom]')){
    putSV(t.dataset.custom, t.dataset.key, t.value);
    const card = t.closest('.card');
    const html = solverCard(t.dataset.custom);
    const tmp = document.createElement('div'); tmp.innerHTML = html;
    const which = t.dataset.key;
    card.replaceWith(tmp.firstElementChild);
    const again = $(`[data-custom="${t.dataset.custom}"][data-key="${which}"]`);
    if (again){ again.focus(); if (typeof again.setSelectionRange === "function") { try { again.setSelectionRange(again.value.length, again.value.length); } catch(e){} } }
    return;
  }
  if (t.matches('[data-matrix]')){
    const name = t.dataset.matrix, r = parseInt(t.dataset.r), c = parseInt(t.dataset.c);
    state.matrices[name][r][c] = parseFloat(t.value) || 0;
    const card = t.closest('.card');
    const sid = { jointP:'joint', stochP:'stoch', markovP:'markov' }[name] || 'joint';
    const html = solverCard(sid);
    const tmp = document.createElement('div'); tmp.innerHTML = html;
    card.replaceWith(tmp.firstElementChild);
    const again = $(`[data-matrix="${name}"][data-r="${r}"][data-c="${c}"]`);
    if (again){ again.focus(); if (typeof again.setSelectionRange === "function") { try { again.setSelectionRange(again.value.length, again.value.length); } catch(e){} } }
    return;
  }
  if (t.matches('[data-matrix-vec]')){
    const name = t.dataset.matrixVec;
    if (name === 'jointX' || name === 'jointY'){
      state.matrices[name] = parseList(t.value).slice(0, state.matrices.jointSize);
      while (state.matrices[name].length < state.matrices.jointSize) state.matrices[name].push(state.matrices[name].length);
    } else if (name === 'markovP0'){ state.matrices.markovP0 = t.value; }
    const card = t.closest('.card');
    const sid = name === 'markovP0' ? 'markov' : 'joint';
    const html = solverCard(sid);
    const tmp = document.createElement('div'); tmp.innerHTML = html;
    card.replaceWith(tmp.firstElementChild);
    const again = $(`[data-matrix-vec="${name}"]`);
    if (again){ again.focus(); if (typeof again.setSelectionRange === "function") { try { again.setSelectionRange(again.value.length, again.value.length); } catch(e){} } }
    return;
  }
  if (t.matches('[data-matrix-size]')){
    const name = t.dataset.matrixSize; const n = parseInt(t.value);
    if (name === 'stoch'){ state.matrices.stochSize = n; state.matrices.stochP = Array.from({length:n}, (_, i) => Array.from({length:n}, (_, j) => i === j ? 0.7 : 0.3/(n-1))); }
    else if (name === 'markov'){ state.matrices.markovSize = n; state.matrices.markovP = Array.from({length:n}, (_, i) => Array.from({length:n}, (_, j) => i === j ? 0.7 : 0.3/(n-1))); state.matrices.markovP0 = Array.from({length:n}, (_, i) => i === 0 ? 1 : 0).join(','); }
    const card = t.closest('.card');
    const html = solverCard(name);
    const tmp = document.createElement('div'); tmp.innerHTML = html;
    card.replaceWith(tmp.firstElementChild);
    return;
  }
});

/* ============ BOOT ============ */
document.documentElement.setAttribute('data-theme', state.theme);
$('#themeBtn').innerHTML = state.theme === 'dark' ? I.sun : I.moon;
renderAll();

window.__statsRerender = renderAll;
</script>

<!-- ========================= APP SWITCHER LOGIC ========================= -->
<script>
(function(){
  const switcher = document.getElementById('app-switcher');
  const numApp = document.getElementById('numerical-app');
  const statsApp = document.getElementById('stats-app');

  function show(appName){
    if (appName === 'stats'){
      numApp.style.display = 'none';
      statsApp.style.display = '';
      document.title = 'Statistics Dashboard · Engineering Mathematics';
      requestAnimationFrame(() => {
        window.dispatchEvent(new Event('resize'));
        if (window.__statsRerender) window.__statsRerender();
      });
    } else {
      statsApp.style.display = 'none';
      numApp.style.display = '';
      document.title = 'Numerical Lab Studio · Solver';
    }
    switcher.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.app === appName));
    try { localStorage.setItem('app.active', appName); } catch(e) {}
  }

  switcher.addEventListener('click', e => {
    const btn = e.target.closest('button[data-app]');
    if (btn) show(btn.dataset.app);
  });

  let saved = 'num';
  try { saved = localStorage.getItem('app.active') || 'num'; } catch(e) {}
  show(saved);
})();
</script>
