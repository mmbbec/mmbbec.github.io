      );
    }

    /* ===============================================================
       8. ODE MODULE (6 methods)
       =============================================================== */
    const ODE_METHODS = {
      euler: { label: "Euler's Method", short: "Euler", order: "O(h)", formula: "y_{n+1} = y_n + h\\,f(x_n, y_n)", desc: "Forward Euler. First-order accurate; simple but requires small h for accuracy." },
      heun: { label: "Modified Euler (Heun)", short: "Heun", order: "O(h²)", formula: "y_{n+1} = y_n + \\tfrac{h}{2}\\left[f_n + f(x_{n+1}, \\tilde{y}_{n+1})\\right]", desc: "Predictor–corrector using trapezoidal averaging. Second-order accurate." },
      rk2: { label: "Midpoint RK2", short: "Midpoint RK2", order: "O(h²)", formula: "y_{n+1} = y_n + h\\,f\\!\\left(x_n + \\tfrac{h}{2}, y_n + \\tfrac{h}{2} f_n\\right)", desc: "Second-order Runge–Kutta using the midpoint slope. Simple and accurate." },
      rk4: { label: "Classical Runge–Kutta 4", short: "RK4", order: "O(h⁴)", formula: "y_{n+1} = y_n + \\tfrac{h}{6}(k_1 + 2k_2 + 2k_3 + k_4)", desc: "Fourth-order Runge–Kutta. The workhorse of ODE integration." },
      ab4: { label: "Adams–Bashforth 4-step", short: "Adams–Bashforth 4", order: "O(h⁴)", formula: "y_{n+1} = y_n + \\tfrac{h}{24}(55f_n - 59f_{n-1} + 37f_{n-2} - 9f_{n-3})", desc: "Multistep explicit method. Requires 3 bootstrapping steps (RK4 used here)." },
      beuler: { label: "Backward Euler", short: "Backward Euler", order: "O(h) · implicit", formula: "y_{n+1} = y_n + h\\,f(x_{n+1}, y_{n+1})", desc: "Implicit Euler. Solved by fixed-point iteration at each step. Stable for stiff problems." },
    };

    function ODESolver() {
      const [expr, setExpr] = useState("x + y");
      const [method, setMethod] = useState("rk4");
      const [x0, setX0] = useState(0);
      const [y0, setY0] = useState(1);
      const [xEnd, setXEnd] = useState(1);
      const [h, setH] = useState(0.1);
      const [tab, setTab] = useState("solver");
      const [result, setResult] = useState(null);
      const [error, setError] = useState("");

      const f = useMemo(() => compileBinary(expr), [expr]);
      const meta = ODE_METHODS[method];

      const solve = useCallback(() => {
        setError(""); setResult(null);
        try {
          if (!(h > 0)) throw new Error("Step size h must be positive.");
          if (!(xEnd > x0)) throw new Error("xEnd must be greater than x0.");
          const its = [];
          const xs = [x0], ys = [y0];
          let x = x0, y = y0;
          its.push({ Iter: 0, x, y });

          while (x < xEnd - 1e-12) {
            const hStep = Math.min(h, xEnd - x);
            if (method === "euler") {
              const slope = f(x, y);
              y = y + hStep * slope;
            } else if (method === "heun") {
              const k1 = f(x, y);
              const k2 = f(x + hStep, y + hStep * k1);
              y = y + (hStep / 2) * (k1 + k2);
            } else if (method === "rk2") {
              const k1 = f(x, y);
              const k2 = f(x + hStep / 2, y + (hStep / 2) * k1);
              y = y + hStep * k2;
            } else if (method === "rk4") {
              const k1 = f(x, y);
              const k2 = f(x + hStep / 2, y + (hStep / 2) * k1);
              const k3 = f(x + hStep / 2, y + (hStep / 2) * k2);
              const k4 = f(x + hStep, y + hStep * k3);
              y = y + (hStep / 6) * (k1 + 2 * k2 + 2 * k3 + k4);
            } else if (method === "ab4") {
              // Bootstrap with RK4 for first 3 steps, then AB4
              const nNeeded = Math.ceil((xEnd - x0) / h);
              if (nNeeded < 4) throw new Error("Adams–Bashforth 4 needs at least 4 steps. Reduce h or increase interval.");
              // If we haven't bootstrapped 3 steps, use RK4
              if (xs.length < 4) {
                const k1 = f(x, y);
                const k2 = f(x + hStep / 2, y + (hStep / 2) * k1);
                const k3 = f(x + hStep / 2, y + (hStep / 2) * k2);
                const k4 = f(x + hStep, y + hStep * k3);
                y = y + (hStep / 6) * (k1 + 2 * k2 + 2 * k3 + k4);
              } else {
                const n = xs.length;
                const f_n = f(xs[n - 1], ys[n - 1]);
                const f_n1 = f(xs[n - 2], ys[n - 2]);
                const f_n2 = f(xs[n - 3], ys[n - 3]);
                const f_n3 = f(xs[n - 4], ys[n - 4]);
                y = y + (hStep / 24) * (55 * f_n - 59 * f_n1 + 37 * f_n2 - 9 * f_n3);
              }
            } else if (method === "beuler") {
              let yNew = y;
              let innerIter = 0;
              const maxInner = 100;
              for (let j = 0; j < maxInner; j++) {
                const yNext = y + hStep * f(x + hStep, yNew);
                innerIter = j + 1;
                if (Math.abs(yNext - yNew) < 1e-10) { yNew = yNext; break; }
                yNew = yNext;
              }
              y = yNew;
            }
            x = x + hStep;
            xs.push(x); ys.push(y);
            its.push({ Iter: its.length, x, y });
          }

          setResult({ its, finalX: x, finalY: y, steps: its.length - 1 });
        } catch (e) { setError(e.message || "Calculation error."); }
      }, [method, x0, y0, xEnd, h, f]);

      const solutionPts = useMemo(() => {
        if (!result) return [];
        return result.its.map((r) => ({ x: r.x, y: r.y }));
      }, [result]);

      const finalPoint = useMemo(() => {
        if (!result) return [];
        return [{ x: result.finalX, y: result.finalY, label: `y(${result.finalX.toFixed(2)}) ≈ ${result.finalY.toFixed(4)}` }];
      }, [result]);

      return (
        <div className="space-y-5 animate-fade-in">
          <div className="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-3">
            <div>
              <div className="flex items-center gap-2">
                <span className="text-[10px] font-extrabold uppercase tracking-[0.18em] text-indigo-500">Module 04</span>
                <span className="h-px w-8 bg-indigo-200" />
              </div>
              <h2 className="text-xl sm:text-2xl font-extrabold tracking-tight text-slate-900 mt-1">Ordinary Differential Equations</h2>
              <p className="text-xs text-slate-500 mt-1">Solve <span className="mono text-slate-700">dy/dx = f(x, y)</span> with explicit and implicit single-step schemes.</p>
            </div>
            <Tabs tabs={[{ key: "solver", label: "Solver" }, { key: "theory", label: "Theory" }, { key: "formula", label: "Formulas" }]} active={tab} onChange={setTab} />
          </div>

          {tab === "theory" && (
            <div className="grid sm:grid-cols-2 gap-3 animate-slide-up">
              {Object.entries(ODE_METHODS).map(([key, m]) => (
                <div key={key} className={`rounded-2xl border bg-white p-4 card-shadow transition-all hover:-translate-y-0.5 ${key === method ? "border-indigo-300 ring-2 ring-indigo-100" : "border-slate-200/80"}`}>
                  <div className="flex items-start justify-between gap-2">
                    <h3 className="text-sm font-bold text-slate-900">{m.short}</h3>
                    <span className="text-[9px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-md bg-indigo-50 text-indigo-600 ring-1 ring-indigo-100 whitespace-nowrap">{m.order}</span>
                  </div>
                  <p className="text-[11px] leading-relaxed text-slate-500 mt-2">{m.desc}</p>
                </div>
              ))}
            </div>
          )}

          {tab === "formula" && (
            <div className="grid sm:grid-cols-2 gap-3 animate-slide-up">
              {Object.entries(ODE_METHODS).map(([key, m]) => (
                <div key={key} className={`rounded-2xl border bg-white overflow-hidden card-shadow ${key === method ? "border-indigo-300 ring-2 ring-indigo-100" : "border-slate-200/80"}`}>
                  <div className="px-4 py-2 border-b border-slate-100 bg-slate-50/70"><span className="text-[10px] font-bold uppercase tracking-wider text-slate-600">{m.short}</span></div>
                  <div className="px-5 py-6 flex items-center justify-center text-slate-800 min-h-[74px]"><Tex display>{m.formula}</Tex></div>
                </div>
              ))}
            </div>
          )}

          {tab === "solver" && (
            <div className="grid lg:grid-cols-12 gap-4 animate-slide-up">
              <div className="lg:col-span-5 space-y-3">
                <div className="rounded-2xl border border-slate-200 bg-white p-4 card-shadow">
                  <div className="flex items-center gap-2 mb-3">
                    <div className="w-6 h-6 rounded-lg bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center">
                      <svg viewBox="0 0 24 24" className="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" strokeWidth="2.2"><path d="M3 17c3 0 3-10 6-10s3 10 6 10 3-6 6-6" /></svg>
                    </div>
                    <span className="text-[11px] font-extrabold uppercase tracking-widest text-slate-600">Configuration</span>
                  </div>
                  <div className="space-y-3">
                    <InputField label="Slope function f(x, y)" type="text" value={expr} onChange={setExpr} placeholder="e.g. x + y" hint="use x and y" />
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-600 mb-1.5">Method</label>
                      <select value={method} onChange={(e) => setMethod(e.target.value)} className="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs font-medium bg-white/70 focus:bg-white focus:outline-none focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-400 transition-all cursor-pointer">
                        {Object.entries(ODE_METHODS).map(([k, m]) => (<option key={k} value={k}>{m.label}</option>))}
                      </select>
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <InputField label="Initial x₀" value={x0} onChange={(v) => setX0(parseFloat(v) || 0)} step="0.1" />
                      <InputField label="Initial y₀" value={y0} onChange={(v) => setY0(parseFloat(v) || 0)} step="0.1" />
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <InputField label="End x" value={xEnd} onChange={(v) => setXEnd(parseFloat(v) || 1)} step="0.1" />
                      <InputField label="Step size h" value={h} onChange={(v) => setH(parseFloat(v) || 0.1)} step="0.01" />
                    </div>
                  </div>
                  <button onClick={solve} className="mt-4 w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold rounded-xl py-2.5 text-[11px] tracking-[0.14em] transition-all shadow-lg shadow-indigo-500/25 active:scale-[0.99]">
                    <span className="flex items-center justify-center gap-2">
                      <svg viewBox="0 0 24 24" className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"><path d="M5 3l14 9-14 9V3z" /></svg>
                      INTEGRATE ODE
                    </span>
                  </button>
                  {error && (<div className="mt-3 text-[11px] text-rose-700 bg-rose-50 border border-rose-200 rounded-xl p-3">⚠ {error}</div>)}
                </div>
                <div className="rounded-2xl border border-indigo-100 bg-gradient-to-br from-indigo-50/80 via-white to-violet-50/50 p-4 card-shadow">
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-[10px] font-extrabold uppercase tracking-widest text-indigo-500">Active Scheme</span>
                    <span className="text-[9px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-md bg-white text-indigo-600 ring-1 ring-indigo-100">{meta.order}</span>
                  </div>
                  <div className="text-[13px] font-bold text-slate-900">{meta.short}</div>
                  <p className="text-[11px] leading-relaxed text-slate-500 mt-2">{meta.desc}</p>
                </div>
              </div>
              <div className="lg:col-span-7 space-y-3">
                {result && (
                  <FunctionPlot title={`Solution y(x) for y′ = ${expr}`} subtitle={`${meta.short} · h = ${h}`} f={null} xMin={x0 - 0.1} xMax={xEnd + 0.1}
                    points={finalPoint}
                    extraSeries={[{ pts: solutionPts, color: "#4f46e5" }]} />
                )}
                {result ? (
                  <div className="space-y-3 animate-slide-up">
                    <div className="grid grid-cols-3 gap-2">
                      <StatTile label={`y(${result.finalX.toFixed(3)})`} value={result.finalY.toFixed(8)} accent="indigo" sub="final value" />
                      <StatTile label="Steps" value={result.steps} accent="sky" sub={`h = ${h}`} />
                      <StatTile label="Method" value={meta.short} accent="emerald" sub={meta.order} />
                    </div>
                    <ResultTable rows={result.its} title={`${meta.short} — Iteration Log`} filename={`${method}-ode.csv`} />
                  </div>
                ) : (
                  !error && (
                    <div className="rounded-2xl border border-dashed border-slate-300 bg-white/60 p-8 text-center">
                      <p className="text-xs font-semibold text-slate-600">No ODE solved yet</p>
                      <p className="text-[11px] text-slate-400 mt-1">Enter f(x, y) and initial data, then press <span className="font-bold text-indigo-600">Integrate ODE</span>.</p>
                    </div>
                  )
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

                  <p className="text-[10.5px] leading-relaxed text-slate-500">All four classical numerical analysis modules — root finding, linear systems, quadrature, and ODEs — in one reproducible lab.</p>
                </div>
              </div>
            </aside>
            <main className="md:col-span-9 min-w-0">
              {activeModule === "root" && <RootSolver />}
              {activeModule === "linear" && <LinearSolver />}
              {activeModule === "integ" && <IntegSolver />}
              {activeModule === "ode" && <ODESolver />}
            </main>
          </div>

          <footer className="mt-auto border-t border-slate-200/80 bg-white/70 backdrop-blur-xl">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-5">
              <div className="flex flex-col sm:flex-row items-center justify-between gap-3">
                <div className="flex items-center gap-2.5 order-2 sm:order-1">
                  <div className="w-7 h-7 rounded-lg bg-gradient-to-br from-indigo-600 to-violet-600 flex items-center justify-center shadow-sm"><span className="text-white text-xs font-extrabold leading-none">∇</span></div>
                  <p className="text-[11px] text-slate-500">© {new Date().getFullYear()} Numerical Lab Studio · 24 numerical methods across 4 modules</p>
                </div>
                <div className="flex items-center gap-2 order-1 sm:order-2 rounded-full border border-indigo-100 bg-indigo-50/70 pl-1.5 pr-4 py-1.5">
                  <span className="w-7 h-7 rounded-full bg-gradient-to-br from-indigo-500 to-violet-600 text-white text-[10px] font-extrabold flex items-center justify-center shadow-sm">MB</span>
                  <div className="leading-tight">
                    <div className="text-[8px] font-extrabold uppercase tracking-[0.16em] text-indigo-400">Developed by</div>
                    <div className="text-[11.5px] font-extrabold text-indigo-900">Dr Mahadev Biradar</div>
                  </div>
                </div>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
