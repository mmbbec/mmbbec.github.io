<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Advanced Numerical Methods Solver</title>

  <!-- Tailwind Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap"
    rel="stylesheet"
  />

  <!-- React 18 UMD (no bundler, no importmap needed) -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone: transpiles JSX in the browser -->
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

  <style>
    body { margin: 0; font-family: "Plus Jakarta Sans", system-ui, sans-serif; background: #f8fafc; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
    .serif { font-family: "Instrument Serif", serif; }
    canvas { display: block; }
    .boot {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      color: #64748b; font-size: 14px; letter-spacing: 0.2em;
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="boot">LOADING SOLVER…</div>
  </div>

  <script type="text/babel" data-presets="react">
    /* ---------------------------------------------------------------
       React UMD globals
       --------------------------------------------------------------- */
    const { useState, useMemo, useCallback, useEffect, useRef } = React;
    const { createRoot } = ReactDOM;

    /* ===============================================================
       1. MATH EXPRESSION PARSER
       =============================================================== */
    function compileUnary(expr) {
      const src = String(expr ?? "")
        .replace(/\^/g, "**")
        .replace(/\bln\b/gi, "log")
        .replace(/\b[eE]\b/g, "E");
      try {
        const fn = new Function("x", "Math", `with (Math) { return (${src}); }`);
        fn(0, Math);
        return (x) => {
          try {
            const v = fn(x, Math);
            return Number.isFinite(v) ? v : NaN;
          } catch { return NaN; }
        };
      } catch { return () => NaN; }
    }

    function compileBinary(expr) {
      const src = String(expr ?? "")
        .replace(/\^/g, "**")
        .replace(/\bln\b/gi, "log")
        .replace(/\b[eE]\b/g, "E");
      try {
        const fn = new Function("x", "y", "Math", `with (Math) { return (${src}); }`);
        fn(0, 0, Math);
        return (x, y) => {
          try {
            const v = fn(x, y, Math);
            return Number.isFinite(v) ? v : NaN;
          } catch { return NaN; }
        };
      } catch { return () => NaN; }
    }

    /* ===============================================================
       2. SHARED UI COMPONENTS
       =============================================================== */
    function Tabs({ tabs, active, onChange }) {
      return (
        <div className="flex gap-2">
          {tabs.map((t) => (
            <button
              key={t}
              onClick={() => onChange(t)}
              className={`px-4 py-1.5 rounded-full text-[11px] font-bold tracking-widest border transition ${
                active === t
                  ? "bg-slate-900 text-white border-slate-900"
                  : "bg-white text-slate-500 border-slate-200 hover:border-indigo-200"
              }`}
            >
              {t.toUpperCase()}
            </button>
          ))}
        </div>
      );
    }

    function StepCard({ label, children }) {
      return (
        <div className="rounded-xl border border-slate-200 bg-white p-4">
          <div className="text-[11px] font-bold tracking-widest text-slate-500 uppercase">{label}</div>
          <div className="mt-2 text-[13px] leading-6 text-slate-700">{children}</div>
        </div>
      );
    }

    function ErrorBanner({ msg }) {
      if (!msg) return null;
      return (
        <div className="text-[12px] text-red-600 bg-red-50 border border-red-200 rounded-lg p-2.5 mt-2">
          ⚠ {msg}
        </div>
      );
    }

    function InputField({ label, value, onChange, step, type = "number" }) {
      return (
        <div>
          <label className="block text-[11px] font-medium text-slate-600 mb-1">{label}</label>
          <input
            type={type}
            step={step}
            value={value}
            onChange={(e) => onChange(e.target.value)}
            className="w-full border border-slate-200 rounded-lg px-2.5 py-1.5 text-sm mono focus:outline-none focus:border-indigo-400"
          />
        </div>
      );
    }

    function NumCell({ v }) {
      if (typeof v !== "number") return <span>{String(v)}</span>;
      if (!Number.isFinite(v)) return <span className="text-red-500">NaN</span>;
      const a = Math.abs(v);
      if (a !== 0 && (a < 1e-4 || a > 1e4)) return <span>{v.toExponential(4)}</span>;
      return <span>{v.toFixed(6)}</span>;
    }

    function ResultTable({ rows }) {
      if (!rows || rows.length === 0) return null;
      const keys = Object.keys(rows[0]);
      return (
        <div className="overflow-auto rounded-xl border border-slate-200 bg-white">
          <table className="w-full text-[11px] border-collapse">
            <thead>
              <tr className="bg-slate-50">
                {keys.map((k) => (
                  <th key={k} className="border-b border-slate-200 px-2 py-1.5 text-left font-bold text-slate-600 mono">
                    {k}
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              {rows.map((r, i) => (
                <tr key={i} className={i % 2 ? "bg-slate-50/50" : "bg-white"}>
                  {keys.map((k) => (
                    <td key={k} className="border-b border-slate-100 px-2 py-1 mono text-slate-700">
                      <NumCell v={r[k]} />
                    </td>
                  ))}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    /* ===============================================================
       3. CANVAS PLOTTER
       =============================================================== */
    function FunctionPlot({
      title, f, xMin, xMax,
      points = [], extraSeries = [],
      shade = false, height = 280, stepLabel,
    }) {
      const ref = useRef(null);

      useEffect(() => {
        const canvas = ref.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        if (!ctx) return;

        const dpr = window.devicePixelRatio || 1;
        const W = canvas.clientWidth || 400;
        const H = height;
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        canvas.style.width = W + "px";
        canvas.style.height = H + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const ys = [];
        if (f) {
          for (let i = 0; i <= 300; i++) {
            const x = xMin + (i / 300) * (xMax - xMin);
            const y = f(x);
            if (Number.isFinite(y)) ys.push(y);
          }
        }
        points.forEach((p) => Number.isFinite(p.y) && ys.push(p.y));
        extraSeries.forEach((s) => s.pts.forEach((p) => Number.isFinite(p.y) && ys.push(p.y)));

        let yMin = ys.length ? Math.min(...ys) : -1;
        let yMax = ys.length ? Math.max(...ys) : 1;
        if (yMin === yMax) { yMin -= 1; yMax += 1; }
        const pad = (yMax - yMin) * 0.15 || 1;
        yMin -= pad;
        yMax += pad;

        const mapX = (x) => ((x - xMin) / (xMax - xMin)) * (W - 40) + 30;
        const mapY = (y) => H - 30 - ((y - yMin) / (yMax - yMin)) * (H - 60);

        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, W, H);

        ctx.strokeStyle = "#eef2ff";
        ctx.lineWidth = 1;
        for (let i = 0; i <= 6; i++) {
          const y = 20 + (i / 6) * (H - 60);
          ctx.beginPath(); ctx.moveTo(30, y); ctx.lineTo(W - 10, y); ctx.stroke();
        }
        for (let i = 0; i <= 8; i++) {
          const x = 30 + (i / 8) * (W - 40);
          ctx.beginPath(); ctx.moveTo(x, 20); ctx.lineTo(x, H - 30); ctx.stroke();
        }

        ctx.strokeStyle = "#94a3b8";
        ctx.lineWidth = 1.2;
        if (yMin <= 0 && 0 <= yMax) {
          const y = mapY(0);
          ctx.beginPath(); ctx.moveTo(30, y); ctx.lineTo(W - 10, y); ctx.stroke();
        }
        if (xMin <= 0 && 0 <= xMax) {
          const x = mapX(0);
          ctx.beginPath(); ctx.moveTo(x, 20); ctx.lineTo(x, H - 30); ctx.stroke();
        }

        if (f && shade) {
          ctx.beginPath();
          ctx.moveTo(mapX(xMin), mapY(0));
          for (let i = 0; i <= 400; i++) {
            const x = xMin + (i / 400) * (xMax - xMin);
            const y = f(x);
            if (Number.isFinite(y)) ctx.lineTo(mapX(x), mapY(y));
          }
          ctx.lineTo(mapX(xMax), mapY(0));
          ctx.closePath();
          ctx.fillStyle = "rgba(99,102,241,0.15)";
          ctx.fill();
        }

        extraSeries.forEach((s) => {
          ctx.beginPath();
          ctx.strokeStyle = s.color || "#6366f1";
          ctx.lineWidth = 1.8;
          let started = false;
          s.pts.forEach((p) => {
            if (!Number.isFinite(p.x) || !Number.isFinite(p.y)) { started = false; return; }
            const px = mapX(p.x), py = mapY(p.y);
            if (!started) { ctx.moveTo(px, py); started = true; }
            else ctx.lineTo(px, py);
          });
          ctx.stroke();
        });

        if (f) {
          ctx.beginPath();
          ctx.strokeStyle = "#0f172a";
          ctx.lineWidth = 2;
          let started = false;
          for (let i = 0; i <= 400; i++) {
            const x = xMin + (i / 400) * (xMax - xMin);
            const y = f(x);
            if (!Number.isFinite(y)) { started = false; continue; }
            const px = mapX(x), py = mapY(y);
            if (!started) { ctx.moveTo(px, py); started = true; }
            else ctx.lineTo(px, py);
          }
          ctx.stroke();
        }

        points.forEach((p) => {
          if (!Number.isFinite(p.x) || !Number.isFinite(p.y)) return;
          const px = mapX(p.x), py = mapY(p.y);
          ctx.beginPath();
          ctx.fillStyle = "#6366f1";
          ctx.arc(px, py, 5, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "#fff";
          ctx.lineWidth = 2;
          ctx.stroke();
          if (p.label) {
            ctx.fillStyle = "#0f172a";
            ctx.font = "11px ui-monospace, monospace";
            ctx.fillText(p.label, px + 6, py - 6);
          }
        });

        ctx.fillStyle = "#64748b";
        ctx.font = "11px ui-sans-serif, system-ui";
        ctx.fillText(xMin.toFixed(2), 30, H - 10);
        ctx.fillText(xMax.toFixed(2), W - 50, H - 10);
        ctx.fillText(yMax.toFixed(2), 2, 28);
        ctx.fillText(yMin.toFixed(2), 2, H - 32);
      }, [f, xMin, xMax, points, extraSeries, shade, height]);

      return (
        <div>
          {stepLabel && (
            <div className="text-[11px] font-bold tracking-widest text-slate-500 uppercase mb-1">
              {stepLabel}
            </div>
          )}
          <div className="rounded-xl border border-slate-200 bg-white overflow-hidden">
            <div className="px-4 py-2 border-b border-slate-100 flex justify-between items-center">
              <span className="text-[11px] font-bold tracking-widest text-slate-500 uppercase">{title}</span>
              <span className="text-[10px] text-slate-400">canvas 2D · sampled</span>
            </div>
            <canvas ref={ref} aria-label={title} className="block" />
          </div>
        </div>
      );
    }

    /* ===============================================================
       4. ROOT FINDING
       =============================================================== */
    function RootSolver() {
      const [expr, setExpr] = useState("x^3 - x - 2");
      const [method, setMethod] = useState("bisection");
      const [a, setA] = useState(1);
      const [b, setB] = useState(2);
      const [x0, setX0] = useState(1.5);
      const [x1, setX1] = useState(2);
      const [gExpr, setGExpr] = useState("(x + 2)^(1/3)");
      const [tol, setTol] = useState(1e-4);
      const [maxIter, setMaxIter] = useState(50);
      const [tab, setTab] = useState("solver");
      const [result, setResult] = useState(null);
      const [error, setError] = useState("");

      const f = useMemo(() => compileUnary(expr), [expr]);

      const solve = useCallback(() => {
        setError("");
        setResult(null);
        const its = [];
        let root = null, lastErr = 0;

        try {
          if (method === "bisection") {
            let lo = a, hi = b;
            let flo = f(lo), fhi = f(hi);
            if (!Number.isFinite(flo) || !Number.isFinite(fhi)) throw new Error("f(a) or f(b) is not finite");
            if (flo * fhi > 0) throw new Error(`f(a)·f(b) = ${(flo * fhi).toExponential(3)} > 0 — no sign change on [a, b]`);
            let prev = null;
            for (let k = 0; k < maxIter; k++) {
              const mid = (lo + hi) / 2;
              const fmid = f(mid);
              const err = prev === null ? Math.abs(fmid) : Math.abs(mid - prev);
              its.push({ k, a: lo, b: hi, m: mid, "f(m)": fmid, err });
              root = mid; lastErr = err;
              if (Math.abs(fmid) < tol || (prev !== null && err < tol)) break;
              if (flo * fmid <= 0) { hi = mid; fhi = fmid; }
              else { lo = mid; flo = fmid; }
              prev = mid;
            }
          } else if (method === "newton") {
            const h = 1e-7;
            const df = (x) => (f(x + h) - f(x - h)) / (2 * h);
            let x = x0;
            for (let k = 0; k < maxIter; k++) {
              const fx = f(x);
              const dfx = df(x);
              if (Math.abs(dfx) < 1e-14) throw new Error("f'(x) ≈ 0 — Newton cannot proceed");
              const xn = x - fx / dfx;
              const err = Math.abs(xn - x);
              its.push({ k, x, "f(x)": fx, "f'(x)": dfx, "x_next": xn, err });
              x = xn; root = xn; lastErr = err;
              if (err < tol || Math.abs(fx) < tol) break;
            }
          } else if (method === "secant") {
            let xp = x0, xc = x1;
            for (let k = 0; k < maxIter; k++) {
              const fp = f(xp), fc = f(xc);
              if (Math.abs(fc - fp) < 1e-14) throw new Error("Secant denominator ≈ 0");
              const xn = xc - (fc * (xc - xp)) / (fc - fp);
              const err = Math.abs(xn - xc);
              its.push({ k, x_prev: xp, x_curr: xc, "f(x_curr)": fc, x_next: xn, err });
              xp = xc; xc = xn;
              root = xn; lastErr = err;
              if (err < tol) break;
            }
          } else if (method === "regula") {
            let lo = a, hi = b;
            let flo = f(lo), fhi = f(hi);
            if (flo * fhi > 0) throw new Error("No bracket — f(a)·f(b) > 0");
            let prev = null;
            for (let k = 0; k < maxIter; k++) {
              const c = (lo * fhi - hi * flo) / (fhi - flo);
              const fc = f(c);
              const err = prev === null ? Math.abs(fc) : Math.abs(c - prev);
              its.push({ k, a: lo, b: hi, c, "f(c)": fc, err });
              prev = c; root = c; lastErr = err;
              if (Math.abs(fc) < tol || err < tol) break;
              if (flo * fc < 0) { hi = c; fhi = fc; }
              else { lo = c; flo = fc; }
            }
          } else if (method === "fixed") {
            const g = compileUnary(gExpr);
            let x = x0;
            for (let k = 0; k < maxIter; k++) {
              const gx = g(x);
              if (!Number.isFinite(gx)) throw new Error("g(x) diverged (returned non-finite)");
              const err = Math.abs(gx - x);
              its.push({ k, x_n: x, "g(x_n)": gx, err });
              x = gx; root = gx; lastErr = err;
              if (err < tol) break;
            }
          }
          setResult({ iterations: its, root, lastErr, method });
        } catch (e) {
          setError(e.message || "Error");
        }
      }, [method, a, b, x0, x1, gExpr, tol, maxIter, f]);

      const initText =
        method === "newton" ? `x₀ = ${x0}`
        : method === "secant" ? `x₀ = ${x0}, x₁ = ${x1}`
        : method === "fixed" ? `x₀ = ${x0}, g(x) = ${gExpr}`
        : `a = ${a}, b = ${b}, f(a) = ${f(a).toFixed(5)}, f(b) = ${f(b).toFixed(5)}`;

      const plotXMin = method === "bisection" || method === "regula" ? Math.min(a, b) - 1 : x0 - 3;
      const plotXMax = method === "bisection" || method === "regula" ? Math.max(a, b) + 1 : x0 + 3;

      return (
        <div className="space-y-4">
          <Tabs tabs={["theory", "formula", "solver"]} active={tab} onChange={setTab} />

          {tab === "theory" && (
            <div className="rounded-xl border border-slate-200 bg-white p-6 text-[13px] leading-6 text-slate-700">
              <h3 className="font-bold text-slate-900 mb-2 text-[15px]">Root Finding — Purpose</h3>
              <p>Find x such that f(x) = 0. Different methods suit different situations:</p>
              <ul className="list-disc ml-5 mt-3 space-y-1">
                <li><b>Bisection</b> — linear convergence, guaranteed if f(a)·f(b) &lt; 0.</li>
                <li><b>Newton-Raphson</b> — quadratic near a simple root, requires derivative.</li>
                <li><b>Secant</b> — superlinear (≈1.618), no derivative needed.</li>
                <li><b>Regula Falsi</b> — guaranteed (bracket preserved), slower than secant.</li>
                <li><b>Fixed-Point</b> — needs |g′| &lt; 1 near the root for convergence.</li>
              </ul>
            </div>
          )}

          {tab === "formula" && (
            <div className="rounded-xl border border-slate-200 bg-white p-6 mono text-[12px] text-slate-800 space-y-1.5">
              <div>Bisection: m = (a + b)/2, err = |m − m_prev|</div>
              <div>Newton: x_(n+1) = x_n − f(x_n) / f′(x_n)</div>
              <div>Secant: x_(n+1) = x_n − f_n·(x_n − x_(n−1)) / (f_n − f_(n−1))</div>
              <div>Regula Falsi: c = (a·f(b) − b·f(a)) / (f(b) − f(a))</div>
              <div>Fixed-Point: x_(n+1) = g(x_n)</div>
            </div>
          )}

          {tab === "solver" && (
            <>
              <div className="grid lg:grid-cols-2 gap-4">
                <div className="rounded-xl border border-slate-200 bg-white p-4 space-y-3">
                  <div className="text-[11px] font-bold tracking-widest text-slate-500 uppercase">Inputs</div>
                  <InputField label="f(x)" type="text" value={expr} onChange={setExpr} />
                  <div>
                    <label className="block text-[11px] font-medium text-slate-600 mb-1">Method</label>
                    <select value={method} onChange={(e) => setMethod(e.target.value)}
                      className="w-full border border-slate-200 rounded-lg px-2.5 py-1.5 text-sm">
                      <option value="bisection">Bisection</option>
                      <option value="newton">Newton-Raphson</option>
                      <option value="secant">Secant</option>
                      <option value="regula">Regula Falsi</option>
                      <option value="fixed">Fixed-Point</option>
                    </select>
                  </div>
                  {(method === "bisection" || method === "regula") && (
                    <div className="grid grid-cols-2 gap-2">
                      <InputField label="a" value={a} onChange={(v) => setA(parseFloat(v) || 0)} />
                      <InputField label="b" value={b} onChange={(v) => setB(parseFloat(v) || 0)} />
                    </div>
                  )}
                  {(method === "newton" || method === "fixed") && (
                    <InputField label="x₀" value={x0} onChange={(v) => setX0(parseFloat(v) || 0)} />
                  )}
                  {method === "secant" && (
                    <div className="grid grid-cols-2 gap-2">
                      <InputField label="x₀" value={x0} onChange={(v) => setX0(parseFloat(v) || 0)} />
                      <InputField label="x₁" value={x1} onChange={(v) => setX1(parseFloat(v) || 0)} />
                    </div>
                  )}
                  {method === "fixed" && (
                    <InputField label="g(x)" type="text" value={gExpr} onChange={setGExpr} />
                  )}
                  <div className="grid grid-cols-2 gap-2">
                    <InputField label="Tolerance ε" value={tol} onChange={(v) => setTol(parseFloat(v) || 1e-4)} step="0.00001" />
                    <InputField label="Max iterations" value={maxIter} onChange={(v) => setMaxIter(parseInt(v) || 50)} />
                  </div>
                  <button onClick={solve}
                    className="w-full bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg py-2.5 text-sm font-bold transition">
                    SOLVE
                  </button>
                  <ErrorBanner msg={error} />
                </div>

                <div className="space-y-3">
                  <FunctionPlot
                    title={`y = ${expr}`}
                    stepLabel="Step 5 — Graph"
                    f={f}
                    xMin={plotXMin}
                    xMax={plotXMax}
                    points={result?.root != null && Number.isFinite(f(result.root))
                      ? [{ x: result.root, y: f(result.root), label: `root ≈ ${result.root.toFixed(5)}` }]
                      : []}
                  />
                  {result && (
                    <div className="rounded-xl border border-slate-200 bg-white p-4">
                      <div className="text-[11px] font-bold tracking-widest text-slate-500 uppercase mb-2">
                        Step 8 — Final Answer
                      </div>
                      <div className="text-sm">
                        Root ≈ <b className="mono">{result.root?.toFixed(8)}</b>, iterations {result.iterations.length},
                        last error <span className="mono">{result.lastErr?.toExponential(3)}</span>
                      </div>
                    </div>
                  )}
                </div>
              </div>

              {result && (
                <div className="space-y-3 mt-2">
                  <StepCard label="Step 1 — Problem Restatement">
                    Find root of f(x) = <span className="mono">{expr}</span> using {method}. Initialization: {initText}, tol = {tol}.
                  </StepCard>
                  <StepCard label="Step 2 — Method + Formula">
                    Chosen because{" "}
                    {method === "bisection" ? "it guarantees a bracket."
                      : method === "newton" ? "of quadratic convergence near simple roots."
                      : method === "secant" ? "it needs no derivative."
                      : method === "regula" ? "it keeps the bracket while using a secant line."
                      : "x = g(x) makes fixed-point iteration possible."}
                  </StepCard>
                  <StepCard label="Step 3 — Initialization">{initText}</StepCard>
                  <div>
                    <div className="text-[11px] font-bold tracking-widest text-slate-500 uppercase mb-1">
                      Step 4 — Iteration Table
                    </div>
                    <ResultTable rows={result.iterations} />
                  </div>
                  <div className="grid md:grid-cols-2 gap-3">
                    <StepCard label="Step 6 — Error & Stopping">
                      |x_n − x_(n−1)| &lt; ε = {tol}. Achieved error {result.lastErr?.toExponential(4)}.
                    </StepCard>
                    <StepCard label="Step 7 — Verification">
                      Residual f(root) = <span className="mono">{f(result.root).toExponential(6)}</span> ≈ 0 → valid.
                    </StepCard>
                  </div>
                </div>
              )}
            </>
          )}
        </div>
      );
    }

    /* ===============================================================
       5. LINEAR SYSTEMS
       =============================================================== */
    function LinearSolver() {
      const [size, setSize] = useState(2);
      const [A, setA] = useState([[4, 1], [1, 3]]);
      const [b, setB] = useState([1, 2]);
      const [method, setMethod] = useState("gauss");
      const [x0, setX0] = useState([0, 0]);
      const [tol, setTol] = useState(1e-6);
      const [maxIter, setMaxIter] = useState(100);
      const [tab, setTab] = useState("solver");
      const [result, setResult] = useState(null);
      const [error, setError] = useState("");

      useEffect(() => {
        const newA = Array.from({ length: size }, (_, i) =>
          Array.from({ length: size }, (_, j) => (A[i]?.[j] ?? (i === j ? 4 : 1)))
        );
        const newB = Array.from({ length: size }, (_, i) => b[i] ?? 1);
        const newX0 = Array.from({ length: size }, (_, i) => x0[i] ?? 0);
        setA(newA);
        setB(newB);
        setX0(newX0);
      }, [size]);

      const solve = useCallback(() => {
        setError("");
        setResult(null);
        try {
          if (method === "gauss") {
            const aug = A.map((row, i) => [...row, b[i]]);
            const steps = [];
            for (let i = 0; i < size; i++) {
              let pivot = i;
              for (let r = i + 1; r < size; r++)
                if (Math.abs(aug[r][i]) > Math.abs(aug[pivot][i])) pivot = r;
              if (Math.abs(aug[pivot][i]) < 1e-12) throw new Error("Singular matrix");
              [aug[i], aug[pivot]] = [aug[pivot], aug[i]];
              for (let r = i + 1; r < size; r++) {
                const factor = aug[r][i] / aug[i][i];
                for (let c = i; c <= size; c++) aug[r][c] -= factor * aug[i][c];
              }
              steps.push(aug.map((row) => [...row]));
            }
            const x = Array(size).fill(0);
            for (let i = size - 1; i >= 0; i--) {
              let s = aug[i][size];
              for (let j = i + 1; j < size; j++) s -= aug[i][j] * x[j];
              x[i] = s / aug[i][i];
            }
            setResult({ x, steps, method });
          } else if (method === "jordan") {
            const M = A.map((row, i) => [...row, b[i]]);
            for (let i = 0; i < size; i++) {
              let pivot = i;
              for (let r = i; r < size; r++)
                if (Math.abs(M[r][i]) > Math.abs(M[pivot][i])) pivot = r;
              [M[i], M[pivot]] = [M[pivot], M[i]];
              const piv = M[i][i];
              if (Math.abs(piv) < 1e-12) throw new Error("Singular matrix");
              for (let c = i; c <= size; c++) M[i][c] /= piv;
              for (let r = 0; r < size; r++) {
                if (r === i) continue;
                const f = M[r][i];
                for (let c = i; c <= size; c++) M[r][c] -= f * M[i][c];
              }
            }
            setResult({ x: M.map((row) => row[size]), steps: [M], method });
          } else if (method === "lu") {
            const L = Array.from({ length: size }, () => Array(size).fill(0));
            const U = Array.from({ length: size }, () => Array(size).fill(0));
            for (let i = 0; i < size; i++) {
              for (let j = i; j < size; j++) {
                let s = 0;
                for (let k = 0; k < i; k++) s += L[i][k] * U[k][j];
                U[i][j] = A[i][j] - s;
              }
              L[i][i] = 1;
              for (let j = i + 1; j < size; j++) {
                let s = 0;
                for (let k = 0; k < i; k++) s += L[j][k] * U[k][i];
                if (Math.abs(U[i][i]) < 1e-12) throw new Error("LU pivot is zero — try reordering");
                L[j][i] = (A[j][i] - s) / U[i][i];
              }
            }
            const yv = Array(size).fill(0);
            for (let i = 0; i < size; i++) {
              let s = 0;
              for (let k = 0; k < i; k++) s += L[i][k] * yv[k];
              yv[i] = b[i] - s;
            }
            const x = Array(size).fill(0);
            for (let i = size - 1; i >= 0; i--) {
              let s = 0;
              for (let k = i + 1; k < size; k++) s += U[i][k] * x[k];
              x[i] = (yv[i] - s) / U[i][i];
            }
            setResult({ x, L, U, method });
          } else if (method === "cholesky") {
            const L = Array.from({ length: size }, () => Array(size).fill(0));
            for (let i = 0; i < size; i++) {
              for (let j = 0; j <= i; j++) {
                let s = 0;
                for (let k = 0; k < j; k++) s += L[i][k] * L[j][k];
                if (i === j) {
                  const d = A[i][i] - s;
                  if (d <= 0) throw new Error("Matrix is not positive-definite");
                  L[i][j] = Math.sqrt(d);
                } else {
                  L[i][j] = (A[i][j] - s) / L[j][j];
                }
              }
            }
            const yv = Array(size).fill(0);
            for (let i = 0; i < size; i++) {
              let s = 0;
              for (let k = 0; k < i; k++) s += L[i][k] * yv[k];
              yv[i] = (b[i] - s) / L[i][i];
            }
            const x = Array(size).fill(0);
            for (let i = size - 1; i >= 0; i--) {
              let s = 0;
              for (let k = i + 1; k < size; k++) s += L[k][i] * x[k];
              x[i] = (yv[i] - s) / L[i][i];
            }
            setResult({ x, L, method });
          } else if (method === "jacobi" || method === "seidel") {
            for (let i = 0; i < size; i++)
              if (Math.abs(A[i][i]) < 1e-14) throw new Error(`Zero diagonal at row ${i}`);
            let strictlyDiag = true;
            for (let i = 0; i < size; i++) {
              let sum = 0;
              for (let j = 0; j < size; j++) if (j !== i) sum += Math.abs(A[i][j]);
              if (Math.abs(A[i][i]) <= sum) strictlyDiag = false;
            }
            let x = [...x0];
            const its = [];
            for (let k = 0; k < maxIter; k++) {
              const nx = Array(size).fill(0);
              for (let i = 0; i < size; i++) {
                let s = 0;
                for (let j = 0; j < size; j++) {
                  if (j === i) continue;
                  s += A[i][j] * (method === "seidel" && j < i ? nx[j] : x[j]);
                }
                nx[i] = (b[i] - s) / A[i][i];
              }
              const err = Math.max(...nx.map((v, i) => Math.abs(v - x[i])));
              its.push({ k, x: [...nx], err });
              x = nx;
              if (err < tol) break;
            }
            setResult({ x, its, method, diagonallyDominant: strictlyDiag });
          }
        } catch (e) {
          setError(e.message || "Error");
        }
      }, [A, b, size, method, x0, tol, maxIter]);

      const updateA = (i, j, v) => {
        const n = parseFloat(v); if (Number.isNaN(n)) return;
        const copy = A.map((row) => [...row]); copy[i][j] = n; setA(copy);
      };
      const updateB = (i, v) => {
        const n = parseFloat(v); if (Number.isNaN(n)) return;
        const copy = [...b]; copy[i] = n; setB(copy);
      };
      const updateX0 = (i, v) => {
        const n = parseFloat(v); if (Number.isNaN(n)) return;
        const copy = [...x0]; copy[i] = n; setX0(copy);
      };

      const plotSeries = useMemo(() => {
        if (size !== 2) return [];
        const s1 = [], s2 = [];
        for (let i = 0; i < 200; i++) {
          const xv = -5 + i * 0.05;
          const y1 = Math.abs(A[0][1]) < 1e-12 ? NaN : (b[0] - A[0][0] * xv) / A[0][1];
          const y2 = Math.abs(A[1][1]) < 1e-12 ? NaN : (b[1] - A[1][0] * xv) / A[1][1];
          s1.push({ x: xv, y: y1 });
          s2.push({ x: xv, y: y2 });
        }
        return [
          { pts: s1, color: "#6366f1" },
          { pts: s2, color: "#f59e0b" },
        ];
      }, [A, b, size]);

      return (
        <div className="space-y-4">
          <Tabs tabs={["theory", "formula", "solver"]} active={tab} onChange={setTab} />

          {tab === "theory" && (
            <div className="rounded-xl border border-slate-200 bg-white p-6 text-[13px] leading-6 text-slate-700">
              <h3 className="font-bold text-slate-900 mb-2 text-[15px]">Linear Systems</h3>
              <p>Solve A·x = b. Direct: Gauss, Gauss-Jordan, LU, Cholesky. Iterative: Jacobi, Gauss-Seidel — converge if strictly diagonally dominant.</p>
            </div>
          )}

          {tab === "formula" && (
            <div className="rounded-xl border border-slate-200 bg-white p-6 mono text-[12px] text-slate-800 space-y-1.5">
              <div>Gauss: factor = a_ik / a_kk</div>
              <div>LU (Doolittle): A = L·U</div>
              <div>Cholesky: A = L·Lᵀ (SPD)</div>
              <div>Jacobi: x_i^(k+1) = (b_i − Σ_(j≠i) a_ij·x_j^(k)) / a_ii</div>
              <div>Seidel: uses latest x_j^(k+1) for j &lt; i</div>
            </div>
          )}

          {tab === "solver" && (
            <>
              <div className="grid lg:grid-cols-2 gap-4">
                <div className="rounded-xl border border-slate-200 bg-white p-4 space-y-3">
                  <div className="flex gap-2 items-center flex-wrap">
                    <span className="text-[11px] font-bold">Size:</span>
                    <select value={size} onChange={(e) => setSize(parseInt(e.target.value))}
                      className="border border-slate-200 rounded px-2 py-1 text-sm">
                      {[2, 3, 4].map((n) => <option key={n} value={n}>{n}×{n}</option>)}
                    </select>
                    <select value={method} onChange={(e) => setMethod(e.target.value)}
                      className="border border-slate-200 rounded px-2 py-1 text-sm">
                      <option value="gauss">Gaussian</option>
                      <option value="jordan">Gauss-Jordan</option>
                      <option value="lu">LU</option>
                      <option value="cholesky">Cholesky</option>
                      <option value="jacobi">Jacobi</option>
                      <option value="seidel">Gauss-Seidel</option>
                    </select>
                  </div>

                  <div>
                    <div className="text-[11px] font-bold tracking-widest text-slate-500 uppercase mb-1">Matrix A</div>
                    <div className="grid gap-1" style={{ gridTemplateColumns: `repeat(${size}, minmax(0,1fr))` }}>
                      {A.map((row, i) => row.map((val, j) => (
                        <input key={`${i}-${j}`} type="number" step="0.1" value={val}
                          onChange={(e) => updateA(i, j, e.target.value)}
                          className="border border-slate-200 rounded px-2 py-1.5 text-sm mono" />
                      )))}
                    </div>
                  </div>

                  <div>
                    <div className="text-[11px] font-bold tracking-widest text-slate-500 uppercase mb-1">Vector b</div>
                    <div className="flex gap-1">
                      {b.map((val, i) => (
                        <input key={i} type="number" step="0.1" value={val}
                          onChange={(e) => updateB(i, e.target.value)}
                          className="border border-slate-200 rounded px-2 py-1.5 text-sm mono w-full" />
                      ))}
                    </div>
                  </div>

                  {(method === "jacobi" || method === "seidel") && (
                    <div className="space-y-2">
                      <div className="text-[11px] font-bold tracking-widest text-slate-500 uppercase">Initial x₀</div>
                      <div className="flex gap-1">
                        {x0.map((val, i) => (
                          <input key={i} type="number" value={val}
                            onChange={(e) => updateX0(i, e.target.value)}
                            className="border border-slate-200 rounded px-2 py-1.5 text-sm mono w-full" />
                        ))}
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <InputField label="Tolerance" value={tol} onChange={(v) => setTol(parseFloat(v) || 1e-6)} step="0.000001" />
                        <InputField label="Max iter" value={maxIter} onChange={(v) => setMaxIter(parseInt(v) || 100)} />
                      </div>
                    </div>
                  )}

                  <button onClick={solve}
                    className="w-full bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg py-2.5 text-sm font-bold transition">
                    SOLVE
                  </button>
                  <ErrorBanner msg={error} />
                </div>

                <div className="space-y-3">
                  {size === 2 && (
                    <FunctionPlot
                      title="Lines A·x = b"
                      stepLabel="Step 5 — Graph"
                      xMin={-5} xMax={5}
                      extraSeries={plotSeries}
                      points={result?.x ? [{ x: result.x[0], y: result.x[1], label: `(${result.x[0].toFixed(2)}, ${result.x[1].toFixed(2)})` }] : []}
                    />
                  )}
                  {result && (
                    <div className="rounded-xl border border-slate-200 bg-white p-4">
                      <div className="text-[11px] font-bold tracking-widest text-slate-500 uppercase mb-2">
                        Step 8 — Final Answer
                      </div>
                      <div className="text-sm mono">x = [{result.x.map((v) => v.toFixed(6)).join(", ")}]</div>
                      {result.diagonallyDominant !== undefined && (
                        <div className="text-[11px] mt-1 text-slate-600">
                          Diagonal dominance: {result.diagonallyDominant ? "✓ satisfied" : "✗ not satisfied"}
                        </div>
                      )}
                    </div>
                  )}
                </div>
              </div>

              {result && (
                <div className="space-y-3">
                  <StepCard label="Step 1 — Problem Restatement">
                    Solve a {size}×{size} system using {method}.
                  </StepCard>
                  {result.its && (
                    <div>
                      <div className="text-[11px] font-bold tracking-widest text-slate-500 uppercase mb-1">
                        Step 4 — Iteration Table
                      </div>
                      <ResultTable rows={result.its.map((r) => ({
                        k: r.k,
                        x: r.x.map((v) => v.toFixed(6)).join(", "),
                        err: r.err,
                      }))} />
                    </div>
                  )}
                  {result.L && (
                    <StepCard label="Step 4 — LU Factors">
                      <div className="mono text-[11px]">L = {JSON.stringify(result.L)}</div>
                      {result.U && <div className="mono text-[11px]">U = {JSON.stringify(result.U)}</div>}
                    </StepCard>
                  )}
                  <StepCard label="Step 7 — Verification">
                    Residual ‖Ax − b‖ ={" "}
                    <span className="mono">
                      {Math.sqrt(result.x.reduce((sum, xi, i) => {
                        const Axi = A[i].reduce((s, aij, j) => s + aij * result.x[j], 0);
                        return sum + (Axi - b[i]) ** 2;
                      }, 0)).toExponential(4)}
                    </span>
                  </StepCard>
                </div>
              )}
            </>
          )}
        </div>
      );
    }

    /* ===============================================================
       6. INTERPOLATION
       =============================================================== */
    function InterpolationSolver() {
      const [dataStr, setDataStr] = useState("0,1;1,2;2,1;3,2.5");
      const [xp, setXp] = useState(1.5);
      const [method, setMethod] = useState("lagrange");
      const [tab, setTab] = useState("solver");
      const [result, setResult] = useState(null);
      const [error, setError] = useState("");

      const points = useMemo(() => {
        return dataStr.split(";").map((s) => s.trim()).filter(Boolean)
          .map((pair) => {
            const [x, y] = pair.split(",").map(Number);
            return { x, y };
          })
          .filter((p) => Number.isFinite(p.x) && Number.isFinite(p.y))
          .sort((a, b) => a.x - b.x);
      }, [dataStr]);

      const compute = useCallback(() => {
        setError("");
        setResult(null);
        try {
          if (points.length < 2) throw new Error("Need at least 2 points");
          const xs = points.map((p) => p.x);
          const ys = points.map((p) => p.y);
          const n = points.length;
          let yp = NaN;
          let extra = {};

          if (method === "lagrange" || method === "divdiff") {
            const table = Array.from({ length: n }, () => Array(n).fill(0));
            for (let i = 0; i < n; i++) table[i][0] = ys[i];
            for (let j = 1; j < n; j++)
              for (let i = 0; i < n - j; i++)
                table[i][j] = (table[i + 1][j - 1] - table[i][j - 1]) / (xs[i + j] - xs[i]);
            let v = table[0][0], prod = 1;
            for (let k = 1; k < n; k++) {
              prod *= xp - xs[k - 1];
              v += table[0][k] * prod;
            }
            yp = method === "lagrange"
              ? points.reduce((s, p, i) => {
                  let term = p.y;
                  for (let j = 0; j < n; j++) if (j !== i) term *= (xp - xs[j]) / (xs[i] - xs[j]);
                  return s + term;
                }, 0)
              : v;
            extra = { table };
          } else if (method === "forward" || method === "backward") {
            const h = xs[1] - xs[0];
            if (Math.abs(h) < 1e-12) throw new Error("Equal x values — h = 0");
            const table = Array.from({ length: n }, () => Array(n).fill(0));
            for (let i = 0; i < n; i++) table[i][0] = ys[i];
            for (let j = 1; j < n; j++)
              for (let i = 0; i < n - j; i++)
                table[i][j] = table[i + 1][j - 1] - table[i][j - 1];
            if (method === "forward") {
              const p = (xp - xs[0]) / h;
              yp = table[0][0];
              let coeff = 1;
              for (let k = 1; k < n; k++) {
                coeff = (coeff * (p - (k - 1))) / k;
                yp += coeff * table[0][k];
              }
            } else {
              const p = (xp - xs[n - 1]) / h;
              yp = table[n - 1][0];
              let coeff = 1;
              for (let k = 1; k < n; k++) {
                coeff = (coeff * (p + (k - 1))) / k;
                yp += coeff * table[n - k - 1][k];
              }
            }
            extra = { table, h };
          } else if (method === "spline") {
            const h = xs.slice(1).map((x, i) => x - xs[i]);
            const alpha = Array(n).fill(0);
            for (let i = 1; i < n - 1; i++)
              alpha[i] = (3 / h[i]) * (ys[i + 1] - ys[i]) - (3 / h[i - 1]) * (ys[i] - ys[i - 1]);
            const l = Array(n).fill(0), mu = Array(n).fill(0), z = Array(n).fill(0);
            l[0] = 1;
            for (let i = 1; i < n - 1; i++) {
              l[i] = 2 * (xs[i + 1] - xs[i - 1]) - h[i - 1] * mu[i - 1];
              mu[i] = h[i] / l[i];
              z[i] = (alpha[i] - h[i - 1] * z[i - 1]) / l[i];
            }
            l[n - 1] = 1;
            const c = Array(n).fill(0), bb = Array(n).fill(0), d = Array(n).fill(0);
            for (let j = n - 2; j >= 0; j--) {
              c[j] = z[j] - mu[j] * c[j + 1];
              bb[j] = (ys[j + 1] - ys[j]) / h[j] - (h[j] * (c[j + 1] + 2 * c[j])) / 3;
              d[j] = (c[j + 1] - c[j]) / (3 * h[j]);
            }
            let found = false;
            for (let i = 0; i < n - 1; i++) {
              if (xp >= xs[i] && xp <= xs[i + 1]) {
                const t = xp - xs[i];
                yp = ys[i] + bb[i] * t + c[i] * t * t + d[i] * t * t * t;
                found = true;
                break;
              }
            }
            if (!found) throw new Error("x_p outside data range for natural spline");
            extra = { b: bb, c, d, h };
          }
          setResult({ points, method, yp, extra });
        } catch (e) {
          setError(e.message || "Error");
        }
      }, [points, xp, method]);

      const curve = useMemo(() => {
        if (!result) return [];
        const xLo = Math.min(...result.points.map((p) => p.x)) - 0.5;
        const xHi = Math.max(...result.points.map((p) => p.x)) + 0.5;
        const pts = [];
        if (result.method === "spline") {
          const { points: p, b, c, d } = result.extra;
          for (let i = 0; i < 300; i++) {
            const x = xLo + (i / 300) * (xHi - xLo);
            let y = NaN;
            for (let j = 0; j < p.length - 1; j++) {
              if (x >= p[j].x && x <= p[j + 1].x) {
                const t = x - p[j].x;
                y = p[j].y + b[j] * t + c[j] * t * t + d[j] * t * t * t;
                break;
              }
            }
            if (Number.isFinite(y)) pts.push({ x, y });
          }
        } else {
          const xs = result.points.map((p) => p.x);
          const ys = result.points.map((p) => p.y);
          const n = xs.length;
          for (let i = 0; i < 300; i++) {
            const x = xLo + (i / 300) * (xHi - xLo);
            let y = 0;
            for (let k = 0; k < n; k++) {
              let term = ys[k];
              for (let j = 0; j < n; j++) if (j !== k) term *= (x - xs[j]) / (xs[k] - xs[j]);
              y += term;
            }
            if (Number.isFinite(y)) pts.push({ x, y });
          }
        }
        return pts;
      }, [result]);

      const xMin = points.length ? Math.min(...points.map((p) => p.x)) - 1 : -1;
      const xMax = points.length ? Math.max(...points.map((p) => p.x)) + 1 : 3;

      return (
        <div className="space-y-4">
          <Tabs tabs={["theory", "formula", "solver"]} active={tab} onChange={setTab} />

          {tab === "theory" && (
            <div className="rounded-xl border border-slate-200 bg-white p-6 text-[13px] leading-6 text-slate-700">
              <h3 className="font-bold text-slate-900 mb-2 text-[15px]">Interpolation</h3>
              <p>Construct a polynomial through all data points. Forward/backward for equally spaced nodes, divided differences for arbitrary, Lagrange basis, natural cubic spline for smoothness.</p>
            </div>
          )}

          {tab === "formula" && (
            <div className="rounded-xl border border-slate-200 bg-white p-6 mono text-[12px] text-slate-800 space-y-1.5">
              <div>Lagrange: L_i = Π_(j≠i) (x − x_j)/(x_i − x_j)</div>
              <div>Divided diff: f[x_i,x_j] = (f[x_j]−f[x_i])/(x_j−x_i)</div>
              <div>Newton forward: p = (x − x₀)/h</div>

    /* ===============================================================
       7. DIFFERENTIATION
       =============================================================== */
    function DifferentiationSolver() {
      const [expr, setExpr] = useState("sin(x)");
      const [x0, setX0] = useState(0.5);
      const [h, setH] = useState(0.1);
      const [method, setMethod] = useState("central");
      const [tab, setTab] = useState("solver");
      const [result, setResult] = useState(null);
      const [error, setError] = useState("");

      const f = useMemo(() => compileUnary(expr), [expr]);

      const compute = useCallback(() => {
        setError("");
        setResult(null);
        try {
          if (Math.abs(h) < 1e-14) throw new Error("h must be non-zero");
          let approx, formula;
          if (method === "forward") {
            approx = (f(x0 + h) - f(x0)) / h;
            formula = "f'(x) ≈ (f(x+h) − f(x))/h, O(h)";
          } else if (method === "backward") {
            approx = (f(x0) - f(x0 - h)) / h;
            formula = "f'(x) ≈ (f(x) − f(x−h))/h, O(h)";
          } else if (method === "central") {
            approx = (f(x0 + h) - f(x0 - h)) / (2 * h);
            formula = "f'(x) ≈ (f(x+h) − f(x−h))/(2h), O(h²)";
          } else {
            approx = (f(x0 + h) - 2 * f(x0) + f(x0 - h)) / (h * h);
            formula = "f''(x) ≈ (f(x+h) − 2f(x) + f(x−h))/h², O(h²)";
          }
          if (!Number.isFinite(approx)) throw new Error("Result is not finite");
          setResult({ approx, formula });
        } catch (e) {
          setError(e.message || "Error");
        }
      }, [expr, x0, h, method, f]);

      const tangent = useMemo(() => {
        if (!result) return [];
        const pts = [];
        for (let i = -20; i <= 20; i++) {
          const x = x0 + (i / 20) * 1.5;
          pts.push({ x, y: f(x0) + result.approx * (x - x0) });
        }
        return pts;
      }, [result, f, x0]);

      return (
        <div className="space-y-4">
          <Tabs tabs={["theory", "formula", "solver"]} active={tab} onChange={setTab} />
          {tab === "theory" && (
            <div className="rounded-xl border border-slate-200 bg-white p-6 text-[13px] leading-6 text-slate-700">
              <h3 className="font-bold text-slate-900 mb-2 text-[15px]">Numerical Differentiation</h3>
              <p>Approximate derivatives from function values. Central is second-order; forward/backward are first-order.</p>
            </div>
          )}
          {tab === "formula" && (
            <div className="rounded-xl border border-slate-200 bg-white p-6 mono text-[12px] text-slate-800 space-y-1.5">
              <div>Forward: (f(x+h) − f(x))/h, O(h)</div>
              <div>Backward: (f(x) − f(x−h))/h, O(h)</div>
              <div>Central: (f(x+h) − f(x−h))/(2h), O(h²)</div>
              <div>Second: (f(x+h) − 2f(x) + f(x−h))/h², O(h²)</div>
            </div>
          )}
          {tab === "solver" && (
            <div className="grid lg:grid-cols-2 gap-4">
              <div className="rounded-xl border border-slate-200 bg-white p-4 space-y-3">
                <InputField label="f(x)" type="text" value={expr} onChange={setExpr} />
                <div className="grid grid-cols-3 gap-2">
                  <InputField label="x₀" value={x0} onChange={(v) => setX0(parseFloat(v) || 0)} />
                  <InputField label="h" value={h} onChange={(v) => setH(parseFloat(v) || 0.1)} step="0.001" />
                  <div>
                    <label className="block text-[11px] font-medium text-slate-600 mb-1">Method</label>
                    <select value={method} onChange={(e) => setMethod(e.target.value)}
                      className="w-full border border-slate-200 rounded-lg px-2 py-1.5 text-sm">
                      <option value="forward">Forward</option>
                      <option value="backward">Backward</option>
                      <option value="central">Central</option>
                      <option value="second">Second deriv.</option>
                    </select>
                  </div>
                </div>
                <button onClick={compute}
                  className="w-full bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg py-2.5 text-sm font-bold transition">
                  DIFFERENTIATE
                </button>
                <ErrorBanner msg={error} />
                {result && (
                  <div className="text-sm space-y-1">
                    <div>Derivative ≈ <b className="mono">{result.approx.toFixed(8)}</b></div>
                    <div className="text-[11px] text-slate-500 mono">{result.formula}</div>
                  </div>
                )}
              </div>
              <FunctionPlot
                title={`f(x) = ${expr} + tangent`}
                stepLabel="Step 5 — Graph"
                f={f}
                xMin={x0 - 2} xMax={x0 + 2}
                points={Number.isFinite(f(x0)) ? [{ x: x0, y: f(x0), label: "x₀" }] : []}
                extraSeries={tangent.length ? [{ pts: tangent, color: "#ef4444" }] : []}
              />
            </div>
          )}
        </div>
      );
    }

    /* ===============================================================
       8. INTEGRATION
       =============================================================== */
    function IntegrationSolver() {
      const [expr, setExpr] = useState("x^2");
      const [a, setA] = useState(0);
      const [b, setB] = useState(1);
      const [n, setN] = useState(6);
      const [method, setMethod] = useState("simpson13");
      const [tab, setTab] = useState("solver");
      const [result, setResult] = useState(null);
      const [error, setError] = useState("");

      const f = useMemo(() => compileUnary(expr), [expr]);

      const compute = useCallback(() => {
        setError("");
        setResult(null);
        try {
          let integral = 0;
          let samples = [];
          const h = (b - a) / n;
          if (method === "trap") {
            let s = f(a) + f(b);
            for (let i = 1; i < n; i++) s += 2 * f(a + i * h);
            integral = (h / 2) * s;
            samples = Array.from({ length: n + 1 }, (_, i) => ({ x: a + i * h, y: f(a + i * h) }));
          } else if (method === "simpson13") {
            if (n % 2 !== 0) throw new Error("Simpson 1/3 requires even n");
            let s = f(a) + f(b);
            for (let i = 1; i < n; i++) s += (i % 2 === 0 ? 2 : 4) * f(a + i * h);
            integral = (h / 3) * s;
            samples = Array.from({ length: n + 1 }, (_, i) => ({ x: a + i * h, y: f(a + i * h) }));
          } else if (method === "simpson38") {
            if (n % 3 !== 0) throw new Error("Simpson 3/8 requires n multiple of 3");
            let s = f(a) + f(b);
            for (let i = 1; i < n; i++) s += (i % 3 === 0 ? 2 : 3) * f(a + i * h);
            integral = ((3 * h) / 8) * s;
            samples = Array.from({ length: n + 1 }, (_, i) => ({ x: a + i * h, y: f(a + i * h) }));
          } else if (method === "gauss2") {
            const nodes = [-1 / Math.sqrt(3), 1 / Math.sqrt(3)];
            const weights = [1, 1];
            let s = 0;
            samples = [];
            for (let i = 0; i < 2; i++) {
              const t = nodes[i];
              const x = ((b - a) * t + (a + b)) / 2;
              const fx = f(x);
              s += weights[i] * fx;
              samples.push({ x, y: fx, w: weights[i] });
            }
            integral = ((b - a) / 2) * s;
          } else if (method === "gauss3") {
            const nodes = [-Math.sqrt(3 / 5), 0, Math.sqrt(3 / 5)];
            const weights = [5 / 9, 8 / 9, 5 / 9];
            let s = 0;
            samples = [];
            for (let i = 0; i < 3; i++) {
              const t = nodes[i];
              const x = ((b - a) * t + (a + b)) / 2;
              const fx = f(x);
              s += weights[i] * fx;
              samples.push({ x, y: fx, w: weights[i] });
            }
            integral = ((b - a) / 2) * s;
          } else if (method === "romberg") {
            if (n <= 0) throw new Error("Romberg requires n > 0");
            const k = Math.min(6, Math.floor(Math.log2(n)));
            const R = [];
            for (let i = 0; i <= k; i++) {
              const m = 2 ** i;
              const hh = (b - a) / m;
              let s = 0.5 * (f(a) + f(b));
              for (let j = 1; j < m; j++) s += f(a + j * hh);
              R[i] = [hh * s];
              for (let j = 1; j <= i; j++)
                R[i][j] = (4 ** j * R[i][j - 1] - R[i - 1][j - 1]) / (4 ** j - 1);
            }
            integral = R[k][k];
          }
          if (!Number.isFinite(integral)) throw new Error("Integral is not finite");
          setResult({ integral, samples, h });
        } catch (e) {
          setError(e.message || "Error");
        }
      }, [expr, a, b, n, method, f]);

      return (
        <div className="space-y-4">
          <Tabs tabs={["theory", "formula", "solver"]} active={tab} onChange={setTab} />
          {tab === "theory" && (
            <div className="rounded-xl border border-slate-200 bg-white p-6 text-[13px] leading-6 text-slate-700">
              <h3 className="font-bold text-slate-900 mb-2 text-[15px]">Numerical Integration</h3>
              <p>Trap O(h²), Simpson 1/3 O(h⁴) even n, Simpson 3/8 O(h⁴) n multiple of 3, Gauss quadrature optimal nodes, Romberg extrapolates trapezoidal.</p>
            </div>
          )}
          {tab === "formula" && (
            <div className="rounded-xl border border-slate-200 bg-white p-6 mono text-[12px] text-slate-800 space-y-1.5">
              <div>Trap: (h/2)(f₀ + fₙ + 2Σ)</div>
              <div>Simpson 1/3: (h/3)(f₀ + fₙ + 4·odd + 2·even)</div>
              <div>Simpson 3/8: (3h/8)(f₀ + fₙ + 3·non-3 + 2·mult3)</div>
              <div>Gauss 2-pt: nodes ±1/√3</div>
              <div>Gauss 3-pt: 0, ±√(3/5)</div>
              <div>Romberg: R[k][j] = (4ʲ R[k][j−1] − R[k−1][j−1])/(4ʲ − 1)</div>
            </div>
          )}
          {tab === "solver" && (
            <div className="grid lg:grid-cols-2 gap-4">
              <div className="rounded-xl border border-slate-200 bg-white p-4 space-y-3">
                <InputField label="f(x)" type="text" value={expr} onChange={setExpr} />
                <div className="grid grid-cols-3 gap-2">
                  <InputField label="a" value={a} onChange={(v) => setA(parseFloat(v) || 0)} />
                  <InputField label="b" value={b} onChange={(v) => setB(parseFloat(v) || 0)} />
                  <InputField label="n" value={n} onChange={(v) => setN(parseInt(v) || 1)} />
                </div>
                <div>
                  <label className="block text-[11px] font-medium text-slate-600 mb-1">Method</label>
                  <select value={method} onChange={(e) => setMethod(e.target.value)}
                    className="w-full border border-slate-200 rounded-lg px-2.5 py-2 text-sm">
                    <option value="trap">Trapezoidal</option>
                    <option value="simpson13">Simpson 1/3</option>
                    <option value="simpson38">Simpson 3/8</option>
                    <option value="gauss2">Gauss 2-pt</option>
                    <option value="gauss3">Gauss 3-pt</option>
                    <option value="romberg">Romberg</option>
                  </select>
                </div>
                <button onClick={compute}
                  className="w-full bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg py-2.5 text-sm font-bold transition">
                  INTEGRATE
                </button>
                <ErrorBanner msg={error} />
                {result && (
                  <div className="text-sm">
                    Integral ≈ <b className="mono">{result.integral.toFixed(8)}</b>
                    {result.h && <div className="text-[11px] text-slate-500 mono mt-1">h = {result.h.toFixed(5)}</div>}
                  </div>
                )}
              </div>
              <FunctionPlot
                title={`∫ ${expr} on [${a}, ${b}]`}
                stepLabel="Step 5 — Graph"
                f={f}
                xMin={a - 0.5} xMax={b + 0.5}
                shade
                points={result?.samples?.map((s) => ({ x: s.x, y: s.y })) || []}
              />
            </div>
          )}
        </div>
      );
    }

    /* ===============================================================
       9. ODEs
       =============================================================== */
    function ODESolver() {
      const [expr, setExpr] = useState("x + y");
      const [x0, setX0] = useState(0);
      const [y0, setY0] = useState(1);
      const [xf, setXf] = useState(1);
      const [h, setH] = useState(0.2);
      const [method, setMethod] = useState("rk4");
      const [tab, setTab] = useState("solver");
      const [result, setResult] = useState(null);
      const [error, setError] = useState("");

      const f = useMemo(() => compileBinary(expr), [expr]);

      const solve = useCallback(() => {
        setError("");
        setResult(null);
        try {
          if (Math.abs(h) < 1e-12) throw new Error("h must be non-zero");
          if ((xf - x0) * h <= 0) throw new Error("h direction must match xf − x0");
          const steps = Math.ceil((xf - x0) / h);
          const xs = [x0], ys = [y0];
          const rows = [{ x: x0, y: y0, k1: "—", k2: "—", k3: "—", k4: "—" }];

          const rk4Step = (x, y) => {
            const k1 = f(x, y);
            const k2 = f(x + h / 2, y + (h * k1) / 2);
            const k3 = f(x + h / 2, y + (h * k2) / 2);
            const k4 = f(x + h, y + h * k3);
            return { yNew: y + (h / 6) * (k1 + 2 * k2 + 2 * k3 + k4), k1, k2, k3, k4 };
          };

          if (method === "euler") {
            for (let i = 0; i < steps; i++) {
              const k1 = f(xs[i], ys[i]);
              const yNew = ys[i] + h * k1;
              xs.push(xs[i] + h); ys.push(yNew);
              rows.push({ x: xs[i + 1], y: yNew, k1, k2: "—", k3: "—", k4: "—" });
            }
          } else if (method === "heun") {
            for (let i = 0; i < steps; i++) {
              const k1 = f(xs[i], ys[i]);
              const yPred = ys[i] + h * k1;
              const k2 = f(xs[i] + h, yPred);
              const yNew = ys[i] + (h / 2) * (k1 + k2);
              xs.push(xs[i] + h); ys.push(yNew);
              rows.push({ x: xs[i + 1], y: yNew, k1, k2, k3: "—", k4: "—" });
            }
          } else if (method === "rk2") {
            for (let i = 0; i < steps; i++) {
              const k1 = f(xs[i], ys[i]);
              const k2 = f(xs[i] + h / 2, ys[i] + (h * k1) / 2);
              const yNew = ys[i] + h * k2;
              xs.push(xs[i] + h); ys.push(yNew);
              rows.push({ x: xs[i + 1], y: yNew, k1, k2, k3: "—", k4: "—" });
            }
          } else if (method === "rk4") {
            for (let i = 0; i < steps; i++) {
              const s = rk4Step(xs[i], ys[i]);
              xs.push(xs[i] + h); ys.push(s.yNew);
              rows.push({ x: xs[i + 1], y: s.yNew, k1: s.k1, k2: s.k2, k3: s.k3, k4: s.k4 });
            }
          } else if (method === "adams" || method === "milne") {
            const starterSteps = Math.min(3, steps);
            for (let i = 0; i < starterSteps; i++) {
              const s = rk4Step(xs[i], ys[i]);
              xs.push(xs[i] + h); ys.push(s.yNew);
              rows.push({ x: xs[i + 1], y: s.yNew, k1: s.k1, k2: s.k2, k3: s.k3, k4: s.k4 });
            }
            for (let i = 3; i < steps; i++) {
              const x = xs[i], y = ys[i];
              const fn = f(xs[i], ys[i]);
              const fn1 = f(xs[i - 1], ys[i - 1]);
              const fn2 = f(xs[i - 2], ys[i - 2]);
              const fn3 = f(xs[i - 3], ys[i - 3]);
              let yPred, yCorr, fPred;
              if (method === "adams") {
                yPred = y + (h / 24) * (55 * fn - 59 * fn1 + 37 * fn2 - 9 * fn3);
                fPred = f(x + h, yPred);
                yCorr = y + (h / 24) * (9 * fPred + 19 * fn - 5 * fn1 + fn2);
              } else {
                yPred = ys[i - 3] + (4 * h / 3) * (2 * fn - fn1 + 2 * fn2);
                fPred = f(x + h, yPred);
                yCorr = ys[i - 1] + (h / 3) * (fPred + 4 * fn + fn1);
              }
              xs.push(x + h); ys.push(yCorr);
              rows.push({ x: x + h, y: yCorr, k1: fn, k2: yPred, k3: fPred, k4: yCorr });
            }
          }
          if (ys.some((v) => !Number.isFinite(v))) throw new Error("Solution diverged");
          setResult({ xs, ys, rows });
        } catch (e) {
          setError(e.message || "Error");
        }
      }, [expr, x0, y0, xf, h, method, f]);

      const series = useMemo(() => result ? result.xs.map((x, i) => ({ x, y: result.ys[i] })) : [], [result]);

      const stageHeaders =
        method === "adams" || method === "milne"
          ? ["f_n", "y_pred", "f_pred", "y_corr"]
          : ["k1", "k2", "k3", "k4"];

      return (
        <div className="space-y-4">
          <Tabs tabs={["theory", "formula", "solver"]} active={tab} onChange={setTab} />
          {tab === "theory" && (
            <div className="rounded-xl border border-slate-200 bg-white p-6 text-[13px] leading-6 text-slate-700">
              <h3 className="font-bold text-slate-900 mb-2 text-[15px]">Ordinary Differential Equations</h3>
              <p>y′ = f(x, y), y(x₀) = y₀. Single-step: Euler, Heun, RK2, RK4. Multistep: Adams-Bashforth-Moulton, Milne (with RK4 starter).</p>
            </div>
          )}
          {tab === "formula" && (
            <div className="rounded-xl border border-slate-200 bg-white p-6 mono text-[12px] text-slate-800 space-y-1.5">
              <div>Euler: y_(n+1) = y_n + h·f_n</div>
              <div>Heun: predictor + corrector</div>
              <div>RK4: k1..k4 stages, y_(n+1) = y_n + (h/6)(k1 + 2k2 + 2k3 + k4)</div>
              <div>Adams-Bashforth 4: y_p = y_n + (h/24)(55f_n − 59f_(n−1) + 37f_(n−2) − 9f_(n−3))</div>
              <div>Adams-Moulton 3: y_(n+1) = y_n + (h/24)(9f_p + 19f_n − 5f_(n−1) + f_(n−2))</div>
            </div>
          )}
          {tab === "solver" && (
            <>
              <div className="grid lg:grid-cols-2 gap-4">
                <div className="rounded-xl border border-slate-200 bg-white p-4 space-y-3">
                  <InputField label="dy/dx = f(x, y)" type="text" value={expr} onChange={setExpr} />
                  <div className="grid grid-cols-4 gap-2">
                    <InputField label="x₀" value={x0} onChange={(v) => setX0(parseFloat(v) || 0)} />
                    <InputField label="y₀" value={y0} onChange={(v) => setY0(parseFloat(v) || 0)} />
                    <InputField label="x_f" value={xf} onChange={(v) => setXf(parseFloat(v) || 0)} />
                    <InputField label="h" value={h} onChange={(v) => setH(parseFloat(v) || 0.1)} step="0.01" />
                  </div>
                  <select value={method} onChange={(e) => setMethod(e.target.value)}
                    className="w-full border border-slate-200 rounded-lg px-2.5 py-2 text-sm">
                    <option value="euler">Euler</option>
                    <option value="heun">Heun</option>
                    <option value="rk2">RK2</option>
                    <option value="rk4">RK4</option>
                    <option value="adams">Adams-Bashforth-Moulton</option>
                    <option value="milne">Milne</option>
                  </select>
                  <button onClick={solve}
                    className="w-full bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg py-2.5 text-sm font-bold transition">
                    SOLVE ODE
                  </button>
                  <ErrorBanner msg={error} />
                  {result && (
                    <div className="text-sm">
                      y({result.xs[result.xs.length - 1].toFixed(2)}) ≈{" "}
                      <b className="mono">{result.ys[result.ys.length - 1].toFixed(6)}</b>
                    </div>
                  )}
                </div>
                <FunctionPlot
