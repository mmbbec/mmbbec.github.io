    /* ===============================================================
       10. CURVE FITTING
       =============================================================== */
    function CurveFitSolver() {
      const [dataStr, setDataStr] = useState("0,1;1,2;2,4;3,8");
      const [model, setModel] = useState("linear");
      const [tab, setTab] = useState("solver");
      const [result, setResult] = useState(null);
      const [error, setError] = useState("");

      const points = useMemo(() =>
        dataStr.split(";").map((s) => s.trim()).filter(Boolean)
          .map((pair) => {
            const [x, y] = pair.split(",").map(Number);
            return { x, y };
          })
          .filter((p) => Number.isFinite(p.x) && Number.isFinite(p.y))
      , [dataStr]);

      const solve = useCallback(() => {
        setError("");
        setResult(null);
        try {
          if (points.length < 2) throw new Error("Need at least 2 points");
          const n = points.length;
          const xs = points.map((p) => p.x);
          const ys = points.map((p) => p.y);
          let fittedYs = [], equation = "";

          if (model === "linear") {
            const sx = xs.reduce((a, b) => a + b, 0);
            const sy = ys.reduce((a, b) => a + b, 0);
            const sxy = xs.reduce((a, x, i) => a + x * ys[i], 0);
            const sxx = xs.reduce((a, x) => a + x * x, 0);
            const denom = n * sxx - sx * sx;
            if (Math.abs(denom) < 1e-12) throw new Error("Singular normal equations");
            const bSlope = (n * sxy - sx * sy) / denom;
            const aInt = (sy - bSlope * sx) / n;
            fittedYs = xs.map((x) => aInt + bSlope * x);
            equation = `y = ${aInt.toFixed(4)} + ${bSlope.toFixed(4)}·x`;
          } else if (model === "poly2") {
            const s = [0, 0, 0, 0, 0];
            for (let k = 0; k < 5; k++) s[k] = xs.reduce((a, x) => a + Math.pow(x, k), 0);
            const t = [0, 1, 2].map((k) => xs.reduce((a, x, i) => a + Math.pow(x, k) * ys[i], 0));
            const M = [
              [s[0], s[1], s[2], t[0]],
              [s[1], s[2], s[3], t[1]],
              [s[2], s[3], s[4], t[2]],
            ];
            for (let i = 0; i < 3; i++) {
              let p = i;
              for (let r = i + 1; r < 3; r++) if (Math.abs(M[r][i]) > Math.abs(M[p][i])) p = r;
              [M[i], M[p]] = [M[p], M[i]];
              if (Math.abs(M[i][i]) < 1e-12) throw new Error("Singular normal equations");
              for (let r = i + 1; r < 3; r++) {
                const fac = M[r][i] / M[i][i];
                for (let c = i; c < 4; c++) M[r][c] -= fac * M[i][c];
              }
            }
            const coef = [0, 0, 0];
            for (let i = 2; i >= 0; i--) {
              let sum = M[i][3];
              for (let j = i + 1; j < 3; j++) sum -= M[i][j] * coef[j];
              coef[i] = sum / M[i][i];
            }
            fittedYs = xs.map((x) => coef[0] + coef[1] * x + coef[2] * x * x);
            equation = `y = ${coef[0].toFixed(4)} + ${coef[1].toFixed(4)}·x + ${coef[2].toFixed(4)}·x²`;
          } else if (model === "exp") {
            if (ys.some((y) => y <= 0)) throw new Error("Exponential fit requires all y > 0");
            const lnY = ys.map((y) => Math.log(y));
            const sx = xs.reduce((a, b) => a + b, 0);
            const sy = lnY.reduce((a, b) => a + b, 0);
            const sxy = xs.reduce((a, x, i) => a + x * lnY[i], 0);
            const sxx = xs.reduce((a, x) => a + x * x, 0);
            const denom = n * sxx - sx * sx;
            if (Math.abs(denom) < 1e-12) throw new Error("Singular normal equations");
            const bSlope = (n * sxy - sx * sy) / denom;
            const lnA = (sy - bSlope * sx) / n;
            const aVal = Math.exp(lnA);
            fittedYs = xs.map((x) => aVal * Math.exp(bSlope * x));
            equation = `y = ${aVal.toFixed(4)}·exp(${bSlope.toFixed(4)}·x)`;
          } else if (model === "log") {
            if (xs.some((x) => x <= 0)) throw new Error("Logarithmic fit requires all x > 0");
            const lnX = xs.map((x) => Math.log(x));
            const sx = lnX.reduce((a, b) => a + b, 0);
            const sy = ys.reduce((a, b) => a + b, 0);
            const sxy = lnX.reduce((a, x, i) => a + x * ys[i], 0);
            const sxx = lnX.reduce((a, x) => a + x * x, 0);
            const denom = n * sxx - sx * sx;
            if (Math.abs(denom) < 1e-12) throw new Error("Singular normal equations");
            const bSlope = (n * sxy - sx * sy) / denom;
            const aInt = (sy - bSlope * sx) / n;
            fittedYs = xs.map((x) => aInt + bSlope * Math.log(x));
            equation = `y = ${aInt.toFixed(4)} + ${bSlope.toFixed(4)}·ln(x)`;
          }

          if (fittedYs.some((y) => !Number.isFinite(y))) throw new Error("Fit produced non-finite values");

          const sse = ys.reduce((acc, y, i) => acc + (y - fittedYs[i]) ** 2, 0);
          const mse = sse / n;
          const rmse = Math.sqrt(mse);
          const meanY = ys.reduce((a, b) => a + b, 0) / n;
          const sst = ys.reduce((acc, y) => acc + (y - meanY) ** 2, 0);
          const r2 = sst === 0 ? 1 : 1 - sse / sst;

          setResult({ points, fittedYs, equation, sse, mse, rmse, r2 });
        } catch (e) {
          setError(e.message || "Error");
        }
      }, [points, model]);

      return (
        <div className="space-y-4">
          <Tabs tabs={["theory", "formula", "solver"]} active={tab} onChange={setTab} />
          {tab === "theory" && (
            <div className="rounded-xl border border-slate-200 bg-white p-6 text-[13px] leading-6 text-slate-700">
              <h3 className="font-bold text-slate-900 mb-2 text-[15px]">Curve Fitting</h3>
              <p>Minimize SSE = Σ(y − ŷ)². Linear/poly2 solve normal equations; exp/log use ln-transform.</p>
            </div>
          )}
          {tab === "formula" && (
            <div className="rounded-xl border border-slate-200 bg-white p-6 mono text-[12px] text-slate-800 space-y-1.5">
              <div>Linear: b = (nΣxy − ΣxΣy)/(nΣx² − (Σx)²)</div>
              <div>Exponential: ln y = ln a + b·x</div>
              <div>Logarithmic: y = a + b·ln x</div>
              <div>SSE, MSE, RMSE, R² = 1 − SSE/SST</div>
            </div>
          )}
          {tab === "solver" && (
            <>
              <div className="grid lg:grid-cols-2 gap-4">
                <div className="rounded-xl border border-slate-200 bg-white p-4 space-y-3">
                  <div>
                    <label className="block text-[11px] font-medium text-slate-600 mb-1">Points (x,y; ...)</label>
                    <input value={dataStr} onChange={(e) => setDataStr(e.target.value)}
                      className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mono" />
                  </div>
                  <div>
                    <label className="block text-[11px] font-medium text-slate-600 mb-1">Model</label>
                    <select value={model} onChange={(e) => setModel(e.target.value)}
                      className="w-full border border-slate-200 rounded-lg px-2.5 py-2 text-sm">
                      <option value="linear">Linear y = a + bx</option>
                      <option value="poly2">Polynomial (deg 2)</option>
                      <option value="exp">Exponential y = a·e^(bx)</option>
                      <option value="log">Logarithmic y = a + b·ln(x)</option>
                    </select>
                  </div>
                  <button onClick={solve}
                    className="w-full bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg py-2.5 text-sm font-bold transition">
                    FIT CURVE
                  </button>
                  <ErrorBanner msg={error} />
                  {result && (
                    <div className="text-sm space-y-1">
                      <div><b className="mono">{result.equation}</b></div>
                      <div className="text-[11px] text-slate-600">
                        SSE = {result.sse.toFixed(4)} · RMSE = {result.rmse.toFixed(4)} · R² = {result.r2.toFixed(4)}
                      </div>
                    </div>
                  )}
                </div>
                {result && (
                  <FunctionPlot
                    title="Data + fitted curve"
                    stepLabel="Step 5 — Graph"
                    xMin={Math.min(...result.points.map((p) => p.x)) - 1}
                    xMax={Math.max(...result.points.map((p) => p.x)) + 1}
                    points={result.points.map((p) => ({ x: p.x, y: p.y }))}
                    extraSeries={[{
                      pts: result.points
                        .map((p, i) => ({ x: p.x, y: result.fittedYs[i] }))
                        .sort((a, b) => a.x - b.x),
                      color: "#ef4444",
                    }]}
                  />
                )}
              </div>

              {result && (
                <StepCard label="Step 8 — Final Answer">
                  <span className="mono">{result.equation}</span>
                  <div className="text-[11px] mt-1 text-slate-600">R² = {result.r2.toFixed(4)}</div>
                </StepCard>
              )}
            </>
          )}
        </div>
      );
    }

    /* ===============================================================
       11. EIGENVALUES
       =============================================================== */
    function EigenSolver() {
      const [size, setSize] = useState(2);
      const [A, setA] = useState([[2, 1], [1, 2]]);
      const [v0, setV0] = useState([1, 0]);
      const [tol, setTol] = useState(1e-6);
      const [maxIter, setMaxIter] = useState(100);
      const [tab, setTab] = useState("solver");
      const [result, setResult] = useState(null);
      const [error, setError] = useState("");

      const changeSize = (newSize) => {
        setSize(newSize);
        setA(Array.from({ length: newSize }, (_, i) =>
          Array.from({ length: newSize }, (_, j) => (i === j ? 2 : 1))
        ));
        setV0(Array.from({ length: newSize }, (_, i) => (i === 0 ? 1 : 0)));
      };

      const solve = useCallback(() => {
        setError("");
        setResult(null);
        try {
          const norm0 = Math.sqrt(v0.reduce((a, v) => a + v * v, 0));
          if (norm0 < 1e-14) throw new Error("Initial vector is zero");
          let x = v0.map((v) => v / norm0);
          let lambda = 0;
          const its = [];
          for (let k = 0; k < maxIter; k++) {
            const y = Array(size).fill(0);
            for (let i = 0; i < size; i++)
              for (let j = 0; j < size; j++) y[i] += A[i][j] * x[j];
            const yNormInf = Math.max(...y.map(Math.abs));
            if (yNormInf < 1e-14) throw new Error("Matrix-vector product underflow");
            const num = x.reduce((a, xi, i) => a + xi * y[i], 0);
            const den = x.reduce((a, xi) => a + xi * xi, 0);
            const lambdaK = num / den;
            const err = Math.abs(lambdaK - lambda);
            its.push({ k, x: [...x], y: [...y], lambda: lambdaK, err });
            lambda = lambdaK;
            x = y.map((v) => v / yNormInf);
            if (k > 0 && err < tol) break;
          }
          const Av = Array(size).fill(0);
          for (let i = 0; i < size; i++)
            for (let j = 0; j < size; j++) Av[i] += A[i][j] * x[j];
          const residual = Math.sqrt(Av.reduce((a, v, i) => a + (v - lambda * x[i]) ** 2, 0));
          setResult({ lambda, x, its, residual });
        } catch (e) {
          setError(e.message || "Error");
        }
      }, [A, v0, size, tol, maxIter]);

      return (
        <div className="space-y-4">
          <Tabs tabs={["theory", "formula", "solver"]} active={tab} onChange={setTab} />
          {tab === "theory" && (
            <div className="rounded-xl border border-slate-200 bg-white p-6 text-[13px] leading-6 text-slate-700">
              <h3 className="font-bold text-slate-900 mb-2 text-[15px]">Eigenvalues — Power Method</h3>
              <p>Find dominant |λ₁| via x_(k+1) = A·x_k / ‖A·x_k‖. Converges when |λ₁| &gt; |λ₂|.</p>
            </div>
          )}
          {tab === "formula" && (
            <div className="rounded-xl border border-slate-200 bg-white p-6 mono text-[12px] text-slate-800 space-y-1.5">
              <div>y_k = A·x_k</div>
              <div>x_(k+1) = y_k / max|y_k|</div>
              <div>λ_k = (x_kᵀ A x_k)/(x_kᵀ x_k)</div>
              <div>Residual = ‖A·x − λ·x‖</div>
            </div>
          )}
          {tab === "solver" && (
            <>
              <div className="grid lg:grid-cols-2 gap-4">
                <div className="rounded-xl border border-slate-200 bg-white p-4 space-y-3">
                  <div className="flex gap-2 items-center">
                    <span className="text-[11px] font-bold">Size:</span>
                    <select value={size} onChange={(e) => changeSize(parseInt(e.target.value))}
                      className="border border-slate-200 rounded px-2 py-1 text-sm">
                      {[2, 3, 4].map((n) => <option key={n} value={n}>{n}</option>)}
                    </select>
                  </div>
                  <div>
                    <div className="text-[11px] font-bold tracking-widest text-slate-500 uppercase mb-1">Matrix A</div>
                    <div className="grid gap-1" style={{ gridTemplateColumns: `repeat(${size}, minmax(0,1fr))` }}>
                      {A.map((row, i) => row.map((val, j) => (
                        <input key={`${i}-${j}`} type="number" value={val}
                          onChange={(e) => {
                            const nv = parseFloat(e.target.value) || 0;
                            const copy = A.map((r) => [...r]);
                            copy[i][j] = nv;
                            setA(copy);
                          }}
                          className="border border-slate-200 rounded px-2 py-1 text-sm mono" />
                      )))}
                    </div>
                  </div>
                  <div>
                    <div className="text-[11px] font-bold tracking-widest text-slate-500 uppercase mb-1">Initial v₀</div>
                    <div className="flex gap-1">
                      {v0.map((val, i) => (
                        <input key={i} type="number" value={val}
                          onChange={(e) => {
                            const nv = parseFloat(e.target.value) || 0;
                            const copy = [...v0];
                            copy[i] = nv;
                            setV0(copy);
                          }}
                          className="border border-slate-200 rounded px-2 py-1 text-sm mono w-full" />
                      ))}
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <InputField label="Tolerance" value={tol} onChange={(v) => setTol(parseFloat(v) || 1e-6)} step="0.000001" />
                    <InputField label="Max iter" value={maxIter} onChange={(v) => setMaxIter(parseInt(v) || 100)} />
                  </div>
                  <button onClick={solve}
                    className="w-full bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg py-2.5 text-sm font-bold transition">
                    POWER METHOD
                  </button>
                  <ErrorBanner msg={error} />
                  {result && (
                    <div className="text-sm space-y-1">
                      <div>λ_max ≈ <b className="mono">{result.lambda.toFixed(8)}</b></div>
                      <div>v ≈ <span className="mono">[{result.x.map((v) => v.toFixed(5)).join(", ")}]</span></div>
                      <div className="text-[11px] text-slate-600">‖Av − λv‖ = {result.residual.toExponential(3)}</div>
                    </div>
                  )}
                </div>
                {result && (
                  <FunctionPlot
                    title="λ vs iteration"
                    stepLabel="Step 5 — Graph"
                    xMin={0} xMax={Math.max(1, result.its.length - 1)}
                    extraSeries={[{
                      pts: result.its.map((r) => ({ x: r.k, y: r.lambda })),
                      color: "#6366f1",
                    }]}
                  />
                )}
              </div>

              {result && (
                <div className="space-y-3">
                  <StepCard label="Step 4 — Iteration Table">
                    <div className="overflow-auto">
                      <table className="w-full text-[11px] border-collapse">
                        <thead>
                          <tr className="bg-slate-50">
                            <th className="border-b px-2 py-1.5 text-left font-bold mono">k</th>
                            <th className="border-b px-2 py-1.5 text-left font-bold mono">λ_k</th>
                            <th className="border-b px-2 py-1.5 text-left font-bold mono">err</th>
                          </tr>
                        </thead>
                        <tbody>
                          {result.its.map((r, i) => (
                            <tr key={i} className={i % 2 ? "bg-slate-50/50" : ""}>
                              <td className="border-b px-2 py-1 mono">{r.k}</td>
                              <td className="border-b px-2 py-1 mono">{r.lambda.toFixed(6)}</td>
                              <td className="border-b px-2 py-1 mono">{r.err.toExponential(2)}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </StepCard>
                  <StepCard label="Step 8 — Final Answer">
                    λ_max ≈ <b className="mono">{result.lambda.toFixed(10)}</b>
                  </StepCard>
                </div>
              )}
            </>
          )}
        </div>
      );
    }

    /* ===============================================================
       12. STATIC PAGES
       =============================================================== */
    function FormulaSheet() {
      const content = `ROOT FINDING
  Bisection:  m = (a + b)/2
  Newton:     x_(n+1) = x_n − f(x_n)/f'(x_n)
  Secant:     x_(n+1) = x_n − f_n(x_n − x_(n−1))/(f_n − f_(n−1))
  Regula:     c = (a·f(b) − b·f(a))/(f(b) − f(a))
  Fixed:      x_(n+1) = g(x_n), |g'| < 1

LINEAR SYSTEMS
  Gauss:      factor = a_ik / a_kk
  LU:         A = L·U (Doolittle)
  Cholesky:   A = L·Lᵀ (SPD)
  Jacobi:     x_i^(k+1) = (b_i − Σ a_ij x_j^(k))/a_ii
  Seidel:     uses latest values

INTERPOLATION
  Lagrange:   L_i(x) = Π (x − x_j)/(x_i − x_j)
  Divid diff: f[x_i,x_j] = (f[x_j]−f[x_i])/(x_j−x_i)
  Forward:    p = (x − x₀)/h
  Spline:     natural cubic

DIFFERENTIATION
  Forward:    (f(x+h) − f(x))/h, O(h)
  Backward:   (f(x) − f(x−h))/h, O(h)
  Central:    (f(x+h) − f(x−h))/(2h), O(h²)
  Second:     (f(x+h) − 2f(x) + f(x−h))/h², O(h²)

INTEGRATION
  Trap:       (h/2)(f₀ + fₙ + 2Σ)
  Simpson1/3: (h/3)(f₀ + fₙ + 4odd + 2even), n even
  Simpson3/8: (3h/8)(f₀ + fₙ + 3non-3 + 2mult3), n%3=0
  Gauss 2-pt: ±1/√3, weights 1,1
  Gauss 3-pt: 0, ±√(3/5), weights 8/9,5/9
  Romberg:    R[k][j] = (4ʲ R[k][j−1] − R[k−1][j−1])/(4ʲ − 1)

ODES
  Euler:      y_(n+1) = y_n + h f_n
  Heun:       predictor + corrector
  RK4:        y_(n+1) = y_n + (h/6)(k1 + 2k2 + 2k3 + k4)
  Adams-B 4:  y_p = y_n + (h/24)(55f_n − 59f_(n−1) + 37f_(n−2) − 9f_(n−3))
  Adams-M 3:  y_(n+1) = y_n + (h/24)(9f_p + 19f_n − 5f_(n−1) + f_(n−2))
  Milne:      y_p = y_(n−3) + (4h/3)(2f_n − f_(n−1) + 2f_(n−2))

CURVE FITTING
  Linear:     b = (nΣxy − ΣxΣy)/(nΣx² − (Σx)²), a = ȳ − b x̄
  Poly2:      solve 3×3 normal equations
  Exp:        ln y = ln a + b x
  Log:        y = a + b ln x
  SSE = Σ(y−ŷ)², MSE = SSE/n, RMSE = √MSE, R² = 1 − SSE/SST

EIGENVALUES
  Power:      y_k = A x_k, x_(k+1) = y_k / ‖y_k‖∞
  Rayleigh:   λ_k = (xᵀAx)/(xᵀx)`;

      return (
        <div className="rounded-xl border border-slate-200 bg-white p-6 mono text-[12px] leading-6 whitespace-pre-wrap text-slate-800">
          {content}
        </div>
      );
    }

    function Practice() {
      return (
        <div className="rounded-xl border border-slate-200 bg-white p-6">
          <div className="text-[12px] font-bold tracking-widest uppercase">Practice Problems</div>
          <div className="mt-3 text-[13px] leading-7 text-slate-700 space-y-3">
            <div><b>1. Bisection.</b> x³ − x − 2 = 0 on [1, 2], tol 0.001. Expected ≈ 1.521.</div>
            <div><b>2. Simpson 1/3.</b> ∫₀¹ x² dx, n = 6 → 0.333…</div>
            <div><b>3. RK4.</b> dy/dx = x + y, y(0) = 1, h = 0.2 up to x = 1.</div>
            <div><b>4. Power method.</b> Dominant eigenvalue of [[4, 1], [2, 3]].</div>
          </div>
        </div>
      );
    }

    function MCQ() {
      const questions = [
        { q: "Bisection error reduces by?", opts: ["1/2 each iteration", "quadratically", "cubically"], correct: 0 },
        { q: "Simpson 1/3 requires?", opts: ["even n", "odd n", "multiple of 3"], correct: 0 },
        { q: "RK4 order?", opts: ["1", "2", "4"], correct: 2 },
        { q: "Which method needs a bracket?", opts: ["Newton", "Secant", "Bisection"], correct: 2 },
        { q: "Cholesky requires?", opts: ["SPD", "diagonally dominant", "singular"], correct: 0 },
      ];
      return (
        <div className="rounded-xl border border-slate-200 bg-white p-6 space-y-3">
          <div className="text-[12px] font-bold tracking-widest uppercase">MCQ Quick Check</div>
          {questions.map((q, i) => (
            <div key={i} className="border border-slate-200 rounded-lg p-3">
              <div className="text-[13px] font-medium">{i + 1}. {q.q}</div>
              <div className="flex gap-2 mt-2 flex-wrap">
                {q.opts.map((opt, j) => (
                  <span key={j} className={`text-[11px] px-3 py-1 rounded-full border ${
                    j === q.correct
                      ? "bg-emerald-50 border-emerald-200 text-emerald-700"
                      : "bg-white border-slate-200 text-slate-600"
                  }`}>
                    {opt}{j === q.correct ? " ✓" : ""}
                  </span>
                ))}
              </div>
            </div>
          ))}
        </div>
      );
    }

    function ProgressPage() {
      return (
        <div className="rounded-xl border border-slate-200 bg-white p-6">
          <div className="text-[12px] font-bold tracking-widest uppercase">Progress Tracking</div>
          <p className="text-[13px] mt-3 text-slate-700 leading-6">
            Each solver keeps its result in React state. Click SOLVE to generate tables and plots.
          </p>
          <div className="mt-4 grid grid-cols-2 md:grid-cols-4 gap-2 text-[11px]">
            {["Root", "Linear", "Interp", "Diff", "Integ", "ODE", "Curve", "Eigen"].map((m) => (
              <div key={m} className="border border-slate-200 rounded-lg p-2 bg-slate-50">
                {m}: ready when you SOLVE
              </div>
            ))}
          </div>
        </div>
      );
    }

    /* ===============================================================
       13. DASHBOARD
       =============================================================== */
    function Dashboard({ onNavigate }) {
      const modules = [
        { key: "root", title: "Root Finding", desc: "Bisection, Newton, Secant, Regula Falsi, Fixed-Point", color: "bg-violet-50", accent: "text-violet-600" },
        { key: "linear", title: "Linear Systems", desc: "Gauss, Gauss-Jordan, LU, Cholesky, Jacobi, Gauss-Seidel", color: "bg-blue-50", accent: "text-blue-600" },
        { key: "interp", title: "Interpolation", desc: "Lagrange, Divided Diff, Newton Forward/Backward, Spline", color: "bg-emerald-50", accent: "text-emerald-600" },
        { key: "diff", title: "Differentiation", desc: "Forward O(h), Backward O(h), Central O(h²), Second", color: "bg-amber-50", accent: "text-amber-600" },
        { key: "integ", title: "Integration", desc: "Trap, Simpson 1/3 & 3/8, Gauss 2/3-pt, Romberg", color: "bg-rose-50", accent: "text-rose-600" },
        { key: "ode", title: "ODEs", desc: "Euler, Heun, RK2, RK4, Adams-Bashforth-Moulton, Milne", color: "bg-indigo-50", accent: "text-indigo-600" },
        { key: "curve", title: "Curve Fitting", desc: "Linear, Poly2, Exponential, Logarithmic + R²", color: "bg-teal-50", accent: "text-teal-600" },
        { key: "eigen", title: "Eigenvalues", desc: "Power method + Rayleigh quotient + residual", color: "bg-orange-50", accent: "text-orange-600" },
      ];
      return (
        <div className="space-y-4">
          <div className="rounded-[20px] border border-slate-200 bg-white p-6 md:p-8 relative overflow-hidden">
            <div className="absolute top-0 right-0 w-[320px] h-[320px] bg-indigo-100 rounded-full blur-[80px] -mr-20 -mt-20 pointer-events-none" />
            <div className="relative">
              <div className="text-[12px] font-bold tracking-[0.2em] text-indigo-600">
                NUMERICAL METHODS · VISUAL · VERIFIED
              </div>
              <h1 className="serif text-[34px] md:text-[48px] leading-[0.95] tracking-tight mt-3">
                Solve, iterate, visualize,<br />verify every step.
              </h1>
              <p className="text-[13px] md:text-[14px] text-slate-600 max-w-[640px] mt-3 leading-6">
                Eight families of methods with genuine numerical computation, iteration tables, error analysis, and canvas plots.
              </p>
              <button onClick={() => onNavigate("root")}
                className="mt-5 bg-slate-900 text-white rounded-full px-5 py-2.5 text-[12px] font-bold tracking-widest hover:bg-slate-800 transition">
                START SOLVING →
              </button>
            </div>
          </div>
          <div className="grid md:grid-cols-2 xl:grid-cols-4 gap-3">
            {modules.map((m) => (
              <div key={m.key} className={`rounded-xl border border-slate-200 p-4 ${m.color} flex flex-col`}>
                <div className="flex justify-between items-start">
                  <div className={`w-8 h-8 rounded-lg bg-white border flex items-center justify-center text-[12px] font-bold ${m.accent}`}>
                    {m.title[0]}
                  </div>
                  <span className="text-[10px] font-bold tracking-widest text-slate-500 border bg-white rounded-full px-2 py-1">SOLVER</span>
                </div>
                <div className="mt-3 text-[14px] font-bold">{m.title}</div>
                <div className="mt-1 text-[11px] leading-5 text-slate-600 flex-1">{m.desc}</div>
                <button onClick={() => onNavigate(m.key)}
                  className="mt-4 w-full bg-white border border-slate-200 rounded-lg py-2 text-[11px] font-bold tracking-widest hover:bg-slate-900 hover:text-white transition">
                  OPEN →
                </button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    /* ===============================================================
       14. APP SHELL
       =============================================================== */
    function App() {
      const [page, setPage] = useState("dashboard");

      const navItems = [
        { key: "dashboard", label: "Dashboard", icon: "◧", desc: "Overview" },
        { key: "root", label: "Root Finding", icon: "∿", desc: "Bisection, Newton..." },
        { key: "linear", label: "Linear Systems", icon: "▦", desc: "Gauss, LU..." },
        { key: "interp", label: "Interpolation", icon: "〰", desc: "Lagrange, Spline..." },
        { key: "diff", label: "Differentiation", icon: "Δ", desc: "Forward, Central..." },
        { key: "integ", label: "Integration", icon: "∫", desc: "Trap, Simpson..." },
        { key: "ode", label: "ODEs", icon: "⤳", desc: "Euler, RK4..." },
        { key: "curve", label: "Curve Fitting", icon: "◐", desc: "Regression + R²" },
        { key: "eigen", label: "Eigenvalues", icon: "λ", desc: "Power method" },
        { key: "formulas", label: "Formula Sheet", icon: "≡", desc: "All formulas" },
        { key: "practice", label: "Practice", icon: "✎", desc: "Problems" },
        { key: "mcq", label: "MCQ", icon: "☑", desc: "Quiz" },
        { key: "progress", label: "Progress", icon: "◎", desc: "Tracking" },
      ];

      return (
        <div className="min-h-screen text-slate-900">
          <header className="sticky top-0 z-20 backdrop-blur bg-white/80 border-b border-slate-200">
            <div className="max-w-[1600px] mx-auto px-4 md:px-8 py-4 flex items-center justify-between">
              <div className="flex items-center gap-4">
                <div className="w-9 h-9 rounded-lg bg-slate-900 text-white flex items-center justify-center font-bold serif text-[18px]">N</div>
                <div>
                  <div className="text-[15px] md:text-[18px] font-bold tracking-tight leading-none">
                    ADVANCED NUMERICAL METHODS SOLVER
                  </div>
                  <div className="text-[11px] tracking-widest text-slate-500 mt-1">
                    Interactive Visualization Dashboard · 8 modules
                  </div>
                </div>
              </div>
              <div className="hidden md:flex items-center gap-2 text-[11px] text-slate-500 border border-slate-200 rounded-full px-3 py-1">
                <span className="w-2 h-2 bg-emerald-500 rounded-full animate-pulse" />
                8 modules active
              </div>
            </div>
          </header>

          <div className="max-w-[1600px] mx-auto px-2 md:px-4 py-4 grid grid-cols-12 gap-4">
            <aside className="col-span-12 lg:col-span-3 xl:col-span-2 space-y-2 lg:sticky lg:top-[88px] self-start max-h-[calc(100vh-100px)] overflow-auto">
              <div className="grid grid-cols-2 lg:grid-cols-1 gap-2">
                {navItems.map((item) => (
                  <button key={item.key} onClick={() => setPage(item.key)}
                    className={`text-left rounded-xl border px-3 py-2.5 flex items-center gap-3 transition ${
                      page === item.key
                        ? "bg-slate-900 text-white border-slate-900 shadow"
                        : "bg-white border-slate-200 hover:border-indigo-200"
                    }`}>
                    <span className={`w-8 h-8 rounded-lg flex items-center justify-center text-[14px] font-bold ${
                      page === item.key ? "bg-white/10" : "bg-slate-100"
                    }`}>{item.icon}</span>
                    <span className="flex-1 min-w-0">
                      <span className="block text-[12px] font-bold leading-tight">{item.label}</span>
                      <span className={`block text-[10px] truncate ${page === item.key ? "text-white/60" : "text-slate-500"}`}>{item.desc}</span>
                    </span>
                  </button>
                ))}
              </div>
            </aside>

            <main className="col-span-12 lg:col-span-9 xl:col-span-10 min-w-0">
              {page === "dashboard" && <Dashboard onNavigate={setPage} />}
              {page === "root" && <RootSolver />}
              {page === "linear" && <LinearSolver />}
              {page === "interp" && <InterpolationSolver />}
              {page === "diff" && <DifferentiationSolver />}
              {page === "integ" && <IntegrationSolver />}
              {page === "ode" && <ODESolver />}
              {page === "curve" && <CurveFitSolver />}
              {page === "eigen" && <EigenSolver />}
              {page === "formulas" && <FormulaSheet />}
              {page === "practice" && <Practice />}
              {page === "mcq" && <MCQ />}
              {page === "progress" && <ProgressPage />}
            </main>
          </div>

          <footer className="max-w-[1600px] mx-auto px-6 py-8 text-[10px] text-slate-400 tracking-widest">
            ADVANCED NUMERICAL METHODS SOLVER · 8-STEP FORMAT · CANVAS PLOTS · VERIFICATION
          </footer>
        </div>
      );
    }

    /* ===============================================================
       BOOT
       =============================================================== */
    const rootEl = document.getElementById("root");
    rootEl.innerHTML = "";
    createRoot(rootEl).render(<App />);
  </script>
</body>
</html>
