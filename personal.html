<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Personal Links</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eef2ff, #f8fafc);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.12);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      color: #1e293b;
    }

    .subtitle {
      color: #64748b;
      margin-bottom: 25px;
    }

    .link-btn {
      display: block;
      width: 100%;
      padding: 15px;
      margin: 14px 0;
      border-radius: 12px;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
      color: white;
      transition: 0.2s;
    }

    .link-btn:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .drive {
      background: #4285F4;
    }

    .sheets {
      background: #0F9D58;
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      color: #475569;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🔐 Personal</h1>

    <p class="subtitle">
      My Personal Links
    </p>

    <!-- Google Drive -->
    <a
      class="link-btn drive"
      href="YOUR_GOOGLE_DRIVE_LINK"
      target="_blank"
      rel="noopener noreferrer">
      📁 My Google Drive
    </a>

    <!-- Google Sheets -->
    <a
      class="link-btn sheets"
      href="https://script.google.com/macros/s/AKfycbwYnn2mCN3LzOmdj1pJDPtwmTGkrAfALmt02ROQrRFhGg1dsb9iBVRU07vRTVlJeWxS/exec"
      target="_blank"
      rel="noopener noreferrer">
      📊 Blood Donar list 
    </a>

    <a class="back" href="index.html">
      ← Back to Website
    </a>

  </div>

</body>
</html>
