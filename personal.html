<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Mahadev Biradar | MMB_Academic_Resources</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
        }

        body {
            background: #f7f9fc;
            color: #263238;
            line-height: 1.6;
            padding-bottom: 60px;
        }

        header {
            background: #163b65;
            color: white;
            padding: 24px 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .header-container {
            max-width: 1150px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-title h1 {
            font-size: 24px;
            font-weight: 700;
        }

        .header-title p {
            font-size: 13px;
            opacity: 0.85;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            padding: 8px 18px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #d94a32;
            border-color: #d94a32;
        }

        .container {
            max-width: 1150px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .search-box {
            background: white;
            padding: 20px 25px;
            border-radius: 10px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.04);
            border: 1px solid #e2e8f0;
            margin-bottom: 25px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            border: 1.5px solid #d0d7de;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        .search-box input:focus {
            border-color: #163b65;
            box-shadow: 0 0 0 3px rgba(22, 59, 101, 0.12);
        }

        .search-icon {
            position: absolute;
            left: 38px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            color: #888;
        }

        .folders-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .folder-card {
            background: white;
            border-radius: 10px;
            padding: 22px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
            transition: 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .folder-card:hover {
            transform: translateY(-4px);
            border-color: #163b65;
            box-shadow: 0 10px 25px rgba(22, 59, 101, 0.1);
        }

        .folder-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .folder-icon {
            font-size: 26px;
        }

        .folder-title {
            font-size: 16px;
            font-weight: 700;
            color: #163b65;
        }

        .folder-desc {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 18px;
            line-height: 1.5;
        }

        .btn-open {
            background: #163b65;
            color: white;
            padding: 10px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }

        .btn-open:hover {
            background: #d94a32;
        }

        #emptyState {
            display: none;
            text-align: center;
            padding: 40px;
            color: #64748b;
            font-size: 15px;
            grid-column: 1 / -1;
        }

        @media (max-width: 900px) {
            .folders-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .folders-grid {
                grid-template-columns: 1fr;
            }
            .header-container {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="header-title">
                <h1>Dr. Mahadev Biradar | MMB_Academic_Resources</h1>
                <p>Google Drive Direct Folder Access</p>
            </div>
            <a href="index.html" class="back-btn">← Back to Profile</a>
        </div>
    </header>

    <div class="container">
        <!-- Search bar -->
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="folderSearch" placeholder="Search sub-folders (e.g., syllabus, notes, calculators, research)..." onkeyup="filterFolders()">
        </div>

        <!-- Grid -->
        <div class="folders-grid" id="foldersContainer">
            <!-- Dynamically populated -->
        </div>
        <div id="emptyState">📂 No sub-folders found matching your search.</div>
    </div>

    <script>
        // -------------------------------------------------------------
        // PASTE YOUR GOOGLE DRIVE SUB-FOLDER SHARING LINKS HERE
        // -------------------------------------------------------------
        const subFolders = [
            {
                name: "01. Syllabus & Curriculum",
                icon: "📚",
                desc: "BEC syllabus schemes, VTU course curriculum, and competitive exam outlines.",
                driveLink: "PASTE_YOUR_01_FOLDER_LINK_HERE"
            },
            {
                name: "02. Lecture Notes & PPTs",
                icon: "📝",
                desc: "Engineering Maths I–IV module notes, tutorial sheets, and question banks.",
                driveLink: "PASTE_YOUR_02_FOLDER_LINK_HERE"
            },
            {
                name: "03. Calculators & Automation Templates",
                icon: "📊",
                desc: "CO–PO attainment spreadsheets, AutoCrat sheets, and grading templates.",
                driveLink: "PASTE_YOUR_03_FOLDER_LINK_HERE"
            },
            {
                name: "04. Research Papers & Preprints",
                icon: "🔬",
                desc: "MHD, Nanofluids preprints, Casson liquid data tables, and book drafts.",
                driveLink: "PASTE_YOUR_04_FOLDER_LINK_HERE"
            },
            {
                name: "05. YRC & Activity Reports",
                icon: "🩸",
                desc: "Youth Red Cross camp rosters, event photos, and social service reports.",
                driveLink: "PASTE_YOUR_05_FOLDER_LINK_HERE"
            },
            {
                name: "06. Certificates & Admin Documents",
                icon: "📋",
                desc: "IDT/Science day certificate templates, BoS/BoE notices, and committee records.",
                driveLink: "PASTE_YOUR_06_FOLDER_LINK_HERE"
            }
        ];

        function renderFolders(data) {
            const container = document.getElementById("foldersContainer");
            const emptyState = document.getElementById("emptyState");
            container.innerHTML = "";

            if (data.length === 0) {
                emptyState.style.display = "block";
                return;
            }
            emptyState.style.display = "none";

            data.forEach(folder => {
                const card = document.createElement("div");
                card.className = "folder-card";
                card.innerHTML = `
                    <div>
                        <div class="folder-header">
                            <span class="folder-icon">${folder.icon}</span>
                            <div class="folder-title">${folder.name}</div>
                        </div>
                        <p class="folder-desc">${folder.desc}</p>
                    </div>
                    <a href="${folder.driveLink}" target="_blank" rel="noopener noreferrer" class="btn-open">
                        Open in Google Drive ↗
                    </a>
                `;
                container.appendChild(card);
            });
        }

        function filterFolders() {
            const query = document.getElementById("folderSearch").value.toLowerCase();
            const filtered = subFolders.filter(f => 
                f.name.toLowerCase().includes(query) || 
                f.desc.toLowerCase().includes(query)
            );
            renderFolders(filtered);
        }

        document.addEventListener("DOMContentLoaded", () => {
            renderFolders(subFolders);
        });
    </script>
</body>
</html>
