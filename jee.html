<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback } = React;
const GA_ID = "G-JZRW69TE7N";

/* ---------- helpers ---------- */
const safeStorage = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch {} }
};

/* Track events via the single GA property */
function trackEvent(name, params){
  try { if (window.gtag) window.gtag("event", name, params || {}); } catch {}
}

/* CSV escape */
function csvEscape(v){
  const s = v == null ? "" : String(v);
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}

/* ---------- question bank ---------- */
const CHAPTERS = {
  Physics: ["Kinematics","Laws of Motion","Work Power Energy","Gravitation","Thermodynamics","Electrostatics","Current Electricity","Magnetic Effects","Ray Optics","Wave Optics","Dual Nature","Atoms & Nuclei","Semiconductors","Oscillations","Waves"],
  Chemistry: ["Mole Concept","Atomic Structure","Periodicity","Chemical Bonding","Thermodynamics","Equilibrium","Redox","s-Block","p-Block","d-Block","Coordination","Organic Basics","Hydrocarbons","Haloalkanes","Biomolecules"],
  Mathematics: ["Sets & Relations","Complex Numbers","Quadratic Equations","Sequences","Binomial Theorem","Matrices Determinants","Trigonometry","Limits","Derivatives","Applications","Integrals","Differential Eq","Vectors","3D Geometry","Probability"],
  Biology: ["Cell Structure","Biomolecules","Cell Cycle","Plant Physiology","Human Digestion","Respiration","Circulation","Excretion","Neural Control","Chemical Coordination","Reproduction","Genetics","Evolution","Human Health","Ecology"]
};

function buildQuestion(e){
  const subjectIdx = Math.floor(e / 125);
  const subject = ["Physics","Chemistry","Mathematics","Biology"][subjectIdx];
  const chapters = CHAPTERS[subject];
  const chapter = chapters[e % chapters.length];
  const difficulty = ["Easy","Medium","Hard"][e % 3];
  const y = e + 1;
  const d = e * 7 % 50 + 5;
  const v = e * 13 % 90 + 10;
  const g = e * 3 % 20 + 2;
  const correctPos = e % 4;

  let text = "", answer = "", distractors = [], explanation = "";

  if (subject === "Physics") {
    const w = e % 8;
    if (w === 0) {
      text = `A particle moves with velocity v = (${g}t² + ${d/5}) m/s. Find acceleration at t = ${g}s for motion in ${chapter}. (Q${y})`;
      const N = 2 * g * g;
      answer = `${N} m/s²`;
      distractors = [`${N+4} m/s²`, `${N-2} m/s²`, `${N*2} m/s²`];
      explanation = `a = dv/dt = 2·${g}·t, at t=${g}, a=${N}.`;
    } else if (w === 1) {
      text = `A block of mass ${d} kg on a frictionless surface is pulled by ${v} N at 30°. What is horizontal acceleration? [${chapter}] (Q${y})`;
      const N = (v * 0.866 / d).toFixed(2);
      answer = `${N} m/s²`;
      distractors = [`${(parseFloat(N)+1).toFixed(2)} m/s²`, `${(v/d).toFixed(2)} m/s²`, `${(v*0.5/d).toFixed(2)} m/s²`];
      explanation = `Horizontal component = F cos30 = ${v}·0.866. a = F/m.`;
    } else if (w === 2) {
      text = `Two charges ${d}μC and ${v}μC are ${g*10} cm apart in vacuum. Find electrostatic force. Use k=9×10⁹. [${chapter}] (Q${y})`;
      const N = 0.9 * d * v / (g * g);
      answer = `${N.toFixed(3)} N`;
      distractors = [`${(N*1.5).toFixed(3)} N`, `${(N*0.5).toFixed(3)} N`, `${(N*2).toFixed(3)} N`];
      explanation = `Coulomb's law F = k·q₁·q₂ / r².`;
    } else if (w === 3) {
      text = `In ${chapter}, a projectile is launched with speed ${v} m/s at ${30+e%30}°. Find time of flight (g=10 m/s²). (Q${y})`;
      const ang = 30 + e % 30;
      const c = (2 * v * Math.sin(ang * Math.PI / 180) / 10).toFixed(2);
      answer = `${c} s`;
      distractors = [`${(parseFloat(c)+0.8).toFixed(2)} s`, `${(parseFloat(c)*0.6).toFixed(2)} s`, `${(v/10).toFixed(2)} s`];
      explanation = `T = 2u·sinθ / g`;
    } else if (w === 4) {
      text = `A ${d} Ω resistor carries current ${g} A in ${chapter}. Power dissipated? (Q${y})`;
      const N = d * g * g;
      answer = `${N} W`;
      distractors = [`${d*g} W`, `${d/g} W`, `${N*2} W`];
      explanation = `P = I²R`;
    } else if (w === 5) {
      text = `For ${chapter}, de Broglie wavelength of an electron accelerated through ${v} V is approximately? (Q${y})`;
      const N = (12.27 / Math.sqrt(v)).toFixed(2);
      answer = `${N} Å`;
      distractors = [`${(parseFloat(N)*1.2).toFixed(2)} Å`, `${(parseFloat(N)*0.8).toFixed(2)} Å`, `${(v/100).toFixed(2)} Å`];
      explanation = `λ = 12.27/√V Å`;
    } else if (w === 6) {
      text = `Convex lens focal length ${d} cm, object at ${v} cm. Image distance (lens formula)? [${chapter}] (Q${y})`;
      const N = d * v / (v - d);
      answer = `${N.toFixed(1)} cm`;
      distractors = [`${(N+10).toFixed(1)} cm`, `${d} cm`, `${v} cm`];
      explanation = `1/f = 1/v − 1/u`;
    } else {
      text = `A gas expands isothermally doing ${v} J work at ${300+d} K. Change in internal energy for ${chapter}? (Q${y})`;
      answer = "0 J (isothermal ideal)";
      distractors = [`${v} J`, `${-v} J`, `${d} J`];
      explanation = `ΔU = 0 for isothermal ideal gas.`;
    }
  } else if (subject === "Chemistry") {
    const w = e % 6;
    if (w === 0) {
      text = `Calculate moles in ${d} g of CaCO₃ (M = 100) in context of ${chapter}. (Q${y})`;
      answer = `${(d/100).toFixed(2)} mol`;
      distractors = [`${(d/50).toFixed(2)} mol`, `${(d*2).toFixed(2)} mol`, `${(d/200).toFixed(2)} mol`];
      explanation = `moles = mass / molar mass`;
    } else if (w === 1) {
      const hasCl = d % 5 === 0;
      text = `For ${chapter}, IUPAC name of CH₃–CH(${hasCl ? "Cl" : "OH"})–CH₃? (Q${y})`;
      answer = hasCl ? "2-chloropropane" : "propan-2-ol";
      distractors = hasCl
        ? ["1-chloropropane","2-methylpropane","1-chloro-2-methylpropane"]
        : ["propan-1-ol","2-methylpropan-2-ol","ethan-1-ol"];
      explanation = "Secondary carbon nomenclature.";
    } else if (w === 2) {
      const Kc = g;
      const concA = d/10, concB = v/10;
      const Q = concB / concA;
      let dir;
      if (Math.abs(Q - Kc) < 1e-9) dir = "at equilibrium";
      else if (Q < Kc) dir = "forward";
      else dir = "backward";
      text = `In ${chapter}, Kc = ${Kc}. If [A]=${concA} M, [B]=${concB} M for A ⇌ B, find Q and direction. (Q${y})`;
      answer = `Q = ${Q.toFixed(2)}, ${dir}`;
      distractors = [`Q = ${(Q+1).toFixed(2)}, forward`, `Q = ${Q.toFixed(2)}, backward`, "At equilibrium"];
      explanation = "Q = [B]/[A]";
    } else if (w === 3) {
      const N = 3 + e % 3;
      const c = N === 3 ? "sp²" : N === 4 ? "sp³" : "sp³d";
      const pool = ["sp","sp²","sp³","sp³d","sp³d²"];
      text = `Hybridisation of central atom in a ${chapter} example with steric number ${N}? (Q${y})`;
      answer = c;
      distractors = pool.filter(a => a !== c).slice(0, 3);
      explanation = "Steric number determines hybridisation.";
    } else if (w === 4) {
      const conc = d / 100;
      const pH = (-Math.log10(conc)).toFixed(2);
      text = `pH of ${conc} M HCl solution in ${chapter}? (Q${y})`;
      answer = pH;
      distractors = [`${(parseFloat(pH)+1).toFixed(2)}`, `${(14 - parseFloat(pH)).toFixed(2)}`, "7.00"];
      explanation = "pH = −log[H⁺]";
    } else {
      text = `Which order is correct for first ionisation energy in ${chapter} (increasing)? (Q${y})`;
      answer = "Li < B < Be < C < O < N < F";
      distractors = ["Li < Be < B < C < N < O < F", "F < O < N < C < B < Be < Li", "Be < Li < B < C < O < N < F"];
      explanation = "Period‑2 trend with Be>B and N>O exceptions.";
    }
  } else if (subject === "Mathematics") {
    const w = e % 7;
    if (w === 0) {
      const N = 3 * g * g * g + d;
      text = `If f(x) = ${g}x³ + ${d}x + ${v} in ${chapter}, find f′(${g}). (Q${y})`;
      answer = `${N}`;
      distractors = [`${N+5}`, `${g*g}`, `${d}`];
      explanation = "f′ = 3·c·x² + a";
    } else if (w === 1) {
      const N = d * g * g / 2;
      text = `Solve: ∫₀^${g} ${d}x dx in ${chapter}. (Q${y})`;
      answer = `${N}`;
      distractors = [`${N/2}`, `${d*g}`, `${g}`];
      explanation = "∫ x dx = x²/2";
    } else if (w === 2) {
      text = `Matrix A has det ${d}. Find det(2A) for a 3×3 matrix in ${chapter}. (Q${y})`;
      answer = `${d*8}`;
      distractors = [`${d*2}`, `${d}`, `${d*4}`];
      explanation = "det(kA) = kⁿ·det A";
    } else if (w === 3) {
      const N = d / (d + v);
      text = `A bag has ${d} red, ${v} blue balls. One drawn in ${chapter}. P(red)? (Q${y})`;
      answer = `${N.toFixed(3)}`;
      distractors = [`${(1-N).toFixed(3)}`, `${(d/v).toFixed(2)}`, "0.500"];
      explanation = "Favourable / total";
    } else if (w === 4) {
      const N = Math.sqrt(2) * g;
      text = `Find distance between (${d},${v}) and (${d+g},${v+g}) in ${chapter}. (Q${y})`;
      answer = `${N.toFixed(2)}`;
      distractors = [`${g}`, `${(g*2).toFixed(2)}`, `${(N+1).toFixed(2)}`];
      explanation = "Distance formula";
    } else if (w === 5) {
      text = `If ${chapter} equation: x² − ${d+v}x + ${d*v/10} = 0, sum of roots? (Q${y})`;
      answer = `${d+v}`;
      distractors = [`${d*v/10}`, `${d-v}`, `${v}`];
      explanation = "Sum = −b/a";
    } else {
      const N = d*g + v*d;
      text = `Vector a = ${d}i + ${v}j, b = ${g}i + ${d}j in ${chapter}. Dot product? (Q${y})`;
      answer = `${N}`;
      distractors = [`${d+v}`, `${d*v}`, `${N+10}`];
      explanation = "a·b = aₓbₓ + aᵧbᵧ";
    }
  } else {
    const w = e % 7;
    if (w === 0) {
      text = `In ${chapter}, which organelle is called the powerhouse of the cell? (Q${y})`;
      answer = "Mitochondria";
      distractors = ["Chloroplast","Ribosome","Nucleus"];
      explanation = "Mitochondria generates ATP.";
    } else if (w === 1) {
      text = `In prokaryotes (${chapter}), the leading strand during DNA replication is synthesised continuously by which enzyme? (Q${y})`;
      answer = "DNA polymerase III";
      distractors = ["DNA polymerase I","RNA polymerase","DNA ligase"];
      explanation = "Pol III is the main replicative enzyme in prokaryotes.";
    } else if (w === 2) {
      text = `In ${chapter}, a dihybrid cross TtRr × TtRr gives a phenotypic ratio of? (Q${y})`;
      answer = "9:3:3:1";
      distractors = ["3:1","1:2:1","9:7"];
      explanation = "Mendelian dihybrid ratio.";
    } else if (w === 3) {
      text = `For ${chapter}, which hormone lowers blood glucose? (Q${y})`;
      answer = "Insulin";
      distractors = ["Glucagon","Adrenaline","Thyroxine"];
      explanation = "Insulin promotes glucose uptake.";
    } else if (w === 4) {
      text = `In ${chapter}, which is not part of the hindbrain? (Q${y})`;
      answer = "Cerebrum";
      distractors = ["Cerebellum","Pons","Medulla"];
      explanation = "Hindbrain = cerebellum, pons, medulla.";
    } else if (w === 5) {
      text = `Number of chromosomes in a human somatic cell related to ${chapter}? (Q${y})`;
      answer = "46 (23 pairs)";
      distractors = ["23","48","44"];
      explanation = "Diploid number = 46.";
    } else {
      text = `In ecology (${chapter}), the pyramid of energy is always? (Q${y})`;
      answer = "Upright";
      distractors = ["Inverted","Spindle","Both possible"];
      explanation = "Energy decreases up trophic levels.";
    }
  }

  // Insert the correct answer at `correctPos`
  const options = [...distractors];
  options.splice(correctPos, 0, answer);
  // Safety: ensure exactly 4
  while (options.length < 4) options.push(`None of the above (Q${y})`);

  return {
    id: `${subject[0]}-${e}-${y}`,
    subject,
    chapter,
    difficulty,
    text,
    options: options.slice(0, 4),
    correct: correctPos,
    explanation
  };
}

const DURATIONS = [180,150,120,180,200,180,180,180,90,240];
function buildBank(){ return Array.from({length:500},(_,i)=>buildQuestion(i)); }

function buildMocks(bank){
  const bySubj = { Physics:[], Chemistry:[], Mathematics:[], Biology:[] };
  bank.forEach(q => bySubj[q.subject].push(q));
  const ptr = { Physics:0, Chemistry:0, Mathematics:0, Biology:0 };
  const mocks = [];
  for (let m = 0; m < 10; m++) {
    const split = m % 2 === 0
      ? { Physics:13, Chemistry:12, Mathematics:13, Biology:12 }
      : { Physics:12, Chemistry:13, Mathematics:12, Biology:13 };
    const questions = [];
    for (const subj of ["Physics","Chemistry","Mathematics","Biology"]) {
      questions.push(...bySubj[subj].slice(ptr[subj], ptr[subj] + split[subj]));
      ptr[subj] += split[subj];
    }
    mocks.push({
      id: m + 1,
      title: `MOCK-${m + 1}`,
      durationMin: DURATIONS[m],
      correctMark: 4,
      negativeMark: m === 1 ? -2 : -1,
      questions: questions.slice(0, 50)
    });
  }
  return mocks;
}

/* ---------- reusable UI ---------- */
function ThemeToggle(){
  const [theme, setTheme] = useState(() => {
    const saved = safeStorage.get("theme");
    if (saved === "dark" || saved === "light") return saved;
    return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  });
  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    safeStorage.set("theme", theme);
  }, [theme]);
  const next = theme === "dark" ? "light" : "dark";
  return (
    <button
      type="button"
      onClick={() => setTheme(next)}
      title={`Switch to ${next} mode`}
      aria-label={`Switch to ${next} mode`}
      className="h-8 w-8 grid place-items-center rounded-full bg-[var(--surface-2)] border border-[var(--border)] hover:border-[#c7c9ff] transition"
    >
      <span aria-hidden="true">{theme === "dark" ? "☀️" : "🌙"}</span>
    </button>
  );
}

function HomeButton(){
  return (
    <a
      href="https://mahadevbiradar.in"
      target="_blank"
      rel="noopener noreferrer"
      className="h-8 px-3 rounded-full bg-[var(--surface-2)] border border-[var(--border)] text-[12px] font-semibold flex items-center gap-1.5 hover:border-[#c7c9ff] transition"
    >
      <span aria-hidden="true">🏠</span>
      <span className="hidden md:inline">mahadevbiradar.in</span>
    </a>
  );
}

/* ---------- main app ---------- */
function App(){
  const bank = useMemo(buildBank, []);
  const mocks = useMemo(() => buildMocks(bank), [bank]);

  const [view, setView] = useState("dashboard");        // dashboard | examination | results
  const [mockIndex, setMockIndex] = useState(0);
  const [current, setCurrent] = useState(0);
  const [answers, setAnswers] = useState({});
  const [marked, setMarked] = useState(new Set());
  const [visited, setVisited] = useState(new Set());
  const [timeLeft, setTimeLeft] = useState(0);
  const [filter, setFilter] = useState("All");
  const [result, setResult] = useState(null);
  const submittedRef = useRef(false);

  const mock = mocks[mockIndex];
  const filtered = useMemo(() => {
    if (!mock) return [];
    if (filter === "All") return mock.questions;
    return mock.questions.filter(q => q.subject === filter);
  }, [mock, filter]);

  useEffect(() => {
    if (filtered.length && current >= filtered.length) setCurrent(0);
  }, [filtered, current]);

  /* timer */
  useEffect(() => {
    if (view !== "examination") return;
    const id = setInterval(() => {
      setTimeLeft(t => (t <= 1 ? 0 : t - 1));
    }, 1000);
    return () => clearInterval(id);
  }, [view]);

  /* auto submit */
  const submitExam = useCallback(() => {
    if (!mock || submittedRef.current) return;
    submittedRef.current = true;

    const qs = mock.questions;
    let correct = 0, incorrect = 0, unattempted = 0, score = 0;
    const subjectStats = {};
    qs.forEach(q => {
      if (!subjectStats[q.subject]) subjectStats[q.subject] = { total: 0, correct: 0, score: 0 };
      subjectStats[q.subject].total++;
      const picked = answers[q.id];
      if (picked === undefined) {
        unattempted++;
      } else if (picked === q.correct) {
        correct++; score += mock.correctMark;
        subjectStats[q.subject].correct++;
        subjectStats[q.subject].score += mock.correctMark;
      } else {
        incorrect++; score += mock.negativeMark;
        subjectStats[q.subject].score += mock.negativeMark;
      }
    });
    const timeTaken = mock.durationMin * 60 - timeLeft;
    setResult({
      mockId: mock.id,
      mockTitle: mock.title,
      total: qs.length,
      correct, incorrect, unattempted,
      score,
      maxScore: qs.length * mock.correctMark,
      subjectStats,
      answers: { ...answers },
      marking: { correctMark: mock.correctMark, negativeMark: mock.negativeMark },
      timeTaken
    });
    setView("results");
    trackEvent("exam_submit", { exam_id: String(mock.id), score });
  }, [mock, answers, timeLeft]);

  const submitRef = useRef(submitExam);
  useEffect(() => { submitRef.current = submitExam; }, [submitExam]);

  useEffect(() => {
    if (view === "examination" && timeLeft === 0) {
      submitRef.current();
    }
  }, [timeLeft, view]);

  /* document title */
  useEffect(() => {
    document.title = view === "examination" && mock
      ? `${mock.title} – JEE & NEET Mock | Mahadev Biradar`
      : "JEE & NEET 10 Full Mock Tests | Mahadev Biradar";
  }, [view, mock]);

  /* scroll anchor */
  useEffect(() => {
    if (view === "examination") {
      const el = document.getElementById("examination-anchor");
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  }, [view]);

  /* start */
  const startExam = (idx) => {
    submittedRef.current = false;
    setMockIndex(idx);
    setCurrent(0);
    setAnswers({});
    setMarked(new Set());
    setTimeLeft(mocks[idx].durationMin * 60);
    const firstId = mocks[idx].questions[0]?.id;
    setVisited(firstId ? new Set([firstId]) : new Set());
    setFilter("All");
    setResult(null);
    setView("examination");
    trackEvent("exam_start", { exam_id: String(mocks[idx].id) });
  };

  /* navigation */
  const pickOption = (optIdx) => {
    const q = filtered[current];
    if (!q) return;
    setAnswers(a => ({ ...a, [q.id]: optIdx }));
  };
  const clearResponse = () => {
    const q = filtered[current];
    if (!q) return;
    setAnswers(a => { const n = { ...a }; delete n[q.id]; return n; });
  };
  const toggleMark = () => {
    const q = filtered[current];
    if (!q) return;
    setMarked(m => {
      const n = new Set(m);
      if (n.has(q.id)) n.delete(q.id); else n.add(q.id);
      return n;
    });
  };
  const goNext = () => {
    if (current < filtered.length - 1) {
      const nid = filtered[current + 1].id;
      setVisited(v => new Set(v).add(nid));
      setCurrent(c => c + 1);
    }
  };
  const goPrev = () => {
    if (current > 0) {
      const nid = filtered[current - 1].id;
      setVisited(v => new Set(v).add(nid));
      setCurrent(c => c - 1);
    }
  };

  /* exports */
  const exportCSV = () => {
    if (!result || !mock) return;
    const rows = [["Q.No","Subject","Chapter","Your Answer","Correct Answer","Status","Explanation"]];
    mock.questions.forEach((q, idx) => {
      const picked = result.answers[q.id];
      const your = picked !== undefined ? q.options[picked] : "Not Attempted";
      const corr = q.options[q.correct];
      const status = picked === undefined ? "Unattempted" : (picked === q.correct ? "Correct" : "Incorrect");
      rows.push([idx + 1, q.subject, q.chapter, your, corr, status, q.explanation]);
    });
    const csv = rows.map(r => r.map(csvEscape).join(",")).join("\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${mock.title}_result.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  };

  const exportPDF = () => {
    if (!result || !mock) return;
    const JsPDF = window.jspdf && window.jspdf.jsPDF;
    if (!JsPDF) { alert("PDF library not loaded."); return; }
    const doc = new JsPDF({ unit: "pt", format: "a4" });
    const margin = 40;
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    const maxW = pageW - margin * 2;
    const lineH = 14;
    let y = margin;

    const add = (txt, opts = {}) => {
      const { size = 10, bold = false, color = [0,0,0] } = opts;
      doc.setFontSize(size);
      doc.setFont("helvetica", bold ? "bold" : "normal");
      doc.setTextColor(...color);
      const lines = doc.splitTextToSize(String(txt), maxW);
      for (const line of lines) {
        if (y + lineH > pageH - margin) { doc.addPage(); y = margin; }
        doc.text(line, margin, y);
        y += lineH;
      }
    };

    add(`JEE & NEET – ${mock.title} Result`, { size: 16, bold: true });
    add(`Score: ${result.score} / ${result.maxScore}   Correct: ${result.correct}   Incorrect: ${result.incorrect}   Unattempted: ${result.unattempted}`);
    add(`Marking: +${mock.correctMark} / ${mock.negativeMark}   Duration: ${mock.durationMin} min   Time taken: ${Math.floor(result.timeTaken/60)}m ${result.timeTaken%60}s`);
    add(`Generated from mahadevbiradar.in`);
    y += 6;

    mock.questions.forEach((q, idx) => {
      const picked = result.answers[q.id];
      const status = picked === undefined ? "U" : (picked === q.correct ? "C" : "W");
      add(`${idx + 1}. [${q.subject}] ${q.text}`, { bold: true });
      add(`Your: ${picked !== undefined ? q.options[picked] : "Not Attempted"}   |   Correct: ${q.options[q.correct]}   |   ${status}`);
      add(`Explanation: ${q.explanation}`, { size: 9 });
      y += 4;
    });

    doc.save(`${mock.title}_result.pdf`);
  };

  const fmtTime = (s) => {
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    const pad = (n) => String(n).padStart(2, "0");
    return h > 0 ? `${pad(h)}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`;
  };

            </div>
          </div>

            <HomeButton />
            <ThemeToggle />
            {view === "examination" && mock ? (

              </div>
            ) : (
              <div className="h-8 px-3 rounded-full bg-[#4f46e5] text-white text-[11px] font-semibold grid place-items-center mono">
                +4/-1
              </div>
            )}
          </div>
        </div>
      </header>

      {/* ---------- Dashboard ---------- */}
      {view === "dashboard" && (
        <main className="max-w-[1280px] mx-auto px-4 md:px-6 py-6 md:py-10">

            <div className="rounded-[28px] bg-[var(--surface)] border border-[var(--border)] shadow-[var(--shadow)] p-6 md:p-8 overflow-hidden relative">
              <div className="flex flex-wrap items-center gap-2 mb-4">
                <span className="px-3 py-1 rounded-full bg-[#eef0ff] text-[#4f46e5] text-[11px] font-bold tracking-wide">JEE • NEET • NTA PATTERN</span>
                <span className="px-3 py-1 rounded-full bg-emerald-50 text-emerald-700 text-[11px] font-bold">500Q BANK • 125/SUBJECT</span>
                <span className="px-3 py-1 rounded-full bg-amber-50 text-amber-700 text-[11px] font-bold">PDF + CSV EXPORT</span>
              </div>
              <h1 className="text-[28px] md:text-[40px] font-[800] tracking-[-0.03em] leading-[0.95]">JEE &amp; NEET 10 Full Mock Tests</h1>

              <div className="mt-6 grid grid-cols-3 gap-3 max-w-[520px]">

                  <div key={it.k} className="rounded-2xl bg-[var(--surface-2)] border border-[var(--border)] p-3">
                    <div className="text-[20px] font-[800] tracking-[-0.02em]">{it.v}</div>
                    <div className="text-[11px] text-[var(--text-muted)] uppercase tracking-wide font-semibold">{it.k}</div>
                  </div>

            <div className="rounded-[28px] bg-[#0f1020] text-white p-6 md:p-7 relative overflow-hidden border border-[#1f2340]">
              <div className="absolute inset-0 bg-[radial-gradient(600px_300px_at_80%_-10%,#6366f1_0%,transparent_60%),radial-gradient(500px_300px_at_0%_100%,#4f46e5_0%,transparent_60%)] opacity-60"></div>

                <div className="text-[12px] mono tracking-[0.18em] opacity-70">MARKING SCHEME</div>

                  </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
            {mocks.map(m => (
              <div key={m.id} className="group rounded-[22px] bg-[var(--surface)] border border-[var(--border)] shadow-[var(--shadow)] p-5 flex flex-col hover:shadow-[0_12px_32px_rgba(79,70,229,0.12)] hover:border-[#c7c9ff] transition-all">

                    <span className={`h-6 px-2 rounded-full text-[11px] mono font-bold grid place-items-center border ${m.negativeMark === -2 ? "bg-[#ffe9e9] border-[#ffcccc] text-[#c02626]" : "bg-[#eef0ff] border-[#d9dcff] text-[#4f46e5]"}`}>

                <div className="mt-4">
                  <div className="font-[700] tracking-[-0.01em]">{m.title}</div>
                  <div className="text-[12px] text-[var(--text-muted)] mono">
                    50Q • P{m.questions.filter(q=>q.subject==="Physics").length} C{m.questions.filter(q=>q.subject==="Chemistry").length} M{m.questions.filter(q=>q.subject==="Mathematics").length} B{m.questions.filter(q=>q.subject==="Biology").length}
                  </div>
                </div>
                <div className="mt-3 flex flex-wrap gap-1">
                  {["Physics","Chemistry","Mathematics","Biology"].map(s => {
                    const n = m.questions.filter(q=>q.subject===s).length;
                    return <span key={s} className="px-2 py-1 rounded-full bg-[var(--surface-2)] border border-[var(--border)] text-[10px] mono">{s[0]}:{n}</span>;
                  })}
                </div>
                <button
                  type="button"
                  onClick={() => startExam(m.id - 1)}
                  className="mt-5 h-11 rounded-xl bg-[#4f46e5] hover:bg-[#4338ca] text-white font-[700] text-[13px] tracking-wide transition flex items-center justify-center gap-2 shadow-[0_8px_18px_rgba(79,70,229,0.3)]"
                >
                  Start Examination <span className="h-5 w-5 rounded-full bg-white/20 grid place-items-center">→</span>
                </button>
              </div>
            ))}
          </div>
        </main>
      )}

      {/* ---------- Examination ---------- */}
      {view === "examination" && mock && (
        <div className="max-w-[1440px] mx-auto" id="examination-anchor">
          <div className="sticky safe-top z-30 bg-[var(--surface)] border-b border-[var(--border)]">
            <div className="px-4 md:px-6 h-[64px] flex items-center justify-between gap-3">
              <div className="flex items-center gap-3 min-w-0">
                <div className="h-9 w-9 rounded-xl bg-[#4f46e5] text-white grid place-items-center font-bold text-[13px] shrink-0">{mock.id}</div>
                <div className="min-w-0">
                  <div className="font-[700] text-[14px] leading-[1.1] truncate">{mock.title} • {mock.durationMin} min • +{mock.correctMark}/{mock.negativeMark}</div>
                  <div className="text-[11px] mono text-[var(--text-muted)]">Question {current+1}/{filtered.length} • Filter: {filter}</div>
                </div>
              </div>
              <div className="flex items-center gap-2 shrink-0">
                <div className={`h-9 px-3 rounded-xl border font-mono text-[13px] font-bold grid place-items-center ${timeLeft < 300 ? "bg-[#ffe9e9] border-[#ffcccc] text-[#b42318]" : "bg-[var(--surface-2)] border-[var(--border)]"}`}>
                  ⏱ {fmtTime(timeLeft)}
                </div>
                <button type="button" onClick={submitExam} className="h-9 px-4 rounded-xl bg-[#0f1020] text-white text-[13px] font-semibold hover:bg-black">Submit</button>
                <button type="button" onClick={() => setView("dashboard")} className="hidden md:grid h-9 w-9 place-items-center rounded-xl bg-[var(--surface-2)] border border-[var(--border)]">✕</button>
              </div>

              {["All","Physics","Chemistry","Mathematics","Biology"].map(f => (
                <button
                  key={f}
                  type="button"
                  onClick={() => { setFilter(f); setCurrent(0); }}
                  className={`whitespace-nowrap h-7 px-3 rounded-full text-[12px] font-semibold border transition ${filter===f ? "bg-[#4f46e5] text-white border-[#4f46e5]" : "bg-[var(--surface)] border-[var(--border)] text-[var(--text-muted)] hover:text-[var(--text)]"}`}
                >{f}</button>
              ))}
              <div className="ml-auto hidden md:flex items-center gap-2 text-[11px] mono text-[var(--text-muted)]">
                <span className="flex items-center gap-1"><span className="h-2 w-2 rounded-full bg-emerald-500"></span> Answered</span>
                <span className="flex items-center gap-1"><span className="h-2 w-2 rounded-full bg-amber-500"></span> Marked</span>
                <span className="flex items-center gap-1"><span className="h-2 w-2 rounded-full bg-[#4f46e5]"></span> Current</span>
              </div>
            </div>
          </div>

          <div className="grid lg:grid-cols-[1fr_340px] min-h-[calc(100vh-108px)]">
            <div className="p-4 md:p-6">
              {filtered[current] ? (
                <div className="rounded-[22px] bg-[var(--surface)] border border-[var(--border)] shadow-[var(--shadow)] p-5 md:p-7">
                  <div className="flex flex-wrap items-start justify-between gap-3">
                    <div className="flex items-center gap-2 flex-wrap">
                      <span className="px-2.5 py-1 rounded-full bg-[#eef0ff] text-[#4f46e5] text-[11px] font-bold mono">Q{current+1}</span>
                      <span className="px-2.5 py-1 rounded-full bg-[var(--surface-2)] border border-[var(--border)] text-[11px] mono">{filtered[current].subject} • {filtered[current].chapter}</span>
                      <span className={`px-2.5 py-1 rounded-full text-[11px] font-bold mono border ${filtered[current].difficulty==="Easy" ? "bg-emerald-50 border-emerald-200 text-emerald-700" : filtered[current].difficulty==="Medium" ? "bg-amber-50 border-amber-200 text-amber-700" : "bg-red-50 border-red-200 text-red-700"}`}>{filtered[current].difficulty}</span>
                    </div>
                    <div className="text-[11px] mono text-[var(--text-muted)]">ID: {filtered[current].id}</div>
                  </div>
                  <div className="mt-5 text-[16px] md:text-[18px] font-[600] leading-[1.45] tracking-[-0.01em]">{filtered[current].text}</div>
                  <div className="mt-6 grid gap-3">
                    {filtered[current].options.map((opt, idx) => {
                      const picked = answers[filtered[current].id] === idx;
                      return (
                        <button
                          key={idx}
                          type="button"
                          onClick={() => pickOption(idx)}
                          className={`text-left rounded-2xl border p-4 flex gap-3 items-start transition ${picked ? "bg-[#eef0ff] border-[#6366f1] shadow-[0_0_0_3px_#eef0ff]" : "bg-[var(--surface-2)] border-[var(--border)] hover:border-[#c7c9ff]"}`}
                        >
                          <span className={`h-7 w-7 rounded-full grid place-items-center text-[12px] font-bold border shrink-0 ${picked ? "bg-[#4f46e5] text-white border-[#4f46e5]" : "bg-[var(--surface)] border-[var(--border)]"}`}>{String.fromCharCode(65 + idx)}</span>

                    <button type="button" onClick={toggleMark} className={`h-10 px-4 rounded-xl border text-[13px] font-semibold ${marked.has(filtered[current].id) ? "bg-amber-50 border-amber-200 text-amber-800" : "bg-[var(--surface-2)] border-[var(--border)]"}`}>

                <div className="flex items-center gap-2"><span className="h-3 w-3 rounded bg-amber-400"></span> Marked: {marked.size}</div>
                <div className="flex items-center gap-2"><span className="h-3 w-3 rounded bg-[var(--surface-2)] border border-[var(--border)]"></span> Visited: {visited.size}</div>
                <div className="flex items-center gap-2"><span className="h-3 w-3 rounded bg-[#4f46e5]"></span> Current</div>
              </div>
              <div className="mt-6 rounded-2xl bg-[var(--surface-2)] border border-[var(--border)] p-4">
                <div className="text-[12px] font-bold">Summary</div>
                <div className="mt-2 text-[12px] mono leading-[1.8] text-[var(--text-muted)]">
                  <div>Total: {filtered.length}</div>
                  <div>Time Left: {fmtTime(timeLeft)}</div>
                  <div>Marking: +{mock.correctMark} / {mock.negativeMark}</div>
                </div>
                <button type="button" onClick={submitExam} className="mt-4 w-full h-11 rounded-xl bg-[#0f1020] text-white text-[13px] font-bold">Submit Examination</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* ---------- Results ---------- */}
      {view === "results" && result && mock && (
        <main className="max-w-[1280px] mx-auto px-4 md:px-6 py-6 md:py-10">
          <div className="flex flex-wrap items-center gap-3 mb-6">
            <button type="button" onClick={() => setView("dashboard")} className="h-9 px-4 rounded-xl bg-[var(--surface)] border border-[var(--border)] text-[13px] font-semibold">← Dashboard</button>
            <div className="h-9 px-3 rounded-full bg-[#4f46e5] text-white text-[12px] font-bold mono grid place-items-center">{mock.title} RESULT • GA {GA_ID}</div>
          </div>

          <div className="grid lg:grid-cols-[1.2fr_0.8fr] gap-6">
            <div className="rounded-[28px] bg-[var(--surface)] border border-[var(--border)] shadow-[var(--shadow)] p-6 md:p-8">
              <div className="flex flex-wrap items-start justify-between gap-4">
                <div>
                  <h2 className="text-[28px] font-[800] tracking-[-0.03em]">Score {result.score} / {result.maxScore}</h2>
                  <div className="mt-1 text-[13px] text-[var(--text-muted)] mono">Correct {result.correct} • Incorrect {result.incorrect} • Unattempted {result.unattempted} • Time {Math.floor(result.timeTaken/60)}m {result.timeTaken%60}s</div>
                </div>
                <div className="flex gap-2">
                  <button type="button" onClick={exportPDF} className="h-10 px-4 rounded-xl bg-[#4f46e5] text-white text-[13px] font-bold shadow-[0_8px_16px_rgba(79,70,229,0.25)]">Export PDF</button>
                  <button type="button" onClick={exportCSV} className="h-10 px-4 rounded-xl bg-[var(--surface-2)] border border-[var(--border)] text-[13px] font-semibold">Export CSV</button>
                </div>
              </div>

              {(() => {
                const attempted = result.correct + result.incorrect;
                const accuracy = attempted > 0 ? Math.round(result.correct / attempted * 100) : 0;
                return (
                  <div className="mt-6 grid grid-cols-2 md:grid-cols-4 gap-3">
                    {[
                      { k: "Accuracy", v: `${accuracy}%` },
                      { k: "Attempted", v: `${attempted}/${result.total}` },
                      { k: "Score", v: `${result.score}` },
                      { k: "Max", v: `${result.maxScore}` }
                    ].map(it => (
                      <div key={it.k} className="rounded-2xl bg-[var(--surface-2)] border border-[var(--border)] p-4">
                        <div className="text-[22px] font-[800] tracking-[-0.02em]">{it.v}</div>
                        <div className="text-[11px] mono text-[var(--text-muted)] uppercase font-bold">{it.k}</div>
                      </div>
                    ))}
                  </div>
                );
              })()}

              <div className="mt-6">
                <div className="text-[13px] font-bold mono mb-3">SUBJECT-WISE</div>
                <div className="grid md:grid-cols-2 gap-3">
                  {Object.entries(result.subjectStats).map(([s, st]) => (
                    <div key={s} className="rounded-2xl border border-[var(--border)] bg-[var(--surface-2)] p-4 flex items-center justify-between">
                      <div>
                        <div className="font-[700] text-[13px]">{s}</div>
                        <div className="text-[11px] mono text-[var(--text-muted)]">{st.correct}/{st.total} correct</div>
                      </div>
                      <div className="text-right">
                        <div className="font-[800] text-[14px]">{st.score} pts</div>
                        <div className="text-[11px] mono text-[var(--text-muted)]">{st.total * mock.correctMark} max</div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            <div className="rounded-[28px] bg-[#0f1020] text-white p-6 border border-[#1f2340] relative overflow-hidden">
              <div className="absolute inset-0 bg-[radial-gradient(500px_300px_at_80%_0%,#6366f1_25%,transparent_60%)] opacity-60"></div>
              <div className="relative">
                <div className="text-[12px] mono tracking-[0.2em] opacity-60">ANALYTICS</div>
                <div className="mt-4 text-[14px] leading-[1.6] opacity-80">
                  Result exported with GA event <span className="mono bg-white/10 px-1 rounded">exam_submit</span> sent to <span className="mono">{GA_ID}</span>.
                </div>
                <div className="mt-6 rounded-2xl bg-white/5 border border-white/10 p-4">
                  <div className="text-[12px] font-bold mono">MARKING SCHEME</div>
                  <div className="mt-2 text-[12px] mono leading-[1.8] opacity-80">
                    <div>This mock: +{mock.correctMark} / {mock.negativeMark}</div>
                    <div className="text-amber-300">MOCK-2: +4/−2 (special)</div>
                    <div className="text-[11px] opacity-60 mt-1">Others: +4/−1</div>
                  </div>
                </div>
                <div className="mt-4 text-[11px] mono opacity-50">
                  <a href="https://mahadevbiradar.in" target="_blank" rel="noopener noreferrer" className="underline">mahadevbiradar.in</a>
                </div>
              </div>
            </div>
          </div>

          <div className="mt-8 rounded-[28px] bg-[var(--surface)] border border-[var(--border)] shadow-[var(--shadow)] p-6">
            <div className="flex items-center justify-between">
              <h3 className="text-[14px] font-bold">Detailed Review • {mock.questions.length} Questions</h3>
              <div className="text-[11px] mono text-[var(--text-muted)]">Correct = green, Incorrect = red, Unattempted = gray</div>
            </div>
            <div className="mt-4 grid gap-4">
              {mock.questions.map((q, idx) => {
                const picked = result.answers[q.id];
                const isCorrect = picked === q.correct;
                const isUnattempted = picked === undefined;
                return (
                  <div key={q.id} className={`rounded-2xl border p-4 ${isUnattempted ? "bg-[var(--surface-2)] border-[var(--border)]" : isCorrect ? "bg-emerald-50 border-emerald-200" : "bg-red-50 border-red-200"}`}>
                    <div className="flex gap-2 items-start">
                      <span className={`h-6 w-6 rounded-full grid place-items-center text-[11px] font-bold shrink-0 ${isUnattempted ? "bg-[var(--surface)] border border-[var(--border)]" : isCorrect ? "bg-emerald-600 text-white" : "bg-red-600 text-white"}`}>{idx + 1}</span>
                      <div className="flex-1 min-w-0">
                        <div className="text-[13px] font-semibold leading-[1.4]">{q.text}</div>
                        <div className="mt-2 grid md:grid-cols-2 gap-2">
                          {q.options.map((opt, oi) => {
                            const isPicked = picked === oi;
                            const isAnswer = q.correct === oi;
                            return (
                              <div key={oi} className={`rounded-xl border px-3 py-2 text-[12px] flex gap-2 ${isAnswer ? "bg-emerald-100 border-emerald-300 font-semibold" : isPicked ? "bg-red-100 border-red-300" : "bg-[var(--surface)] border-[var(--border)]"}`}>
                                <span className="font-bold">{String.fromCharCode(65 + oi)}.</span>
                                <span className="flex-1">{opt}</span>
                                {isPicked && <span className="ml-auto text-[10px] mono self-center">{isCorrect ? "Your • Correct" : "Your"}</span>}
                                {isAnswer && !isPicked && <span className="ml-auto text-[10px] mono self-center">Correct</span>}
                              </div>
                            );
                          })}
                        </div>
                        <div className="mt-2 text-[11px] mono text-[var(--text-muted)]">Explanation: {q.explanation} • Chapter: {q.chapter} • {q.subject}</div>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </main>
      )}

      {/* footer */}
      <footer className="max-w-[1280px] mx-auto px-4 md:px-6 py-8 text-[11px] mono text-[var(--text-muted)] border-t border-[var(--border)] mt-8">
        <div className="flex flex-wrap gap-4 justify-between">
          <span>JEE Portal • GA {GA_ID} • <a href="https://mahadevbiradar.in" target="_blank" rel="noopener noreferrer" className="underline">mahadevbiradar.in</a></span>
          <span className="hidden md:inline">React + jsPDF • CSV • Light/Dark theme</span>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <React.StrictMode><App /></React.StrictMode>
);
</script>

<!-- external links: open in new tab -->
<script>
(function(){
  function m(a){
    var h = a.getAttribute("href"); if (!h) return;
    try {
      var u = new URL(h, document.baseURI);
      if (((u.protocol === "http:" || u.protocol === "https:") && u.host !== location.host) ||
          u.protocol === "mailto:" || u.protocol === "tel:" || u.protocol === "sms:") {
        a.target = "_blank"; a.rel = "noopener noreferrer";
      }
    } catch (e) {}
  }
  function s(){ document.querySelectorAll("a[href]").forEach(m); }
  if (document.readyState !== "loading") s();
  else document.addEventListener("DOMContentLoaded", s);
  document.addEventListener("click", function(e){
    var a = e.target && e.target.closest && e.target.closest("a[href]");
    if (a) m(a);
  }, true);
})();
</script>
</body>
</html>
