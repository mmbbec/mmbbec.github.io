    function taskStatus(task) {
      if (task.status === 'Completed') return 'Completed';
      if (daysUntil(task.dueDate) < 0) return 'Overdue';
      return 'Pending';
    }

    function TasksModule({ tasks, setTasks, onAddTask }) {
      const sorted = tasks
        .slice()
        .sort((a, b) => {
          const aDone = a.status === 'Completed' ? 1 : 0;
          const bDone = b.status === 'Completed' ? 1 : 0;
          if (aDone !== bDone) return aDone - bDone;
          return a.dueDate.localeCompare(b.dueDate);
        });

      const toggle = (id) =>
        setTasks((list) =>
          list.map((t) =>
            t.id === id
              ? { ...t, status: t.status === 'Completed' ? 'Pending' : 'Completed' }
              : t
          )
        );

      const remove = (id) => setTasks((list) => list.filter((t) => t.id !== id));

      return (
        <div className="space-y-3">
          <PrimaryButton onClick={onAddTask} className="w-full">
            <Icon name="plus" className="h-4 w-4" /> Add task
          </PrimaryButton>

          {sorted.map((task) => {
            const status = taskStatus(task);
            const tone = status === 'Completed' ? 'success' : status === 'Overdue' ? 'danger' : 'warn';
            const done = task.status === 'Completed';
            return (
              <Card key={task.id} className="flex items-start gap-3 p-4">
                <button
                  onClick={() => toggle(task.id)}
                  aria-label={done ? 'Mark as pending' : 'Mark as complete'}
                  className={`mt-0.5 grid h-5 w-5 shrink-0 place-items-center rounded-full border transition ${
                    done ? 'border-emerald-600 bg-emerald-600 text-white' : 'border-stone-300 bg-white text-transparent hover:border-emerald-500'
                  }`}
                >
                  <Icon name="check" className="h-3 w-3" strokeWidth={3} />
                </button>
                <div className="min-w-0 flex-1">
                  <p className={`text-[12.5px] font-semibold leading-snug ${done ? 'text-stone-400 line-through' : 'text-ink'}`}>
                    {task.title}
                  </p>
                  <p className="mt-1 text-[10.5px] text-stone-500">
                    {task.category} · {task.priority} priority · due {formatDate(task.dueDate)}
                  </p>
                </div>
                <div className="flex shrink-0 flex-col items-end gap-1.5">
                  <Badge tone={tone}>{status}</Badge>
                  <button onClick={() => remove(task.id)} className="text-[10px] font-semibold text-stone-400 transition hover:text-brand">
                    Delete
                  </button>
                </div>
              </Card>
            );
          })}
        </div>
      );
    }

    function MeetingsModule({ meetings }) {
      return (
        <div className="space-y-3">
          {meetings.map((meeting) => (
            <Card key={meeting.id} className="p-4">
              <div className="flex items-start justify-between gap-3">
                <p className="text-[12.5px] font-bold text-ink">{meeting.title}</p>
                <Badge tone={meeting.type === 'YRC' ? 'brand' : 'success'} className="shrink-0">{meeting.type}</Badge>
              </div>
              <p className="mt-1 text-[11px] text-stone-500">
                {formatDate(meeting.date)} · {meeting.time} · {meeting.venue} · {meeting.participants} participants
              </p>
              <div className="mt-3 rounded-xl bg-stone-50 p-3">
                <p className="mb-1 text-[10px] font-bold uppercase tracking-wider text-stone-400">Minutes</p>
                <p className="text-[11.5px] leading-relaxed text-stone-600">{meeting.minutes}</p>
              </div>
            </Card>
          ))}
        </div>
      );
    }

    function AccreditationModule({ subjects }) {
      const rows = subjects.map((subject) => {
        const checklist = buildChecklist(subject);
        const done = checklist.filter((c) => c.done).length;
        return { subject, done, total: checklist.length, percent: Math.round((done / checklist.length) * 100) };
      });
      const overall = rows.length
        ? Math.round(rows.reduce((sum, r) => sum + r.percent, 0) / rows.length)
        : 0;

      return (
        <div className="space-y-3">
          <div className="rounded-2xl bg-ink p-4 text-white">
            <p className="text-[10px] uppercase tracking-wider text-white/50">Course file readiness</p>
            <p className="mt-1 text-[24px] font-extrabold leading-none">{overall}%</p>
            <p className="mt-1 text-[11px] text-white/60">Across {rows.length} subjects · BEC Autonomous</p>
          </div>

          {rows.map(({ subject, done, total, percent }) => (
            <Card key={subject.id} className="p-4">
              <div className="flex items-start justify-between gap-3">
                <div className="min-w-0">
                  <p className="truncate text-[12.5px] font-bold text-ink">{subject.name}</p>
                  <p className="text-[11px] text-stone-500">{subject.code} · {subject.branch}</p>
                </div>
                <Badge tone={percent >= 75 ? 'success' : percent >= 50 ? 'warn' : 'danger'}>{done}/{total}</Badge>
              </div>
              <div className="mt-2.5 h-1.5 overflow-hidden rounded-full bg-stone-100">
                <div className="h-full rounded-full bg-brand" style={{ width: `${percent}%` }} />
              </div>
            </Card>
          ))}
        </div>
      );
    }

    function CalendarModule({ tasks, meetings, documents }) {
      const events = useMemo(() => {
        const list = [];
        tasks.forEach((t) => list.push({ id: `t-${t.id}`, date: t.dueDate, title: t.title, type: 'Task' }));
        meetings.forEach((m) => list.push({ id: `m-${m.id}`, date: m.date, title: m.title, type: 'Meeting' }));
        documents.forEach((d) => {
          if (d.expiryDate) list.push({ id: `d-${d.id}`, date: d.expiryDate, title: `${d.name} expires`, type: 'Renewal' });
        });
        return list.sort((a, b) => a.date.localeCompare(b.date));
      }, [tasks, meetings, documents]);

      const upcoming = events.filter((e) => daysUntil(e.date) >= -30);

      return (
        <div className="space-y-2.5">
          {upcoming.map((event) => {
            const days = daysUntil(event.date);
            const tone = event.type === 'Renewal' ? 'danger' : event.type === 'Meeting' ? 'success' : 'neutral';
            return (
              <Card key={event.id} className="flex items-center gap-3 p-3.5">
                <div className="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-stone-50 text-[10px] font-bold leading-none text-stone-600">
                  <span>{parseDate(event.date).getDate()}</span>
                  <span className="text-[8.5px] font-semibold uppercase text-stone-400">
                    {parseDate(event.date).toLocaleDateString('en-IN', { month: 'short' })}
                  </span>
                </div>
                <div className="min-w-0 flex-1">
                  <p className="truncate text-[12px] font-semibold text-ink">{event.title}</p>
                  <p className="text-[10.5px] text-stone-500">
                    {days < 0 ? `${Math.abs(days)} days ago` : days === 0 ? 'Today' : `in ${days} days`}
                  </p>
                </div>
                <Badge tone={tone} className="shrink-0">{event.type}</Badge>
              </Card>
            );
          })}
        </div>
      );
    }

    function ReportsModule({ expenses, publications, tasks }) {
      const exportExpenses = () => {
        const header = ['Date', 'Amount', 'Category', 'Payment mode', 'Vendor', 'Description'];
        const rows = expenses.map((e) =>
          [e.date, e.amount, e.category, e.paymentMode, e.vendor, e.description].map(csvCell).join(',')
        );
        downloadFile(`bec-expenses-${isoDate(new Date())}.csv`, [header.join(','), ...rows].join('\n'));
      };

      const exportPublications = () => {
        const header = ['Title', 'Authors', 'Journal', 'Year', 'Volume', 'DOI'];
        const rows = publications.map((p) =>
          [p.title, p.authors, p.journal, p.year, p.volume, p.doi].map(csvCell).join(',')
        );
        downloadFile(`bec-publications-${isoDate(new Date())}.csv`, [header.join(','), ...rows].join('\n'));
      };

      const exportTasks = () => {
        const header = ['Title', 'Category', 'Priority', 'Due date', 'Status'];
        const rows = tasks.map((t) => [t.title, t.category, t.priority, t.dueDate, taskStatus(t)].map(csvCell).join(','));
        downloadFile(`bec-tasks-${isoDate(new Date())}.csv`, [header.join(','), ...rows].join('\n'));
      };

      const exportBackup = () => {
        const payload = { generatedAt: new Date().toISOString(), expenses, publications, tasks };
        downloadFile(`bec-workspace-backup-${isoDate(new Date())}.json`, JSON.stringify(payload, null, 2), 'application/json');
      };

      return (
        <div className="space-y-2.5">
          {[
            { label: 'Expenses (CSV)', desc: `${expenses.length} records`, action: exportExpenses, icon: 'wallet' },
            { label: 'Publications (CSV)', desc: `${publications.length} records`, action: exportPublications, icon: 'book' },
            { label: 'Tasks (CSV)', desc: `${tasks.length} records`, action: exportTasks, icon: 'clipboard' },
            { label: 'Full backup (JSON)', desc: 'Expenses, publications and tasks', action: exportBackup, icon: 'download' }
          ].map((item) => (
            <button
              key={item.label}
              onClick={item.action}
              className="flex w-full items-center gap-3 rounded-2xl border border-stone-200 bg-white p-4 text-left shadow-card transition hover:border-brand/30"
            >
              <span className="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-stone-50 text-ink">
                <Icon name={item.icon} className="h-5 w-5" />
              </span>
              <span className="min-w-0 flex-1">
                <span className="block text-[12.5px] font-bold text-ink">{item.label}</span>
                <span className="block text-[10.5px] text-stone-500">{item.desc}</span>
              </span>
              <Icon name="download" className="h-4 w-4 shrink-0 text-stone-400" />
            </button>
          ))}
        </div>
      );
    }

    function LinksModule({ profile }) {
      const links = [
        { label: 'ORCID', value: profile.orcid, href: profile.orcidLink },
        { label: 'Google Scholar', value: profile.scholarId, href: profile.scholarLink },
        { label: 'ResearchGate', value: 'Profile', href: profile.researchGate },
        { label: 'Personal website', value: profile.website.replace('https://', ''), href: profile.website },
        { label: 'VTU', value: 'vtu.ac.in', href: 'https://vtu.ac.in' },
        { label: 'Scopus', value: 'Author record', href: `https://www.scopus.com/authid/detail.uri?authorId=${profile.scopusId}` }
      ];

      return (
        <div className="space-y-2.5">
          {links.map((link) => (
            <a
              key={link.label}
              href={link.href}
              target="_blank"
              rel="noopener noreferrer"
              className="flex items-center justify-between gap-3 rounded-2xl border border-stone-200 bg-white p-4 shadow-card transition hover:border-brand/30"
            >
              <div className="flex min-w-0 items-center gap-3">
                <span className="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-stone-50 text-ink">
                  <Icon name="link" className="h-4 w-4" />
                </span>
                <div className="min-w-0">
                  <p className="text-[12.5px] font-semibold text-ink">{link.label}</p>
                  <p className="truncate text-[10.5px] text-stone-500">{link.value}</p>
                </div>
              </div>
              <Icon name="external" className="h-4 w-4 shrink-0 text-stone-400" />
            </a>
          ))}
        </div>
      );
    }

    function ContactsModule({ profile }) {
      const rows = [
        { label: 'Email', value: profile.email, href: `mailto:${profile.email}`, icon: 'mail' },
        { label: 'Phone', value: profile.phone, href: `tel:${profile.phone.replace(/\s/g, '')}`, icon: 'phone' },
        { label: 'Institution', value: profile.institution, icon: 'building' },
        { label: 'Employee ID', value: profile.employeeId, icon: 'shield' }
      ];

      return (
        <div className="space-y-2.5">
          {rows.map((row) => {
            const Wrapper = row.href ? 'a' : 'div';
            return (
              <Wrapper
                key={row.label}
                href={row.href}
                className="flex items-center gap-3 rounded-2xl border border-stone-200 bg-white p-4 shadow-card"
              >
                <span className="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-stone-50 text-ink">
                  <Icon name={row.icon} className="h-4 w-4" />
                </span>
                <div className="min-w-0">
                  <p className="text-[10.5px] font-semibold uppercase tracking-wider text-stone-400">{row.label}</p>
                  <p className="text-[12px] font-medium text-ink">{row.value}</p>
                </div>
              </Wrapper>
            );
          })}
        </div>
      );
    }

    function SettingsModule({ profile, setProfile, session, onSignOut }) {
      const fields = [
        { key: 'name', label: 'Full name' },
        { key: 'designation', label: 'Designation' },
        { key: 'department', label: 'Department' },
        { key: 'employeeId', label: 'Employee ID' },
        { key: 'email', label: 'Email' },
        { key: 'phone', label: 'Phone' },
        { key: 'scopusId', label: 'Scopus ID' },
        { key: 'orcid', label: 'ORCID' },
        { key: 'scholarId', label: 'Google Scholar ID' },
        { key: 'website', label: 'Website' }
      ];

      const resetProfile = () => setProfile(PROFILE);

      const clearData = () => {
        const confirmed = window.confirm('Clear all locally stored workspace data and reload?');
        if (!confirmed) return;
        store.clearAll();
        window.location.reload();
      };

      const signedInAt = session?.at
        ? new Date(session.at).toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' })
        : '—';

      return (
        <div className="space-y-3">
          <Card className="p-4">
            <p className="mb-3 text-[10px] font-bold uppercase tracking-wider text-stone-400">Profile</p>
            <div className="space-y-3">
              {fields.map((field) => (
                <Field key={field.key} label={field.label}>
                  <input
                    value={profile[field.key] || ''}
                    onChange={(e) => setProfile((prev) => ({ ...prev, [field.key]: e.target.value }))}
                    className={inputClass}
                  />
                </Field>
              ))}
            </div>
            <div className="mt-4 grid grid-cols-2 gap-2">
              <PrimaryButton onClick={() => store.write('profile', profile)}>Save changes</PrimaryButton>
              <GhostButton onClick={resetProfile}>Reset to default</GhostButton>
            </div>
          </Card>

          <Card className="p-4">
            <p className="mb-3 text-[10px] font-bold uppercase tracking-wider text-stone-400">Session</p>
            <dl className="space-y-2 text-[12px]">
              <div className="flex justify-between gap-3">
                <dt className="text-stone-500">Signed in as</dt>
                <dd className="truncate font-semibold text-ink">{session?.email || '—'}</dd>
              </div>
              <div className="flex justify-between gap-3">
                <dt className="text-stone-500">Session started</dt>
                <dd className="font-semibold text-ink">{signedInAt}</dd>
              </div>
              <div className="flex justify-between gap-3">
                <dt className="text-stone-500">Storage</dt>
                <dd className="font-semibold text-ink">Local browser only</dd>
              </div>
            </dl>
            <div className="mt-3 grid grid-cols-2 gap-2">
              <GhostButton onClick={onSignOut}>
                <Icon name="logout" className="h-4 w-4" /> Sign out
              </GhostButton>
              <button
                onClick={clearData}
                className="inline-flex items-center justify-center gap-2 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-[13px] font-semibold text-brand transition hover:bg-red-100"
              >
                <Icon name="trash" className="h-4 w-4" /> Clear data
              </button>
            </div>
          </Card>
        </div>
      );
    }

    /* =========================================================
       15. CREATE SHEETS
       ========================================================= */
    function ExpenseSheet({ open, onClose, onSave }) {
      const [form, setForm] = useState({
        amount: '', category: 'Food', paymentMode: 'UPI', vendor: '', description: '', date: isoDate(new Date())
      });

      useEffect(() => {
        if (open) {
          setForm({ amount: '', category: 'Food', paymentMode: 'UPI', vendor: '', description: '', date: isoDate(new Date()) });
        }
      }, [open]);

      const update = (key, value) => setForm((prev) => ({ ...prev, [key]: value }));

      const submit = (e) => {
        e.preventDefault();
        const amount = Number(form.amount);
        if (!amount || amount <= 0) return;
        onSave({
          id: `e-${Date.now()}`,
          date: form.date,
          amount,
          category: form.category,
          paymentMode: form.paymentMode,
          vendor: form.vendor.trim() || '—',
          description: form.description.trim() || 'Expense'
        });
      };

      return (
        <Sheet open={open} onClose={onClose} title="Add expense" subtitle="Recorded locally in your workspace">
          <form onSubmit={submit} className="space-y-3">
            <div className="grid grid-cols-2 gap-3">
              <Field label="Amount (₹)">
                <input type="number" min="1" inputMode="numeric" value={form.amount}
                  onChange={(e) => update('amount', e.target.value)} placeholder="0" className={inputClass} required />
              </Field>
              <Field label="Date">
                <input type="date" value={form.date} onChange={(e) => update('date', e.target.value)} className={inputClass} />
              </Field>
            </div>
            <Field label="Category">
              <select value={form.category} onChange={(e) => update('category', e.target.value)} className={inputClass}>
                {EXPENSE_CATEGORIES.map((category) => <option key={category}>{category}</option>)}
              </select>
            </Field>
            <div className="grid grid-cols-2 gap-3">
              <Field label="Payment mode">
                <select value={form.paymentMode} onChange={(e) => update('paymentMode', e.target.value)} className={inputClass}>
                  {PAYMENT_MODES.map((mode) => <option key={mode}>{mode}</option>)}
                </select>
              </Field>
              <Field label="Vendor">
                <input value={form.vendor} onChange={(e) => update('vendor', e.target.value)} placeholder="Vendor" className={inputClass} />
              </Field>
            </div>
            <Field label="Description">
              <textarea value={form.description} onChange={(e) => update('description', e.target.value)}
                placeholder="What was this for?" rows={3} className={inputClass} />
            </Field>
            <PrimaryButton type="submit" className="w-full">Save expense</PrimaryButton>
          </form>
        </Sheet>
      );
    }

    function PublicationSheet({ open, onClose, onSave }) {
      const [form, setForm] = useState({ title: '', journal: '', year: String(new Date().getFullYear()), doi: '', authors: 'Biradar M.' });

      useEffect(() => {
        if (open) setForm({ title: '', journal: '', year: String(new Date().getFullYear()), doi: '', authors: 'Biradar M.' });
      }, [open]);

      const update = (key, value) => setForm((prev) => ({ ...prev, [key]: value }));

      const submit = (e) => {
        e.preventDefault();
        if (!form.title.trim()) return;
        onSave({
          id: `p-${Date.now()}`,
          title: form.title.trim(),
          authors: form.authors.trim() || 'Biradar M.',
          journal: form.journal.trim() || 'Journal',
          year: form.year.trim() || String(new Date().getFullYear()),
          volume: '',
          doi: form.doi.trim()
        });
      };

      return (
        <Sheet open={open} onClose={onClose} title="Add publication" subtitle="Add to your research record">
          <form onSubmit={submit} className="space-y-3">
            <Field label="Title">
              <textarea value={form.title} onChange={(e) => update('title', e.target.value)} rows={2}
                placeholder="Publication title" className={inputClass} required />
            </Field>
            <div className="grid grid-cols-2 gap-3">
              <Field label="Journal">
                <input value={form.journal} onChange={(e) => update('journal', e.target.value)} placeholder="Journal name" className={inputClass} />
              </Field>
              <Field label="Year">
                <input value={form.year} onChange={(e) => update('year', e.target.value)} placeholder="2026" className={inputClass} />
              </Field>
            </div>
            <Field label="Authors">
              <input value={form.authors} onChange={(e) => update('authors', e.target.value)} className={inputClass} />
            </Field>
            <Field label="DOI" hint="Optional — used to generate a direct link">
              <input value={form.doi} onChange={(e) => update('doi', e.target.value)} placeholder="10.xxxx/xxxxx" className={inputClass} />
            </Field>
            <PrimaryButton type="submit" className="w-full">Save publication</PrimaryButton>
          </form>
        </Sheet>
      );
    }

    function DocumentSheet({ open, onClose, onSave }) {
      const [form, setForm] = useState({ name: '', docNumber: '', category: 'Identity', subType: '', expiryDate: '', authority: '' });

      useEffect(() => {
        if (open) setForm({ name: '', docNumber: '', category: 'Identity', subType: '', expiryDate: '', authority: '' });
      }, [open]);

      const update = (key, value) => setForm((prev) => ({ ...prev, [key]: value }));

      const submit = (e) => {
        e.preventDefault();
        if (!form.name.trim()) return;
        onSave({
          id: `d-${Date.now()}`,
          name: form.name.trim(),
          category: form.category,
          subType: form.subType.trim() || 'General',
          docNumber: form.docNumber.trim() || 'XXXX',
          issueDate: isoDate(new Date()),
          expiryDate: form.expiryDate,
          authority: form.authority.trim() || 'BEC Bagalkot',
          notes: 'Added manually',
          tags: ['manual']
        });
      };

      return (
        <Sheet open={open} onClose={onClose} title="Add document" subtitle="Stored locally — masked by default">
          <form onSubmit={submit} className="space-y-3">
            <Field label="Document name">
              <input value={form.name} onChange={(e) => update('name', e.target.value)} placeholder="e.g. Passport" className={inputClass} required />
            </Field>
            <div className="grid grid-cols-2 gap-3">
              <Field label="Document number">
                <input value={form.docNumber} onChange={(e) => update('docNumber', e.target.value)} placeholder="Number" className={inputClass} />
              </Field>
              <Field label="Category">
                <select value={form.category} onChange={(e) => update('category', e.target.value)} className={inputClass}>
                  <option>Identity</option>
                  <option>Personal</option>
                </select>
              </Field>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <Field label="Sub-type">
                <input value={form.subType} onChange={(e) => update('subType', e.target.value)} placeholder="e.g. Research ID" className={inputClass} />
              </Field>
              <Field label="Expiry date">
                <input type="date" value={form.expiryDate} onChange={(e) => update('expiryDate', e.target.value)} className={inputClass} />
              </Field>
            </div>
            <Field label="Issuing authority">
              <input value={form.authority} onChange={(e) => update('authority', e.target.value)} placeholder="Authority" className={inputClass} />
            </Field>
            <PrimaryButton type="submit" className="w-full">Save document</PrimaryButton>
          </form>
        </Sheet>
      );
    }

    function TaskSheet({ open, onClose, onSave }) {
      const [form, setForm] = useState({ title: '', category: 'Teaching', priority: 'Medium', dueDate: addDays(1) });

      useEffect(() => {
        if (open) setForm({ title: '', category: 'Teaching', priority: 'Medium', dueDate: addDays(1) });
      }, [open]);

      const update = (key, value) => setForm((prev) => ({ ...prev, [key]: value }));

      const submit = (e) => {
        e.preventDefault();
        if (!form.title.trim()) return;
        onSave({
          id: `t-${Date.now()}`,
          title: form.title.trim(),
          category: form.category,
          priority: form.priority,
          dueDate: form.dueDate,
          status: 'Pending'
        });
      };

      const categories = ['Teaching', 'Research', 'NAAC', 'YRC', 'College', 'Personal'];

      return (
        <Sheet open={open} onClose={onClose} title="Add task" subtitle="Track a follow-up in your workspace">
          <form onSubmit={submit} className="space-y-3">
            <Field label="Task">
              <textarea value={form.title} onChange={(e) => update('title', e.target.value)} rows={2}
                placeholder="What needs to be done?" className={inputClass} required />
            </Field>
            <div className="grid grid-cols-2 gap-3">
              <Field label="Category">
                <select value={form.category} onChange={(e) => update('category', e.target.value)} className={inputClass}>
                  {categories.map((category) => <option key={category}>{category}</option>)}
                </select>
              </Field>
              <Field label="Priority">
                <select value={form.priority} onChange={(e) => update('priority', e.target.value)} className={inputClass}>
                  <option>High</option>
                  <option>Medium</option>
                  <option>Low</option>
                </select>
              </Field>
            </div>
            <Field label="Due date">
              <input type="date" value={form.dueDate} onChange={(e) => update('dueDate', e.target.value)} className={inputClass} />
            </Field>
            <PrimaryButton type="submit" className="w-full">Save task</PrimaryButton>
          </form>
        </Sheet>
      );
    }

    /* =========================================================
       16. APP ROOT
       ========================================================= */
    function App() {
      const [session, setSession] = useState(() => readSession());

      const handleAuthenticated = (next) => {
        saveSession(next);
        setSession(next);
      };

      const handleSignOut = () => {
        clearSession();
        setSession(null);
        window.scrollTo({ top: 0 });
      };

      return session
        ? <Workspace session={session} onSignOut={handleSignOut} />
        : <LoginScreen onAuthenticated={handleAuthenticated} />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <React.StrictMode>
        <App />
      </React.StrictMode>
    );
  </script>
</body>
</html>
