function doGet(e) {
  const action = (e.parameter.action || 'pull');
  const cb = e.parameter.callback;
  let result;
  try {
    if (action === 'pull') {
      const data = {};
      ['Profile','Expenses','Publications','Tasks','Documents',
       'Books','Patents','Certificates','Meetings','Subjects'].forEach(function (name) {
        data[name] = readSheet(getSheet(name));
      });
      result = { ok: true, data: data };
    } else {
      result = { ok: true, action: action, time: new Date().toISOString() };
    }
  } catch (err) { result = { ok: false, error: String(err) }; }
  const json = JSON.stringify(result);
  if (cb) return ContentService.createTextOutput(cb + '(' + json + ')')
    .setMimeType(ContentService.MimeType.JAVASCRIPT);
  return ContentService.createTextOutput(json)
    .setMimeType(ContentService.MimeType.JSON);
}

function doPost(e) {
  try {
    const body = JSON.parse(e.postData.contents);
    if (body.action === 'push') {
      writeAll(body.data || {});
      return out({ ok: true, savedAt: new Date().toISOString() });
    }
    if (body.action === 'backup') {
      const folder = DriveApp.getFolderById(FOLDER_ID);
      const stamp = new Date().toISOString().replace(/[:.]/g, '-');
      const name = 'bec-backup-' + stamp + '.json';
      folder.createFile(name, JSON.stringify(body.data, null, 2), 'application/json');
      return out({ ok: true, file: name });
    }
    return out({ ok: false, error: 'Unknown action' });
  } catch (err) { return out({ ok: false, error: String(err) }); }
}

function out(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj))
    .setMimeType(ContentService.MimeType.JSON);
}

function getSS() { return SpreadsheetApp.openById(SHEET_ID); }

function getSheet(name) {
  const ss = getSS();
  let sh = ss.getSheetByName(name);
  if (!sh) sh = ss.insertSheet(name);
  return sh;
}

function writeAll(data) {
  Object.keys(data).forEach(function (name) {
    const rows = data[name];
    if (!Array.isArray(rows)) return;
    const sh = getSheet(name);
    sh.clear();
    if (rows.length === 0) return;
    const headers = [];
    const seen = {};
    rows.forEach(function (r) {
      Object.keys(r).forEach(function (k) {
        if (!seen[k]) { seen[k] = true; headers.push(k); }
      });
    });
    const values = [headers].concat(rows.map(function (r) {
      return headers.map(function (h) {
        const v = r[h];
        if (v == null) return '';
        if (typeof v === 'object') return JSON.stringify(v);
        return v;
      });
    }));
    sh.getRange(1, 1, values.length, headers.length).setValues(values);
  });
}

function readSheet(sh) {
  const values = sh.getDataRange().getValues();
  if (values.length < 2) return [];
  const headers = values[0];
  return values.slice(1).map(function (row) {
    const obj = {};
    headers.forEach(function (h, i) {
      let v = row[i];
      if (typeof v === 'string' && (v.charAt(0) === '{' || v.charAt(0) === '[')) {
        try { v = JSON.parse(v); } catch (e) {}
      }
      obj[h] = v;
    });
    return obj;
  });
}`;

    function readSession() {
      try {
        const raw = sessionStorage.getItem(SESSION_KEY) || localStorage.getItem(SESSION_KEY);
        if (!raw) return null;
        const s = JSON.parse(raw);
        if (!s || !s.at || Date.now() - s.at > SESSION_TTL) { clearSession(); return null; }
        return s;
      } catch (e) { return null; }
    }
    function saveSession(s) {
      try {
        const payload = JSON.stringify(s);
        if (s.remember) localStorage.setItem(SESSION_KEY, payload);
        else sessionStorage.setItem(SESSION_KEY, payload);
      } catch (e) {}
    }
    function clearSession() {
      try { localStorage.removeItem(SESSION_KEY); sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
    }

    /* ================================================================

       ================================================================ */
    function renderHome() {

      const monthTotal = monthExp.reduce(function (s, e) { return s + Number(e.amount||0); }, 0);

      const dueSoon = openTasks.filter(function (t) { return daysUntil(t.dueDate) <= 1; });

      let html = '<div class="fade-up space-y-5 px-4 py-5">';

      html += '<section class="relative overflow-hidden rounded-3xl bg-ink p-5 text-white">' +
        '<div class="absolute -right-8 -top-10 h-32 w-32 rounded-full bg-brand/30 blur-2xl"></div>' +
        '<div class="relative">' +
          '<p class="text-[9.5px] font-semibold uppercase tracking-[0.18em] text-white/50">Basaveshwar Engineering College · Autonomous</p>' +
          '<h1 class="mt-1.5 text-[18px] font-extrabold leading-tight">' + escapeHtml(p.name) + '</h1>' +
          '<p class="text-[12px] text-white/75">' + escapeHtml(p.designation) + ' · ' + escapeHtml(p.department) + '</p>' +
          '<p class="mt-1 text-[10.5px] text-white/50">' + escapeHtml(p.employeeId) + ' · Joined ' + fmtDate(p.joiningDate) + ' · 15+ years</p>' +
          '<div class="mt-3 flex flex-wrap gap-1.5">' +
            '<a href="' + escapeHtml(p.orcidLink) + '" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 rounded-full bg-white px-2.5 py-1 text-[10px] font-bold text-ink">ORCID ' + escapeHtml(p.orcid) + icon('external','h-2.5 w-2.5') + '</a>' +
            '<a href="' + escapeHtml(p.scholarLink) + '" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 rounded-full bg-white/15 px-2.5 py-1 text-[10px] font-medium">Google Scholar ' + icon('external','h-2.5 w-2.5') + '</a>' +
          '</div>' +
          '<div class="mt-4 grid grid-cols-3 gap-2">' +
            ['Scopus|' + p.scopusId, 'Vidwan|' + p.vidwanId, 'Citations|150+'].map(function (item) {
              const parts = item.split('|');
              return '<div class="rounded-xl bg-white/10 px-2.5 py-2"><p class="text-[9px] uppercase tracking-wider text-white/50">' + parts[0] + '</p><p class="truncate text-[11px] font-semibold">' + parts[1] + '</p></div>';
            }).join('') +
          '</div>' +
        '</div></section>';

      html += '<section>' + sectionTitle(todayLabel);
      html += '<div class="grid grid-cols-2 gap-3">';
      if (focus) {
        html += '<button data-action="open-subject" data-id="' + focus.id + '" class="col-span-2 rounded-2xl border border-stone-200 bg-white p-4 text-left shadow-card hover:border-brand/30">' +
          '<div class="flex items-start justify-between">' +
            '<div class="min-w-0">' +
              '<p class="text-[10px] font-bold uppercase tracking-wider text-brand">In focus</p>' +
              '<p class="mt-1 truncate text-[14px] font-bold text-ink">' + escapeHtml(focus.name) + '</p>' +
              '<p class="mt-0.5 text-[11px] text-stone-500">' + escapeHtml(focus.code) + ' · ' + escapeHtml(focus.branch) + ' · Sem ' + focus.sem + ' · Div ' + escapeHtml(focus.division) + '</p>' +
              '<div class="mt-2 flex flex-wrap gap-1.5">' + badge((focus.attendance&&focus.attendance.average||0) + '% attendance', 'success') + badge(focus.students + ' students', 'neutral') + badge('CIE ' + (focus.cie&&focus.cie.average||0) + '/' + (focus.cie&&focus.cie.max||30), 'brand') + '</div>' +
            '</div>' +
            '<span class="grid h-8 w-8 shrink-0 place-items-center rounded-full bg-stone-50 text-stone-400">' + icon('chevronRight','h-4 w-4') + '</span>' +
          '</div></button>';
      }
      html += '<button data-action="nav" data-tab="more" data-module="tasks" class="rounded-2xl border border-red-100 bg-brand-soft p-3.5 text-left hover:border-brand/40">' +
        '<div class="flex items-center justify-between"><span class="text-[10px] font-bold uppercase tracking-wider text-brand">Due now</span>' + icon('alert','h-3.5 w-3.5 text-brand') + '</div>' +
        '<p class="mt-1.5 text-[22px] font-extrabold leading-none text-ink">' + dueSoon.length + '</p>' +
        '<p class="mt-1 text-[10.5px] text-stone-600">tasks due today or overdue</p></button>';
      html += '<button data-action="nav" data-tab="finance" class="rounded-2xl border border-stone-200 bg-white p-3.5 text-left shadow-card hover:border-brand/30">' +
        '<p class="text-[10px] font-bold uppercase tracking-wider text-stone-400">Spent this month</p>' +
        '<p class="mt-1.5 text-[18px] font-extrabold leading-none text-ink">' + fmtMoney(monthTotal) + '</p>' +
        '<p class="mt-1 text-[10.5px] text-stone-500">' + monthExp.length + ' recorded expenses</p></button>';
      html += '</div></section>';

      html += '<section>' + sectionTitle('Research profile', '<button data-action="nav" data-tab="research" class="text-[11px] font-semibold text-brand">View all</button>');
      html += card(
        '<div class="p-4">' +
          '<div class="grid grid-cols-4 gap-2">' +
            statTile('Pubs', state.publications.length, 'Scopus indexed') +
            statTile('Books', state.books.length, 'Published') +
            statTile('Patents', state.patents.length, 'Published') +
            statTile('h-index', '8', '150+ cites', 'brand') +
          '</div>' +
          '<div class="mt-4">' +
            '<p class="mb-2 text-[10px] font-bold uppercase tracking-wider text-stone-400">Publications by year</p>' +
            '<div class="flex h-20 items-end gap-1.5">' +
              yearsArr.map(function (y) {
                const h = Math.max(8, (byYear[y]/maxY)*64);
                return '<div class="flex flex-1 flex-col items-center gap-1"><div class="w-full rounded-t-md bg-brand/85" style="height:' + h + 'px" title="' + y + ': ' + byYear[y] + '"></div><span class="text-[8.5px] text-stone-400">' + y.slice(-2) + '</span></div>';
              }).join('') +
            '</div>' +
          '</div>' +
        '</div>'
      );
      html += '</section>';

      html += '<section>' + sectionTitle('Alerts');
      if (expiring.length > 0) {
        html += '<div class="rounded-2xl border border-amber-200 bg-amber-50 p-4">' +

          '<ul class="space-y-2">' + expiring.map(function (d) {

              const days = daysUntil(t.dueDate);
              return '<li class="flex items-start justify-between gap-3"><span class="min-w-0 text-[12px] leading-snug text-stone-700">' + escapeHtml(t.title) + '</span>' + badge(days < 0 ? Math.abs(days) + 'd late' : 'Today', days < 0 ? 'danger' : 'warn') + '</li>';

          '</div>',
          'mt-2.5'
        );

      html += '<section>' + sectionTitle('Administrative roles');

        return '<div class="flex items-start gap-2.5 px-4 py-3"><span class="mt-1.5 h-1.5 w-1.5 shrink-0 rounded-full bg-brand"></span><span class="text-[12px] leading-snug text-stone-700">' + escapeHtml(role) + '</span></div>';
      }).join('') + '</div>');
      html += '</section>';

      html += '</div>';
      return html;
    }

    /* ================================================================
       14. PAGE: ACADEMIC
       ================================================================ */
    function planStats(subject) {
      const units = (subject.plan && subject.plan.units) || [];
      const done = units.filter(function (u) { return u.status === 'Completed'; }).length;
      return { done: done, total: units.length, percent: units.length ? Math.round((done/units.length)*100) : 0 };
    }

    function renderAcademic() {
      if (state.activeSubjectId) {
        const subj = state.subjects.find(function (s) { return s.id === state.activeSubjectId; });
        if (subj) return renderSubjectDetail(subj);
      }

      const visible = state.subjects.filter(function (s) { return s.academicYear === state.year && s.semesterType === state.semester; });
      const years = [{ id: currentYear(), label: currentYear(), current: true }];

      let html = '<div class="fade-up space-y-5 px-4 py-5">';
      html += '<section>' + sectionTitle('Academic year');
      html += '<div class="space-y-2.5">' + years.map(function (y) {
        const active = y.id === state.year;
        const count = state.subjects.filter(function (s) { return s.academicYear === y.id; }).length;
        return '<button data-action="set-year" data-year="' + y.id + '" class="w-full rounded-2xl border p-4 text-left transition ' + (active ? 'border-ink bg-ink text-white shadow-card' : 'border-stone-200 bg-white text-ink hover:border-stone-300') + '">' +
          '<div class="flex items-center justify-between">' +
            '<div class="flex items-center gap-2"><span class="text-[15px] font-bold">' + escapeHtml(y.label) + '</span>' + (y.current ? '<span class="rounded-full bg-brand px-2 py-0.5 text-[9.5px] font-bold uppercase tracking-wide text-white">Current</span>' : '') + '</div>' +
            icon('chevronRight', 'h-4 w-4 ' + (active ? 'text-white/60' : 'text-stone-300')) +
          '</div>' +
          '<p class="mt-1 text-[11px] ' + (active ? 'text-white/60' : 'text-stone-500') + '">' + count + ' subjects on record</p></button>';
      }).join('') + '</div></section>';

      html += '<section>' + sectionTitle('Semester');
      html += '<div class="flex gap-2">' + ['ODD','EVEN','SUMMER'].map(function (t) {
        return '<button data-action="set-semester" data-sem="' + t + '" class="flex-1 rounded-xl border py-2.5 text-[12.5px] font-semibold transition ' + (state.semester === t ? 'border-brand bg-brand text-white' : 'border-stone-200 bg-white text-stone-600 hover:border-stone-300') + '">' + t + '</button>';
      }).join('') + '</div></section>';

      html += '<section>' + sectionTitle(state.year + ' · ' + state.semester, '<span class="text-[11px] text-stone-400">' + visible.length + ' subjects</span>');
      if (visible.length === 0) {
        html += emptyState('cap', 'No subjects for this semester', 'Add a subject from More → Settings → Manage data, or switch semester.');
      } else {
        html += '<div class="space-y-3">' + visible.map(function (s) {
          const st = planStats(s);
          const att = (s.attendance && s.attendance.average) || 0;
          const cie = (s.cie && s.cie.average) || 0;
          const cieMax = (s.cie && s.cie.max) || 30;
          return '<button data-action="open-subject" data-id="' + s.id + '" class="w-full rounded-2xl border border-stone-200 bg-white p-4 text-left shadow-card hover:border-brand/30">' +
            '<div class="flex items-start justify-between gap-3">' +
              '<div class="min-w-0">' +
                '<p class="text-[10.5px] font-bold uppercase tracking-wide text-brand">' + escapeHtml(s.code) + ' · ' + escapeHtml(s.ltp) + ' · ' + s.credits + ' credits</p>' +
                '<p class="mt-1 text-[13.5px] font-bold leading-snug text-ink">' + escapeHtml(s.name) + '</p>' +
                '<p class="mt-1 text-[11px] text-stone-500">' + escapeHtml(s.branch) + ' · Sem ' + s.sem + ' · Div ' + escapeHtml(s.division) + ' · ' + s.students + ' students</p>' +
              '</div>' +
              '<span class="grid h-8 w-8 shrink-0 place-items-center rounded-full bg-stone-50 text-stone-400">' + icon('chevronRight','h-4 w-4') + '</span>' +
            '</div>' +
            '<div class="mt-3 flex flex-wrap gap-1.5">' + badge(att + '% attendance', 'success') + badge(st.percent + '% syllabus', 'neutral') + badge('CIE ' + cie + '/' + cieMax, 'brand') + '</div>' +
            '<div class="mt-3 h-1.5 overflow-hidden rounded-full bg-stone-100"><div class="h-full rounded-full bg-ink" style="width:' + st.percent + '%"></div></div>' +
          '</button>';
        }).join('') + '</div>';
      }
      html += '</section></div>';
      return html;
    }

    function renderSubjectDetail(s) {
      const st = planStats(s);
      const tab = state.subjectTab || 'Overview';
      const tabs = ['Overview','Timetable','Attendance','Lesson plan','Notes','CIE','Course file'];
      const notes = s.notes || [];
      const schedule = s.schedule || [];
      const units = (s.plan && s.plan.units) || [];
      const att = (s.attendance && s.attendance.average) || 0;
      const attBelow = (s.attendance && s.attendance.below) || 0;
      const cie = s.cie || { test:'CIE Test 1', average:0, max:30, passRate:0 };

      let body = '';

      if (tab === 'Overview') {
        body = '<div class="grid grid-cols-2 gap-3">' + statTile('Class strength', s.students, 'Division ' + s.division) + statTile('Attendance', att + '%', attBelow + ' below 75%', 'brand') + '</div>' +
          card('<div class="p-4"><div class="mb-2 flex items-center justify-between"><p class="text-[12.5px] font-bold text-ink">Syllabus coverage</p><span class="text-[11px] font-semibold text-stone-500">' + st.done + '/' + st.total + ' units</span></div>' +
            '<div class="h-2 overflow-hidden rounded-full bg-stone-100"><div class="h-full rounded-full bg-ink" style="width:' + st.percent + '%"></div></div>' +
            '<p class="mt-2 text-[11px] text-stone-500">' + st.percent + '% of the planned syllabus is complete.</p></div>', 'mt-3') +
          card('<div class="p-4"><p class="mb-2 text-[12.5px] font-bold text-ink">CIE performance</p>' +
            '<div class="flex items-center justify-between text-[12px] text-stone-600"><span>' + escapeHtml(cie.test) + '</span><span class="font-bold text-ink">' + cie.average + '/' + cie.max + '</span></div>' +
            '<div class="mt-2 h-2 overflow-hidden rounded-full bg-stone-100"><div class="h-full rounded-full bg-brand" style="width:' + ((cie.average/cie.max)*100) + '%"></div></div>' +
            '<p class="mt-2 text-[11px] text-stone-500">Pass rate ' + (cie.passRate||0) + '%</p></div>', 'mt-3');
      } else if (tab === 'Timetable') {
        body = card('<div class="divide-y divide-stone-100">' + (schedule.length === 0 ? '<p class="px-4 py-6 text-center text-[12px] text-stone-400">No timetable slots.</p>' : schedule.map(function (slot) {
          return '<div class="flex items-center gap-3 px-4 py-3"><span class="grid h-9 w-11 place-items-center rounded-lg bg-ink text-[11px] font-bold text-white">' + escapeHtml(slot.day) + '</span>' +
            '<div><p class="text-[12.5px] font-semibold text-ink">' + escapeHtml(slot.time) + '</p><p class="text-[11px] text-stone-500">' + escapeHtml(slot.room) + '</p></div></div>';
        }).join('')) + '</div>');
      } else if (tab === 'Attendance') {
        body = card('<div class="p-4"><div class="flex items-center justify-between"><p class="text-[12.5px] font-bold text-ink">Average attendance</p><span class="text-[12.5px] font-bold text-brand">' + att + '%</span></div>' +
          '<div class="mt-2 h-2 overflow-hidden rounded-full bg-stone-100"><div class="h-full rounded-full bg-brand" style="width:' + att + '%"></div></div>' +
          '<p class="mt-2 text-[11px] text-stone-500">' + attBelow + ' students below the 75% threshold.</p></div>');
      } else if (tab === 'Lesson plan') {
        body = card('<div class="p-4"><div class="h-2 overflow-hidden rounded-full bg-stone-100"><div class="h-full rounded-full bg-brand" style="width:' + st.percent + '%"></div></div><p class="mt-2 text-[11px] text-stone-500">' + st.done + ' of ' + st.total + ' units complete · ' + st.percent + '%</p></div>') +
          (units.length === 0 ? emptyState('clipboard', 'No lesson plan', 'Units will appear once you add them.') :
          units.map(function (u) {
            const tone = u.status === 'Completed' ? 'success' : u.status === 'In Progress' ? 'neutral' : 'warn';
            return card('<div class="flex items-center justify-between gap-3 p-4"><span class="text-[12.5px] font-semibold text-ink">' + escapeHtml(u.name) + '</span>' + badge(u.status, tone) + '</div>', 'mt-3');
          }).join(''));
      } else if (tab === 'Notes') {
        if (notes.length === 0) {
          body = emptyState('file', 'No material uploaded', 'Upload notes, slides or code for this subject.');
        } else {
          body = notes.map(function (n) {
            return card('<div class="flex items-center gap-3 p-4"><span class="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-brand-soft text-brand">' + icon('file','h-5 w-5') + '</span>' +
              '<div class="min-w-0"><p class="truncate text-[12.5px] font-semibold text-ink">' + escapeHtml(n.name) + '</p><p class="text-[11px] text-stone-500">' + escapeHtml(n.type) + ' · ' + escapeHtml(s.code) + '</p></div></div>', 'mt-3');
          }).join('');
        }
      } else if (tab === 'CIE') {
        body = card('<div class="overflow-hidden">' +
          '<div class="grid grid-cols-4 bg-stone-50 px-4 py-2.5 text-[10px] font-bold uppercase tracking-wide text-stone-500"><span>Test</span><span class="text-center">Max</span><span class="text-center">Average</span><span class="text-right">Status</span></div>' +
          '<div class="grid grid-cols-4 border-t border-stone-100 px-4 py-3 text-[12px]"><span class="font-medium text-ink">' + escapeHtml(cie.test) + '</span><span class="text-center text-stone-600">' + cie.max + '</span><span class="text-center font-bold text-ink">' + cie.average + '</span><span class="text-right font-semibold text-emerald-600">Completed</span></div></div>') +
          '<div class="mt-3 rounded-2xl bg-ink p-4 text-white"><p class="text-[10px] uppercase tracking-wider text-white/50">Consolidated CIE</p><p class="mt-1 text-[18px] font-extrabold">' + cie.average + '/' + cie.max + ' average</p><p class="mt-1 text-[11px] text-white/60">Pass rate ' + (cie.passRate||0) + '%</p></div>';
      } else if (tab === 'Course file') {
        const checklist = buildChecklist(s);
        const done = checklist.filter(function (c) { return c.done; }).length;
        const pct = Math.round((done / checklist.length) * 100);
        body = card('<div class="p-4"><div class="mb-3 flex items-center justify-between"><p class="text-[12.5px] font-bold text-ink">Course file checklist</p>' + badge(done + '/' + checklist.length + ' · ' + pct + '%', pct >= 75 ? 'success' : 'warn') + '</div>' +
          '<div class="mb-4 h-2 overflow-hidden rounded-full bg-stone-100"><div class="h-full rounded-full bg-brand" style="width:' + pct + '%"></div></div>' +
          '<ul class="max-h-[340px] space-y-1.5 overflow-y-auto pr-1">' + checklist.map(function (item, i) {
            return '<li class="flex items-center gap-2.5 py-1"><span class="grid h-5 w-5 shrink-0 place-items-center rounded-full border ' + (item.done ? 'border-emerald-600 bg-emerald-600 text-white' : 'border-stone-300 bg-white text-transparent') + '">' + icon('check','h-3 w-3') + '</span>' +
              '<span class="text-[12px] ' + (item.done ? 'text-stone-700' : 'text-stone-400') + '">' + (i+1) + '. ' + escapeHtml(item.label) + '</span></li>';
          }).join('') + '</ul></div>');
      }

      return '<div class="fade-up pb-6">' +
        '<div class="sticky top-[124px] z-20 bg-ink px-4 py-4 text-white">' +
          '<button data-action="close-subject" class="mb-2 inline-flex items-center gap-1 text-[11.5px] text-white/70 hover:text-white">' + icon('arrowLeft','h-3.5 w-3.5') + 'Back to academics</button>' +
          '<h1 class="text-[16px] font-extrabold leading-tight">' + escapeHtml(s.name) + '</h1>' +
          '<p class="mt-1 text-[11px] text-white/70">' + escapeHtml(s.code) + ' · ' + escapeHtml(s.branch) + ' · Sem ' + s.sem + ' · Div ' + escapeHtml(s.division) + ' · ' + s.students + ' students</p>' +
          '<p class="mt-0.5 text-[10.5px] text-white/50">L-T-P ' + escapeHtml(s.ltp) + ' · ' + s.credits + ' credits · ' + escapeHtml(s.faculty) + '</p>' +
        '</div>' +
        '<div class="no-scrollbar sticky top-[248px] z-10 flex gap-2 overflow-x-auto border-b border-stone-200 bg-white px-4 py-2.5">' +
          tabs.map(function (t) {
            return '<button data-action="set-subject-tab" data-tab="' + t + '" class="whitespace-nowrap rounded-full border px-3 py-1.5 text-[11.5px] font-semibold transition ' + (tab === t ? 'border-brand bg-brand text-white' : 'border-stone-200 bg-white text-stone-600 hover:border-stone-300') + '">' + t + '</button>';
          }).join('') +
        '</div>' +
        '<div class="space-y-3 px-4 py-4">' + body + '</div>' +
        '</div>';
    }

    function buildChecklist(s) {
      const st = planStats(s);
      const notes = s.notes || [];
      const schedule = s.schedule || [];
      const att = (s.attendance && s.attendance.average) || 0;
      const cie = s.cie || {};
      return [
        { label:'Course information sheet', done:Boolean(s.code) },
        { label:'Approved syllabus', done:true },
        { label:'Course objectives', done:true },
        { label:'Course outcomes', done:true },
        { label:'CO–PO mapping', done:true },
        { label:'CO–PSO mapping', done:true },
        { label:'Academic calendar', done:true },
        { label:'Timetable', done:schedule.length > 0 },
        { label:'Lesson plan (5 units)', done:st.total >= 5 },
        { label:'Teaching plan', done:true },
        { label:'Teaching–learning methodologies', done:true },
        { label:'Notes & reference material', done:notes.length > 0 },
        { label:'Attendance register', done:att > 0 },
        { label:'CIE records', done:Boolean(cie.average) },
        { label:'Question papers', done:true },
        { label:'Assignments', done:true },
        { label:'Performance analysis', done:false },
        { label:'Result analysis', done:false },
        { label:'CO attainment', done:false },
        { label:'PO attainment', done:false },
        { label:'PSO attainment', done:false },
        { label:'Student feedback', done:false },
        { label:'Corrective actions', done:false },
        { label:'Continuous improvement', done:false },
        { label:'Previous year comparison', done:false },
        { label:'Evidence attachments', done:notes.length > 0 }
      ];
    }

    /* ================================================================
       16. PAGE: FINANCE
       ================================================================ */
    function renderFinance() {
      const thisMonth = state.expenses.filter(function (e) { return String(e.date).slice(0,7) === monthKey(); });
      const monthTotal = thisMonth.reduce(function (s, e) { return s + Number(e.amount||0); }, 0);
      const todayTotal = state.expenses.filter(function (e) { return String(e.date).slice(0,10) === today(); }).reduce(function (s, e) { return s + Number(e.amount||0); }, 0);
      const income = 95000 + 8000;
      const byCat = {};
      thisMonth.forEach(function (e) { byCat[e.category] = (byCat[e.category]||0) + Number(e.amount||0); });
      const cats = Object.keys(byCat).sort(function (a,b) { return byCat[b] - byCat[a]; });
      const maxCat = Math.max(1, ...cats.map(function (c) { return byCat[c]; }));

      const sorted = state.expenses.slice().sort(function (a,b) { return String(b.date).localeCompare(String(a.date)); });

      return '<div class="fade-up space-y-4 px-4 py-5">' +
        '<div class="grid grid-cols-2 gap-3">' +
          statTile('Spent today', fmtMoney(todayTotal), 'All categories') +
          statTile('This month', fmtMoney(monthTotal), thisMonth.length + ' expenses', 'brand') +
          statTile('Gross income', fmtMoney(income), 'Salary + other') +
          statTile('Net balance', fmtMoney(income - monthTotal), 'Income − expenses', 'dark') +
        '</div>' +
        card('<div class="p-4"><div class="mb-3 flex items-center justify-between"><p class="text-[12.5px] font-bold text-ink">Category breakdown</p><span class="text-[11px] text-stone-400">This month</span></div>' +
          (cats.length === 0 ? '<p class="py-3 text-center text-[12px] text-stone-400">No expenses recorded this month.</p>' :
            '<ul class="space-y-2.5">' + cats.map(function (c) {
              return '<li class="flex items-center gap-3"><span class="w-20 shrink-0 truncate text-[11.5px] text-stone-600">' + escapeHtml(c) + '</span><span class="h-2 flex-1 overflow-hidden rounded-full bg-stone-100"><span class="block h-full rounded-full bg-brand" style="width:' + ((byCat[c]/maxCat)*100) + '%"></span></span><span class="w-16 shrink-0 text-right text-[11.5px] font-semibold text-ink">' + fmtMoney(byCat[c]) + '</span></li>';
            }).join('') + '</ul>') +
          '</div>') +
        '<div class="flex gap-2">' + primaryBtn(icon('plus','h-4 w-4') + 'Add expense', 'data-action="open-sheet" data-sheet="expense"', 'flex-1') + ghostBtn(icon('download','h-4 w-4') + 'Export', 'data-action="export-expenses"') + '</div>' +
        sectionTitle('All expenses', '<span class="text-[11px] text-stone-400">' + state.expenses.length + ' records</span>') +
        (sorted.length === 0 ? emptyState('wallet','No expenses','Record your first expense.') :
          '<div class="space-y-2.5">' + sorted.map(function (e) {
            return card('<div class="flex items-center justify-between gap-3 p-3.5">' +
              '<div class="flex min-w-0 items-center gap-3"><span class="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-stone-100 text-stone-500">' + icon('wallet','h-4 w-4') + '</span>' +
              '<div class="min-w-0"><p class="truncate text-[12.5px] font-semibold text-ink">' + escapeHtml(e.description) + '</p><p class="truncate text-[10.5px] text-stone-500">' + fmtDate(e.date) + ' · ' + escapeHtml(e.category) + ' · ' + escapeHtml(e.paymentMode) + '</p></div></div>' +
              '<div class="shrink-0 text-right"><p class="text-[13px] font-bold text-ink">' + fmtMoney(e.amount) + '</p><div class="mt-0.5 flex justify-end gap-1"><button data-action="edit-record" data-type="expense" data-id="' + e.id + '" class="text-[10px] font-semibold text-stone-400 hover:text-brand">Edit</button><button data-action="delete-record" data-type="expense" data-id="' + e.id + '" class="text-[10px] font-semibold text-stone-400 hover:text-brand">Remove</button></div></div>' +
              '</div>');
          }).join('') + '</div>') +

    /* ================================================================

       ================================================================ */
    function renderDocuments() {

      return '<div class="fade-up space-y-4 px-4 py-5">' +
        '<div class="flex items-start gap-3 rounded-2xl bg-ink p-4 text-white">' + icon('shield','mt-0.5 h-5 w-5 shrink-0 text-white/70') +
          '<div><p class="text-[12.5px] font-bold">Encrypted local vault</p><p class="mt-1 text-[11px] leading-relaxed text-white/60">Aadhaar and PAN are masked by default. All records are stored in this browser and can be backed up to your Google Sheet / Drive from Settings → Cloud sync.</p></div></div>' +
        (expiring.length > 0 ? '<div class="flex items-start gap-2 rounded-xl border border-red-200 bg-red-50 px-3 py-2.5">' + icon('alert','mt-0.5 h-4 w-4 shrink-0 text-brand') + '<p class="text-[11.5px] font-semibold text-brand">' + expiring.length + ' document(s) expiring within 60 days</p></div>' : '') +
        '<div class="flex items-center justify-between gap-3">' +
          '<div class="no-scrollbar flex gap-1.5 overflow-x-auto">' +
            cats.map(function (c) {
              return '<button data-action="set-doc-filter" data-filter="' + c + '" class="shrink-0 rounded-full border px-3 py-1.5 text-[11.5px] font-semibold transition ' + (filter === c ? 'border-brand bg-brand text-white' : 'border-stone-200 bg-white text-stone-600') + '">' + c + '</button>';
            }).join('') +
          '</div>' +
          primaryBtn(icon('plus','h-3.5 w-3.5') + 'Add', 'data-action="open-sheet" data-sheet="document"', 'shrink-0 px-3 py-2 text-[11.5px]') +
        '</div>' +
        (list.length === 0 ? emptyState('folder','No documents','Add identity or research documents.') :
          '<div class="space-y-3">' + list.map(function (d) {
            const revealed = state.revealedDocs[d.id];
            const days = d.expiryDate ? daysUntil(d.expiryDate) : null;
            return card('<div class="p-4">' +
              '<div class="flex items-start justify-between gap-3"><div class="flex min-w-0 items-start gap-3">' +
                '<span class="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-stone-100 text-stone-500">' + icon('file','h-5 w-5') + '</span>' +
                '<div class="min-w-0"><p class="text-[12.5px] font-bold text-ink">' + escapeHtml(d.name) + '</p>' +
                  '<p class="text-[11px] text-stone-500">' + escapeHtml(d.category) + ' · ' + escapeHtml(d.subType) + '</p>' +
                  '<p class="text-[10.5px] text-stone-400">' + escapeHtml(d.authority) + '</p></div></div>' +
                '<div class="flex shrink-0 gap-1"><button data-action="edit-record" data-type="document" data-id="' + d.id + '" aria-label="Edit" class="grid h-8 w-8 place-items-center rounded-full bg-stone-50 text-stone-400 hover:bg-stone-100 hover:text-ink">' + icon('pencil','h-3.5 w-3.5') + '</button>' +
                '<button data-action="delete-record" data-type="document" data-id="' + d.id + '" aria-label="Remove" class="grid h-8 w-8 place-items-center rounded-full bg-stone-50 text-stone-400 hover:bg-red-50 hover:text-brand">' + icon('trash','h-3.5 w-3.5') + '</button></div>' +
              '</div>' +
              '<div class="mt-3 flex items-center justify-between gap-3 rounded-xl bg-stone-50 px-3 py-2.5">' +
                '<span class="truncate font-mono text-[12px] font-semibold tracking-wide text-ink">' + maskNum(d.docNumber, revealed) + '</span>' +
                '<button data-action="toggle-doc" data-id="' + d.id + '" aria-label="Reveal" class="grid h-7 w-7 shrink-0 place-items-center rounded-full border border-stone-200 bg-white text-stone-500 hover:bg-stone-100">' + icon(revealed ? 'eyeOff' : 'eye', 'h-3.5 w-3.5') + '</button>' +
              '</div>' +
              '<div class="mt-2.5 flex flex-wrap items-center gap-1.5">' +
                (d.expiryDate ? badge('Expires ' + fmtDate(d.expiryDate), days !== null && days <= 30 ? 'danger' : 'warn') : badge('No expiry','neutral')) +
                (d.tags || []).map(function (t) { return badge(t, 'neutral'); }).join('') +
              '</div>' +
              (d.notes ? '<p class="mt-2 text-[11px] text-stone-500">' + escapeHtml(d.notes) + '</p>' : '') +

    /* ================================================================
       18. PAGE: MORE + SETTINGS (CRUD + Cloud)
       ================================================================ */
    const MODULES = [
      { id:'tasks', label:'Tasks & reminders', desc:'Due, overdue and completed', icon:'clipboard' },
      { id:'meetings', label:'Meetings', desc:'Department & YRC minutes', icon:'users' },
      { id:'certificates', label:'Certificates', desc:'FDPs and workshops', icon:'award' },
      { id:'accreditation', label:'NAAC / NBA vault', desc:'Evidence readiness', icon:'building' },
      { id:'reports', label:'Reports & backup', desc:'CSV, JSON, Drive', icon:'download' },
      { id:'links', label:'Important links', desc:'VTU, ORCID, Scholar', icon:'link' },
      { id:'settings', label:'Settings & data', desc:'Profile, CRUD, cloud sync', icon:'settings' }
    ];

    function renderMore() {
      if (!state.moreModule) {
        return '<div class="fade-up space-y-4 px-4 py-5">' +
          sectionTitle('Workspace modules') +
          '<div class="grid grid-cols-2 gap-3">' + MODULES.map(function (m) {
            return '<button data-action="set-module" data-module="' + m.id + '" class="rounded-2xl border border-stone-200 bg-white p-4 text-left shadow-card hover:border-brand/30">' +
              '<span class="grid h-10 w-10 place-items-center rounded-xl bg-stone-50 text-ink">' + icon(m.icon, 'h-5 w-5') + '</span>' +
              '<p class="mt-3 text-[12.5px] font-bold leading-tight text-ink">' + escapeHtml(m.label) + '</p>' +
              '<p class="mt-1 text-[10.5px] leading-snug text-stone-500">' + escapeHtml(m.desc) + '</p></button>';
          }).join('') + '</div>' +
          '<button data-action="logout" class="flex w-full items-center justify-center gap-2 rounded-2xl border border-stone-200 bg-white py-3 text-[12.5px] font-semibold text-stone-600 hover:border-red-200 hover:bg-red-50 hover:text-brand">' + icon('logout','h-4 w-4') + 'Sign out</button>' +
          '</div>';
      }

      const titles = { tasks:'Tasks & reminders', meetings:'Meetings', certificates:'Certificates & FDPs', accreditation:'NAAC / NBA vault', reports:'Reports & backup', links:'Important links', settings:'Settings & data' };
      let body = '';

      if (state.moreModule === 'tasks') {
        body = primaryBtn(icon('plus','h-4 w-4') + 'Add task', 'data-action="open-sheet" data-sheet="task"', 'w-full mb-3') +
          (state.tasks.length === 0 ? emptyState('clipboard','No tasks','Add a follow-up to track.') :
          state.tasks.slice().sort(function (a,b) {
            if ((a.status==='Completed') !== (b.status==='Completed')) return a.status==='Completed'?1:-1;
            return String(a.dueDate).localeCompare(String(b.dueDate));
          }).map(function (t) {
            const done = t.status === 'Completed';
            const status = done ? 'Completed' : (daysUntil(t.dueDate) < 0 ? 'Overdue' : 'Pending');
            const tone = done ? 'success' : status === 'Overdue' ? 'danger' : 'warn';
            return card('<div class="flex items-start gap-3 p-4">' +
              '<button data-action="toggle-task" data-id="' + t.id + '" aria-label="Toggle" class="mt-0.5 grid h-5 w-5 shrink-0 place-items-center rounded-full border ' + (done ? 'border-emerald-600 bg-emerald-600 text-white' : 'border-stone-300 bg-white text-transparent hover:border-emerald-500') + '">' + icon('check','h-3 w-3') + '</button>' +
              '<div class="min-w-0 flex-1"><p class="text-[12.5px] font-semibold leading-snug ' + (done ? 'text-stone-400 line-through' : 'text-ink') + '">' + escapeHtml(t.title) + '</p>' +
              '<p class="mt-1 text-[10.5px] text-stone-500">' + escapeHtml(t.category) + ' · ' + escapeHtml(t.priority) + ' · due ' + fmtDate(t.dueDate) + '</p></div>' +
              '<div class="flex shrink-0 flex-col items-end gap-1.5">' + badge(status, tone) + '<div class="flex gap-1"><button data-action="edit-record" data-type="task" data-id="' + t.id + '" class="text-[10px] font-semibold text-stone-400 hover:text-ink">Edit</button><button data-action="delete-record" data-type="task" data-id="' + t.id + '" class="text-[10px] font-semibold text-stone-400 hover:text-brand">Delete</button></div></div>' +
              '</div>', 'mb-2.5');
          }).join(''));
      } else if (state.moreModule === 'meetings') {
        body = primaryBtn(icon('plus','h-4 w-4') + 'Add meeting', 'data-action="open-sheet" data-sheet="meeting"', 'w-full mb-3') +
          (state.meetings.length === 0 ? emptyState('users','No meetings','Add meeting minutes.') :
          state.meetings.map(function (m) {
            return card('<div class="p-4"><div class="flex items-start justify-between gap-3"><p class="text-[12.5px] font-bold text-ink">' + escapeHtml(m.title) + '</p>' + badge(m.type, m.type==='YRC'?'brand':'success') + '</div>' +
              '<p class="mt-1 text-[11px] text-stone-500">' + fmtDate(m.date) + ' · ' + escapeHtml(m.time) + ' · ' + escapeHtml(m.venue) + ' · ' + m.participants + ' participants</p>' +
              '<div class="mt-3 rounded-xl bg-stone-50 p-3"><p class="mb-1 text-[10px] font-bold uppercase tracking-wider text-stone-400">Minutes</p><p class="text-[11.5px] leading-relaxed text-stone-600">' + escapeHtml(m.minutes) + '</p></div>' +
              '<div class="mt-2 flex justify-end gap-1"><button data-action="edit-record" data-type="meeting" data-id="' + m.id + '" class="rounded-md bg-stone-100 px-2 py-1 text-[10px] font-semibold text-stone-700 hover:bg-stone-200">Edit</button>' +
              '<button data-action="delete-record" data-type="meeting" data-id="' + m.id + '" class="rounded-md bg-red-50 px-2 py-1 text-[10px] font-semibold text-brand hover:bg-red-100">Delete</button></div>' +
              '</div>', 'mb-3');
          }).join(''));
      } else if (state.moreModule === 'certificates') {
        body = primaryBtn(icon('plus','h-4 w-4') + 'Add certificate', 'data-action="open-sheet" data-sheet="certificate"', 'w-full mb-3') +
          state.certificates.map(function (c) {
            return card('<div class="flex gap-3 p-4"><span class="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-amber-50 text-amber-600">' + icon('award','h-5 w-5') + '</span>' +
              '<div class="min-w-0 flex-1"><h3 class="text-[12.5px] font-bold text-ink">' + escapeHtml(c.title) + '</h3>' +
              '<p class="mt-1 text-[11px] text-stone-500">' + escapeHtml(c.org) + ' · ' + fmtDate(c.date) + ' · ' + escapeHtml(c.duration) + '</p>' +
              '<div class="mt-2 flex items-center justify-between"><div class="flex flex-wrap gap-1.5">' + badge(c.type,'neutral') + badge(c.location,'neutral') + '</div>' +
              '<div class="flex gap-1"><button data-action="edit-record" data-type="certificate" data-id="' + c.id + '" class="rounded-md bg-stone-100 px-2 py-1 text-[10px] font-semibold text-stone-700 hover:bg-stone-200">Edit</button>' +
              '<button data-action="delete-record" data-type="certificate" data-id="' + c.id + '" class="rounded-md bg-red-50 px-2 py-1 text-[10px] font-semibold text-brand hover:bg-red-100">Delete</button></div>' +
              '</div></div></div>', 'mb-3');
          }).join('');
      } else if (state.moreModule === 'accreditation') {
        const overall = state.subjects.length === 0 ? 0 : Math.round(state.subjects.reduce(function (sum, s) {
          const cl = buildChecklist(s);
          return sum + (cl.filter(function (c) { return c.done; }).length / cl.length) * 100;
        }, 0) / state.subjects.length);
        body = '<div class="rounded-2xl bg-ink p-4 text-white mb-3"><p class="text-[10px] uppercase tracking-wider text-white/50">Course file readiness</p><p class="mt-1 text-[24px] font-extrabold leading-none">' + overall + '%</p><p class="mt-1 text-[11px] text-white/60">Across ' + state.subjects.length + ' subjects</p></div>' +
          state.subjects.map(function (s) {
            const cl = buildChecklist(s);
            const done = cl.filter(function (c) { return c.done; }).length;
            const pct = Math.round((done/cl.length)*100);
            return card('<div class="p-4"><div class="flex items-start justify-between gap-3"><div class="min-w-0"><p class="truncate text-[12.5px] font-bold text-ink">' + escapeHtml(s.name) + '</p><p class="text-[11px] text-stone-500">' + escapeHtml(s.code) + ' · ' + escapeHtml(s.branch) + '</p></div>' + badge(done + '/' + cl.length, pct >= 75 ? 'success' : pct >= 50 ? 'warn' : 'danger') + '</div>' +
              '<div class="mt-2.5 h-1.5 overflow-hidden rounded-full bg-stone-100"><div class="h-full rounded-full bg-brand" style="width:' + pct + '%"></div></div></div>', 'mb-2.5');
          }).join('');
      } else if (state.moreModule === 'reports') {
        body = '<div class="space-y-2.5">' +
          [['Expenses (CSV)', state.expenses.length + ' records', 'export-expenses'],
           ['Publications (CSV)', state.publications.length + ' records', 'export-publications'],
           ['Tasks (CSV)', state.tasks.length + ' records', 'export-tasks'],
           ['Full backup (JSON)', 'All collections + profile', 'export-backup'],
           ['Save backup to Google Drive', 'Uses Apps Script backup endpoint', 'cloud-backup']].map(function (item) {
            return '<button data-action="' + item[2] + '" class="flex w-full items-center gap-3 rounded-2xl border border-stone-200 bg-white p-4 text-left shadow-card hover:border-brand/30">' +
              '<span class="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-stone-50 text-ink">' + icon(item[2] === 'cloud-backup' ? 'cloud' : 'download','h-5 w-5') + '</span>' +
              '<span class="min-w-0 flex-1"><span class="block text-[12.5px] font-bold text-ink">' + item[0] + '</span><span class="block text-[10.5px] text-stone-500">' + item[1] + '</span></span>' +
              icon(item[2] === 'cloud-backup' ? 'upload' : 'download','h-4 w-4 shrink-0 text-stone-400') + '</button>';
          }).join('') +
          '</div>';
      } else if (state.moreModule === 'links') {
        const p = state.profile;
        const links = [
          ['ORCID', p.orcid, p.orcidLink],
          ['Google Scholar', p.scholarId, p.scholarLink],
          ['ResearchGate', 'Profile', p.researchGate],
          ['Personal website', p.website.replace('https://',''), p.website],
          ['Google Sheet', 'Workspace data', state.cloud.sheetUrl],
          ['Google Drive', 'Backups folder', state.cloud.driveUrl],
          ['VTU', 'vtu.ac.in', 'https://vtu.ac.in']
        ];
        body = '<div class="space-y-2.5">' + links.map(function (l) {
          return '<a href="' + escapeHtml(l[2]) + '" target="_blank" rel="noopener noreferrer" class="flex items-center justify-between gap-3 rounded-2xl border border-stone-200 bg-white p-4 shadow-card hover:border-brand/30">' +
            '<div class="flex min-w-0 items-center gap-3"><span class="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-stone-50 text-ink">' + icon('link','h-4 w-4') + '</span>' +
            '<div class="min-w-0"><p class="text-[12.5px] font-semibold text-ink">' + escapeHtml(l[0]) + '</p><p class="truncate text-[10.5px] text-stone-500">' + escapeHtml(l[1]) + '</p></div></div>' +
            icon('external','h-4 w-4 shrink-0 text-stone-400') + '</a>';
        }).join('') + '</div>';
      } else if (state.moreModule === 'settings') {
        body = renderSettings();

      return '<div class="fade-up px-4 py-5">' +
        '<button data-action="set-module" data-module="" class="mb-4 inline-flex items-center gap-1 text-[11.5px] font-semibold text-stone-500 hover:text-ink">' + icon('arrowLeft','h-3.5 w-3.5') + 'Back to modules</button>' +
        '<h1 class="mb-4 text-[17px] font-extrabold text-ink">' + escapeHtml(titles[state.moreModule] || '') + '</h1>' +
        body + '</div>';
    }

        ['name','Full name'], ['designation','Designation'], ['department','Department'],

      // ---- Apps Script code ----
      html += card('<div class="p-4"><div class="mb-2 flex items-center justify-between"><p class="text-[10px] font-bold uppercase tracking-wider text-stone-400">Apps Script setup</p>' +
        '<button data-action="copy-apps-script" class="inline-flex items-center gap-1 rounded-md bg-stone-100 px-2 py-1 text-[10px] font-semibold text-stone-700 hover:bg-stone-200">' + icon('copy','h-3 w-3') + 'Copy</button></div>' +
        '<p class="mb-2 text-[10.5px] leading-relaxed text-stone-500">Open your sheet → Extensions → Apps Script → paste → Deploy as Web App → paste the /exec URL above.</p>' +
        '<pre id="apps-script-code" class="max-h-[260px] overflow-auto rounded-xl bg-ink p-3 text-[9.5px] leading-relaxed text-white/90">' + escapeHtml(APPS_SCRIPT_CODE) + '</pre></div>', 'mb-3');

      // ---- Session ----
      html += card('<div class="p-4"><p class="mb-3 text-[10px] font-bold uppercase tracking-wider text-stone-400">Session</p>' +
        '<dl class="space-y-2 text-[12px]"><div class="flex justify-between gap-3"><dt class="text-stone-500">Signed in as</dt><dd class="truncate font-semibold text-ink">' + escapeHtml((state.session && state.session.email) || '—') + '</dd></div>' +
        '<div class="flex justify-between gap-3"><dt class="text-stone-500">Storage</dt><dd class="font-semibold text-ink">Local + Google Sheet</dd></div></dl>' +
        '<div class="mt-3 grid grid-cols-2 gap-2"><button data-action="logout" class="inline-flex items-center justify-center gap-2 rounded-xl border border-stone-200 bg-white px-4 py-3 text-[13px] font-semibold text-stone-700 hover:bg-stone-50">' + icon('logout','h-4 w-4') + 'Sign out</button>' +
        '<button data-action="clear-data" class="inline-flex items-center justify-center gap-2 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-[13px] font-semibold text-brand hover:bg-red-100">' + icon('trash','h-4 w-4') + 'Clear data</button></div></div>');

      return html;
    }

    /* ================================================================
       19. SHEETS (schema-driven add + edit)
       ================================================================ */
    function fieldInputHtml(f, value) {
      const v = value == null ? '' : value;
      if (f.type === 'select') {
        const opts = (f.options || []).slice();
        if (v && opts.indexOf(v) === -1) opts.unshift(v);
        return '<select name="' + f.key + '" class="' + inputCls + '">' + opts.map(function (o) {
          return '<option' + (o === v ? ' selected' : '') + '>' + escapeHtml(o) + '</option>';
        }).join('') + '</select>';
      }
      if (f.type === 'textarea') {
        return '<textarea name="' + f.key + '" rows="' + (f.rows||2) + '" class="' + inputCls + '" placeholder="' + escapeHtml(f.placeholder||'') + '"' + (f.required?' required':'') + '>' + escapeHtml(v) + '</textarea>';
      }
      return '<input name="' + f.key + '" type="' + (f.type||'text') + '" value="' + escapeHtml(v) + '" class="' + inputCls + '" placeholder="' + escapeHtml(f.placeholder||'') + '"' + (f.required?' required':'') + ' />';
    }

    function renderRecordSheet(type, wrap) {
      const schema = RECORD_TYPES[type];
      if (!schema) return '';
      const editing = state.editing && state.editing.type === type ? state.editing : null;
      const record = editing ? state.editing.record : {};
      let inner = '<form data-record-type="' + type + '"' + (editing ? ' data-record-id="' + escapeHtml(editing.id) + '"' : '') + ' class="space-y-3">';
      schema.fields.forEach(function (f) {
        let val;
        if (editing) {
          val = f.get ? f.get(record) : record[f.key];
          if (val == null && f.def) val = f.def();
          if (val == null) val = '';
        } else {
          val = f.def ? f.def() : '';
        }
        inner += field(f.label, fieldInputHtml(f, val));
      });
      const btnLabel = editing ? 'Save changes' : 'Add ' + schema.label.toLowerCase();
      inner += primaryBtn(btnLabel, 'type="submit"', 'w-full');
      inner += '</form>';
      const title = editing ? 'Edit ' + schema.label.toLowerCase() : 'Add ' + schema.label.toLowerCase();
      const sub = editing ? 'Update the record below' : 'Create a new record';
      return wrap(title, sub, inner);
    }

    function renderSheet() {
      if (!state.sheet) return '';

      const close = '<div data-action="close-sheet" class="absolute inset-0 bg-ink/50 backdrop-blur-sm"></div>';
      const wrap = function (title, subtitle, inner) {
        return '<div class="fixed inset-0 z-50 flex items-end justify-center">' + close +
          '<div class="sheet-up relative max-h-[92vh] w-full max-w-[520px] overflow-y-auto rounded-t-3xl bg-white p-5 pb-8">' +
            '<div class="mx-auto mb-4 h-1.5 w-10 rounded-full bg-stone-200"></div>' +
            '<div class="mb-4 flex items-start justify-between gap-4"><div><h2 class="text-base font-bold text-ink">' + escapeHtml(title) + '</h2>' + (subtitle ? '<p class="mt-0.5 text-xs text-stone-500">' + escapeHtml(subtitle) + '</p>' : '') + '</div>' +
              '<button data-action="close-sheet" aria-label="Close" class="grid h-8 w-8 shrink-0 place-items-center rounded-full bg-stone-100 text-stone-500 hover:bg-stone-200">' + icon('x','h-4 w-4') + '</button></div>' +
            inner + '</div></div>';
      };

      if (state.sheet === 'quick') {
        const items = [
          ['Expense','wallet','expense'], ['Task','clipboard','task'], ['Document','folder','document'],
          ['Publication','book','publication'], ['Book','book','book'], ['Patent','flask','patent'],
          ['Certificate','award','certificate'], ['Meeting','users','meeting'], ['Subject','cap','subject']
        ];
        return wrap('Quick add', 'Create a record in the BEC workspace',
          '<div class="grid grid-cols-3 gap-2.5">' + items.map(function (item) {
            return '<button data-action="quick-add" data-target="' + item[2] + '" class="flex flex-col items-center gap-2 rounded-2xl border border-stone-200 bg-stone-50 p-3 hover:border-brand/30 hover:bg-white">' +
              '<span class="grid h-9 w-9 place-items-center rounded-xl bg-white text-ink shadow-sm">' + icon(item[1],'h-4 w-4') + '</span>' +
              '<span class="text-[11px] font-semibold text-ink">' + item[0] + '</span></button>';
          }).join('') + '</div>');
      }

      if (RECORD_TYPES[state.sheet]) return renderRecordSheet(state.sheet, wrap);
      return '';
    }

    /* ================================================================
       20. CLOUD SYNC
       ================================================================ */
    function buildCloudPayload() {
      return {
        action: 'push',
        data: {
          Profile: [state.profile],
          Expenses: state.expenses,
          Publications: state.publications,
          Tasks: state.tasks,
          Documents: state.documents,
          Books: state.books,
          Patents: state.patents,
          Certificates: state.certificates,
          Meetings: state.meetings,
          Subjects: state.subjects
        }
      };
    }

    function normalizeRecord(type, r) {
      const out = Object.assign({}, r || {});
      ['date','dueDate','expiryDate','issueDate'].forEach(function (k) {
        if (out[k]) out[k] = String(out[k]).slice(0, 10);
      });
      ['amount','participants','students','credits','sem'].forEach(function (k) {
        if (out[k] != null) out[k] = Number(out[k]) || 0;
      });
      if (typeof out.tags === 'string') out.tags = out.tags.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
      if (!Array.isArray(out.tags) && type === 'document') out.tags = [];
      return out;
    }

    function normalizeSubject(s) {
      s = normalizeRecord('subject', s);
      s.attendance = s.attendance || { average: 0, below: 0 };
      s.cie = s.cie || { test: 'CIE Test 1', average: 0, max: 30, passRate: 0 };
      s.plan = s.plan || { units: [] };
      if (!Array.isArray(s.plan.units)) s.plan.units = [];
      s.notes = Array.isArray(s.notes) ? s.notes : [];
      s.schedule = Array.isArray(s.schedule) ? s.schedule : [];
      s.academicYear = s.academicYear || currentYear();
      s.semesterType = s.semesterType || 'ODD';
      s.sem = Number(s.sem) || 1;
      s.credits = Number(s.credits) || 0;
      s.students = Number(s.students) || 0;
      return s;
    }

    async function cloudPush() {
      const url = state.cloud.scriptUrl;
      if (!url) { toast('Add the Apps Script /exec URL first'); return; }
      const body = JSON.stringify(buildCloudPayload());
      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: body
        });
        let json = null;
        try { json = await res.json(); } catch (e) {}
        if (json && json.ok) {
          state.cloud.lastSync = new Date().toISOString();
          persist('cloud', state.cloud);
          render();
          toast('Pushed to Google Sheet ✓');
        } else if (json) {
          toast('Push returned: ' + (json.error || 'unknown'));
        } else {
          await pushNoCors(url, body);
        }
      } catch (err) {
        await pushNoCors(url, body);
      }
    }

    async function pushNoCors(url, body) {
      try {
        await fetch(url, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: body
        });
        toast('Push sent — tap Pull to verify');
      } catch (err) {
        toast('Push failed: ' + err.message);
      }
    }

    function cloudPull() {
      const url = state.cloud.scriptUrl;
      if (!url) { toast('Add the Apps Script /exec URL first'); return; }
      const cbName = 'becPull_' + Date.now();
      window[cbName] = function (json) {
        try {
          if (!json || !json.ok) { toast('Pull failed'); return; }
          const d = json.data || {};
          if (Array.isArray(d.Expenses)) { state.expenses = d.Expenses.map(function (r) { return normalizeRecord('expense', r); }); persist('expenses', state.expenses); }
          if (Array.isArray(d.Publications)) { state.publications = d.Publications.map(function (r) { return normalizeRecord('publication', r); }); persist('publications', state.publications); }
          if (Array.isArray(d.Tasks)) { state.tasks = d.Tasks.map(function (r) { return normalizeRecord('task', r); }); persist('tasks', state.tasks); }
          if (Array.isArray(d.Documents)) { state.documents = d.Documents.map(function (r) { return normalizeRecord('document', r); }); persist('documents', state.documents); }
          if (Array.isArray(d.Books)) { state.books = d.Books.map(function (r) { return normalizeRecord('book', r); }); persist('books', state.books); }
          if (Array.isArray(d.Patents)) { state.patents = d.Patents.map(function (r) { return normalizeRecord('patent', r); }); persist('patents', state.patents); }
          if (Array.isArray(d.Certificates)) { state.certificates = d.Certificates.map(function (r) { return normalizeRecord('certificate', r); }); persist('certificates', state.certificates); }
          if (Array.isArray(d.Meetings)) { state.meetings = d.Meetings.map(function (r) { return normalizeRecord('meeting', r); }); persist('meetings', state.meetings); }
          if (Array.isArray(d.Subjects)) { state.subjects = d.Subjects.map(normalizeSubject); persist('subjects', state.subjects); }
          if (Array.isArray(d.Profile) && d.Profile[0]) {
            state.profile = Object.assign({}, state.profile, d.Profile[0]);
            persist('profile', state.profile);
          }
          state.cloud.lastSync = new Date().toISOString();
          persist('cloud', state.cloud);
          render();
          toast('Pulled from Google Sheet ✓');
        } catch (e) { toast('Pull error: ' + e.message); }
        delete window[cbName];
        const tag = document.getElementById('bec-jsonp'); if (tag) tag.remove();
      };
      const s = document.createElement('script');
      s.id = 'bec-jsonp';
      s.src = url + (url.indexOf('?') === -1 ? '?' : '&') + 'action=pull&callback=' + cbName + '&t=' + Date.now();
      s.onerror = function () { delete window[cbName]; toast('Pull failed — check the /exec URL and deployment access'); };
      document.body.appendChild(s);
      setTimeout(function () { delete window[cbName]; s.remove(); }, 15000);
    }

    async function cloudBackup() {
      const url = state.cloud.scriptUrl;
      if (!url) { toast('Add the Apps Script /exec URL first'); return; }
      const payload = { action: 'backup', data: buildCloudPayload().data };
      const body = JSON.stringify(payload);
      try {
        const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body });
        let json = null;
        try { json = await res.json(); } catch (e) {}
        if (json && json.ok) toast('Backup saved to Drive: ' + json.file);
        else await pushNoCors(url, body);
      } catch (err) {
        await pushNoCors(url, body);
      }
    }

    function cloudPing() {
      const url = state.cloud.scriptUrl;
      if (!url) { toast('Add the Apps Script /exec URL first'); return; }
      const cb = 'becPing_' + Date.now();
      window[cb] = function (res) {
        delete window[cb];
        if (res && res.ok) toast('Connected ✓'); else toast('Connection failed');
      };
      const s = document.createElement('script');
      s.src = url + (url.indexOf('?') === -1 ? '?' : '&') + 'action=ping&callback=' + cb + '&t=' + Date.now();
      s.onerror = function () { delete window[cb]; toast('Connection error'); };
      document.body.appendChild(s);
      setTimeout(function () { delete window[cb]; s.remove(); }, 8000);
    }

    /* ================================================================
       21. RENDER ROOT (with focus preservation)
       ================================================================ */
    function render() {
      const root = document.getElementById('app');
      if (!root) return;
      const active = document.activeElement;
      const wasSearch = active && active.id === 'search-input';
      const selStart = wasSearch ? active.selectionStart : 0;
      root.innerHTML = state.session ? renderWorkspace() : renderLogin();
      if (wasSearch) {
        const el = document.getElementById('search-input');
        if (el) {
          el.focus();
          try { el.setSelectionRange(selStart, selStart); } catch (e) {}
        }
      }
    }

    /* ================================================================
       22. EVENT HANDLERS
       ================================================================ */
    function findRecord(type, id) {
      const schema = RECORD_TYPES[type];
      if (!schema) return null;
      return (state[schema.collection] || []).find(function (r) { return r.id === id; }) || null;
    }

    function handleClick(e) {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const action = btn.dataset.action;

      if (action === 'toggle-pass') {
        const input = document.getElementById('login-password');
        if (input) input.type = input.type === 'password' ? 'text' : 'password';
        return;
      }
      if (action === 'clear-search') { setState({ query: '' }); return; }
      if (action === 'logout') { clearSession(); setState({ session: null, tab: 'home', activeSubjectId: null, moreModule: null, sheet: null, editing: null }); return; }
      if (action === 'nav') {
        setState({ tab: btn.dataset.tab, moreModule: btn.dataset.module || null, activeSubjectId: null, query: '', sheet: null, editing: null });
        window.scrollTo(0,0); return;
      }
      if (action === 'set-year') { setState({ year: btn.dataset.year }); return; }
      if (action === 'set-semester') { setState({ semester: btn.dataset.sem }); return; }
      if (action === 'open-subject') { setState({ tab: 'academic', activeSubjectId: btn.dataset.id, subjectTab: 'Overview' }); return; }
      if (action === 'close-subject') { setState({ activeSubjectId: null }); return; }
      if (action === 'set-subject-tab') { setState({ subjectTab: btn.dataset.tab }); return; }
      if (action === 'set-research-tab') { setState({ researchTab: btn.dataset.tab }); return; }
      if (action === 'set-module') { setState({ moreModule: btn.dataset.module || null }); return; }
      if (action === 'set-doc-filter') { setState({ docFilter: btn.dataset.filter }); return; }
      if (action === 'open-sheet') { setState({ sheet: btn.dataset.sheet, editing: null }); return; }
      if (action === 'close-sheet') { setState({ sheet: null, editing: null }); return; }

      if (action === 'quick-add') {
        const target = btn.dataset.target;
        if (target.indexOf('goto:') === 0) {
          const dest = target.slice(5);
          if (dest === 'academic') setState({ tab: 'academic', sheet: null, moreModule: null });
          else setState({ tab: 'more', sheet: null, moreModule: dest });
        } else {
          setState({ sheet: target, editing: null });
        }
        return;
      }

      if (action === 'edit-record') {
        const type = btn.dataset.type;
        const id = btn.dataset.id;
        const schema = RECORD_TYPES[type];
        if (!schema) return;
        const record = findRecord(type, id);
        if (!record) { toast('Record not found'); return; }
        setState({ sheet: type, editing: { type: type, id: id, record: record } });
        return;
      }

      if (action === 'rename-record') {
        const type = btn.dataset.type;
        const id = btn.dataset.id;
        const schema = RECORD_TYPES[type];
        if (!schema) return;
        const record = findRecord(type, id);
        if (!record) { toast('Record not found'); return; }
        const current = schema.title(record);
        const next = window.prompt('Rename ' + schema.label.toLowerCase(), current);
        if (next == null) return;
        const trimmed = next.trim();
        if (!trimmed || trimmed === current) return;
        const key = schema.renameKey || 'title';
        const coll = schema.collection;
        state[coll] = state[coll].map(function (r) {
          return r.id === id ? Object.assign({}, r, { [key]: trimmed }) : r;
        });
        persist(coll, state[coll]);
        render();
        toast('Renamed ✓');
        return;
      }

      if (action === 'delete-record') {
        const type = btn.dataset.type;
        const id = btn.dataset.id;
        const schema = RECORD_TYPES[type];
        if (!schema) return;
        if (!window.confirm('Delete this ' + schema.label.toLowerCase() + '?\n\nThis cannot be undone.')) return;
        const coll = schema.collection;
        state[coll] = state[coll].filter(function (r) { return r.id !== id; });
        persist(coll, state[coll]);
        render();
        toast('Deleted ✓');
        return;
      }

      if (action === 'toggle-task') {
        const id = btn.dataset.id;
        const tasks = state.tasks.map(function (t) { return t.id === id ? Object.assign({}, t, { status: t.status === 'Completed' ? 'Pending' : 'Completed' }) : t; });
        state.tasks = tasks; persist('tasks', tasks); render(); return;
      }
      if (action === 'toggle-doc') {
        const id = btn.dataset.id;
        state.revealedDocs[id] = !state.revealedDocs[id];
        render(); return;
      }

      if (action === 'export-expenses') {
        const csv = 'Date,Amount,Category,Mode,Vendor,Description\n' + state.expenses.map(function (e) {
          return [e.date, e.amount, e.category, e.paymentMode, e.vendor, e.description].map(function (v) { return '"' + String(v||'').replace(/"/g,'""') + '"'; }).join(',');
        }).join('\n');
        download('bec-expenses.csv', csv); return;
      }
      if (action === 'export-publications') {
        const csv = 'Title,Authors,Journal,Year,Volume,DOI\n' + state.publications.map(function (p) {
          return [p.title, p.authors, p.journal, p.year, p.volume, p.doi].map(function (v) { return '"' + String(v||'').replace(/"/g,'""') + '"'; }).join(',');
        }).join('\n');
        download('bec-publications.csv', csv); return;
      }
      if (action === 'export-tasks') {
        const csv = 'Title,Category,Priority,Due,Status\n' + state.tasks.map(function (t) {
          return [t.title, t.category, t.priority, t.dueDate, t.status].map(function (v) { return '"' + String(v||'').replace(/"/g,'""') + '"'; }).join(',');
        }).join('\n');
        download('bec-tasks.csv', csv); return;
      }
      if (action === 'export-backup') {
        const payload = JSON.stringify({
          generatedAt: new Date().toISOString(),
          profile: state.profile,
          expenses: state.expenses,
          publications: state.publications,
          tasks: state.tasks,
          documents: state.documents,
          books: state.books,
          patents: state.patents,
          certificates: state.certificates,
          meetings: state.meetings,
          subjects: state.subjects
        }, null, 2);
        download('bec-backup.json', payload, 'application/json'); return;
      }

      if (action === 'save-profile') {
        document.querySelectorAll('[data-profile-field]').forEach(function (inp) {
          state.profile[inp.dataset.profileField] = inp.value;
        });
        persist('profile', state.profile);
        render();
        toast('Profile saved ✓');
        return;
      }
      if (action === 'reset-profile') { state.profile = clone(PROFILE); persist('profile', state.profile); render(); toast('Profile reset'); return; }

      if (action === 'cloud-save') {
        document.querySelectorAll('[data-cloud-field]').forEach(function (inp) {
          state.cloud[inp.dataset.cloudField] = inp.value.trim();
        });
        persist('cloud', state.cloud);
        render();
        toast('Cloud settings saved ✓');
        return;
      }
      if (action === 'cloud-push') { cloudPush(); return; }
      if (action === 'cloud-pull') { cloudPull(); return; }
      if (action === 'cloud-backup') { cloudBackup(); return; }
      if (action === 'cloud-ping') { cloudPing(); return; }
      if (action === 'copy-apps-script') {
        const doCopy = function () {
          try {
            navigator.clipboard.writeText(APPS_SCRIPT_CODE).then(function () { toast('Apps Script copied ✓'); }, function () { toast('Copy failed — select the code manually'); });
          } catch (e) { toast('Copy failed — select the code manually'); }
        };
        doCopy();
        return;
      }

      if (action === 'clear-data') {
        if (!window.confirm('Clear all locally stored workspace data and reload?')) return;
        store.clear(); clearSession(); window.location.reload(); return;
      }
    }

    function download(filename, content, type) {
      const blob = new Blob([content], { type: type || 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
    }

    function handleSubmit(e) {
      const form = e.target;
      if (!form.id && !form.dataset.recordType) return;
      e.preventDefault();

      if (form.id === 'login-form') {
        const email = document.getElementById('login-email').value.trim().toLowerCase();
        const password = document.getElementById('login-password').value;
        const remember = document.getElementById('login-remember').checked;
        if (!email || !password) { state.loginError = 'Please enter both email and password.'; render(); return; }
        if (email === AUTH.email && password === AUTH.password) {
          const session = { email: AUTH.email, at: Date.now(), remember: remember };
          saveSession(session);
          state.session = session;
          state.loginError = null;
          render();
        } else {
          state.loginError = 'Those credentials do not match our records.';
          render();
        }
        return;
      }

      if (form.dataset.recordType) {
        const type = form.dataset.recordType;
        const schema = RECORD_TYPES[type];
        if (!schema) return;
        const id = form.dataset.recordId;
        const data = new FormData(form);
        let record;
        if (id) {
          const original = state.editing && state.editing.id === id ? state.editing.record : findRecord(type, id);
          record = original ? clone(original) : {};
        } else if (schema.createDefaults) {
          record = schema.createDefaults();
        } else {
          record = {};
        }
        schema.fields.forEach(function (f) {
          const v = data.get(f.key);
          if (f.set) { f.set(record, v); }
          else if (f.type === 'number') { record[f.key] = Number(v) || 0; }
          else { record[f.key] = v; }
        });
        for (let i = 0; i < schema.fields.length; i++) {
          const f = schema.fields[i];
          if (f.required) {
            const v = f.get ? f.get(record) : record[f.key];
            if (v == null || String(v).trim() === '') {
              toast(f.label + ' is required');
              return;
            }
          }
        }
        const coll = schema.collection;
        if (id) {
          state[coll] = state[coll].map(function (r) { return r.id === id ? Object.assign({}, r, record) : r; });
        } else {
          record.id = type.slice(0, 2) + '-' + Date.now().toString(36);
          state[coll] = [record].concat(state[coll]);
        }
        persist(coll, state[coll]);
        state.sheet = null;
        state.editing = null;
        render();
        toast(id ? 'Updated ✓' : 'Saved ✓');
        return;
      }
    }

    function handleInput(e) {
      const target = e.target;
      if (target.id === 'search-input') {
        state.query = target.value;
        render();
        return;
      }
    }

    /* ================================================================
       23. INIT
       ================================================================ */
    document.addEventListener('click', handleClick);
    document.addEventListener('submit', handleSubmit);
    document.addEventListener('input', handleInput);

    render();

    window.addEventListener('error', function (e) {
      console.error('Workspace error:', e.error || e.message);
    });
  })();
  </script>
</body>
</html>
