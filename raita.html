    const DAY = 86400000;
    const pad = (n) => String(n).padStart(2, '0');

      const d = new Date(base);
      d.setDate(d.getDate() + n);
      return isoDate(d);
    };
    const parseDate = (s) => {
      const [y, m, d] = String(s).split('-').map(Number);
      return new Date(y, m - 1, d);
    };
    const startOfToday = () => new Date().setHours(0, 0, 0, 0);
    const daysUntil = (s) => Math.round((parseDate(s) - startOfToday()) / DAY);

    const formatMoney = (n) => '₹' + Number(n || 0).toLocaleString('en-IN');

    function downloadFile(filename, content, type = 'text/csv;charset=utf-8;') {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1500);
    }

    function maskNumber(value, revealed) {
      if (revealed) return value || '—';
      const v = String(value || '');
      if (v.length <= 4) return '••••';
      if (/x/i.test(v)) return v;
      return '•••• •••• ' + v.slice(-4);
    }

    /* =========================================================
       4. STORAGE

    const store = {
      read(key, fallback) {
        const empty = () => (typeof fallback === 'function' ? fallback() : fallback);
        try {
          const raw = localStorage.getItem(STORE_PREFIX + key);
          if (!raw) return empty();
          const parsed = JSON.parse(raw);
          if (parsed === null || parsed === undefined) return empty();
          if (Array.isArray(parsed) && parsed.length === 0) return empty();
          return parsed;
        } catch {
          return empty();
        }
      },
      write(key, value) {
        try {
          localStorage.setItem(STORE_PREFIX + key, JSON.stringify(value));
        } catch {
          /* storage full or unavailable — fail silently */
        }
      },
      clearAll() {
        try {
          Object.keys(localStorage)
            .filter((k) => k.startsWith(STORE_PREFIX))
            .forEach((k) => localStorage.removeItem(k));
        } catch { /* noop */ }
      }
    };

    function usePersistent(key, seed) {
      const [value, setValue] = useState(() => store.read(key, seed));
      useEffect(() => { store.write(key, value); }, [key, value]);
      return [value, setValue];
    }

    /* ---- session ---- */
    function saveSession(session) {
      const payload = JSON.stringify(session);
      try {
        if (session.remember) localStorage.setItem(SESSION_KEY, payload);
        else sessionStorage.setItem(SESSION_KEY, payload);
      } catch { /* noop */ }
    }
    function readSession() {
      try {
        const raw = sessionStorage.getItem(SESSION_KEY) || localStorage.getItem(SESSION_KEY);
        if (!raw) return null;
        const s = JSON.parse(raw);
        if (!s || !s.at || Date.now() - s.at > SESSION_TTL) {
          clearSession();
          return null;
        }
        return s;
      } catch {
        return null;
      }
    }
    function clearSession() {
      try {
        localStorage.removeItem(SESSION_KEY);
        sessionStorage.removeItem(SESSION_KEY);
      } catch { /* noop */ }

    function Sheet({ open, onClose, title, subtitle, children }) {
      useEffect(() => {
        if (!open) return undefined;
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        document.addEventListener('keydown', onKey);
        document.body.style.overflow = 'hidden';
        return () => {
          document.removeEventListener('keydown', onKey);
          document.body.style.overflow = '';
        };
      }, [open, onClose]);

      if (!open) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-end justify-center">
          <div className="absolute inset-0 bg-ink/50 backdrop-blur-sm" onClick={onClose} aria-hidden="true" />
          <div
            role="dialog" aria-modal="true" aria-label={title}
            className="animate-sheet relative max-h-[92vh] w-full max-w-[520px] overflow-y-auto rounded-t-3xl bg-white p-5 pb-8"

    function LoginScreen({ onAuthenticated }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [reveal, setReveal] = useState(false);
      const [remember, setRemember] = useState(true);
      const [error, setError] = useState('');
      const [checking, setChecking] = useState(false);

      const submit = (e) => {
        e.preventDefault();
        if (checking) return;
        setError('');
        if (!email.trim() || !password) {
          setError('Please enter both your email address and password.');
          return;
        }
        setChecking(true);
        window.setTimeout(() => {
          const match =
            email.trim().toLowerCase() === AUTH.email && password === AUTH.password;
          if (match) {
            onAuthenticated({ email: AUTH.email, at: Date.now(), remember });
          } else {
            setChecking(false);
            setError('Those credentials do not match our records. Please try again.');
          }
        }, 450);
      };

      return (
        <div className="flex min-h-screen items-center justify-center bg-gradient-to-br from-stone-100 via-stone-50 to-brand-soft/60 px-5 py-10">
          <div className="w-full max-w-[420px] animate-fade-up">
            <div className="mb-6 flex flex-col items-center text-center">
              <div className="grid h-16 w-16 place-items-center rounded-2xl bg-brand text-xl font-extrabold text-white shadow-lg shadow-brand/25">
                MB
              </div>
              <h1 className="mt-4 text-[20px] font-extrabold tracking-tight text-ink">BEC Faculty Workspace</h1>
              <p className="mt-1 text-[13px] text-stone-500">Basaveshwar Engineering College (Autonomous)</p>
              <p className="text-[11px] text-stone-400">Bagalkot · Karnataka · 587102</p>
            </div>

            <Card className="p-6">
              <form onSubmit={submit} noValidate>
                <div className="mb-4">
                  <h2 className="text-[15px] font-bold text-ink">Sign in to continue</h2>
                  <p className="mt-0.5 text-[12px] text-stone-500">Authorised faculty access only.</p>
                </div>

                <div className="space-y-3.5">
                  <Field label="Email address">
                    <div className="relative">
                      <Icon name="mail" className="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-stone-400" />
                      <input
                        type="email"
                        value={email}
                        onChange={(e) => setEmail(e.target.value)}
                        placeholder="name@bec.ac.in"
                        autoComplete="username"
                        aria-invalid={Boolean(error)}
                        className={`${inputClass} pl-9`}
                      />
                    </div>
                  </Field>

                  <Field label="Password">
                    <div className="relative">
                      <Icon name="lock" className="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-stone-400" />
                      <input
                        type={reveal ? 'text' : 'password'}
                        value={password}
                        onChange={(e) => setPassword(e.target.value)}
                        placeholder="••••••••"
                        autoComplete="current-password"
                        aria-invalid={Boolean(error)}
                        className={`${inputClass} pl-9 pr-11`}
                      />
                      <button
                        type="button"
                        onClick={() => setReveal((v) => !v)}
                        aria-label={reveal ? 'Hide password' : 'Show password'}
                        className="absolute right-2 top-1/2 grid h-8 w-8 -translate-y-1/2 place-items-center rounded-lg text-stone-400 transition hover:bg-stone-100 hover:text-stone-600"
                      >
                        <Icon name={reveal ? 'eyeOff' : 'eye'} className="h-4 w-4" />
                      </button>
                    </div>
                  </Field>

                  <label className="flex cursor-pointer select-none items-center gap-2 text-[12px] text-stone-600">
                    <input
                      type="checkbox"
                      checked={remember}
                      onChange={(e) => setRemember(e.target.checked)}
                      className="h-3.5 w-3.5 rounded border-stone-300 text-brand focus:ring-brand/30"
                    />
                    Keep me signed in on this device
                  </label>

                  {error && (
                    <div role="alert" className="flex items-start gap-2 rounded-xl border border-red-200 bg-red-50 px-3 py-2.5 text-[12px] font-medium text-red-700">
                      <Icon name="alert" className="mt-0.5 h-3.5 w-3.5 shrink-0" />
                      <span>{error}</span>
                    </div>
                  )}

                  <PrimaryButton type="submit" disabled={checking} className="w-full">
                    {checking ? (
                      <>
                        <span className="h-3.5 w-3.5 animate-spin-slow rounded-full border-2 border-white/40 border-t-white" />
                        Verifying…
                      </>
                    ) : (
                      <>
                        Sign in
                        <Icon name="chevronRight" className="h-4 w-4" />
                      </>
                    )}
                  </PrimaryButton>
                </div>
              </form>

              <div className="mt-5 flex items-center justify-center gap-1.5 border-t border-stone-100 pt-4 text-[11px] text-stone-400">
                <Icon name="shield" className="h-3.5 w-3.5" />
                Encrypted local vault · Session expires after 8 hours
              </div>
            </Card>

            <div className="mt-4 rounded-xl border border-stone-200 bg-white/70 px-4 py-3 text-center">
              <p className="text-[11px] text-stone-500">
                <span className="font-semibold text-stone-600">Demo access</span> · mmbbec@gmail.com / mahadevmb
              </p>
            </div>
          </div>
        </div>
      );
    }

    /* =========================================================
       8. WORKSPACE SHELL
       ========================================================= */
    const NAV_ITEMS = [
      { id: 'home', label: 'Home', icon: 'home' },
      { id: 'academic', label: 'Academic', icon: 'cap' },
      { id: 'research', label: 'Research', icon: 'book' },
      { id: 'finance', label: 'Finance', icon: 'wallet' },
      { id: 'documents', label: 'Docs', icon: 'folder' },
      { id: 'more', label: 'More', icon: 'grid' }
    ];

    function Workspace({ session, onSignOut }) {
      /* navigation */
      const [tab, setTab] = useState('home');
      const [query, setQuery] = useState('');
      const [moreModule, setMoreModule] = useState(null);
      const [activeSubjectId, setActiveSubjectId] = useState(null);
      const [year, setYear] = useState(() => currentAcademicYear());
      const [semester, setSemester] = useState('ODD');

      /* sheets */
      const [sheet, setSheet] = useState(null); // 'quick' | 'expense' | 'publication' | 'document' | 'task'

      /* data */
      const [profile, setProfile] = usePersistent('profile', () => PROFILE);
      const [years] = usePersistent('years', seedYears);
      const [subjects] = usePersistent('subjects', seedSubjects);
      const [expenses, setExpenses] = usePersistent('expenses', seedExpenses);
      const [documents, setDocuments] = usePersistent('documents', seedDocuments);
      const [publications, setPublications] = usePersistent('publications', () => PUBLICATIONS);
      const [books] = usePersistent('books', () => BOOKS);
      const [patents] = usePersistent('patents', () => PATENTS);
      const [certificates] = usePersistent('certificates', () => CERTIFICATES);
      const [tasks, setTasks] = usePersistent('tasks', seedTasks);
      const [meetings] = usePersistent('meetings', seedMeetings);

      /* derived */
      const currentSubjects = useMemo(
        () => subjects.filter((s) => s.academicYear === year && s.semesterType === semester),
        [subjects, year, semester]
      );
      const activeSubject = useMemo(
        () => subjects.find((s) => s.id === activeSubjectId) || null,
        [subjects, activeSubjectId]
      );

      const openTasks = useMemo(() => tasks.filter((t) => t.status !== 'Completed'), [tasks]);
      const overdueCount = useMemo(
        () => openTasks.filter((t) => daysUntil(t.dueDate) < 0).length,
        [openTasks]
      );
      const expiringDocs = useMemo(
        () => documents
          .filter((d) => d.expiryDate && daysUntil(d.expiryDate) <= 60)
          .sort((a, b) => daysUntil(a.expiryDate) - daysUntil(b.expiryDate)),
        [documents]
      );
      const alertCount = overdueCount + expiringDocs.length;

      const navigate = (nextTab, module = null) => {
        setTab(nextTab);
        setMoreModule(module);
        setQuery('');
        if (nextTab !== 'academic') setActiveSubjectId(null);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const openSubject = (subject) => {
        setTab('academic');
        setActiveSubjectId(subject.id);
        setQuery('');
      };

      const searchHits = useMemo(() => {
        const q = query.trim().toLowerCase();
        if (q.length < 1) return [];
        const hits = [];
        subjects.forEach((s) => {
          if (`${s.name} ${s.code} ${s.branch}`.toLowerCase().includes(q)) {
            hits.push({
              key: `sub-${s.id}`, group: 'Teaching', title: s.name,
              subtitle: `${s.code} · ${s.branch} · Sem ${s.sem}`,
              onClick: () => openSubject(s)
            });
          }
        });
        publications.forEach((p) => {
          if (`${p.title} ${p.journal} ${p.year}`.toLowerCase().includes(q)) {
            hits.push({
              key: `pub-${p.id}`, group: 'Research', title: p.title,
              subtitle: `${p.journal} · ${p.year}`,
              onClick: () => navigate('research')
            });
          }
        });
        documents.forEach((d) => {
          if (`${d.name} ${d.subType} ${d.category}`.toLowerCase().includes(q)) {
            hits.push({
              key: `doc-${d.id}`, group: 'Documents', title: d.name,
              subtitle: `${d.category} · ${d.subType}`,
              onClick: () => navigate('documents')
            });
          }
        });
        tasks.forEach((t) => {
          if (`${t.title} ${t.category}`.toLowerCase().includes(q)) {
            hits.push({
              key: `task-${t.id}`, group: 'Tasks', title: t.title,
              subtitle: `${t.category} · due ${formatDate(t.dueDate)}`,
              onClick: () => navigate('more', 'tasks')
            });
          }
        });
        certificates.forEach((c) => {
          if (`${c.title} ${c.org}`.toLowerCase().includes(q)) {
            hits.push({
              key: `cert-${c.id}`, group: 'Certificates', title: c.title,
              subtitle: `${c.org} · ${c.type}`,
              onClick: () => navigate('more', 'certificates')
            });
          }
        });
        return hits.slice(0, 12);
      }, [query, subjects, publications, documents, tasks, certificates]);

      const groupedHits = useMemo(() => {
        const map = new Map();
        searchHits.forEach((h) => {
          if (!map.has(h.group)) map.set(h.group, []);
          map.get(h.group).push(h);
        });
        return [...map.entries()];
      }, [searchHits]);

      const initials = profile.name
        .replace(/^Dr\s+/i, '')
        .split(' ')
        .map((w) => w[0])
        .slice(0, 2)
        .join('')
        .toUpperCase();

      /* ---------- page rendering ---------- */
      const renderPage = () => {
        switch (tab) {
          case 'home':
            return (
              <HomePage
                profile={profile}
                subjects={currentSubjects}
                tasks={tasks}
                documents={documents}
                expenses={expenses}
                publications={publications}
                books={books}
                patents={patents}
                onNavigate={navigate}
                onOpenSubject={openSubject}
              />
            );
          case 'academic':
            return (
              <AcademicPage
                years={years}
                subjects={subjects}
                year={year}
                onYearChange={setYear}
                semester={semester}
                onSemesterChange={setSemester}
                activeSubject={activeSubject}
                onOpenSubject={openSubject}
                onCloseSubject={() => setActiveSubjectId(null)}
              />
            );
          case 'research':
            return (
              <ResearchPage
                profile={profile}
                publications={publications}
                books={books}
                patents={patents}
                certificates={certificates}
                onAddPublication={() => setSheet('publication')}
                onRemovePublication={(id) => setPublications((list) => list.filter((p) => p.id !== id))}
              />
            );
          case 'finance':
            return (
              <FinancePage
                expenses={expenses}
                onAdd={() => setSheet('expense')}
                onRemove={(id) => setExpenses((list) => list.filter((e) => e.id !== id))}
              />
            );
          case 'documents':
            return (
              <DocumentsPage
                documents={documents}
                onAdd={() => setSheet('document')}
                onRemove={(id) => setDocuments((list) => list.filter((d) => d.id !== id))}
              />
            );
          case 'more':
            return (
              <MorePage
                module={moreModule}
                onOpenModule={setMoreModule}
                profile={profile}
                setProfile={setProfile}
                tasks={tasks}
                setTasks={setTasks}
                meetings={meetings}
                certificates={certificates}
                subjects={subjects}
                expenses={expenses}
                publications={publications}
                documents={documents}
                onAddTask={() => setSheet('task')}
                onNavigate={navigate}
                onSignOut={onSignOut}
                session={session}
              />
            );
          default:
            return null;
        }
      };

      return (
        <div className="flex min-h-screen justify-center bg-stone-100">
          <div className="relative flex min-h-screen w-full max-w-[520px] flex-col bg-[#FAFAF9] shadow-[0_0_0_1px_rgba(0,0,0,0.04),0_30px_90px_-40px_rgba(0,0,0,0.35)]">

            {/* ---------- header ---------- */}
            <header className="sticky top-0 z-30 border-b border-stone-200/80 bg-white/90 backdrop-blur-xl">
              <div className="flex items-center justify-between gap-3 px-4 pb-3 pt-4">
                <div className="flex min-w-0 items-center gap-3">
                  <div className="grid h-10 w-10 shrink-0 place-items-center rounded-full bg-ink text-[13px] font-bold text-white">
                    {initials}
                  </div>
                  <div className="min-w-0">
                    <p className="truncate text-[14px] font-bold leading-tight text-ink">{profile.name}</p>
                    <p className="mt-0.5 flex items-center gap-1.5 truncate text-[11px] text-stone-500">
                      <span className="h-1.5 w-1.5 shrink-0 rounded-full bg-emerald-500" />
                      {profile.designation} · {profile.department}
                    </p>
                    <p className="truncate text-[9.5px] font-semibold text-brand">{profile.employeeId} · BEC Bagalkot</p>
                  </div>
                </div>

                <div className="flex shrink-0 items-center gap-1.5">
                  <button
                    onClick={() => navigate('more', 'tasks')}
                    aria-label={`Notifications: ${alertCount} pending`}
                    className="relative grid h-9 w-9 place-items-center rounded-full border border-stone-200 bg-white text-stone-600 transition hover:bg-stone-50"
                  >
                    <Icon name="bell" className="h-4 w-4" />
                    {alertCount > 0 && (
                      <span className="absolute -right-0.5 -top-0.5 grid h-4 min-w-4 place-items-center rounded-full bg-brand px-1 text-[9px] font-bold text-white">
                        {alertCount}
                      </span>
                    )}
                  </button>
                  <button
                    onClick={() => navigate('more', 'settings')}
                    aria-label="Settings"
                    className="grid h-9 w-9 place-items-center rounded-full border border-stone-200 bg-white text-stone-600 transition hover:bg-stone-50"
                  >
                    <Icon name="settings" className="h-4 w-4" />
                  </button>
                  <button
                    onClick={onSignOut}
                    aria-label="Sign out"
                    className="grid h-9 w-9 place-items-center rounded-full border border-stone-200 bg-white text-stone-600 transition hover:bg-brand-soft hover:text-brand"
                  >
                    <Icon name="logout" className="h-4 w-4" />
                  </button>
                </div>
              </div>

              {/* search */}
              <div className="relative px-4 pb-3">
                <Icon name="search" className="pointer-events-none absolute left-7 top-1/2 h-4 w-4 -translate-y-1/2 text-stone-400" />
                <input
                  value={query}
                  onChange={(e) => setQuery(e.target.value)}
                  placeholder="Search publications, documents, tasks…"
                  aria-label="Search workspace"
                  className="w-full rounded-xl border border-stone-200 bg-stone-100/80 py-2.5 pl-9 pr-9 text-[13px] text-ink outline-none transition placeholder:text-stone-400 focus:border-brand focus:bg-white focus:ring-4 focus:ring-brand/10"
                />
                {query && (
                  <button
                    onClick={() => setQuery('')}
                    aria-label="Clear search"
                    className="absolute right-6 top-1/2 grid h-6 w-6 -translate-y-1/2 place-items-center rounded-full bg-stone-200 text-stone-500 hover:bg-stone-300"
                  >
                    <Icon name="x" className="h-3 w-3" />
                  </button>
                )}

                {query && (
                  <div className="absolute left-4 right-4 top-full z-40 mt-1 max-h-[60vh] overflow-y-auto rounded-2xl border border-stone-200 bg-white shadow-xl">
                    {groupedHits.length === 0 ? (
                      <div className="px-4 py-6 text-center text-[12px] text-stone-400">No matches for “{query}”</div>
                    ) : (
                      groupedHits.map(([group, items]) => (
                        <div key={group} className="border-b border-stone-100 last:border-0">
                          <p className="px-4 pt-3 text-[10px] font-bold uppercase tracking-wider text-brand">{group}</p>
                          {items.map((hit) => (
                            <button
                              key={hit.key}
                              onClick={hit.onClick}
                              className="block w-full px-4 py-2.5 text-left transition hover:bg-stone-50"
                            >
                              <span className="block truncate text-[12.5px] font-medium text-ink">{hit.title}</span>
                              <span className="block truncate text-[11px] text-stone-500">{hit.subtitle}</span>
                            </button>
                          ))}
                        </div>
                      ))
                    )}
                  </div>
                )}
              </div>
            </header>

            {/* ---------- main ---------- */}
            <main className="flex-1 pb-28">{renderPage()}</main>

            {/* ---------- quick add ---------- */}
            <button
              onClick={() => setSheet('quick')}
              aria-label="Quick add"
              className="fixed bottom-[92px] right-[calc(50%-260px+16px)] z-30 grid h-14 w-14 place-items-center rounded-full bg-brand text-white shadow-lg shadow-brand/40 transition hover:bg-brand-dark active:scale-95 max-[560px]:right-4"
            >
              <Icon name="plus" className="h-6 w-6" />
            </button>

            {/* ---------- bottom nav ---------- */}
            <nav className="fixed bottom-0 left-1/2 z-30 w-full max-w-[520px] -translate-x-1/2 border-t border-stone-200 bg-white/95 backdrop-blur-xl">
              <div className="flex items-stretch justify-between px-1.5 py-1.5">
                {NAV_ITEMS.map((item) => {
                  const active = tab === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => navigate(item.id)}
                      aria-current={active ? 'page' : undefined}
                      className={`flex flex-1 flex-col items-center gap-1 rounded-xl px-1 py-2 transition ${
                        active ? 'bg-ink text-white' : 'text-stone-400 hover:text-stone-600'
                      }`}
                    >
                      <Icon name={item.icon} className="h-[19px] w-[19px]" />
                      <span className="text-[9px] font-bold uppercase tracking-wider">{item.label}</span>
                    </button>
                  );
                })}
              </div>
              <div className="h-[env(safe-area-inset-bottom)]" />
            </nav>

            {/* ---------- sheets ---------- */}
            <Sheet open={sheet === 'quick'} onClose={() => setSheet(null)} title="Quick add" subtitle="Create a record in the BEC workspace">
              <div className="grid grid-cols-3 gap-2.5">
                {[
                  { label: 'Expense', icon: 'wallet', next: 'expense' },
                  { label: 'Task', icon: 'clipboard', next: 'task' },
                  { label: 'Document', icon: 'folder', next: 'document' },
                  { label: 'Publication', icon: 'book', next: 'publication' },
                  { label: 'Certificates', icon: 'award', go: () => { setSheet(null); navigate('more', 'certificates'); } },
                  { label: 'Academics', icon: 'cap', go: () => { setSheet(null); navigate('academic'); } }
                ].map((action) => (
                  <button
                    key={action.label}
                    onClick={() => {
                      if (action.go) return action.go();
                      setSheet(action.next);
                    }}
                    className="flex flex-col items-center gap-2 rounded-2xl border border-stone-200 bg-stone-50 p-3 transition hover:border-brand/30 hover:bg-white"
                  >
                    <span className="grid h-9 w-9 place-items-center rounded-xl bg-white text-ink shadow-sm">
                      <Icon name={action.icon} className="h-4 w-4" />
                    </span>
                    <span className="text-[11px] font-semibold text-ink">{action.label}</span>
                  </button>
                ))}
              </div>
            </Sheet>

            <ExpenseSheet
              open={sheet === 'expense'}
              onClose={() => setSheet(null)}
              onSave={(expense) => {
                setExpenses((list) => [expense, ...list]);
                setSheet(null);
              }}
            />
            <PublicationSheet
              open={sheet === 'publication'}
              onClose={() => setSheet(null)}
              onSave={(pub) => {
                setPublications((list) => [pub, ...list]);
                setSheet(null);
              }}
            />
            <DocumentSheet
              open={sheet === 'document'}
              onClose={() => setSheet(null)}
              onSave={(doc) => {
                setDocuments((list) => [...list, doc]);
                setSheet(null);
              }}
            />
            <TaskSheet
              open={sheet === 'task'}
              onClose={() => setSheet(null)}
              onSave={(task) => {
                setTasks((list) => [task, ...list]);
                setSheet(null);
              }}
            />
          </div>
        </div>
      );
    }

    /* =========================================================
       9. HOME
       ========================================================= */
    function HomePage({ profile, subjects, tasks, documents, expenses, publications, books, patents, onNavigate, onOpenSubject }) {
      const now = new Date();
      const todayLabel = now.toLocaleDateString('en-IN', {
        weekday: 'long', day: '2-digit', month: 'short', year: 'numeric'
      });

      const monthSpend = useMemo(
        () => expenses.filter((e) => e.date.slice(0, 7) === monthKey()).reduce((sum, e) => sum + Number(e.amount || 0), 0),
        [expenses]
      );
      const openTasks = tasks.filter((t) => t.status !== 'Completed');
      const dueSoon = openTasks
        .filter((t) => daysUntil(t.dueDate) <= 1)
        .sort((a, b) => daysUntil(a.dueDate) - daysUntil(b.dueDate));
      const expiring = documents
        .filter((d) => d.expiryDate && daysUntil(d.expiryDate) <= 60)
        .sort((a, b) => daysUntil(a.expiryDate) - daysUntil(b.expiryDate));

      const byYear = useMemo(() => {
        const map = new Map();
        publications.forEach((p) => map.set(p.year, (map.get(p.year) || 0) + 1));
        return [...map.entries()].sort((a, b) => a[0].localeCompare(b[0])).slice(-8);
      }, [publications]);
      const maxYearCount = Math.max(1, ...byYear.map(([, v]) => v));

      const focus = subjects[0] || null;

      return (
        <div className="animate-fade-up space-y-5 px-4 py-5">
          {/* profile hero */}
          <section className="relative overflow-hidden rounded-3xl bg-ink p-5 text-white">
            <div className="absolute -right-8 -top-10 h-32 w-32 rounded-full bg-brand/30 blur-2xl" />
            <div className="relative">
              <p className="text-[9.5px] font-semibold uppercase tracking-[0.18em] text-white/50">
                Basaveshwar Engineering College · Autonomous
              </p>
              <h1 className="mt-1.5 text-[18px] font-extrabold leading-tight">{profile.name}</h1>
              <p className="text-[12px] text-white/75">{profile.designation} · {profile.department}</p>
              <p className="mt-1 text-[10.5px] text-white/50">
                {profile.employeeId} · Joined {formatDate(profile.joiningDate)} · 15+ years
              </p>

              <div className="mt-3 flex flex-wrap gap-1.5">
                <a href={profile.orcidLink} target="_blank" rel="noopener noreferrer"
                  className="inline-flex items-center gap-1 rounded-full bg-white px-2.5 py-1 text-[10px] font-bold text-ink">
                  ORCID {profile.orcid} <Icon name="external" className="h-2.5 w-2.5" />
                </a>
                <a href={profile.scholarLink} target="_blank" rel="noopener noreferrer"
                  className="inline-flex items-center gap-1 rounded-full bg-white/15 px-2.5 py-1 text-[10px] font-medium">
                  Google Scholar <Icon name="external" className="h-2.5 w-2.5" />
                </a>
                <a href={profile.website} target="_blank" rel="noopener noreferrer"
                  className="inline-flex items-center gap-1 rounded-full bg-white/15 px-2.5 py-1 text-[10px] font-medium">
                  Website <Icon name="globe" className="h-2.5 w-2.5" />
                </a>
              </div>

              <div className="mt-4 grid grid-cols-3 gap-2">
                {[
                  { k: 'Scopus', v: profile.scopusId },
                  { k: 'Vidwan', v: profile.vidwanId },
                  { k: 'Citations', v: '150+' }
                ].map((item) => (
                  <div key={item.k} className="rounded-xl bg-white/10 px-2.5 py-2">
                    <p className="text-[9px] uppercase tracking-wider text-white/50">{item.k}</p>
                    <p className="truncate text-[11px] font-semibold">{item.v}</p>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* today */}
          <section>
            <SectionTitle>{todayLabel}</SectionTitle>
            <div className="grid grid-cols-2 gap-3">
              <button
                onClick={() => focus && onOpenSubject(focus)}
                className="col-span-2 rounded-2xl border border-stone-200 bg-white p-4 text-left shadow-card transition hover:border-brand/30"
              >
                <div className="flex items-start justify-between">
                  <div className="min-w-0">
                    <p className="text-[10px] font-bold uppercase tracking-wider text-brand">In focus</p>
                    <p className="mt-1 truncate text-[14px] font-bold text-ink">{focus ? focus.name : 'No active subject'}</p>
                    <p className="mt-0.5 text-[11px] text-stone-500">
                      {focus ? `${focus.code} · ${focus.branch} · Sem ${focus.sem} · Div ${focus.division}` : 'Add a subject from the Academic tab'}
                    </p>
                    {focus && (
                      <div className="mt-2 flex flex-wrap gap-1.5">
                        <Badge tone="success">{focus.attendance.average}% attendance</Badge>
                        <Badge tone="neutral">{focus.students} students</Badge>
                        <Badge tone="brand">CIE {focus.cie.average}/{focus.cie.max}</Badge>
                      </div>
                    )}
                  </div>
                  <span className="grid h-8 w-8 shrink-0 place-items-center rounded-full bg-stone-50 text-stone-400">
                    <Icon name="chevronRight" className="h-4 w-4" />
                  </span>
                </div>
              </button>

              <button onClick={() => onNavigate('more', 'tasks')} className="rounded-2xl border border-red-100 bg-brand-soft p-3.5 text-left transition hover:border-brand/40">
                <div className="flex items-center justify-between">
                  <span className="text-[10px] font-bold uppercase tracking-wider text-brand">Due now</span>
                  <Icon name="alert" className="h-3.5 w-3.5 text-brand" />
                </div>
                <p className="mt-1.5 text-[22px] font-extrabold leading-none text-ink">{dueSoon.length}</p>
                <p className="mt-1 text-[10.5px] text-stone-600">tasks due today or overdue</p>
              </button>

              <button onClick={() => onNavigate('finance')} className="rounded-2xl border border-stone-200 bg-white p-3.5 text-left shadow-card transition hover:border-brand/30">
                <p className="text-[10px] font-bold uppercase tracking-wider text-stone-400">Spent this month</p>
                <p className="mt-1.5 text-[18px] font-extrabold leading-none text-ink">{formatMoney(monthSpend)}</p>
                <p className="mt-1 text-[10.5px] text-stone-500">{expenses.length} recorded expenses</p>
              </button>
            </div>
          </section>

          {/* research snapshot */}
          <section>
            <SectionTitle
              action={<button onClick={() => onNavigate('research')} className="text-[11px] font-semibold text-brand">View all</button>}
            >
              Research profile
            </SectionTitle>
            <Card className="p-4">
              <div className="grid grid-cols-4 gap-2">
                <StatTile label="Pubs" value={publications.length} sub="Scopus indexed" />
                <StatTile label="Books" value={books.length} sub="Published" />
                <StatTile label="Patents" value={patents.length} sub="Published" />
                <StatTile label="h-index" value="8" sub="150+ cites" tone="brand" />
              </div>

              <div className="mt-4">
                <p className="mb-2 text-[10px] font-bold uppercase tracking-wider text-stone-400">Publications by year</p>
                <div className="flex h-20 items-end gap-1.5">
                  {byYear.map(([yr, count]) => (
                    <div key={yr} className="flex flex-1 flex-col items-center gap-1">
                      <div
                        className="w-full rounded-t-md bg-brand/85 transition-all"
                        style={{ height: `${Math.max(8, (count / maxYearCount) * 64)}px` }}
                        title={`${yr}: ${count}`}
                      />
                      <span className="text-[8.5px] text-stone-400">{yr.slice(-2)}</span>
                    </div>
                  ))}
                </div>
              </div>
            </Card>
          </section>

          {/* alerts */}
          <section>
            <SectionTitle>Alerts</SectionTitle>
            <div className="space-y-2.5">
              {expiring.length > 0 ? (
                <div className="rounded-2xl border border-amber-200 bg-amber-50 p-4">
                  <div className="mb-2 flex items-center gap-2">
                    <Icon name="alert" className="h-4 w-4 text-amber-600" />
                    <p className="text-[12.5px] font-bold text-amber-900">Documents expiring soon</p>
                  </div>
                  <ul className="space-y-2">
                    {expiring.map((doc) => {
                      const days = daysUntil(doc.expiryDate);
                      return (
                        <li key={doc.id} className="flex items-center justify-between gap-3 border-b border-amber-100 pb-2 last:border-0 last:pb-0">
                          <div className="min-w-0">
                            <p className="truncate text-[12px] font-semibold text-amber-900">{doc.name}</p>
                            <p className="text-[10.5px] text-amber-700">{formatDate(doc.expiryDate)} · {doc.authority}</p>
                          </div>
                          <Badge tone={days <= 30 ? 'danger' : 'warn'}>{days} d</Badge>
                        </li>
                      );
                    })}
                  </ul>
                </div>
              ) : (
                <div className="rounded-2xl border border-emerald-200 bg-emerald-50 p-4 text-[12px] font-medium text-emerald-800">
                  No documents expiring in the next 60 days.
                </div>
              )}

              {dueSoon.length > 0 && (
                <div className="rounded-2xl border border-stone-200 bg-white p-4 shadow-card">
                  <div className="mb-2 flex items-center justify-between">
                    <p className="text-[12.5px] font-bold text-ink">Tasks needing attention</p>
                    <button onClick={() => onNavigate('more', 'tasks')} className="text-[11px] font-semibold text-brand">Open</button>
                  </div>
                  <ul className="space-y-2">
                    {dueSoon.slice(0, 3).map((task) => {
                      const days = daysUntil(task.dueDate);
                      return (
                        <li key={task.id} className="flex items-start justify-between gap-3">
                          <span className="min-w-0 text-[12px] leading-snug text-stone-700">{task.title}</span>
                          <Badge tone={days < 0 ? 'danger' : 'warn'} className="shrink-0">
                            {days < 0 ? `${Math.abs(days)}d late` : 'Today'}
                          </Badge>
                        </li>

                    })}
                  </ul>
                </div>
              )}
            </div>
          </section>

          {/* admin roles */}
          <section>
            <SectionTitle>Administrative roles</SectionTitle>
            <Card className="divide-y divide-stone-100">
              {profile.adminRoles.slice(0, 4).map((role) => (
                <div key={role} className="flex items-start gap-2.5 px-4 py-3">
                  <span className="mt-1.5 h-1.5 w-1.5 shrink-0 rounded-full bg-brand" />

                </div>
              ))}

          </section>
        </div>
      );
    }

    /* =========================================================
       10. ACADEMIC
       ========================================================= */
    function planStats(subject) {
      const units = subject.plan?.units || [];
      const done = units.filter((u) => u.status === 'Completed').length;
      const percent = units.length ? Math.round((done / units.length) * 100) : 0;
      return { done, total: units.length, percent };
    }

    function AcademicPage({ years, subjects, year, onYearChange, semester, onSemesterChange, activeSubject, onOpenSubject, onCloseSubject }) {
      if (activeSubject) {
        return <SubjectDetail subject={activeSubject} onBack={onCloseSubject} />;
      }

      const visible = subjects.filter((s) => s.academicYear === year && s.semesterType === semester);

      return (
        <div className="animate-fade-up space-y-5 px-4 py-5">
          <section>
            <SectionTitle>Academic years</SectionTitle>
            <div className="space-y-2.5">
              {years.map((item) => {
                const active = item.id === year;
                const count = subjects.filter((s) => s.academicYear === item.id).length;
                return (
                  <button
                    key={item.id}
                    onClick={() => onYearChange(item.id)}
                    className={`w-full rounded-2xl border p-4 text-left transition ${
                      active
                        ? 'border-ink bg-ink text-white shadow-card'
                        : 'border-stone-200 bg-white text-ink hover:border-stone-300'
                    }`}
                  >
                    <div className="flex items-center justify-between">
                      <div className="flex items-center gap-2">
                        <span className="text-[15px] font-bold">{item.label}</span>
                        {item.current && (
                          <span className="rounded-full bg-brand px-2 py-0.5 text-[9.5px] font-bold uppercase tracking-wide text-white">
                            Current
                          </span>
                        )}
                      </div>
                      <Icon name="chevronRight" className={`h-4 w-4 ${active ? 'text-white/60' : 'text-stone-300'}`} />
                    </div>
                    <p className={`mt-1 text-[11px] ${active ? 'text-white/60' : 'text-stone-500'}`}>
                      {count} subject{count === 1 ? '' : 's'} on record
                    </p>
                  </button>
                );
              })}
            </div>
          </section>

          <section>
            <SectionTitle>Semester</SectionTitle>
            <div className="flex gap-2">
              {['ODD', 'EVEN', 'SUMMER'].map((type) => (
                <button
                  key={type}
                  onClick={() => onSemesterChange(type)}
                  className={`flex-1 rounded-xl border py-2.5 text-[12.5px] font-semibold transition ${
                    semester === type
                      ? 'border-brand bg-brand text-white'
                      : 'border-stone-200 bg-white text-stone-600 hover:border-stone-300'
                  }`}
                >
                  {type}
                </button>
              ))}
            </div>
          </section>

          <section>
            <SectionTitle action={<span className="text-[11px] text-stone-400">{visible.length} subjects</span>}>
              {year} · {semester}
            </SectionTitle>

            {visible.length === 0 ? (
              <EmptyState
                icon="cap"
                title="No subjects for this semester"
                description="Switch to another semester or academic year to view teaching records."
              />
            ) : (
              <div className="space-y-3">
                {visible.map((subject) => {
                  const stats = planStats(subject);
                  return (
                    <button
                      key={subject.id}
                      onClick={() => onOpenSubject(subject)}
                      className="w-full rounded-2xl border border-stone-200 bg-white p-4 text-left shadow-card transition hover:border-brand/30"
                    >
                      <div className="flex items-start justify-between gap-3">
                        <div className="min-w-0">
                          <p className="text-[10.5px] font-bold uppercase tracking-wide text-brand">
                            {subject.code} · {subject.ltp} · {subject.credits} credits
                          </p>
                          <p className="mt-1 text-[13.5px] font-bold leading-snug text-ink">{subject.name}</p>
                          <p className="mt-1 text-[11px] text-stone-500">
                            {subject.branch} · Sem {subject.sem} · Div {subject.division} · {subject.students} students
                          </p>
                        </div>
                        <span className="grid h-8 w-8 shrink-0 place-items-center rounded-full bg-stone-50 text-stone-400">
                          <Icon name="chevronRight" className="h-4 w-4" />
                        </span>
                      </div>

                      <div className="mt-3 flex flex-wrap gap-1.5">
                        <Badge tone="success">{subject.attendance.average}% attendance</Badge>
                        <Badge tone="neutral">{stats.percent}% syllabus</Badge>
                        <Badge tone="brand">CIE {subject.cie.average}/{subject.cie.max}</Badge>
                      </div>

                      <div className="mt-3 h-1.5 overflow-hidden rounded-full bg-stone-100">
                        <div className="h-full rounded-full bg-ink" style={{ width: `${stats.percent}%` }} />
                      </div>
                    </button>
                  );
                })}
              </div>
            )}
          </section>
        </div>
      );
    }

    const DETAIL_TABS = ['Overview', 'Timetable', 'Attendance', 'Lesson plan', 'Notes', 'CIE', 'Course file'];

    function SubjectDetail({ subject, onBack }) {
      const [tab, setTab] = useState('Overview');
      const stats = planStats(subject);

      return (
        <div className="animate-fade-up pb-6">
          <div className="sticky top-[124px] z-20 bg-ink px-4 py-4 text-white">
            <button onClick={onBack} className="mb-2 inline-flex items-center gap-1 text-[11.5px] text-white/70 transition hover:text-white">
              <Icon name="arrowLeft" className="h-3.5 w-3.5" />
              Back to academics
            </button>
            <h1 className="text-[16px] font-extrabold leading-tight">{subject.name}</h1>
            <p className="mt-1 text-[11px] text-white/70">
              {subject.code} · {subject.branch} · Sem {subject.sem} · Div {subject.division} · {subject.students} students
            </p>
            <p className="mt-0.5 text-[10.5px] text-white/50">
              L-T-P {subject.ltp} · {subject.credits} credits · {subject.faculty}
            </p>
          </div>

          <div className="no-scrollbar sticky top-[248px] z-10 flex gap-2 overflow-x-auto border-b border-stone-200 bg-white px-4 py-2.5">
            {DETAIL_TABS.map((item) => (
              <button
                key={item}
                onClick={() => setTab(item)}
                className={`whitespace-nowrap rounded-full border px-3 py-1.5 text-[11.5px] font-semibold transition ${
                  tab === item
                    ? 'border-brand bg-brand text-white'
                    : 'border-stone-200 bg-white text-stone-600 hover:border-stone-300'
                }`}
              >
                {item}
              </button>
            ))}
          </div>

          <div className="space-y-3 px-4 py-4">
            {tab === 'Overview' && (
              <>
                <div className="grid grid-cols-2 gap-3">
                  <StatTile label="Class strength" value={subject.students} sub={`Division ${subject.division}`} />
                  <StatTile label="Attendance" value={`${subject.attendance.average}%`} sub={`${subject.attendance.below} below 75%`} tone="brand" />
                </div>
                <Card className="p-4">
                  <div className="mb-2 flex items-center justify-between">
                    <p className="text-[12.5px] font-bold text-ink">Syllabus coverage</p>
                    <span className="text-[11px] font-semibold text-stone-500">{stats.done}/{stats.total} units</span>
                  </div>
                  <div className="h-2 overflow-hidden rounded-full bg-stone-100">
                    <div className="h-full rounded-full bg-ink" style={{ width: `${stats.percent}%` }} />
                  </div>
                  <p className="mt-2 text-[11px] text-stone-500">{stats.percent}% of the planned syllabus is complete.</p>
                </Card>
                <Card className="p-4">
                  <p className="mb-2 text-[12.5px] font-bold text-ink">CIE performance</p>
                  <div className="flex items-center justify-between text-[12px] text-stone-600">
                    <span>{subject.cie.test}</span>
                    <span className="font-bold text-ink">{subject.cie.average}/{subject.cie.max}</span>
                  </div>
                  <div className="mt-2 h-2 overflow-hidden rounded-full bg-stone-100">
                    <div className="h-full rounded-full bg-brand" style={{ width: `${(subject.cie.average / subject.cie.max) * 100}%` }} />
                  </div>
                  <p className="mt-2 text-[11px] text-stone-500">Pass rate {subject.cie.passRate}%</p>
                </Card>
              </>
            )}

            {tab === 'Timetable' && (
              <Card className="divide-y divide-stone-100">
                {subject.schedule.map((slot) => (
                  <div key={`${slot.day}-${slot.time}`} className="flex items-center gap-3 px-4 py-3">
                    <span className="grid h-9 w-11 shrink-0 place-items-center rounded-lg bg-ink text-[11px] font-bold text-white">
                      {slot.day}
                    </span>
                    <div>
                      <p className="text-[12.5px] font-semibold text-ink">{slot.time}</p>
                      <p className="text-[11px] text-stone-500">{slot.room}</p>
                    </div>
                  </div>
                ))}
              </Card>
            )}

            {tab === 'Attendance' && (
              <>
                <Card className="p-4">
                  <div className="flex items-center justify-between">
                    <p className="text-[12.5px] font-bold text-ink">Average attendance</p>
                    <span className="text-[12.5px] font-bold text-brand">{subject.attendance.average}%</span>
                  </div>
                  <div className="mt-2 h-2 overflow-hidden rounded-full bg-stone-100">
                    <div className="h-full rounded-full bg-brand" style={{ width: `${subject.attendance.average}%` }} />
                  </div>
                  <p className="mt-2 text-[11px] text-stone-500">{subject.attendance.below} students below the 75% threshold.</p>
                </Card>

                <Card className="overflow-hidden">
                  <div className="grid grid-cols-4 bg-stone-50 px-4 py-2.5 text-[10px] font-bold uppercase tracking-wide text-stone-500">
                    <span>Student</span>
                    <span className="text-center">Present</span>
                    <span className="text-center">Total</span>
                    <span className="text-right">%</span>
                  </div>
                  {subject.attendance.roster.map((row) => {
                    const pct = Math.round((row.present / row.total) * 100);
                    return (
                      <div key={row.id} className="grid grid-cols-4 border-t border-stone-100 px-4 py-2.5 text-[12px]">
                        <span className="font-medium text-ink">{row.id}</span>
                        <span className="text-center text-stone-600">{row.present}</span>
                        <span className="text-center text-stone-600">{row.total}</span>
                        <span className={`text-right font-bold ${pct < 75 ? 'text-brand' : 'text-emerald-600'}`}>{pct}%</span>
                      </div>
                    );
                  })}
                </Card>
              </>
            )}

            {tab === 'Lesson plan' && (
              <>
                <Card className="p-4">
                  <div className="h-2 overflow-hidden rounded-full bg-stone-100">
                    <div className="h-full rounded-full bg-brand" style={{ width: `${stats.percent}%` }} />
                  </div>
                  <p className="mt-2 text-[11px] text-stone-500">
                    {stats.done} of {stats.total} units complete · {stats.percent}%
                  </p>
                </Card>
                {subject.plan.units.map((unit) => {
                  const tone = unit.status === 'Completed' ? 'success' : unit.status === 'In Progress' ? 'neutral' : 'warn';
                  return (
                    <Card key={unit.name} className="flex items-center justify-between gap-3 p-4">
                      <span className="text-[12.5px] font-semibold text-ink">{unit.name}</span>
                      <Badge tone={tone}>{unit.status}</Badge>
                    </Card>
                  );
                })}
              </>
            )}

            {tab === 'Notes' && (
              <>
                {subject.notes.length === 0 ? (
                  <EmptyState icon="file" title="No material uploaded" description="Upload notes, slides or code files for this subject." />
                ) : (
                  subject.notes.map((note) => (
                    <Card key={note.name} className="flex items-center gap-3 p-4">
                      <span className="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-brand-soft text-brand">
                        <Icon name="file" className="h-4.5 w-4.5" />
                      </span>
                      <div className="min-w-0">
                        <p className="truncate text-[12.5px] font-semibold text-ink">{note.name}</p>
                        <p className="text-[11px] text-stone-500">{note.type} · {subject.code}</p>
                      </div>
                    </Card>
                  ))
                )}
              </>
            )}

            {tab === 'CIE' && (
              <>
                <Card className="overflow-hidden">
                  <div className="grid grid-cols-4 bg-stone-50 px-4 py-2.5 text-[10px] font-bold uppercase tracking-wide text-stone-500">
                    <span>Test</span>
                    <span className="text-center">Max</span>
                    <span className="text-center">Average</span>
                    <span className="text-right">Status</span>
                  </div>
                  <div className="grid grid-cols-4 border-t border-stone-100 px-4 py-3 text-[12px]">
                    <span className="font-medium text-ink">{subject.cie.test}</span>
                    <span className="text-center text-stone-600">{subject.cie.max}</span>
                    <span className="text-center font-bold text-ink">{subject.cie.average}</span>
                    <span className="text-right font-semibold text-emerald-600">Completed</span>
                  </div>
                </Card>
                <div className="rounded-2xl bg-ink p-4 text-white">
                  <p className="text-[10px] uppercase tracking-wider text-white/50">Consolidated CIE</p>
                  <p className="mt-1 text-[18px] font-extrabold">
                    {subject.cie.average}/{subject.cie.max} average
                  </p>
                  <p className="mt-1 text-[11px] text-white/60">Pass rate {subject.cie.passRate}%</p>
                </div>
              </>
            )}

            {tab === 'Course file' && <CourseFile subject={subject} />}
          </div>
        </div>
      );
    }

    function buildChecklist(subject) {
      const stats = planStats(subject);
      return [
        { label: 'Course information sheet', done: Boolean(subject.code) },
        { label: 'Approved syllabus', done: true },
        { label: 'Course objectives', done: true },
        { label: 'Course outcomes', done: true },
        { label: 'CO–PO mapping', done: true },
        { label: 'CO–PSO mapping', done: true },
        { label: 'Academic calendar', done: true },
        { label: 'Timetable', done: subject.schedule.length > 0 },
        { label: 'Lesson plan (5 units)', done: stats.total >= 5 },
        { label: 'Teaching plan', done: true },
        { label: 'Teaching–learning methodologies', done: true },
        { label: 'Notes & reference material', done: subject.notes.length > 0 },
        { label: 'Attendance register', done: subject.attendance.average > 0 },
        { label: 'CIE records', done: Boolean(subject.cie.average) },
        { label: 'Question papers', done: true },
        { label: 'Assignments', done: true },
        { label: 'Performance analysis', done: false },
        { label: 'Result analysis', done: false },
        { label: 'CO attainment', done: false },
        { label: 'PO attainment', done: false },
        { label: 'PSO attainment', done: false },
        { label: 'Student feedback', done: false },
        { label: 'Corrective actions', done: false },
        { label: 'Continuous improvement record', done: false },
        { label: 'Previous year comparison', done: false },
        { label: 'Evidence attachments', done: subject.notes.length > 0 }
      ];
    }

    function CourseFile({ subject }) {
      const checklist = buildChecklist(subject);
      const done = checklist.filter((c) => c.done).length;
      const percent = Math.round((done / checklist.length) * 100);

      return (
        <Card className="p-4">
          <div className="mb-3 flex items-center justify-between">
            <p className="text-[12.5px] font-bold text-ink">Course file checklist</p>
            <Badge tone={percent >= 75 ? 'success' : 'warn'}>{done}/{checklist.length} · {percent}%</Badge>
          </div>
          <div className="mb-4 h-2 overflow-hidden rounded-full bg-stone-100">
            <div className="h-full rounded-full bg-brand" style={{ width: `${percent}%` }} />
          </div>
          <ul className="max-h-[340px] space-y-1.5 overflow-y-auto pr-1">
            {checklist.map((item, index) => (
              <li key={item.label} className="flex items-center gap-2.5 py-1">
                <span className={`grid h-5 w-5 shrink-0 place-items-center rounded-full border ${
                  item.done ? 'border-emerald-600 bg-emerald-600 text-white' : 'border-stone-300 bg-white text-transparent'
                }`}>
                  <Icon name="check" className="h-3 w-3" strokeWidth={3} />
                </span>
                <span className={`text-[12px] ${item.done ? 'text-stone-700' : 'text-stone-400'}`}>
                  {index + 1}. {item.label}
                </span>
              </li>
            ))}
          </ul>
        </Card>
      );
    }

    /* =========================================================
       11. RESEARCH
       ========================================================= */
    const RESEARCH_TABS = ['Publications', 'Books', 'Patents', 'Certificates', 'Profile'];

    function ResearchPage({ profile, publications, books, patents, certificates, onAddPublication, onRemovePublication }) {
      const [tab, setTab] = useState('Publications');

      return (
        <div className="animate-fade-up space-y-4 px-4 py-5">
          <div className="grid grid-cols-3 gap-2.5">
            <StatTile label="Publications" value={publications.length} sub="Peer reviewed" />
            <StatTile label="Books" value={books.length} sub="Authored" />
            <StatTile label="Patents" value={patents.length} sub="Published" tone="brand" />
          </div>

          <div className="no-scrollbar flex gap-2 overflow-x-auto pb-1">
            {RESEARCH_TABS.map((item) => (
              <button
                key={item}
                onClick={() => setTab(item)}
                className={`whitespace-nowrap rounded-full border px-3.5 py-1.5 text-[11.5px] font-semibold transition ${
                  tab === item ? 'border-brand bg-brand text-white' : 'border-stone-200 bg-white text-stone-600'
                }`}
              >
                {item}
              </button>
            ))}
          </div>

          {tab === 'Publications' && <PublicationsPanel items={publications} onAdd={onAddPublication} onRemove={onRemovePublication} />}
          {tab === 'Books' && <BooksPanel items={books} />}
          {tab === 'Patents' && <PatentsPanel items={patents} />}
          {tab === 'Certificates' && <CertificatesPanel items={certificates} />}
          {tab === 'Profile' && <ProfilePanel profile={profile} />}
        </div>
      );
    }

    function PublicationsPanel({ items, onAdd, onRemove }) {
      const [yearFilter, setYearFilter] = useState('All');
      const years = useMemo(
        () => [...new Set(items.map((p) => p.year))].sort((a, b) => b.localeCompare(a)),
        [items]
      );
      const list = yearFilter === 'All' ? items : items.filter((p) => p.year === yearFilter);

      return (
        <div className="space-y-3">
          <div className="flex items-center justify-between gap-3">
            <div className="no-scrollbar flex flex-1 gap-1.5 overflow-x-auto">
              {['All', ...years].map((year) => (
                <button
                  key={year}
                  onClick={() => setYearFilter(year)}
                  className={`shrink-0 rounded-full border px-2.5 py-1 text-[11px] font-semibold transition ${
                    yearFilter === year ? 'border-ink bg-ink text-white' : 'border-stone-200 bg-white text-stone-600'
                  }`}
                >
                  {year}
                </button>
              ))}
            </div>
            <PrimaryButton onClick={onAdd} className="shrink-0 px-3 py-2 text-[11.5px]">
              <Icon name="plus" className="h-3.5 w-3.5" />
              Add
            </PrimaryButton>
          </div>

          {list.length === 0 ? (
            <EmptyState icon="book" title="No publications" description="Add a publication to start building your research record." />
          ) : (
            list.map((pub) => (
              <Card key={pub.id} className="p-4">
                <div className="flex items-start justify-between gap-3">
                  <h3 className="text-[13px] font-bold leading-snug text-ink">{pub.title}</h3>
                  <Badge tone="brand" className="shrink-0">{pub.year}</Badge>
                </div>
                <p className="mt-2 text-[11.5px] text-stone-500">
                  {pub.journal}{pub.volume ? ` · ${pub.volume}` : ''}
                </p>
                <p className="text-[11px] text-stone-400">{pub.authors}</p>

                {pub.doi && (
                  <p className="mt-2 truncate rounded-lg bg-stone-50 px-2.5 py-1.5 text-[10.5px] text-stone-500">
                    DOI: {pub.doi}
                  </p>
                )}

                <div className="mt-3 flex gap-2">

    /* =========================================================
       12. FINANCE
       ========================================================= */
    function FinancePage({ expenses, onAdd, onRemove }) {
      const thisMonth = expenses.filter((e) => e.date.slice(0, 7) === monthKey());
      const monthTotal = thisMonth.reduce((sum, e) => sum + Number(e.amount || 0), 0);
      const todayTotal = expenses.filter((e) => e.date === isoDate(new Date())).reduce((sum, e) => sum + Number(e.amount || 0), 0);
      const income = SALARY.gross + SALARY.other;

      const byCategory = useMemo(() => {
        const map = new Map();
        thisMonth.forEach((e) => map.set(e.category, (map.get(e.category) || 0) + Number(e.amount || 0)));
        return [...map.entries()].sort((a, b) => b[1] - a[1]);
      }, [thisMonth]);

      const maxCategory = Math.max(1, ...byCategory.map(([, v]) => v));

      const exportCsv = () => {
        const header = ['Date', 'Amount', 'Category', 'Payment mode', 'Vendor', 'Description'];
        const rows = expenses.map((e) =>
          [e.date, e.amount, e.category, e.paymentMode, e.vendor, e.description].map(csvCell).join(',')
        );
        downloadFile(`bec-expenses-${isoDate(new Date())}.csv`, [header.join(','), ...rows].join('\n'));
      };

      return (
        <div className="animate-fade-up space-y-4 px-4 py-5">
          <div className="grid grid-cols-2 gap-3">
            <StatTile label="Spent today" value={formatMoney(todayTotal)} sub="All categories" />
            <StatTile label="This month" value={formatMoney(monthTotal)} sub={`${thisMonth.length} expenses`} tone="brand" />
            <StatTile label="Gross income" value={formatMoney(income)} sub="Salary + other" />
            <StatTile label="Net balance" value={formatMoney(income - monthTotal)} sub="Income − expenses" tone="dark" />
          </div>

          <Card className="p-4">
            <div className="mb-3 flex items-center justify-between">
              <p className="text-[12.5px] font-bold text-ink">Category breakdown</p>
              <span className="text-[11px] text-stone-400">This month</span>
            </div>
            {byCategory.length === 0 ? (
              <p className="py-3 text-center text-[12px] text-stone-400">No expenses recorded this month.</p>
            ) : (
              <ul className="space-y-2.5">
                {byCategory.map(([category, amount]) => (
                  <li key={category} className="flex items-center gap-3">
                    <span className="w-20 shrink-0 truncate text-[11.5px] text-stone-600">{category}</span>
                    <span className="h-2 flex-1 overflow-hidden rounded-full bg-stone-100">
                      <span className="block h-full rounded-full bg-brand" style={{ width: `${(amount / maxCategory) * 100}%` }} />
                    </span>
                    <span className="w-16 shrink-0 text-right text-[11.5px] font-semibold text-ink">{formatMoney(amount)}</span>
                  </li>
                ))}
              </ul>
            )}
          </Card>

          <div className="flex gap-2">
            <PrimaryButton onClick={onAdd} className="flex-1">
              <Icon name="plus" className="h-4 w-4" /> Add expense
            </PrimaryButton>
            <GhostButton onClick={exportCsv}>
              <Icon name="download" className="h-4 w-4" /> Export
            </GhostButton>
          </div>

          <section>
            <SectionTitle action={<span className="text-[11px] text-stone-400">{expenses.length} records</span>}>
              All expenses
            </SectionTitle>
            <div className="space-y-2.5">
              {expenses.length === 0 ? (
                <EmptyState icon="wallet" title="No expenses yet" description="Record your first expense to start tracking spending." />
              ) : (
                expenses
                  .slice()
                  .sort((a, b) => b.date.localeCompare(a.date))
                  .map((expense) => (
                    <Card key={expense.id} className="flex items-center justify-between gap-3 p-3.5">
                      <div className="flex min-w-0 items-center gap-3">
                        <span className="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-stone-100 text-stone-500">
                          <Icon name="wallet" className="h-4 w-4" />
                        </span>
                        <div className="min-w-0">
                          <p className="truncate text-[12.5px] font-semibold text-ink">{expense.description}</p>
                          <p className="truncate text-[10.5px] text-stone-500">
                            {formatDate(expense.date)} · {expense.category} · {expense.paymentMode}
                          </p>
                        </div>
                      </div>
                      <div className="shrink-0 text-right">
                        <p className="text-[13px] font-bold text-ink">{formatMoney(expense.amount)}</p>
                        <button
                          onClick={() => onRemove(expense.id)}

                        >
                          Remove

                    </Card>

          </section>

          <div className="flex items-center justify-between gap-3">
            <div className="no-scrollbar flex gap-1.5 overflow-x-auto">
              {categories.map((category) => (
                <button
                  key={category}
                  onClick={() => setFilter(category)}

            <PrimaryButton onClick={onAdd} className="shrink-0 px-3 py-2 text-[11.5px]">
              <Icon name="plus" className="h-3.5 w-3.5" /> Add

          <div className="space-y-3">

                    <div className="flex items-start justify-between gap-3">
                      <div className="flex min-w-0 items-start gap-3">

                          <Icon name="file" className="h-4.5 w-4.5" />
                        </span>
                        <div className="min-w-0">
                          <p className="text-[12.5px] font-bold text-ink">{doc.name}</p>
                          <p className="text-[11px] text-stone-500">{doc.category} · {doc.subType}</p>
                          <p className="text-[10.5px] text-stone-400">{doc.authority}</p>
                        </div>
                      </div>
                      <button
                        onClick={() => onRemove(doc.id)}
                        aria-label={`Remove ${doc.name}`}
                        className="grid h-8 w-8 shrink-0 place-items-center rounded-full bg-stone-50 text-stone-400 transition hover:bg-red-50 hover:text-brand"
                      >
                        <Icon name="trash" className="h-3.5 w-3.5" />
                      </button>
                    </div>

                    <div className="mt-3 flex items-center justify-between gap-3 rounded-xl bg-stone-50 px-3 py-2.5">
                      <span className="truncate font-mono text-[12px] font-semibold tracking-wide text-ink">

                      {doc.expiryDate ? (
