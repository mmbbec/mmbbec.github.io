","Sleeping","Running"],ans:0,exp:"He pulled enemy fleet."},{q:"Gulliver’s Travels is written by:",opts:["Jonathan Swift","J K Rowling","Ruskin Bond","Premchand"],ans:0,exp:"Jonathan Swift wrote satire."},{q:"Blefuscu was:",opts:["Enemy island of Lilliput","Friend","Capital","Mountain"],ans:0,exp:"Lilliput fought Blefuscu."},{q:"How did Gulliver leave Lilliput?",opts:["Built a boat","Swam","Flew","Teleported"],ans:0,exp:"He found and repaired a boat."},{q:"Genre of Gulliver’s Travels:",opts:["Fantasy adventure","Cookbook","Science report","Math"],ans:0,exp:"Fantasy with satire."},{q:"Lesson:",opts:["Size matters not, kindness matters","Be cruel","Never travel","Ignore others"],ans:0,exp:"Gulliver was kind despite being giant."}]},{id:"v-e6",title:"Ch10: Who Will be Ningthou?",mcqs:[{q:"Ningthou means:",opts:["Servant","King in Manipuri","Village","River"],ans:1,exp:"Ningthou means king in Manipur."},{q:"Story is set in:",opts:["Manipur - Kangleipak","Kerala","Delhi","Rajasthan"],ans:0,exp:"Ancient Kangleipak (Manipur)."},{q:"Who were contenders for king?",opts:["Two sons","Two daughters","Ministers","Soldiers"],ans:0,exp:"Sanajaoba and Sanatomba."},{q:"Father king tested them by:",opts:["Giving tasks","Fight","Lottery","Dice"],ans:0,exp:"Tasks tested wisdom and kindness."},{q:"Younger son was:",opts:["Cruel","Kind and wise","Lazy","Rude"],ans:1,exp:"He cared for people."},{q:"What did elder son do?",opts:["Helped people","Was selfish","Sang","Danced"],ans:1,exp:"He thought only of throne."},{q:"Who became Ningthou finally?",opts:["Elder","Younger - Sanatomba","Minister","No one"],ans:1,exp:"Younger son chosen for virtues."},{q:"Story teaches:",opts:["Kindness and wisdom make a good ruler","Power by force","Cheating wins","Age matters"],ans:0,exp:"Good king is kind."},{q:"Manipuri culture element in story:",opts:["Polo","Ningthou title","Both","None"],ans:2,exp:"Manipur is birthplace of polo."},{q:"Sanatomba’s quality:",opts:["Compassion","Greed","Anger","Fear"],ans:
