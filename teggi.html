<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BEC-BIPS Staff Quarters · Batch Bill Generator</title>
  <!-- html2pdf Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: #f1f5f9; color: #0f172a; padding: 20px; }

    .main-wrapper { max-width: 950px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    
    h1 { font-size: 1.4rem; color: #1e3a8a; margin-bottom: 6px; }
    p { font-size: 0.85rem; color: #64748b; margin-bottom: 20px; }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.8rem; font-weight: 600; color: #334155; margin-bottom: 6px; }
    input, textarea {
      width: 100%;
      padding: 10px;
      border: 1.5px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
    }
    textarea { font-family: monospace; font-size: 0.82rem; white-space: pre; }
    input:focus, textarea:focus { border-color: #2563eb; }

    .btn-group { display: flex; gap: 10px; margin-top: 10px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      color: #ffffff;
      background: #1e40af;
      transition: background 0.2s;
    }
    .btn:hover { background: #1d4ed8; }
    .btn-green { background: #16a34a; }
    .btn-green:hover { background: #15803d; }

    #statusMessage { margin-top: 15px; font-weight: 600; font-size: 0.9rem; color: #166534; }

    /* PDF Source Container */
    #pdfSourceContainer {
      margin-top: 30px;
      border-top: 2px dashed #cbd5e1;
      padding-top: 20px;
    }

    /* Official Bill Layout Template */
    .bill-page {
      background: #ffffff;
      border: 2px solid #0f172a;
      padding: 30px;
      margin-bottom: 30px;
      width: 100%;
      max-width: 750px;
      margin-left: auto;
      margin-right: auto;
      page-break-after: always;
    }

    .doc-header {
      text-align: center;
      border-bottom: 2px solid #0f172a;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .doc-header h2 { font-size: 1.15rem; font-weight: 800; text-transform: uppercase; color: #0f172a; }
    .doc-header h3 { font-size: 0.9rem; font-weight: 700; color: #1e40af; margin-top: 2px; }
    .doc-header p { font-size: 0.75rem; color: #475569; margin-top: 2px; }

    .meta-bar {
      display: flex;
      justify-content: space-between;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      padding: 8px 12px;
      font-size: 0.82rem;
      margin-bottom: 14px;
    }

    .resident-card {
      display: grid;
      grid-template-columns: 1fr 1fr;
      row-gap: 6px;
      font-size: 0.85rem;
      border: 1px dashed #cbd5e1;
      padding: 10px 12px;
      margin-bottom: 16px;
      background: #fdfdfd;
    }

    .doc-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 16px;
      font-size: 0.85rem;
    }
    .doc-table th, .doc-table td {
      border: 1px solid #0f172a;
      padding: 7px 9px;
      text-align: left;
    }
    .doc-table th { background: #f1f5f9; font-weight: 700; }
    .text-right { text-align: right; }
    .text-center { text-align: center; }
    .reading-highlight-row { background: #f0fdf4; font-weight: 600; }
    .total-box { background: #f8fafc; font-weight: 800; font-size: 1rem; }

    .bank-box {
      border: 1.5px solid #1e40af;
      background: #eff6ff;
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 16px;
      font-size: 0.82rem;
    }
    .bank-box h4 {
      color: #1e3a8a;
      font-size: 0.88rem;
      margin-bottom: 6px;
      text-transform: uppercase;
      font-weight: 700;
    }
    .bank-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      row-gap: 4px;
      color: #1e293b;
    }

    .doc-notice {
      border: 1px solid #cbd5e1;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.78rem;
      color: #334155;
      margin-bottom: 20px;
    }

    .signature-row {
      display: flex;
      justify-content: space-between;
      margin-top: 30px;
      font-size: 0.82rem;
      font-weight: 600;
    }
  </style>
</head>

  function normalizeText(txt) {
    return (txt || '').replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
  }

  function parseInputData() {
    const rawText = document.getElementById('excelInput').value.trim();
    if (!rawText) return [];

    const lines = rawText.split('\n');
    const validBills = [];

    lines.forEach((line) => {
      if (!line.trim()) return;
      const cols = line.split('\t');
      if (cols.length < 4) return;

      let rawQtr = '';
      let rawName = '';
      let prev = 0;
      let curr = 0;

      if (cols.length >= 5 && !isNaN(parseFloat(cols[3])) && !isNaN(parseFloat(cols[4]))) {
        rawQtr = cols[1].trim();
        rawName = cols[2].trim();
        prev = parseFloat(cols[3]) || 0;
        curr = parseFloat(cols[4]) || 0;
      } else if (!isNaN(parseFloat(cols[2])) && !isNaN(parseFloat(cols[3]))) {
        rawQtr = cols[0].trim();
        rawName = cols[1].trim();
        prev = parseFloat(cols[2]) || 0;
        curr = parseFloat(cols[3]) || 0;
      }

      const qtrNorm = normalizeText(rawQtr);
      const nameNorm = normalizeText(rawName);

      const match = masterQuarters.find(m => {
        const mQtr = normalizeText(m.qtr);
        const mName = normalizeText(m.name);
        return mQtr === qtrNorm || mName.includes(nameNorm) || nameNorm.includes(mName);
      });

      if (match) {
        const units = Math.max(0, curr - prev);
        const energy = units * match.rate;
        const kvAmount = match.kvr * 50.00;
        const total = Math.round(energy + kvAmount + match.fixed);

        validBills.push({
          qtr: match.qtr,
          name: match.name,
          phone: match.phone,
          prev,
          curr,
          units,
          rate: match.rate,
          kvr: match.kvr,
          kvAmount,
          fixed: match.fixed,
          energy,
          total
        });
      }
    });

    return validBills;
  }

        </div>

        <div class="doc-notice">

        </div>

        <div class="signature-row">

          <div>Authorized Signatory</div>

      `;
      container.appendChild(pageDiv);
    });

    statusDiv.innerText = `✅ Verified ${bills.length} quarter records with KV charges and Bank Details included! Preview displayed below.`;
  }

  function downloadSinglePDF() {
    const container = document.getElementById('pdfSourceContainer');
    const statusDiv = document.getElementById('statusMessage');

    if (!container.innerHTML.trim()) {
      processAndPreview();
    }

    if (!container.innerHTML.trim()) return;

    statusDiv.innerText = "Compiling all verified bills into one PDF... Please wait a moment.";

    const opt = {
      margin:       8,
      filename:     `BEC_Staff_Quarters_Bills_Combined.pdf`,
      image:        { type: 'jpeg', quality: 0.98 },
      html2canvas:  { scale: 2, useCORS: true, logging: false },
      jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };

    html2pdf().from(container).set(opt).save().then(() => {
      statusDiv.innerText = "✅ Successfully downloaded all verified bills with Bank Details in one PDF file!";
    });
  }
</script>
