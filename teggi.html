<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BEC-BIPS Staff Quarters - Electricity Bill & Receipt Desk</title>
  
  <!-- html2pdf Library for Client-side PDF Generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: #f1f5f9; color: #0f172a; padding: 20px; }
    
    .main-wrapper { max-width: 1340px; margin: 0 auto; }

    /* Top Navigation Switcher */
    .tab-nav {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      background: #e2e8f0;
      padding: 6px;
      border-radius: 10px;
      width: fit-content;
    }
    .tab-btn {
      padding: 10px 24px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      color: #475569;
      background: transparent;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: #1e3a8a;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(30, 58, 138, 0.25);
    }

    .tab-content { display: none; }
    .tab-content.active { display: grid; grid-template-columns: 430px 1fr; gap: 24px; }

    /* Control Sidebars */
    .control-panel {
      background: #ffffff;
      padding: 22px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      height: fit-content;
    }
    .control-panel h2 { font-size: 1.15rem; font-weight: 700; color: #1e3a8a; margin-bottom: 4px; }
    .control-panel p { font-size: 0.8rem; color: #64748b; margin-bottom: 16px; }

    .form-group { margin-bottom: 11px; }
    label { display: block; font-size: 0.78rem; font-weight: 600; color: #334155; margin-bottom: 4px; }
    input, select {
      width: 100%;
      padding: 8px 10px;
      border: 1.5px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus { border-color: #2563eb; }
    input[readonly] { background-color: #f8fafc; color: #475569; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

    .meter-highlight-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .meter-highlight-box legend {
      font-size: 0.75rem;
      font-weight: 700;
      color: #1e40af;
      padding: 0 4px;
      text-transform: uppercase;
    }

    .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn-pdf { background: #1e40af; color: #ffffff; }
    .btn-pdf:hover { background: #1d4ed8; }
    .btn-wa { background: #16a34a; color: #ffffff; }
    .btn-wa:hover { background: #15803d; }
    .btn-print { background: #475569; color: #ffffff; }
    .btn-print:hover { background: #334155; }

    /* Document Previews */
    .preview-wrapper {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      min-height: 600px;
    }

    .doc-card {
      background: #ffffff;
      border: 2px solid #0f172a;
      padding: 24px;
      position: relative;
    }

    .doc-header {
      text-align: center;
      border-bottom: 2px solid #0f172a;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .doc-header h1 { font-size: 1.25rem; font-weight: 800; color: #0f172a; text-transform: uppercase; }
    .doc-header h2 { font-size: 0.95rem; font-weight: 700; color: #1e40af; margin-top: 2px; }
    .doc-header p { font-size: 0.78rem; color: #475569; margin-top: 2px; }

    .meta-bar {
      display: flex;
      justify-content: space-between;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      padding: 9px 12px;
      font-size: 0.82rem;
      margin-bottom: 14px;
    }

    .resident-card {
      display: grid;
      grid-template-columns: 1fr 1fr;
      row-gap: 6px;
      font-size: 0.85rem;
      border: 1px dashed #cbd5e1;
      padding: 10px 12px;
      margin-bottom: 16px;
    }

    .doc-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 16px;
      font-size: 0.85rem;
    }
    .doc-table th, .doc-table td {
      border: 1px solid #0f172a;
      padding: 7px 9px;
      text-align: left;
    }
    .doc-table th { background: #f1f5f9; font-weight: 700; }
    .text-right { text-align: right; }
    .text-center { text-align: center; }

    .reading-highlight-row { background: #f0fdf4; font-weight: 600; }
    .total-box { background: #f8fafc; font-weight: 800; font-size: 1rem; }

    .stamp-badge {
      display: inline-block;
      border: 2px solid #16a34a;
      color: #16a34a;
      padding: 3px 10px;
      border-radius: 4px;
      font-weight: 800;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .doc-notice {
      border: 1px solid #cbd5e1;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.78rem;
      color: #334155;
      margin-bottom: 24px;
    }

    .signature-row {
      display: flex;
      justify-content: space-between;
      margin-top: 36px;
      font-size: 0.82rem;
      font-weight: 600;
    }

    @media (max-width: 900px) {
      .tab-content.active { grid-template-columns: 1fr; }
    }

    @media print {
      body { background: white; padding: 0; }
      .tab-nav, .control-panel, .btn-group { display: none !important; }
      .preview-wrapper { box-shadow: none; padding: 0; }
      .doc-card { border: 2px solid #000; }
    }
  </style>
</head>
<body>

<div class="main-wrapper">
  
  <!-- Navigation Switcher -->
  <div class="tab-nav">
    <button class="tab-btn active" onclick="switchMainTab('billTab', this)">⚡ Generate & Share Bill</button>
    <button class="tab-btn" onclick="switchMainTab('receiptTab', this)">🧾 Generate & Share Receipt</button>
  </div>

  <!-- ==================== TAB 1: BILL GENERATOR ==================== -->
  <div id="billTab" class="tab-content active">
    <div class="control-panel">
      <h2>Electricity Bill Desk</h2>
      <p>Select resident quarter to load readings, compute units, and export bill.</p>

      <div class="form-group">
        <label>Select Quarter & Resident *</label>
        <select id="billSelect" onchange="onBillQuarterChange()">
          <option value="" disabled selected>-- Choose Quarter --</option>
        </select>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>Quarter No</label>
          <input type="text" id="b_qtr" readonly>
        </div>
        <div class="form-group">
          <label>Mobile Number</label>
          <input type="text" id="b_phone" readonly>
        </div>
      </div>

      <div class="form-group">
        <label>Resident Name</label>
        <input type="text" id="b_name" oninput="updateBillCalc()">
      </div>

      <div class="grid-2
